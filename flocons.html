const BATCH_SIZE = 450;
const WHEAT_GERM_G = 25;

function calcIngredients(totalG) {
  const avoine = Math.round(totalG * 0.5);
  const epeautre = Math.round(totalG * 0.4);
  const seigle = Math.round(totalG * 0.1);
  const wheatGerm = WHEAT_GERM_G;
  const totalWithGerm = totalG + wheatGerm;
  const waterMin = Math.round(totalWithGerm * 1.5);
  const waterMax = Math.round(totalWithGerm * 2.0);
  return { avoine, epeautre, seigle, wheatGerm, waterMin, waterMax, total: totalG, totalWithGerm };
}

const ing = calcIngredients(BATCH_SIZE);

function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function Timer({ minutes, label }) {
  const [totalSeconds, setTotalSeconds] = useState(minutes * 60);
  const [running, setRunning] = useState(false);
  const [finished, setFinished] = useState(false);
  useEffect(() => {
    if (!running || totalSeconds <= 0) return;
    const iv = setInterval(() => {
      setTotalSeconds((p) => { if (p <= 1) { setRunning(false); setFinished(true); return 0; } return p - 1; });
    }, 1000);
    return () => clearInterval(iv);
  }, [running, totalSeconds]);
  const progress = 1 - totalSeconds / (minutes * 60);
  const reset = () => { setTotalSeconds(minutes * 60); setRunning(false); setFinished(false); };
  return (
    <div style={{ marginTop: 12, background: finished ? "#1a2e1a" : "#1a1a2e", borderRadius: 12, padding: "14px 16px", border: finished ? "1px solid #2d5a2d" : "1px solid #2a2a4a" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <span style={{ fontSize: 12, color: "#8888aa", letterSpacing: 1, textTransform: "uppercase" }}>⏱ {label}</span>
        {finished && <span style={{ fontSize: 12, color: "#6abf6a" }}>✓ Terminé</span>}
      </div>
      <div style={{ fontSize: 36, fontFamily: "'JetBrains Mono', 'SF Mono', monospace", fontWeight: 600, color: finished ? "#6abf6a" : "#e8e8ff", textAlign: "center", margin: "4px 0 12px" }}>{formatTime(totalSeconds)}</div>
      <div style={{ height: 4, background: "#2a2a4a", borderRadius: 2, marginBottom: 12, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${progress * 100}%`, background: finished ? "#6abf6a" : "#aa8844", borderRadius: 2, transition: "width 1s linear" }} />
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={() => setRunning(!running)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", fontSize: 14, fontWeight: 600, cursor: "pointer", background: running ? "#cc5555" : "#8a7a44", color: "#fff" }}>
          {running ? "Pause" : totalSeconds === minutes * 60 ? "Démarrer" : "Reprendre"}
        </button>
        <button onClick={reset} style={{ padding: "10px 16px", borderRadius: 8, border: "1px solid #3a3a3a", fontSize: 14, cursor: "pointer", background: "transparent", color: "#8888aa" }}>Reset</button>
      </div>
    </div>
  );
}

      </div>
      {notes.map((note, i) => (
        <div key={i} style={{ padding: "10px 14px", background: "#111110", borderRadius: 10, marginBottom: 6, borderLeft: "3px solid #4a4430" }}>
          <span style={{ color: "#554", fontSize: 11 }}>{note.time}</span>
          <p style={{ color: "#bba", fontSize: 13, margin: "4px 0 0", lineHeight: 1.5 }}>{note.text}</p>
        </div>
      ))}
    </div>
  );
}

// ─── MAIN ───

function FloconsTracker() {
  const [completed, setCompleted] = useState({});
  const [notes, setNotes] = useState([]);
  const [started, setStarted] = useState(false);
  const [batchNum, setBatchNum] = useState(1);
  const toggleStep = useCallback((id) => { setCompleted((p) => ({ ...p, [id]: !p[id] })); }, []);
  const addNote = useCallback((text) => {
    const now = new Date();
    const time = now.toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    setNotes((p) => [{ text, time }, ...p]);
  }, []);
  const completedCount = Object.values(completed).filter(Boolean).length;
  const progress = completedCount / STEPS.length;
  const reset = () => { setCompleted({}); setNotes([]); setStarted(false); };
  const newBatch = () => { setCompleted({}); setNotes([]); setBatchNum((p) => p + 1); };

  if (!started) {
    return (
      <div style={{ minHeight: "100vh", background: "#0d0c08", color: "#ddddd0", fontFamily: "'DM Sans', 'Avenir', -apple-system, sans-serif", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
        <div style={{ textAlign: "center", maxWidth: 400, width: "100%" }}>
          <div style={{ fontSize: 56, marginBottom: 16 }}>🌾</div>
          <h1 style={{ fontSize: 28, fontWeight: 700, margin: "0 0 6px", letterSpacing: -0.5 }}>Flocons Fermentés</h1>
          <p style={{ color: "#6a6a5a", fontSize: 14, marginBottom: 24 }}>Avoine + petit épeautre + seigle — fermentation lactique</p>
          <div style={{ padding: "16px", background: "#111110", borderRadius: 14, border: "1px solid #2a2818", marginBottom: 16, textAlign: "left" }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
              <span style={{ color: "#887744", fontSize: 12, fontWeight: 600 }}>Batch standard</span>
              <span style={{ color: "#aa9955", fontSize: 13, fontWeight: 700 }}>{BATCH_SIZE}g + {WHEAT_GERM_G}g germe</span>
            </div>
            {[
              { label: "Avoine", qty: `${ing.avoine}g`, color: "#c8a86a" },
              { label: "Petit épeautre", qty: `${ing.epeautre}g`, color: "#a8926a" },
              { label: "Farine de seigle", qty: `${ing.seigle}g`, color: "#8a7a5a" },
              { label: "Germe de blé", qty: `${ing.wheatGerm}g`, color: "#b8a050" },
              { label: "Eau tiède (<40°C)", qty: `${ing.waterMin}-${ing.waterMax} ml`, color: "#6a8acc" },
            ].map((item, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", borderTop: i === 0 ? "1px solid #1e1e18" : "none" }}>
                <span style={{ color: item.color, fontSize: 13 }}>{item.label}</span>
                <span style={{ color: "#ccc", fontSize: 13, fontWeight: 500 }}>{item.qty}</span>
              </div>
            ))}
            <div style={{ marginTop: 8, paddingTop: 8, borderTop: "1px solid #1e1e18" }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}><span style={{ color: "#666", fontSize: 12 }}>Rendement</span><span style={{ color: "#aaa", fontSize: 12 }}>~{Math.round(ing.totalWithGerm * 2)}g hydraté → 4-5 jours</span></div>
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: 2 }}><span style={{ color: "#666", fontSize: 12 }}>Fermentation</span><span style={{ color: "#aaa", fontSize: 12 }}>16-20h à 25-26°C avec backslopping</span></div>
            </div>
          </div>
          <div style={{ textAlign: "left", marginBottom: 16 }}>
            <TempZonesPanel />
            <HealthPanel />
            <SpermidinePanel />
          </div>
          <button onClick={() => setStarted(true)} style={{ width: "100%", padding: "14px 0", borderRadius: 12, border: "none", background: "#8a7a44", color: "#fff", fontSize: 16, fontWeight: 700, cursor: "pointer", letterSpacing: 0.5 }}>Démarrer le batch</button>
        </div>
      </div>
    );
  }

  const phases = [...new Set(STEPS.map((s) => s.phase))];
  return (
    <div style={{ minHeight: "100vh", background: "#0d0c08", color: "#ddddd0", fontFamily: "'DM Sans', 'Avenir', -apple-system, sans-serif", paddingBottom: 40 }}>
      <div style={{ position: "sticky", top: 0, zIndex: 10, background: "rgba(13,12,8,0.92)", backdropFilter: "blur(12px)", padding: "14px 18px 12px", borderBottom: "1px solid #1e1e18" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <div>
            <span style={{ fontSize: 18, fontWeight: 700 }}>🌾 Flocons</span>
            <span style={{ color: "#5a5a4a", fontSize: 13, marginLeft: 10 }}>Batch #{batchNum} · {BATCH_SIZE}+{WHEAT_GERM_G}g</span>
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            {progress === 1 && <button onClick={newBatch} style={{ padding: "6px 12px", borderRadius: 6, border: "none", background: "#6abf6a", color: "#fff", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Batch suivant</button>}
            <button onClick={reset} style={{ padding: "6px 12px", borderRadius: 6, border: "1px solid #2a2818", background: "transparent", color: "#6a6a5a", fontSize: 12, cursor: "pointer" }}>Reset</button>
          </div>
        </div>
        <div style={{ height: 4, background: "#1e1e18", borderRadius: 2, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${progress * 100}%`, background: progress === 1 ? "#6abf6a" : "#8a7a44", borderRadius: 2, transition: "width 0.3s ease" }} />
        </div>
        <div style={{ textAlign: "right", fontSize: 11, color: "#555", marginTop: 4 }}>{completedCount}/{STEPS.length}</div>
      </div>
      <div style={{ padding: "12px 14px 0" }}>
        {phases.map((phase) => (
          <div key={phase} style={{ marginBottom: 16 }}>
            <h2 style={{ fontSize: 11, letterSpacing: 2, textTransform: "uppercase", color: "#5a5a4a", margin: "16px 0 10px 4px", fontWeight: 600 }}>{phase}</h2>
            {STEPS.filter((s) => s.phase === phase).map((step) => (
              <StepCard key={step.id} step={step} completed={completed[step.id]} onToggle={() => toggleStep(step.id)} />
            ))}
          </div>
        ))}
      </div>
      <div style={{ padding: "0 14px" }}>
        <TempZonesPanel />
        <HealthPanel />
        <SpermidinePanel />
        <ScheduleView />
      </div>
      <div style={{ padding: "0 14px" }}><BatchNotes notes={notes} onAdd={addNote} /></div>
      {progress === 1 && (
        <div style={{ margin: "24px 14px", padding: 20, background: "#1a2e1a", border: "1px solid #2d5a2d", borderRadius: 14, textAlign: "center" }}>
          <div style={{ fontSize: 32, marginBottom: 8 }}>🌾</div>
          <p style={{ color: "#6abf6a", fontSize: 16, fontWeight: 600, margin: 0 }}>Batch terminé !</p>
          <p style={{ color: "#5a8a5a", fontSize: 13, marginTop: 6 }}>4-5 jours au frigo · prochain batch dans 3-4 jours</p>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(FloconsTracker));
  </script>
</body>
</html>
