function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function Timer({ minutes, label }) {
  const [totalSeconds, setTotalSeconds] = useState(minutes * 60);
  const [running, setRunning] = useState(false);
  const [finished, setFinished] = useState(false);

  useEffect(() => {
    if (!running || totalSeconds <= 0) return;
    const interval = setInterval(() => {
      setTotalSeconds((prev) => {
        if (prev <= 1) { setRunning(false); setFinished(true); return 0; }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(interval);
  }, [running, totalSeconds]);

  const progress = 1 - totalSeconds / (minutes * 60);
  const reset = () => { setTotalSeconds(minutes * 60); setRunning(false); setFinished(false); };

  return (
    <div style={{
      marginTop: 12, background: finished ? "#1a2e1a" : "#1a1a2e",
      borderRadius: 12, padding: "14px 16px",
      border: finished ? "1px solid #2d5a2d" : "1px solid #2a2a4a",
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <span style={{ fontSize: 12, color: "#8888aa", letterSpacing: 1, textTransform: "uppercase" }}>⏱ {label}</span>
        {finished && <span style={{ fontSize: 12, color: "#6abf6a" }}>✓ Terminé</span>}
      </div>
      <div style={{
        fontSize: 36, fontFamily: "'JetBrains Mono', 'SF Mono', monospace",
        fontWeight: 600, color: finished ? "#6abf6a" : "#e8e8ff", textAlign: "center", margin: "4px 0 12px",
      }}>
        {formatTime(totalSeconds)}
      </div>
      <div style={{ height: 4, background: "#2a2a4a", borderRadius: 2, marginBottom: 12, overflow: "hidden" }}>
        <div style={{
          height: "100%", width: `${progress * 100}%`,
          background: finished ? "#6abf6a" : "#7878cc", borderRadius: 2, transition: "width 1s linear",
        }} />
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={() => setRunning(!running)} style={{
          flex: 1, padding: "10px 0", borderRadius: 8, border: "none", fontSize: 14, fontWeight: 600,
          cursor: "pointer", background: running ? "#cc5555" : "#5a5aaa", color: "#fff",
        }}>
          {running ? "Pause" : totalSeconds === minutes * 60 ? "Démarrer" : "Reprendre"}
        </button>
        <button onClick={reset} style={{
          padding: "10px 16px", borderRadius: 8, border: "1px solid #3a3a5a",
          fontSize: 14, cursor: "pointer", background: "transparent", color: "#8888aa",
        }}>Reset</button>
      </div>
    </div>
  );
}

      <div style={{ marginTop: 12, padding: "8px 12px", background: "#1a1a12", borderRadius: 8, borderLeft: "3px solid #ccaa55" }}>
        <p style={{ fontSize: 12, color: "#ccaa55", margin: 0, lineHeight: 1.5 }}>{data.conservationNote}</p>
      </div>
    </Collapsible>
  );
}

function BatchCircuitsPanel() {
  const data = BATCH_CIRCUITS;
  return (
    <Collapsible title={data.title} icon="📦" color="#6abf6a" defaultOpen={false}>
      {data.circuits.map((c, i) => (
        <div key={i} style={{
          padding: "10px 12px", background: "#0d0d16", borderRadius: 10,
          border: c.recommended ? "1px solid #2d5a2d" : "1px solid #1e1e2e",
          marginBottom: 8,
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
            <span style={{ fontSize: 18 }}>{c.icon}</span>
            <span style={{ fontSize: 14, fontWeight: 600, color: c.color }}>{c.name}</span>
            {c.recommended && <span style={{ fontSize: 10, color: "#6abf6a", background: "#1a2e1a", padding: "1px 6px", borderRadius: 4, fontWeight: 600 }}>RECOMMANDÉ</span>}
          </div>
          <p style={{ fontSize: 12, color: "#aab", margin: "0 0 4px", lineHeight: 1.5, paddingLeft: 30 }}>{c.steps}</p>
          <p style={{ fontSize: 11, color: "#777", margin: 0, lineHeight: 1.5, paddingLeft: 30, fontStyle: "italic" }}>{c.surplus}</p>
        </div>
      ))}
    </Collapsible>
  );
}

function PostRecolteSection() {
  return (
    <div style={{ marginTop: 8 }}>
      <h2 style={{
        fontSize: 11, letterSpacing: 2, textTransform: "uppercase",
        color: "#5a5a7a", margin: "16px 0 10px 4px", fontWeight: 600,
      }}>Post-récolte</h2>
      <CuttingPanel />
      <ConservationPanel />
      <CookingProfilesPanel />
      <MarinadePanel />
      <BatchCircuitsPanel />
    </div>
  );
}

function StepCard({ step, completed, onToggle, variant, cookingMethod, quantity }) {
  const [expanded, setExpanded] = useState(false);
  const isActive = !completed && expanded;
  const config = variant === "apo" ? APO_CONFIG : BT_CONFIG;

  const detail = step.isVariantStep && variant
    ? variant === "apo"
      ? "APO : sonde 31°C (recommandé), Vapeur, HR 85-90%, ventilation activée. Gaze humide sur le substrat, substrat surélevé sur baguettes.\n\n🌡 Sonde : insérer par un trou du bac perforé, pointe au centre du bloc en épaisseur (~1,5-2 cm). Seuls les 3-5 derniers mm mesurent — positionner la pointe, pas la tige. L'APO s'autorégule automatiquement pendant la phase exothermique."
      : "B&T : 30°C, écuelle d'eau, stylo dans couvercle. Gaze/cheesecloth (pas charlotte coton). Inverser bacs haut/bas et retourner le bloc à 18-24h."
    : step.isInoculationStep
      ? `Saupoudrer le starter sur le soja tiède (≤35°C). Mélanger soigneusement 1-2 min.`
      : step.isMiseEnBacStep
        ? null
        : step.isOvernightStep
          ? null
          : step.detail;

  const cookInfo = step.isCookingStep && cookingMethod
    ? COOKING_METHODS.find(m => m.key === cookingMethod) : null;
  const timerMinutes = cookInfo ? cookInfo.time : step.timerMinutes;
  const timerLabel = cookInfo ? cookInfo.label : step.timerLabel;

  return (
    <div style={{
      background: completed ? "#111118" : "#16161f",
      border: completed ? "1px solid #1e1e2e" : isActive ? "1px solid #5a5aaa" : "1px solid #25253a",
      borderRadius: 14, marginBottom: 10, overflow: "hidden",
      opacity: completed ? 0.5 : 1, transition: "all 0.2s ease",
    }}>
      <div onClick={() => setExpanded(!expanded)} style={{
        display: "flex", alignItems: "center", padding: "14px 16px", cursor: "pointer", gap: 12,
      }}>
        <div onClick={(e) => { e.stopPropagation(); onToggle(); }} style={{
          width: 26, height: 26, borderRadius: 8,
          border: completed ? "2px solid #6abf6a" : "2px solid #4a4a6a",
          background: completed ? "#1a2e1a" : "transparent",
          display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, cursor: "pointer",
        }}>
          {completed && <span style={{ color: "#6abf6a", fontSize: 14, fontWeight: 700 }}>✓</span>}
        </div>
        <div style={{ flex: 1 }}>
          <div style={{
            fontSize: 15, fontWeight: 600, color: completed ? "#555" : "#dddde8",
            textDecoration: completed ? "line-through" : "none",
          }}>{step.title}</div>
          {step.isAPOPhase && variant === "apo" && !expanded && (
            <div style={{ fontSize: 11, color: "#5a5a8a", marginTop: 2 }}>🔥 Gestion APO détaillée</div>
          )}
          {step.isOvernightStep && !expanded && (
            <div style={{ fontSize: 11, color: "#5a5a8a", marginTop: 2 }}>🌙 Stratégies pour la nuit</div>
          )}
        </div>
        <span style={{
          color: "#555", fontSize: 18,
          transform: expanded ? "rotate(180deg)" : "rotate(0)", transition: "transform 0.2s ease",
        }}>▾</span>
      </div>

      {expanded && (
        <div style={{ padding: "0 16px 16px", borderTop: "1px solid #1e1e2e" }}>
          {cookInfo && (
            <div style={{
              marginTop: 12, padding: "8px 12px", background: "#1a1a2e",
              borderRadius: 8, display: "flex", alignItems: "center", gap: 8,
            }}>
              <span style={{ fontSize: 18 }}>{cookInfo.icon}</span>
              <div>
                <span style={{ color: "#aab0ff", fontSize: 13, fontWeight: 600 }}>{cookInfo.label}</span>
                {cookInfo.sub && <span style={{ color: "#6a6a8a", fontSize: 12, marginLeft: 6 }}>{cookInfo.sub}</span>}
                <span style={{ color: "#7878aa", fontSize: 12, marginLeft: 8 }}>{cookInfo.range}</span>
              </div>
            </div>
          )}

          {detail && <p style={{ color: "#aab", fontSize: 14, lineHeight: 1.6, margin: "12px 0 0", whiteSpace: "pre-line" }}>{detail}</p>}

          {step.isMiseEnBacStep && <MiseEnBacPanel variant={variant} />}

          {step.isOvernightStep && <OvernightPanel variant={variant} />}
          {step.isOvernightStep && variant !== "apo" && (
            <p style={{ color: "#aab", fontSize: 14, lineHeight: 1.6, margin: "12px 0 0" }}>
              B&T : vérifier la température et le niveau d'eau avant de dormir. La B&T n'a pas de sonde — utiliser un thermomètre externe si possible. Si impossible de surveiller : frigo + reprise le matin.
            </p>
          )}

          {step.isInoculationStep && <StarterBadge quantity={quantity} />}

          {step.tip && (
            <div style={{
              marginTop: 10, padding: "10px 12px", background: "#1a1a12",
              borderRadius: 8, borderLeft: "3px solid #aa8833",
            }}>
              <p style={{ color: "#ccaa55", fontSize: 13, margin: 0, lineHeight: 1.5 }}>{step.tip}</p>
            </div>
          )}

          {step.hygiene && <InfoBadge icon="🧼" text={step.hygiene} color="#7a9aaa" />}
          {step.water && <InfoBadge icon="💧" text={step.water} color="#6a8acc" />}

          {step.isVariantStep && variant && (
            <div style={{ marginTop: 12 }}>
              {config.params.map((p, i) => (
                <div key={i} style={{
                  display: "flex", justifyContent: "space-between", padding: "7px 0",
                  borderBottom: "1px solid #1e1e2e",
                }}>
                  <span style={{ color: "#777", fontSize: 13 }}>{p.label}</span>
                  <span style={{ color: "#bbc", fontSize: 13, fontWeight: 500, textAlign: "right", maxWidth: "55%" }}>{p.value}</span>
                </div>
              ))}
              {config.hygieneNote && <InfoBadge icon="🧼" text={config.hygieneNote} color="#7a9aaa" />}
              {config.waterNote && <InfoBadge icon="💧" text={config.waterNote} color="#6a8acc" />}
            </div>
          )}

          {step.apoGuidance && <APOGuidancePanel guidance={step.apoGuidance} variant={variant} />}

          {timerMinutes && <Timer minutes={timerMinutes} label={timerLabel} />}
        </div>
      )}
    </div>
  );
}

function BatchNotes({ notes, onAdd }) {
  const [input, setInput] = useState("");
  const handleSubmit = () => { if (input.trim()) { onAdd(input.trim()); setInput(""); } };

  return (
    <div style={{ marginTop: 20 }}>
      <h3 style={{ color: "#8888aa", fontSize: 12, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 12 }}>
        Journal du batch
      </h3>
      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        <input value={input} onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && handleSubmit()}
          placeholder="Observation, ajustement..."
          style={{
            flex: 1, padding: "10px 14px", borderRadius: 10, border: "1px solid #2a2a4a",
            background: "#111118", color: "#dddde8", fontSize: 14, outline: "none",
          }}
        />
        <button onClick={handleSubmit} style={{
          padding: "10px 16px", borderRadius: 10, border: "none",
          background: "#5a5aaa", color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer",
        }}>+</button>
      </div>
      {notes.map((note, i) => (
        <div key={i} style={{
          padding: "10px 14px", background: "#111118", borderRadius: 10,
          marginBottom: 6, borderLeft: "3px solid #3a3a6a",
        }}>
          <span style={{ color: "#556", fontSize: 11 }}>{note.time}</span>
          <p style={{ color: "#bbc", fontSize: 13, margin: "4px 0 0", lineHeight: 1.5 }}>{note.text}</p>
        </div>
      ))}
    </div>
  );
}

function TempehTracker() {
  const [variant, setVariant] = useState(null);
  const [cookingMethod, setCookingMethod] = useState(null);
  const [completed, setCompleted] = useState({});
  const [notes, setNotes] = useState([]);
  const [started, setStarted] = useState(false);
  const [quantity, setQuantity] = useState("1kg");

  const toggleStep = useCallback((id) => {
    setCompleted((prev) => ({ ...prev, [id]: !prev[id] }));
  }, []);

  const addNote = useCallback((text) => {
    const now = new Date();
    const time = now.toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    setNotes((prev) => [{ text, time }, ...prev]);
  }, []);

  const completedCount = Object.values(completed).filter(Boolean).length;
  const progress = completedCount / STEPS.length;
  const canStart = variant && cookingMethod;
  const selectedQ = QUANTITIES.find(q => q.key === quantity);

  const reset = () => {
    setCompleted({}); setNotes([]); setStarted(false); setVariant(null); setCookingMethod(null);
  };

  if (!started) {
    return (
      <div style={{
        minHeight: "100vh", background: "#0d0d14", color: "#dddde8",
        fontFamily: "'DM Sans', 'Avenir', -apple-system, sans-serif",
        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24,
      }}>
        <div style={{ textAlign: "center", maxWidth: 360, width: "100%" }}>
          <div style={{ fontSize: 56, marginBottom: 16 }}>🫘</div>
          <h1 style={{ fontSize: 28, fontWeight: 700, margin: "0 0 6px", letterSpacing: -0.5 }}>Tempeh Tracker</h1>
          <p style={{ color: "#6a6a8a", fontSize: 14, marginBottom: 28 }}>Protocole de fermentation pas à pas</p>

          <div style={{ marginBottom: 22 }}>
            <p style={{ color: "#8888aa", fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 8 }}>Soja dépelliculé bio (Celnat)</p>
            <div style={{ display: "flex", gap: 8, justifyContent: "center", flexWrap: "wrap" }}>
              {QUANTITIES.map((q) => (
                <button key={q.key} onClick={() => setQuantity(q.key)} style={{
                  padding: "8px 16px", borderRadius: 8,
                  border: quantity === q.key ? "1px solid #5a5aaa" : "1px solid #2a2a4a",
                  background: quantity === q.key ? "#1e1e3e" : "transparent",
                  color: quantity === q.key ? "#aab0ff" : "#6a6a8a", fontSize: 14, fontWeight: 500, cursor: "pointer",
                }}>{q.label}</button>
              ))}
            </div>
            {selectedQ && (
              <div style={{ marginTop: 10, padding: "10px 14px", background: "#111118", borderRadius: 10, border: "1px solid #1e1e2e" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ color: "#7a9a7a", fontSize: 12 }}>🍄 Starter</span>
                  <span style={{ color: "#b8d8b0", fontSize: 13, fontWeight: 600 }}>{selectedQ.starter}</span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 4 }}>
                  <span style={{ color: "#7a7a9a", fontSize: 12 }}>Rendement</span>
                  <span style={{ color: "#aab", fontSize: 12 }}>{selectedQ.yield}</span>
                </div>
              </div>
            )}
          </div>

          <div style={{ marginBottom: 22 }}>
            <p style={{ color: "#8888aa", fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 8 }}>Cuisson</p>
            <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
              {COOKING_METHODS.map((m) => (
                <button key={m.key} onClick={() => setCookingMethod(m.key)} style={{
                  padding: "12px 16px", borderRadius: 12,
                  border: cookingMethod === m.key ? "1px solid #5a5aaa" : "1px solid #2a2a4a",
                  background: cookingMethod === m.key ? "#1e1e3e" : "transparent",
                  color: cookingMethod === m.key ? "#dddde8" : "#6a6a8a",
                  fontSize: 14, fontWeight: 600, cursor: "pointer",
                  display: "flex", flexDirection: "column", alignItems: "center", gap: 3, minWidth: 140,
                }}>
                  <span style={{ fontSize: 20 }}>{m.icon}</span>
                  <span>{m.label}</span>
                  {m.sub && <span style={{ fontSize: 11, color: "#6a6a8a", fontWeight: 400 }}>{m.sub}</span>}
                  <span style={{ fontSize: 11, color: "#5a5a7a", fontWeight: 400 }}>{m.range}</span>
                </button>
              ))}
            </div>
          </div>

          <div style={{ marginBottom: 24 }}>
            <p style={{ color: "#8888aa", fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 8 }}>Fermentation</p>
            <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
              {[{ key: "apo", ...APO_CONFIG }, { key: "bt", ...BT_CONFIG }].map((v) => (
                <button key={v.key} onClick={() => setVariant(v.key)} style={{
                  padding: "14px 24px", borderRadius: 12,
                  border: variant === v.key ? "1px solid #5a5aaa" : "1px solid #2a2a4a",
                  background: variant === v.key ? "#1e1e3e" : "transparent",
                  color: variant === v.key ? "#dddde8" : "#6a6a8a",
                  fontSize: 15, fontWeight: 600, cursor: "pointer",
                  display: "flex", flexDirection: "column", alignItems: "center", gap: 6, minWidth: 130,
                }}>
                  <span style={{ fontSize: 24 }}>{v.icon}</span>
                  {v.name}
                </button>
              ))}
            </div>
          </div>

          <div style={{
            padding: "12px 16px", background: "#111118", borderRadius: 12,
            border: "1px solid #1e1e2e", marginBottom: 20, textAlign: "left",
          }}>
            <p style={{ color: "#7a9aaa", fontSize: 12, margin: 0, lineHeight: 1.6 }}>
              🧼 <strong style={{ color: "#9abac8" }}>Hygiène</strong> — Propre, pas stérile. La sécurité vient du process (pH acide, égouttage, 30°C). Chaque étape affiche son niveau requis.
            </p>
          </div>

          <button onClick={() => canStart && setStarted(true)} disabled={!canStart} style={{
            width: "100%", padding: "14px 0", borderRadius: 12, border: "none",
            background: canStart ? "#5a5aaa" : "#2a2a4a", color: canStart ? "#fff" : "#555",
            fontSize: 16, fontWeight: 700, cursor: canStart ? "pointer" : "default", letterSpacing: 0.5,
          }}>
            Démarrer le batch
          </button>
        </div>
      </div>
    );
  }

  const phases = [...new Set(STEPS.map((s) => s.phase))];

  return (
    <div style={{
      minHeight: "100vh", background: "#0d0d14", color: "#dddde8",
      fontFamily: "'DM Sans', 'Avenir', -apple-system, sans-serif", paddingBottom: 40,
    }}>
      <div style={{
        position: "sticky", top: 0, zIndex: 10,
        background: "rgba(13,13,20,0.92)", backdropFilter: "blur(12px)",
        padding: "14px 18px 12px", borderBottom: "1px solid #1e1e2e",
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <div>
            <span style={{ fontSize: 18, fontWeight: 700 }}>🫘 Tempeh</span>
            <span style={{ color: "#5a5a7a", fontSize: 13, marginLeft: 10 }}>
              {variant === "apo" ? "APO" : "B&T"} · {cookingMethod === "omnicuiseur" ? "Omni" : "Cass."} · {quantity}
            </span>
          </div>
          <button onClick={reset} style={{
            padding: "6px 12px", borderRadius: 6, border: "1px solid #2a2a4a",
            background: "transparent", color: "#6a6a8a", fontSize: 12, cursor: "pointer",
          }}>Nouveau</button>
        </div>
        <div style={{ height: 4, background: "#1e1e2e", borderRadius: 2, overflow: "hidden" }}>
          <div style={{
            height: "100%", width: `${progress * 100}%`,
            background: progress === 1 ? "#6abf6a" : "#5a5aaa", borderRadius: 2, transition: "width 0.3s ease",
          }} />
        </div>
        <div style={{ textAlign: "right", fontSize: 11, color: "#555", marginTop: 4 }}>
          {completedCount}/{STEPS.length}
        </div>
      </div>

      <div style={{ padding: "12px 14px 0" }}>
        {phases.map((phase) => (
          <div key={phase} style={{ marginBottom: 16 }}>
            <h2 style={{
              fontSize: 11, letterSpacing: 2, textTransform: "uppercase",
              color: "#5a5a7a", margin: "16px 0 10px 4px", fontWeight: 600,
            }}>{phase}</h2>
            {STEPS.filter((s) => s.phase === phase).map((step) => (
              <StepCard key={step.id} step={step} completed={completed[step.id]}
                onToggle={() => toggleStep(step.id)} variant={variant}
                cookingMethod={cookingMethod} quantity={quantity} />
            ))}
          </div>
        ))}
      </div>

      <div style={{ padding: "0 14px" }}>
        <ThermalManagementPanel variant={variant} />
      </div>

      <div style={{ padding: "0 14px" }}>
        <OptimizationPanel variant={variant} />
      </div>

      <div style={{ padding: "0 14px" }}>
        <PostRecolteSection />
      </div>

      <div style={{ padding: "0 14px" }}>
        <BatchNotes notes={notes} onAdd={addNote} />
      </div>

      {progress === 1 && (
        <div style={{
          margin: "24px 14px", padding: 20, background: "#1a2e1a",
          border: "1px solid #2d5a2d", borderRadius: 14, textAlign: "center",
        }}>
          <div style={{ fontSize: 32, marginBottom: 8 }}>🎉</div>
          <p style={{ color: "#6abf6a", fontSize: 16, fontWeight: 600, margin: 0 }}>Batch terminé !</p>
          <p style={{ color: "#5a8a5a", fontSize: 13, marginTop: 6 }}>Consulte la section Post-Récolte pour découpe, conservation, cuisson et marinades.</p>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(TempehTracker));
  </script>
</body>
</html>
