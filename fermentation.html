<script type="text/babel">
const {useState,useEffect,useCallback,useRef} = React;

// ═══════════════════════════════════════════
// UTILS — Template resolution, conditional content
// ═══════════════════════════════════════════

function resolveTemplate(text, selectors, selections) {
  if (typeof text !== 'string') return text;
  return text.replace(/\{\{(\w+)\.(\w+)\}\}/g, (match, selectorKey, valueKey) => {
    const selector = selectors?.find(s => s.key === selectorKey);
    const option = selector?.options?.find(o => o.key === selections[selectorKey]);
    return option?.values?.[valueKey] || match;
  });
}

function resolveConditional(content, selections) {
  if (content && typeof content === 'object' && content.depends_on) {
    const sel = selections[content.depends_on];
    return content.values?.[sel] || '';
  }
  return content;
}

function resolveContent(content, selectors, selections) {
  const resolved = resolveConditional(content, selections);
  return resolveTemplate(resolved, selectors, selections);
}

// ═══════════════════════════════════════════
// COMPONENTS — Shared UI blocks
// ═══════════════════════════════════════════

function Timer({minutes, label}) {
  const [total, setTotal] = useState(minutes * 60);
  const [running, setRunning] = useState(false);
  const [finished, setFinished] = useState(false);
  useEffect(() => {
    if (!running || total <= 0) return;
    const iv = setInterval(() => {
      setTotal(p => { if (p <= 1) { setRunning(false); setFinished(true); return 0; } return p - 1; });
    }, 1000);
    return () => clearInterval(iv);
  }, [running, total]);
  const pct = 1 - total / (minutes * 60);
  const reset = () => { setTotal(minutes * 60); setRunning(false); setFinished(false); };
  const m = Math.floor(total / 60), s = total % 60;
  const display = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return (
    <div style={{marginTop:12,background:finished?'#1a2e1a':'#1a1a2e',border:`1px solid ${finished?'#2d5a2d':'#2a2a4a'}`,borderRadius:10,padding:'12px 14px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{color:'#8888aa',fontSize:12}}>⏱ {label||'Timer'}</span>
        <span style={{color:finished?'#6abf6a':'#dddde8',fontSize:22,fontWeight:700,fontVariantNumeric:'tabular-nums'}}>{display}</span>
      </div>
      <div style={{height:4,background:'#1e1e2e',borderRadius:2,overflow:'hidden',margin:'8px 0'}}>
        <div style={{height:'100%',width:`${pct*100}%`,background:finished?'#6abf6a':'#aa8833',borderRadius:2,transition:'width 0.5s ease'}}/>
      </div>
      <div style={{display:'flex',gap:8,justifyContent:'center'}}>
        <button onClick={()=>setRunning(!running)} style={{padding:'6px 18px',borderRadius:6,border:'1px solid #3a3a5a',background:running?'#2a1a1a':'#1a1a2e',color:running?'#cc7755':'#aab0ff',fontSize:13,fontWeight:600}}>{running?'Pause':finished?'Fini ✓':'Démarrer'}</button>
        <button onClick={reset} style={{padding:'6px 12px',borderRadius:6,border:'1px solid #2a2a4a',background:'transparent',color:'#6a6a8a',fontSize:12}}>Reset</button>
      </div>
    </div>
  );
}

function CollapsiblePanel({icon, title, color, children, defaultOpen}) {
  const [open, setOpen] = useState(defaultOpen || false);
  return (
    <div style={{background:'#16161f',border:open?`1px solid ${color||'#5a5aaa'}`:'1px solid #25253a',borderRadius:14,marginBottom:10,overflow:'hidden'}}>
      <div onClick={()=>setOpen(!open)} style={{display:'flex',alignItems:'center',padding:'14px 16px',cursor:'pointer',gap:10}}>
        <span style={{fontSize:18}}>{icon}</span>
        <span style={{flex:1,fontSize:14,fontWeight:600,color:'#dddde8'}}>{title}</span>
        <span style={{color:'#555',fontSize:18,transform:open?'rotate(180deg)':'rotate(0)',transition:'transform 0.2s'}}>▾</span>
      </div>
      {open && <div style={{padding:'0 16px 16px',borderTop:'1px solid #1e1e2e'}}>{children}</div>}
    </div>
  );
}

// ═══════════════════════════════════════════
// ERROR BOUNDARY
// ═══════════════════════════════════════════

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (this.state.error) {
      return React.createElement('div', {style:{padding:20,margin:14,background:'#2a1a1a',border:'1px solid #5a2a2a',borderRadius:14}},
        React.createElement('p', {style:{color:'#cc7755',fontSize:14,fontWeight:600,margin:'0 0 8px'}}, '⚠️ Erreur de rendu'),
        React.createElement('p', {style:{color:'#aab',fontSize:12,margin:'0 0 8px'}}, String(this.state.error?.message || this.state.error)),
        React.createElement('button', {onClick:()=>this.setState({error:null}),style:{padding:'6px 14px',borderRadius:6,border:'1px solid #5a2a2a',background:'transparent',color:'#cc7755',fontSize:12,cursor:'pointer'}}, 'Réessayer')
      );
    }
    return this.props.children;
  }
}

// ═══════════════════════════════════════════
// BLOCK RENDERERS — Each block type
// ═══════════════════════════════════════════

function BlockRenderer({block, selectors, selections, theme}) {
  if (!block || !block.type) return null;
  const t = theme || {};
  const resolve = (c) => { try { return resolveContent(c, selectors, selections); } catch(e) { return ''; } };

  try {
  switch (block.type) {
    case 'text': {
      const content = resolve(block.content);
      if (!content) return null;
      return <p style={{color:'#aab',fontSize:14,lineHeight:1.7,margin:'12px 0 0',whiteSpace:'pre-line'}}>{content}</p>;
    }

    case 'tip': {
      const content = resolve(block.content);
      if (!content) return null;
      return (
        <div style={{marginTop:10,padding:'10px 12px',background:'#1a1a12',borderRadius:8,borderLeft:`3px solid ${t.accent||'#aa8833'}`}}>
          <p style={{color:'#ccaa55',fontSize:13,margin:0,lineHeight:1.5}}>{content}</p>
        </div>
      );
    }

    case 'hygiene': {
      const content = resolve(block.content);
      if (!content) return null;
      return (
        <div style={{marginTop:8,padding:'8px 12px',background:'#111118',borderRadius:8,display:'flex',gap:8,alignItems:'flex-start'}}>
          <span style={{fontSize:14,flexShrink:0}}>🧼</span>
          <p style={{color:'#7a9aaa',fontSize:12,margin:0,lineHeight:1.5}}>{content}</p>
        </div>
      );
    }

    case 'timer':
      if (!block.minutes) return null;
      return <Timer minutes={block.minutes} label={block.label} />;

    case 'checks':
      if (!block.items || !Array.isArray(block.items)) return null;
      return (
        <div style={{marginTop:10}}>
          {block.items.map((c,i) => (
            <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'1px solid #1e1e2e'}}>
              <span style={{color:'#aab',fontSize:12,flex:1}}>{resolve(c.condition)}</span>
              <span style={{color:c.color||'#aab',fontSize:12,fontWeight:600,marginLeft:8,textAlign:'right',minWidth:80}}>{resolve(c.result)}</span>
            </div>
          ))}
        </div>
      );

    case 'guidance':
      return (
        <div style={{marginTop:10}}>
          {block.params?.map((p,i) => (
            <div key={i} style={{padding:'8px 0',borderBottom:'1px solid #1e1e2e'}}>
              <div style={{display:'flex',justifyContent:'space-between'}}>
                <span style={{color:'#8888aa',fontSize:12}}>{p.label}</span>
                <span style={{color:t.accent||'#aa8833',fontSize:12,fontWeight:600}}>{resolve(p.value)}</span>
              </div>
              {p.note && <p style={{color:'#6a6a8a',fontSize:11,margin:'4px 0 0',lineHeight:1.4}}>{resolve(p.note)}</p>}
            </div>
          ))}
          {block.checks && <BlockRenderer block={{type:'checks',items:block.checks}} selectors={selectors} selections={selections} theme={theme}/>}
        </div>
      );

    case 'ingredient_cards':
      return (
        <div style={{marginTop:12}}>
          {block.groups?.map((group,gi) => (
            <div key={gi}>
              {group.label && (
                <div style={{margin:`${gi>0?'14px':'0'} 0 10px`,padding:'8px 12px',background:group.label_type==='danger'?'#2a1a1a':'#1a1a2e',borderRadius:8,border:group.label_type==='danger'?'1px solid #5a2a2a':'1px solid #2a2a4a'}}>
                  <p style={{color:group.label_type==='danger'?'#cc7755':'#aab0ff',fontSize:12,margin:0,fontWeight:600}}>{group.label}</p>
                </div>
              )}
              {group.items?.map((ing,ii) => (
                <div key={ii} style={{padding:'12px 14px',background:'#111118',borderRadius:10,marginBottom:8,borderLeft:`3px solid ${ing.heat_sensitive?'#cc7755':t.accent||'#aa8833'}`}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                    <span style={{color:'#dddde8',fontSize:13,fontWeight:600}}>{ing.icon} {ing.name}</span>
                    <span style={{color:t.accent||'#aa8833',fontSize:12,fontWeight:700,background:t.accentLight||'#1e1a12',padding:'2px 8px',borderRadius:6}}>{resolve(ing.quantity)}</span>
                  </div>
                  <p style={{color:'#aab',fontSize:12,lineHeight:1.6,margin:'0 0 4px'}}>{ing.what}</p>
                  <p style={{color:'#6a8acc',fontSize:11,margin:0}}>📍 Où trouver : {ing.where}</p>
                </div>
              ))}
            </div>
          ))}
          {block.footer && (
            <div style={{marginTop:10,padding:'10px 12px',background:'#1a1a2e',borderRadius:8,border:'1px solid #2a2a4a'}}>
              <p style={{color:'#aab0ff',fontSize:13,margin:0,fontWeight:600}}>{resolve(block.footer)}</p>
            </div>
          )}
        </div>
      );

    default:
      return null;
  }
  } catch(e) { console.error('BlockRenderer error:', e, block); return null; }
}

// ═══════════════════════════════════════════
// STEP CARD
// ═══════════════════════════════════════════

function StepCard({step, completed, onToggle, selectors, selections, theme}) {
  const [expanded, setExpanded] = useState(false);
  const t = theme || {};
  return (
    <div style={{
      background:completed?'#111118':'#16161f',
      border:completed?'1px solid #1e1e2e':expanded?`1px solid ${t.accent||'#aa8833'}`:'1px solid #25253a',
      borderRadius:14,marginBottom:10,overflow:'hidden',
      opacity:completed?0.5:1,transition:'all 0.2s ease',
    }}>
      <div onClick={()=>setExpanded(!expanded)} style={{display:'flex',alignItems:'center',padding:'14px 16px',cursor:'pointer',gap:12}}>
        <div onClick={e=>{e.stopPropagation();onToggle();}} style={{
          width:26,height:26,borderRadius:8,
          border:completed?'2px solid #6abf6a':'2px solid #4a4a6a',
          background:completed?'#1a2e1a':'transparent',
          display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,cursor:'pointer',
        }}>
          {completed && <span style={{color:'#6abf6a',fontSize:14,fontWeight:700}}>✓</span>}
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:15,fontWeight:600,color:completed?'#555':'#dddde8',textDecoration:completed?'line-through':'none'}}>{step.title}</div>
          {step.safety_critical && !expanded && <div style={{fontSize:11,color:'#cc5555',marginTop:2}}>⚠️ Étape de sécurité critique</div>}
        </div>
        <span style={{color:'#555',fontSize:18,transform:expanded?'rotate(180deg)':'rotate(0)',transition:'transform 0.2s'}}>▾</span>
      </div>
      {expanded && (
        <div style={{padding:'0 16px 16px',borderTop:'1px solid #1e1e2e'}}>
          {step.blocks?.map((block,i) => <BlockRenderer key={i} block={block} selectors={selectors} selections={selections} theme={t}/>)}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════
// PANEL RENDERERS — Science, recipes, etc.
// ═══════════════════════════════════════════

function SectionPanel({panel, theme}) {
  const t = theme || {};
  return (
    <CollapsiblePanel icon={panel.icon} title={panel.title} color={panel.color}>
      {panel.intro && <p style={{color:'#8888aa',fontSize:12,margin:'8px 0 12px',lineHeight:1.5}}>{panel.intro}</p>}

      {panel.subsections?.map((sub,si) => (
        <div key={si} style={{marginBottom:14}}>
          <p style={{color:'#ccaa55',fontSize:12,fontWeight:600,margin:'0 0 6px'}}>{sub.heading}</p>
          {sub.items?.map((item,ii) => (
            <div key={ii} style={{display:'flex',gap:8,alignItems:'flex-start',padding:'4px 0'}}>
              <p style={{color:'#aab',fontSize:11,margin:0,lineHeight:1.4}}><strong style={{color:'#dddde8'}}>{item.label}</strong> — {item.value}</p>
            </div>
          ))}
        </div>
      ))}

      {panel.sections?.map((s,i) => (
        <div key={i} style={{marginTop:i>0?14:8}}>
          <p style={{color:panel.color||'#aab0ff',fontSize:13,fontWeight:600,margin:'0 0 4px'}}>{s.heading}</p>
          {s.text && <p style={{color:'#aab',fontSize:13,lineHeight:1.6,margin:0}}>{s.text}</p>}
          {s.items && (
            <div style={{marginTop:6}}>
              {s.items.map((item,j) => (
                <div key={j} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'1px solid #1e1e2e'}}>
                  <span style={{color:'#aab',fontSize:12,flex:1}}>{item.label}</span>
                  <span style={{color:item.color||t.accent||'#aa8833',fontSize:12,fontWeight:600,minWidth:100,textAlign:'right'}}>{item.value}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      ))}

      {panel.recipes?.map((r,i) => (
        <div key={i} style={{marginBottom:14,padding:14,background:'#111118',borderRadius:12,borderLeft:`3px solid ${r.color||t.accent||'#aa8833'}`}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
            <span style={{fontSize:20}}>{r.icon}</span>
            <span style={{color:'#dddde8',fontSize:14,fontWeight:700,flex:1}}>{r.name}</span>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
            {r.timing && <span style={{fontSize:11,color:'#8888aa',background:'#1a1a2e',padding:'2px 8px',borderRadius:4}}>{r.timing}</span>}
            {r.gaba && <span style={{fontSize:11,color:'#aa8833',background:'#1e1a12',padding:'2px 8px',borderRadius:4,fontWeight:600}}>GABA {r.gaba}</span>}
            {r.spd && <span style={{fontSize:11,color:'#6abf6a',background:'#1a2e1a',padding:'2px 8px',borderRadius:4,fontWeight:600}}>SPD {r.spd}</span>}
          </div>
          <div style={{marginBottom:8}}>
            <p style={{color:'#8888aa',fontSize:11,fontWeight:600,margin:'0 0 2px',textTransform:'uppercase',letterSpacing:1}}>Ingrédients</p>
            <p style={{color:'#aab',fontSize:12,margin:0,lineHeight:1.6}}>{r.ingredients}</p>
          </div>
          <div style={{marginBottom:8}}>
            <p style={{color:'#8888aa',fontSize:11,fontWeight:600,margin:'0 0 2px',textTransform:'uppercase',letterSpacing:1}}>Méthode</p>
            <p style={{color:'#aab',fontSize:12,margin:0,lineHeight:1.6}}>{r.method}</p>
          </div>
          {r.why && <div style={{marginBottom:6}}>
            <p style={{color:'#8888aa',fontSize:11,fontWeight:600,margin:'0 0 2px',textTransform:'uppercase',letterSpacing:1}}>Pourquoi ça marche</p>
            <p style={{color:'#aab',fontSize:12,margin:0,lineHeight:1.6}}>{r.why}</p>
          </div>}
          {r.note && <div style={{padding:'6px 10px',background:'#1a1a12',borderRadius:6,borderLeft:'2px solid #aa8833'}}>
            <p style={{color:'#ccaa55',fontSize:11,margin:0,lineHeight:1.4}}>💡 {r.note}</p>
          </div>}
        </div>
      ))}

      {panel.caveat && (
        <div style={{padding:'10px 12px',background:'#1a1a2e',borderRadius:8,border:'1px solid #2a2a4a'}}>
          <p style={{color:'#8888aa',fontSize:11,margin:0,lineHeight:1.5}}>⚖️ {panel.caveat}</p>
        </div>
      )}

      {panel.type === 'matrix' && panel.matrix && <MatrixPanel matrix={panel.matrix} theme={t}/>}
    </CollapsiblePanel>
  );
}

function MatrixPanel({matrix, theme}) {
  const [selected, setSelected] = useState(null);
  const t = theme || {};
  return (
    <div style={{marginTop:8}}>
      <div style={{display:'grid',gridTemplateColumns:`auto ${matrix.cols.map(()=>'1fr').join(' ')}`,gap:4,marginBottom:14}}>
        <div style={{padding:6}}></div>
        {matrix.cols.map((col,i) => <div key={i} style={{padding:'6px 8px',textAlign:'center',color:'#8888aa',fontSize:11,fontWeight:600}}>{col}</div>)}
        {matrix.rows.map((row,ri) => (
          <React.Fragment key={ri}>
            <div style={{padding:'8px 10px',color:'#8888aa',fontSize:12,fontWeight:600,display:'flex',alignItems:'center'}}>{row}</div>
            {matrix.cols.map((col,ci) => {
              const key = `${row}|${col}`;
              const cell = matrix.cells[key];
              const isSel = selected === key;
              return (
                <button key={ci} onClick={()=>setSelected(isSel?null:key)} style={{
                  padding:'10px 8px',borderRadius:8,border:isSel?`2px solid ${cell?.tag_color||t.accent||'#5a5aaa'}`:'1px solid #25253a',
                  background:isSel?(t.accentLight||'#1e1e3e'):'#111118',cursor:'pointer',textAlign:'center',
                }}>
                  <div style={{color:cell?.tag_color||'#aab',fontSize:10,fontWeight:600,lineHeight:1.3}}>{cell?.tag?.replace(/^[✅⚡👍⚠️🚫]\s*/,'').substring(0,30)}</div>
                </button>
              );
            })}
          </React.Fragment>
        ))}
      </div>
      {selected && matrix.cells[selected] && (() => {
        const cell = matrix.cells[selected];
        return (
          <div style={{padding:14,background:'#111118',borderRadius:12,border:`1px solid ${cell.tag_color||'#25253a'}`}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
              <span style={{color:cell.tag_color||'#aab',fontSize:13,fontWeight:700}}>{cell.tag}</span>
            </div>
            {cell.items?.map((item,i) => (
              <div key={i} style={{padding:'8px 0',borderBottom:i<cell.items.length-1?'1px solid #1e1e2e':'none'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                  <span style={{color:'#dddde8',fontSize:13,fontWeight:600}}>{item.nutrient}</span>
                  <span style={{color:item.color||'#aab',fontSize:12,fontWeight:700}}>{item.reduction}</span>
                </div>
                {item.detail && <p style={{color:'#8888aa',fontSize:11,lineHeight:1.5,margin:'0 0 2px'}}>{item.detail}</p>}
                {item.impact && <p style={{color:'#aab',fontSize:11,lineHeight:1.5,margin:0}}>{item.impact}</p>}
              </div>
            ))}
            {cell.warnings?.map((w,i) => (
              <div key={i} style={{marginTop:8,padding:'6px 10px',background:'#1a1a12',borderRadius:6,borderLeft:'2px solid #aa8833'}}>
                <p style={{color:'#ccaa55',fontSize:11,margin:0,lineHeight:1.4}}>{w}</p>
              </div>
            ))}
          </div>
        );
      })()}
    </div>
  );
}

// ═══════════════════════════════════════════
// BATCH NOTES
// ═══════════════════════════════════════════

function BatchNotes({notes, onAdd, theme}) {
  const [text, setText] = useState('');
  const t = theme || {};
  return (
    <CollapsiblePanel icon="📝" title="Notes de batch" color="#5a5aaa">
      <div style={{marginTop:8}}>
        {notes.map((n,i) => (
          <div key={i} style={{padding:'8px 0',borderBottom:'1px solid #1e1e2e'}}>
            <span style={{color:'#6a6a8a',fontSize:11}}>{n.time}</span>
            <p style={{color:'#aab',fontSize:13,margin:'2px 0 0'}}>{n.text}</p>
          </div>
        ))}
        <div style={{display:'flex',gap:8,marginTop:10}}>
          <input value={text} onChange={e=>setText(e.target.value)} placeholder="Observation..."
            style={{flex:1,padding:'8px 12px',borderRadius:8,border:'1px solid #2a2a4a',background:'#111118',color:'#dddde8',fontSize:13,outline:'none'}}
            onKeyDown={e=>{if(e.key==='Enter'&&text.trim()){onAdd(text.trim());setText('');}}}/>
          <button onClick={()=>{if(text.trim()){onAdd(text.trim());setText('');}}}
            style={{padding:'8px 14px',borderRadius:8,border:'none',background:t.accent||'#aa8833',color:'#fff',fontSize:13,fontWeight:600}}>+</button>
        </div>
      </div>
    </CollapsiblePanel>
  );
}

// ═══════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════

function App() {
  const [index, setIndex] = useState(null);
  const [protocol, setProtocol] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [selections, setSelections] = useState({});
  const [started, setStarted] = useState(false);
  const [completed, setCompleted] = useState({});
  const [notes, setNotes] = useState([]);

  // Load index
  useEffect(() => {
    fetch('data/fermentation_index.json')
      .then(r => r.json())
      .then(data => { setIndex(data); setLoading(false); })
      .catch(e => {
        // Fallback: try localStorage
        const cached = localStorage.getItem('fermentation_index');
        if (cached) { setIndex(JSON.parse(cached)); setLoading(false); }
        else setError('Impossible de charger l\'index des protocoles.');
      });
  }, []);

  const loadProtocol = useCallback((proto) => {
    setLoading(true);
    fetch(proto.file)
      .then(r => r.json())
      .then(data => {
        setProtocol(data);
        localStorage.setItem('fermentation_' + proto.id, JSON.stringify(data));
        // Initialize selections with first option of each selector
        const sels = {};
        data.config?.selectors?.forEach(s => { sels[s.key] = s.options[0]?.key; });
        setSelections(sels);
        setLoading(false);
      })
      .catch(e => {
        const cached = localStorage.getItem('fermentation_' + proto.id);
        if (cached) {
          const data = JSON.parse(cached);
          setProtocol(data);
          const sels = {};
          data.config?.selectors?.forEach(s => { sels[s.key] = s.options[0]?.key; });
          setSelections(sels);
          setLoading(false);
        } else {
          setError('Impossible de charger le protocole.');
          setLoading(false);
        }
      });
  }, []);

  const toggleStep = useCallback(id => setCompleted(p => ({...p, [id]: !p[id]})), []);
  const addNote = useCallback(text => {
    setNotes(p => [...p, {text, time: new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}]);
  }, []);
  const reset = () => { setStarted(false); setCompleted({}); setNotes([]); };
  const backToIndex = () => { setProtocol(null); setStarted(false); setCompleted({}); setNotes({}); };

  if (loading) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#0d0d14'}}><p style={{color:'#6a6a8a',fontSize:14}}>Chargement...</p></div>;
  if (error) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#0d0d14'}}><p style={{color:'#cc5555',fontSize:14}}>{error}</p></div>;

  // ─── PROTOCOL SELECTOR ───
  if (!protocol) {
    return (
      <div style={{minHeight:'100vh',background:'#0d0d14',color:'#dddde8',fontFamily:"'DM Sans',system-ui,sans-serif",display:'flex',alignItems:'center',justifyContent:'center'}}>
        <div style={{width:'100%',maxWidth:420,padding:'30px 20px',textAlign:'center'}}>
          <div style={{fontSize:48,marginBottom:12}}>🧫</div>
          <h1 style={{fontSize:24,fontWeight:700,margin:'0 0 4px'}}>Fermentation</h1>
          <p style={{color:'#6a6a8a',fontSize:13,margin:'0 0 30px'}}>Sélectionne un protocole</p>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {index?.protocols?.map(proto => (
              <button key={proto.id} onClick={()=>loadProtocol(proto)} style={{
                padding:'18px 20px',borderRadius:14,border:'1px solid #25253a',background:'#16161f',
                color:'#dddde8',fontSize:15,fontWeight:600,cursor:'pointer',textAlign:'left',
                display:'flex',alignItems:'center',gap:14,transition:'border-color 0.2s',
              }} onMouseEnter={e=>e.currentTarget.style.borderColor='#5a5aaa'} onMouseLeave={e=>e.currentTarget.style.borderColor='#25253a'}>
                <span style={{fontSize:32}}>{proto.icon}</span>
                <div>
                  <div>{proto.name}</div>
                  <div style={{fontSize:12,color:'#6a6a8a',fontWeight:400,marginTop:2}}>{proto.description}</div>
                </div>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  const P = protocol;
  const T = P.meta?.theme || {};
  const selectors = P.config?.selectors || [];

  const getSelectedOption = (selectorKey) => {
    const sel = selectors.find(s => s.key === selectorKey);
    return sel?.options?.find(o => o.key === selections[selectorKey]);
  };

  // ─── CONFIG SCREEN ───
  if (!started) {
    return (
      <div style={{minHeight:'100vh',background:T.bg||'#0d0d14',color:T.text||'#dddde8',fontFamily:"'DM Sans',system-ui,sans-serif",display:'flex',alignItems:'center',justifyContent:'center'}}>
        <div style={{width:'100%',maxWidth:420,padding:'30px 20px',textAlign:'center'}}>
          <button onClick={backToIndex} style={{position:'absolute',top:16,left:16,padding:'6px 12px',borderRadius:6,border:'1px solid #2a2a4a',background:'transparent',color:'#6a6a8a',fontSize:12}}>← Protocoles</button>
          <div style={{fontSize:48,marginBottom:12}}>{P.meta?.icon}</div>
          <h1 style={{fontSize:22,fontWeight:700,margin:'0 0 4px'}}>{P.meta?.name}</h1>
          <p style={{color:'#6a6a8a',fontSize:13,margin:'0 0 24px'}}>{P.meta?.description}</p>

          {P.config?.fixed_batch && (
            <div style={{padding:'16px',background:T.surfaceAlt||'#111118',borderRadius:14,border:`1px solid ${T.border||'#2a2818'}`,marginBottom:20,textAlign:'left'}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                <span style={{color:T.accent||'#8a7a44',fontSize:12,fontWeight:600}}>Batch standard</span>
                <span style={{color:T.accent||'#aa9955',fontSize:13,fontWeight:700}}>{P.config.fixed_batch.total}</span>
              </div>
              {P.config.fixed_batch.ingredients?.map((item,i) => (
                <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'5px 0',borderTop:i===0?`1px solid ${T.border||'#1e1e18'}`:'none'}}>
                  <span style={{color:item.color||'#aab',fontSize:13}}>{item.label}</span>
                  <span style={{color:'#ccc',fontSize:13,fontWeight:500}}>{item.qty}</span>
                </div>
              ))}
              {(P.config.fixed_batch.yield || P.config.fixed_batch.fermentation) && (
                <div style={{marginTop:8,paddingTop:8,borderTop:`1px solid ${T.border||'#1e1e18'}`}}>
                  {P.config.fixed_batch.yield && <div style={{display:'flex',justifyContent:'space-between'}}><span style={{color:'#666',fontSize:12}}>Rendement</span><span style={{color:'#aaa',fontSize:12}}>{P.config.fixed_batch.yield}</span></div>}
                  {P.config.fixed_batch.fermentation && <div style={{display:'flex',justifyContent:'space-between',marginTop:2}}><span style={{color:'#666',fontSize:12}}>Fermentation</span><span style={{color:'#aaa',fontSize:12}}>{P.config.fixed_batch.fermentation}</span></div>}
                </div>
              )}
            </div>
          )}

          {selectors.map(sel => (
            <div key={sel.key} style={{marginBottom:22}}>
              <p style={{color:'#8888aa',fontSize:11,letterSpacing:1.5,textTransform:'uppercase',marginBottom:8}}>{sel.label}</p>
              <div style={{display:'flex',gap:10,justifyContent:'center'}}>
                {sel.options.map(opt => (
                  <button key={opt.key} onClick={()=>setSelections(p=>({...p,[sel.key]:opt.key}))} style={{
                    padding:'14px 16px',borderRadius:12,flex:1,
                    border:selections[sel.key]===opt.key?`1px solid ${T.accent||'#aa8833'}`:'1px solid #2a2a4a',
                    background:selections[sel.key]===opt.key?(T.accentLight||'#1e1a12'):'transparent',
                    color:selections[sel.key]===opt.key?(T.text||'#dddde8'):'#6a6a8a',
                    fontSize:13,fontWeight:600,cursor:'pointer',
                    display:'flex',flexDirection:'column',alignItems:'center',gap:6,
                  }}>
                    {opt.icon && <span style={{fontSize:24}}>{opt.icon}</span>}
                    <span>{opt.label}</span>
                    {opt.subtitle && <span style={{fontSize:10,color:'#5a5a7a',fontWeight:400}}>{opt.subtitle}</span>}
                  </button>
                ))}
              </div>
              {/* Show selected option description */}
              {getSelectedOption(sel.key)?.description && (
                <div style={{marginTop:10,padding:'10px 14px',background:'#111118',borderRadius:10,border:'1px solid #1e1e2e',textAlign:'left'}}>
                  <p style={{color:T.accent||'#aa8833',fontSize:12,margin:'0 0 4px',fontWeight:600}}>{getSelectedOption(sel.key)?.label}</p>
                  <p style={{color:'#8888aa',fontSize:11,margin:0,lineHeight:1.5}}>{getSelectedOption(sel.key)?.description}</p>
                </div>
              )}
            </div>
          ))}

          {/* Summary fields */}
          {P.config?.summary_fields && getSelectedOption(selectors[selectors.length-1]?.key) && (
            <div style={{padding:'10px 14px',background:'#111118',borderRadius:10,border:'1px solid #1e1e2e',marginBottom:20}}>
              {P.config.summary_fields.map((f,i) => {
                const [selKey, valKey] = f.value_key.split('.');
                const opt = getSelectedOption(selKey);
                return (
                  <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'4px 0',borderBottom:i<P.config.summary_fields.length-1?'1px solid #1e1e2e':'none'}}>
                    <span style={{color:'#7a7a9a',fontSize:12}}>{f.label}</span>
                    <span style={{color:T.accent||'#aa8833',fontSize:12,fontWeight:600}}>{opt?.values?.[valKey]||''}</span>
                  </div>
                );
              })}
            </div>
          )}

          {/* Warnings */}
          {P.config?.warnings?.map((w,i) => (
            <div key={i} style={{padding:'12px 16px',background:'#111118',borderRadius:12,border:'1px solid #1e1e2e',marginBottom:20,textAlign:'left'}}>
              <p style={{color:w.type==='danger'?'#cc7755':'#ccaa55',fontSize:12,margin:0,lineHeight:1.6}}>
                {w.icon} <strong style={{color:w.type==='danger'?'#cc9977':'#cccc77'}}>{w.title}</strong> — {w.text}
              </p>
            </div>
          ))}

          <button onClick={()=>setStarted(true)} style={{
            width:'100%',padding:'14px 0',borderRadius:12,border:'none',
            background:T.accent||'#aa8833',color:'#fff',
            fontSize:16,fontWeight:700,cursor:'pointer',letterSpacing:0.5,
          }}>Démarrer le batch</button>
        </div>
      </div>
    );
  }

  // ─── ACTIVE TRACKING ───
  const steps = P.steps || [];
  const phases = [...new Set(steps.map(s => s.phase))];
  const completedCount = Object.values(completed).filter(Boolean).length;
  const progress = steps.length > 0 ? completedCount / steps.length : 0;

  return (
    <div style={{minHeight:'100vh',background:T.bg||'#0d0d14',color:T.text||'#dddde8',fontFamily:"'DM Sans',system-ui,sans-serif",paddingBottom:40}}>
      {/* Sticky header */}
      <div style={{position:'sticky',top:0,zIndex:10,background:T.headerBg||'rgba(13,13,20,0.92)',backdropFilter:'blur(12px)',padding:'14px 18px 12px',borderBottom:'1px solid #1e1e2e'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <div>
            <span style={{fontSize:18,fontWeight:700}}>{P.meta?.icon} {P.meta?.name}</span>
            <span style={{color:'#5a5a7a',fontSize:13,marginLeft:10}}>
              {selectors.map(s => getSelectedOption(s.key)?.label).filter(Boolean).join(' · ')}
            </span>
          </div>
          <div style={{display:'flex',gap:6}}>
            <button onClick={backToIndex} style={{padding:'6px 12px',borderRadius:6,border:'1px solid #2a2a4a',background:'transparent',color:'#6a6a8a',fontSize:12}}>←</button>
            <button onClick={reset} style={{padding:'6px 12px',borderRadius:6,border:'1px solid #2a2a4a',background:'transparent',color:'#6a6a8a',fontSize:12}}>Nouveau</button>
          </div>
        </div>
        <div style={{height:4,background:'#1e1e2e',borderRadius:2,overflow:'hidden'}}>
          <div style={{height:'100%',width:`${progress*100}%`,background:progress===1?'#6abf6a':(T.accent||'#aa8833'),borderRadius:2,transition:'width 0.3s ease'}}/>
        </div>
        <div style={{textAlign:'right',fontSize:11,color:'#555',marginTop:4}}>{completedCount}/{steps.length}</div>
      </div>

      {/* Steps */}
      <div style={{padding:'12px 14px 0'}}>
        {phases.map(phase => (
          <div key={phase} style={{marginBottom:16}}>
            <h2 style={{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:'#5a5a7a',margin:'16px 0 10px 4px',fontWeight:600}}>{phase}</h2>
            {steps.filter(s => s.phase === phase).map(step => (
              <StepCard key={step.id} step={step} completed={completed[step.id]} onToggle={()=>toggleStep(step.id)} selectors={selectors} selections={selections} theme={T}/>
            ))}
          </div>
        ))}
      </div>

      {/* Panels */}
      {P.panels && P.panels.length > 0 && (
        <div style={{padding:'0 14px'}}>
          <h2 style={{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:'#5a5a7a',margin:'16px 0 10px 4px',fontWeight:600}}>Science & Contexte</h2>
          {P.panels.map(panel => <SectionPanel key={panel.id} panel={panel} theme={T}/>)}
        </div>
      )}

      {/* Notes */}
      <div style={{padding:'0 14px'}}>
        <BatchNotes notes={notes} onAdd={addNote} theme={T}/>
      </div>

      {/* Completion */}
      {progress === 1 && (
        <div style={{margin:'24px 14px',padding:20,background:'#1a2e1a',border:'1px solid #2d5a2d',borderRadius:14,textAlign:'center'}}>
          <div style={{fontSize:32,marginBottom:8}}>🎉</div>
          <p style={{color:'#6abf6a',fontSize:16,fontWeight:600,margin:0}}>Batch terminé !</p>
          <p style={{color:'#5a8a5a',fontSize:13,marginTop:6}}>Consulte les sections Conservation et Intégration pour le portionnement.</p>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<ErrorBoundary><App/></ErrorBoundary>, document.getElementById('root'));
</script>
</body>
</html>
