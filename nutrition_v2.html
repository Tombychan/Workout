<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nutrition Tracker v2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #FAF7F2;
  --bg-card: #FFFFFF;
  --bg-card-alt: #F5F0E8;
  --text: #2C2416;
  --text-muted: #8C7E6A;
  --text-light: #B5A898;
  --accent: #D4A574;
  --accent-dark: #B8854A;
  --accent-light: #F0DCC8;
  --green: #7CAA6E;
  --green-light: #E8F2E4;
  --green-bg: #D4E8CC;
  --red: #C47A6A;
  --red-light: #F5E0DA;
  --blue: #6A94B8;
  --blue-light: #DDE9F2;
  --border: #E8E0D4;
  --shadow: 0 2px 8px rgba(44,36,22,0.06);
  --shadow-lg: 0 4px 16px rgba(44,36,22,0.1);
  --radius: 14px;
  --radius-sm: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: 'DM Sans', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
  -webkit-tap-highlight-color: transparent;
}

/* Header */
.header {
  background: linear-gradient(135deg, #3D3024 0%, #2C2416 100%);
  color: #FAF7F2;
  padding: 20px 16px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
.header-version {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  background: rgba(255,255,255,0.12);
  padding: 3px 8px;
  border-radius: 20px;
  color: var(--accent-light);
}
.header-date {
  font-size: 0.85rem;
  color: var(--accent);
  font-weight: 500;
}
.header-macros {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.macro-pill {
  flex: 1;
  text-align: center;
  padding: 6px 4px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.08);
  font-size: 0.72rem;
  line-height: 1.3;
}
.macro-pill .val {
  display: block;
  font-weight: 700;
  font-size: 0.95rem;
  font-family: 'DM Mono', monospace;
}
.macro-pill .lbl { color: var(--accent-light); }
.macro-pill.highlight { background: rgba(212,165,116,0.2); }

/* Navigation tabs */
.nav-tabs {
  display: flex;
  gap: 4px;
  padding: 8px 16px;
  background: var(--bg);
  position: sticky;
  top: 94px;
  z-index: 99;
  border-bottom: 1px solid var(--border);
}
.nav-tab {
  flex: 1;
  padding: 8px 2px;
  text-align: center;
  font-size: 0.68rem;
  font-weight: 600;
  border: none;
  background: transparent;
  color: var(--text-muted);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
}
.nav-tab.active {
  background: var(--text);
  color: var(--bg);
}

/* Content */
.content { padding: 12px 12px; }

/* Meal Card */
.meal-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
  border: 1px solid var(--border);
  transition: box-shadow 0.2s;
}
.meal-card.completed {
  border-color: var(--green);
  background: linear-gradient(135deg, var(--bg-card) 90%, var(--green-light) 100%);
}
.meal-header {
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
}
.meal-header:active { background: var(--bg-card-alt); }
.meal-left { flex: 1; }
.meal-time {
  font-family: 'DM Mono', monospace;
  font-size: 0.8rem;
  color: var(--accent-dark);
  font-weight: 500;
}
.meal-name { font-size: 1rem; font-weight: 600; margin-top: 2px; }
.meal-right { text-align: right; }
.meal-kcal {
  font-family: 'DM Mono', monospace;
  font-size: 0.95rem;
  font-weight: 700;
}
.meal-macros-mini {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 2px;
}
.leucine-badge {
  display: inline-block;
  font-size: 0.6rem;
  font-weight: 700;
  background: var(--green-bg);
  color: var(--green);
  padding: 2px 6px;
  border-radius: 10px;
  margin-top: 4px;
}
.meal-expand {
  color: var(--text-light);
  font-size: 1.2rem;
  margin-left: 10px;
  transition: transform 0.2s;
}
.meal-card.open .meal-expand { transform: rotate(180deg); }

.meal-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}
.meal-card.open .meal-body { max-height: 2000px; }

.meal-items { padding: 0 16px 14px; }

/* Item row */
.item-row {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid var(--border);
  gap: 10px;
}
.item-check {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  font-size: 0.8rem;
  color: transparent;
}
.item-check.checked {
  background: var(--green);
  border-color: var(--green);
  color: white;
}
.item-info { flex: 1; min-width: 0; }
.item-name { font-size: 0.88rem; font-weight: 500; line-height: 1.3; }
.item-detail {
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-top: 2px;
  font-family: 'DM Mono', monospace;
}
.item-qty {
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--accent-dark);
  flex-shrink: 0;
  text-align: right;
  min-width: 50px;
}

/* Juice section */
.juice-section {
  margin: 0 16px 14px;
  padding: 10px 12px;
  background: var(--bg-card-alt);
  border-radius: var(--radius-sm);
}
.juice-title {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--green);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.juice-ingredients {
  font-size: 0.75rem;
  color: var(--text-muted);
  line-height: 1.5;
}

/* Rotation (diner) */
.rotation-section {
  margin: 0 16px 14px;
  padding: 10px 12px;
  background: var(--blue-light);
  border-radius: var(--radius-sm);
}
.rotation-title {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--blue);
  margin-bottom: 6px;
}
.rotation-options { display: flex; flex-wrap: wrap; gap: 6px; }
.rotation-opt {
  font-size: 0.72rem;
  padding: 5px 10px;
  background: var(--bg-card);
  border: 1.5px solid var(--blue);
  border-radius: 20px;
  cursor: pointer;
  color: var(--blue);
  font-weight: 500;
  transition: all 0.15s;
}
.rotation-opt.selected {
  background: var(--blue);
  color: white;
}

/* Progress bar */
.meal-progress {
  height: 3px;
  background: var(--border);
}
.meal-progress-fill {
  height: 100%;
  background: var(--green);
  transition: width 0.3s;
  border-radius: 0 3px 3px 0;
}

/* Notes */
.meal-notes {
  padding: 0 16px 10px;
  font-size: 0.72rem;
  color: var(--text-muted);
  font-style: italic;
  line-height: 1.4;
}

/* Supplements tab */
.supp-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.supp-check {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border);
  background: transparent; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; font-size: 0.8rem; color: transparent;
}
.supp-check.checked { background: var(--green); border-color: var(--green); color: white; }
.supp-info { flex: 1; }
.supp-name { font-size: 0.88rem; font-weight: 600; }
.supp-dose { font-size: 0.75rem; color: var(--text-muted); font-family: 'DM Mono', monospace; }
.supp-timing { font-size: 0.7rem; color: var(--accent-dark); margin-top: 2px; }

/* Interactions tab */
.interaction-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  font-size: 0.82rem;
  line-height: 1.5;
  color: var(--text);
}
.interaction-card::first-line { font-weight: 600; }

/* Changelog tab */
.changelog-entry {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.changelog-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.changelog-version {
  font-family: 'DM Mono', monospace;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--accent-dark);
}
.changelog-date { font-size: 0.75rem; color: var(--text-muted); }
.changelog-changes { list-style: none; padding: 0; }
.changelog-changes li {
  font-size: 0.78rem;
  padding: 4px 0;
  border-top: 1px solid var(--border);
  color: var(--text);
  line-height: 1.4;
}
.changelog-changes li::before {
  content: "→ ";
  color: var(--accent-dark);
  font-weight: 600;
}

/* Daily summary */
.daily-summary {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.summary-title {
  font-size: 0.85rem;
  font-weight: 700;
  margin-bottom: 10px;
  color: var(--text);
}
.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.82rem;
}
.summary-row:last-child { border: none; }
.summary-bar-container {
  width: 80px;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-left: 8px;
}
.summary-bar {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s;
}
.summary-bar.good { background: var(--green); }
.summary-bar.over { background: var(--red); }
.summary-bar.under { background: var(--accent); }

/* Notes textarea */
.daily-notes {
  width: 100%;
  min-height: 60px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  resize: vertical;
  background: var(--bg-card);
  color: var(--text);
  margin-top: 8px;
}
.daily-notes::placeholder { color: var(--text-light); }

/* Settings / actions */
.action-bar {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.action-btn {
  flex: 1;
  min-width: 100px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}
.action-btn:active { background: var(--bg-card-alt); transform: scale(0.97); }
.action-btn.danger { border-color: var(--red); color: var(--red); }

/* Toast */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text);
  color: var(--bg);
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 0.82rem;
  font-weight: 500;
  z-index: 200;
  opacity: 0;
  transition: all 0.3s;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* Loading */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-size: 0.9rem;
}
.loading-spinner {
  width: 30px; height: 30px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Date nav */
.date-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 10px 16px;
  background: var(--bg);
}
.date-nav-btn {
  width: 34px; height: 34px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--bg-card);
  cursor: pointer;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
}
.date-nav-btn:active { background: var(--bg-card-alt); }
.date-nav-label {
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 12px;
  border-radius: var(--radius-sm);
}
.date-nav-label:active { background: var(--bg-card-alt); }

/* Status indicator */
.data-status {
  font-size: 0.65rem;
  font-family: 'DM Mono', monospace;
  color: var(--text-light);
  display: flex;
  align-items: center;
  gap: 4px;
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
}
.status-dot.cached { background: var(--accent); }
.status-dot.offline { background: var(--red); }
/* ── Leucine Calculator ── */
.leu-summary { background: var(--bg-card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.leu-summary-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
.leu-summary-stat .leu-val { font-family: 'DM Mono', monospace; font-size: 1.4rem; font-weight: 700; }
.leu-summary-stat .leu-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.leu-bar-row { margin-bottom: 6px; }
.leu-bar-label { display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 3px; color: var(--text-muted); }
.leu-bar-label .leu-bar-val { font-weight: 600; }
.leu-bar-label .leu-bar-val.ok { color: var(--green); }
.leu-bar-label .leu-bar-val.low { color: var(--red); }
.leu-bar-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.leu-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.leu-bar-fill.ok { background: var(--green); }
.leu-bar-fill.low { background: linear-gradient(90deg, var(--red), var(--accent)); }
.leu-meal-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.leu-meal-tab { flex: 1; padding: 8px 4px; font-size: 0.72rem; font-weight: 500; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); cursor: pointer; text-align: center; transition: all 0.2s; line-height: 1.3; font-family: 'DM Sans', sans-serif; }
.leu-meal-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.leu-meal-card { background: var(--bg-card); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); min-height: 80px; }
.leu-meal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.leu-meal-title { font-size: 0.88rem; font-weight: 600; color: var(--accent-dark); }
.leu-meal-totals { font-size: 0.75rem; color: var(--text-muted); font-family: 'DM Mono', monospace; }
.leu-item-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
.leu-item-info { flex: 1; min-width: 0; }
.leu-item-name { font-size: 0.82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.leu-item-detail { font-size: 0.7rem; color: var(--text-muted); font-family: 'DM Mono', monospace; }
.leu-item-qty { display: flex; align-items: center; gap: 4px; }
.leu-item-qty input { width: 50px; padding: 4px 6px; font-size: 0.82rem; font-family: 'DM Mono', monospace; background: var(--bg-card-alt); color: var(--text); border: 1px solid var(--border); border-radius: 6px; text-align: right; }
.leu-item-qty span { font-size: 0.7rem; color: var(--text-muted); }
.leu-item-remove { background: none; border: none; color: var(--red); opacity: 0.5; cursor: pointer; font-size: 1.1rem; padding: 0 4px; }
.leu-add-btn { width: 100%; padding: 10px; margin-top: 8px; background: var(--bg-card-alt); color: var(--accent-dark); border: 1px dashed var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.82rem; font-weight: 500; font-family: 'DM Sans', sans-serif; }
.leu-empty { color: var(--text-light); font-size: 0.82rem; text-align: center; padding: 20px 0; }
.leu-search-overlay { position: fixed; inset: 0; background: rgba(44,36,22,0.5); z-index: 200; display: flex; flex-direction: column; padding: 50px 12px 12px; }
.leu-search-panel { background: var(--bg-card); border-radius: 16px; max-height: 75vh; display: flex; flex-direction: column; border: 1px solid var(--border); box-shadow: var(--shadow-lg); overflow: hidden; }
.leu-search-input { width: 100%; padding: 12px 14px; font-size: 0.92rem; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); border: none; border-bottom: 1px solid var(--border); outline: none; box-sizing: border-box; }
.leu-search-results { overflow-y: auto; flex: 1; }
.leu-search-item { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 10px 14px; background: none; border: none; border-bottom: 1px solid var(--border); color: var(--text); cursor: pointer; text-align: left; font-size: 0.82rem; font-family: 'DM Sans', sans-serif; }
.leu-search-item:active { background: var(--bg-card-alt); }
.leu-search-item-name { font-weight: 500; }
.leu-search-item-cat { font-size: 0.7rem; color: var(--text-muted); }
.leu-search-item-vals { text-align: right; white-space: nowrap; font-family: 'DM Mono', monospace; font-size: 0.75rem; }
.leu-search-item-leu { color: var(--green); }
.leu-search-item-leu.low { color: var(--text-muted); }

/* ── Bol : charge gastrique ── */
:root { --amber: #D9963A; --amber-light: #F7E7CF; --amber-text: #A86A18; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--border); }
.dot.v-ok { background: var(--green); } .dot.v-warn { background: var(--amber); }
.dot.v-over { background: var(--red); } .dot.v-low { background: var(--blue); }
.bol-meal-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
.bol-meal-tab { flex: 1; padding: 7px 2px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-card); font-family: 'DM Sans', sans-serif; font-size: 0.74rem; font-weight: 600; color: var(--text-muted); cursor: pointer; line-height: 1.3; }
.bol-meal-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.bol-kcal { display: block; font-family: 'DM Mono', monospace; font-weight: 400; font-size: 0.64rem; opacity: 0.85; }
.bol-day { font-size: 0.74rem; color: var(--text-muted); margin: 0 2px 10px; }
.bol-day b { color: var(--text); }
.verdict { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; border: 1.5px solid var(--border); background: var(--bg-card); box-shadow: var(--shadow); }
.verdict.v-ok { border-color: var(--green); background: linear-gradient(180deg, var(--green-light), var(--bg-card) 70px); }
.verdict.v-warn { border-color: var(--amber); background: linear-gradient(180deg, var(--amber-light), var(--bg-card) 70px); }
.verdict.v-over { border-color: var(--red); background: linear-gradient(180deg, var(--red-light), var(--bg-card) 70px); }
.verdict.v-low { border-color: var(--blue); background: linear-gradient(180deg, var(--blue-light), var(--bg-card) 70px); }
.verdict-title { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
.verdict-sub { font-size: 0.76rem; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
.verdict-why { font-size: 0.76rem; margin-top: 8px; line-height: 1.45; display: flex; flex-direction: column; gap: 3px; }
.g-row { margin-top: 11px; }

}

<body>
<div class="header">
  <div class="header-top">
    <h1>🥬 Nutrition</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="data-status" id="dataStatus">
        <div class="status-dot"></div>
        <span>chargement…</span>
      </div>
      <div class="header-version" id="headerVersion">–</div>

  </div>

</div>

    <div class="loading-spinner"></div>
    Chargement de la routine…
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── State ──
let routine = null;
let currentDate = todayStr();
let currentTab = 'bol';
let tracking = {};

// ── Bol : composition des repas et charge gastrique ──
const MEAL_IDS = ['r1', 'inter', 'r2', 'collation', 'diner'];
const MAIN_IDS = ['r1', 'r2', 'collation', 'diner']; // une journée est complète quand ces quatre repas sont renseignés
// Valeurs de secours si routine_alimentaire.json (bloc meal_corridors) n'est pas chargé
const DEFAULT_CORRIDORS = {
  liquid_mass_factor: 0.5,
  meals: {
    r1: { label: 'R1', time: '8h', kcal: { min: 600, max: 850, red: 1000 }, fat_g: { max: 22, red: 30 }, mass_g: { max: 600, red: 800 }, leucine_min_g: 2.5 },
    r2: { label: 'R2', time: '12h30', kcal: { min: 650, max: 850, red: 1000 }, fat_g: { max: 35, red: 45 }, mass_g: { max: 850, red: 1050 }, leucine_min_g: 2.5 },
    collation: { label: 'Collation', time: '16h', kcal: { min: 300, max: 500, red: 650 }, fat_g: { max: 10, red: 15 }, mass_g: { max: 450, red: 600 }, leucine_min_g: 2.5 },
    diner: { label: 'Dîner', time: '18h30', kcal: { min: 450, max: 650, red: 800 }, fat_g: { max: 20, red: 28 }, mass_g: { max: 700, red: 900 }, protein_g: { max: 30, red: 40 }, leucine_min_g: null },
    inter: { label: 'Inter', time: '12h', kcal: { max: 250, red: 400 }, fat_g: { max: 10, red: 15 }, mass_g: { max: 300, red: 450 }, leucine_min_g: null },
  },
};
const VEG_CATS = ['Légumes cuits', 'Crudités', 'Féculents', 'Légumes jus'];
const TRIG_LABEL = { acide: 'Acide', menthe: 'Menthe', allium: 'Ail / oignon / poireau' };
const LOC_TAGS = ['Derrière le sternum', 'Creux de l’estomac', 'Gorge / bouche', 'Remontées acides'];
const CTX_TAGS = ['Chant', 'Sol / gainage', 'Flexion (hinge, rows)', 'Allongé', 'Sauna', 'Effort intense', 'Stress', 'Mangé vite'];
const ENERGY_TAGS = ['Coup de fatigue', 'Faim', 'Concentration en baisse', 'Faiblesse / vertige', 'Irritabilité'];
const ENERGY_CTX = ['À jeun', 'Pendant l’entraînement', 'En cours', 'Chant', 'Après un repas', 'Fin de journée'];
const VERDICT_TXT = {
  ok: ['Dans le couloir', 'Volume, graisses et énergie dans les clous.'],
  warn: ['Limite', 'Un paramètre dépasse le vert : risque de brûlures accru.'],
  over: ['Trop chargé', 'Au moins un paramètre est dans le rouge : allège avant de manger.'],
  low: ['Pas assez', 'Rien de trop, mais il manque de quoi nourrir l’entraînement.'],
  empty: ['Compose ton repas', 'Charge un modèle ou ajoute des aliments.'],
};

let baseNutritionelle = null;
let foodsById = {};
let foodList = [];
let leuMeals = { r1: [], inter: [], r2: [], collation: [], diner: [] }; // { id, grams }
let leuActiveMeal = mealForNow();
let userTemplates = [];
let journal = { entries: [] };
let jOpenId = null, jDraft = null;
let bolTimes = {};        // heure prévue par repas, 'HH:MM'
let bedtime = null;       // heure de coucher prévue, 'HH:MM'
let wake = null;          // heure de réveil, 'HH:MM'
let activeAxis = 'reflux';

const num = v => { const x = typeof v === 'number' ? v : parseFloat(v); return Number.isFinite(x) ? x : 0; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (v, d = 0) => num(v).toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });

function mealForNow() {
  const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  return h < 11.25 ? 'r1' : h < 12.75 ? 'inter' : h < 15 ? 'r2' : h < 17.5 ? 'collation' : 'diner';
}
function corridors() { return (routine && routine.meal_corridors && routine.meal_corridors.meals) ? routine.meal_corridors : DEFAULT_CORRIDORS; }
function mealCfg(id) { return corridors().meals[id] || DEFAULT_CORRIDORS.meals[id]; }

async function loadBaseNutritionelle() {
  try {
    const resp = await fetch('base_nutritionnelle.json?v=' + Date.now());
    if (resp.ok) {
      baseNutritionelle = await resp.json();
      try { localStorage.setItem('nt-basenutri-cache', JSON.stringify(baseNutritionelle)); } catch(e) {}
    }
  } catch(e) {}
  if (!baseNutritionelle) {
    try {
      const cached = localStorage.getItem('nt-basenutri-cache');
      if (cached) baseNutritionelle = JSON.parse(cached);
    } catch(e) {}
  }
  buildFoods();
  try {
    const saved = localStorage.getItem('nt-leumeal-v1');
    if (saved) {
      const s = JSON.parse(saved);
      MEAL_IDS.forEach(m => { leuMeals[m] = Array.isArray(s[m]) ? s[m].filter(i => i && i.id).map(i => ({ id: i.id, grams: num(i.grams) })) : []; });
    }
  } catch(e) {}
  bolRolledOver = bolRollover();
  try { const t = localStorage.getItem('nt-templates-v1'); if (t) userTemplates = JSON.parse(t) || []; } catch(e) { userTemplates = []; }
  try { const s = localStorage.getItem('nt-bol-times-v1'); if (s) bolTimes = JSON.parse(s) || {}; } catch(e) { bolTimes = {}; }
  try { bedtime = localStorage.getItem('nt-bedtime-v1') || null; wake = localStorage.getItem('nt-wake-v1') || null; } catch(e) {}
}
function saveTimes() { try { localStorage.setItem('nt-bol-times-v1', JSON.stringify(bolTimes)); if (bedtime) localStorage.setItem('nt-bedtime-v1', bedtime); if (wake) localStorage.setItem('nt-wake-v1', wake); } catch(e) {} }

function buildFoods() {
  foodsById = {}; foodList = [];
  if (!baseNutritionelle || !baseNutritionelle.items) return;
  for (const v of Object.values(baseNutritionelle.items)) {
    const f = {
      id: v.id || '', n: v.Aliment || '', c: v['Catégorie'] || '', p: num(v['Portion type (g)']) || 100,
      kcal: num(v['kcal/100g']), pr: num(v['Prot (g/100g)']), fat: num(v['Lip (g/100g)']), carb: num(v['Glu (g/100g)']),
      l: num(v['Leucine /100g (g)']), lEst: !!v['Leucine estimée'], dig: num(v['Digest. prot. (coef)']) || 0.8,
      state: v['État'] || 'solide', massCoef: num(v['Masse ingérée (coef)']) || 1,
      mx: num(v['Méthylxanthines (mg/100g)']), trig: Array.isArray(v['Déclencheurs']) ? v['Déclencheurs'] : [],
      ferm: v['Fermentesc.'] || '', unit: (v['Unité'] && num(v['Unité'].g) > 0) ? v['Unité'] : null, hint: v['Repères'] || '',
      // v2 : champs de la base v2.5/2.6
      fib: num(v['Fibres (g/100g)']), na: num(v['Na (mg/100g)']), fe: num(v['Fe (mg/100g)']), zn: num(v['Zn (mg/100g)']),
      vitc: num(v['Vit C (mg/100g)']), poly: num(v['Polyphén. totaux (mg/100g)']), osm: num(v['Ch. osmot. rénale (mOsm/100g)']),
      o3: num(v['Ω3 EPA+DHA (mg/100g)']), ig: (v['IG'] == null ? null : num(v['IG'])), inhib: v['Inhib. Fe/Zn'] || '',
      fodSt: v['FODMAP statut'] || 'inconnu', fodFams: Array.isArray(v['FODMAP familles']) ? v['FODMAP familles'] : [],
      fodGreen: (v['FODMAP portion verte max (g)'] == null ? null : num(v['FODMAP portion verte max (g)'])),
      slots: Array.isArray(v['Créneaux']) ? v['Créneaux'].map(x => { const k = String(x).toLowerCase(); return k === 'inter-repas' ? 'inter' : k; }) : [], soir: v['Soir'] || 'ok', soirMotif: v['Soir (motif)'] || '',
      viande: v['Viande'] || null, plantes: Array.isArray(v['Plantes']) ? v['Plantes'] : [], st: v['Statut'] || '',
      pStep: num(v['Pas (g)']) || 0, pMin: num(v['Portion min (g)']) || 0, pMax: num(v['Portion max (g)']) || 0,
    };
    foodsById[f.id] = f;
    if (f.kcal === 0 && f.state !== 'liquide') continue; // compléments sans énergie : inutiles ici
    foodList.push(f);
  }
  foodList.sort((a, b) => a.n.localeCompare(b.n, 'fr'));
}

// Le bol est celui du jour : au premier lancement d'une nouvelle journée, il est archivé
// (récupérable dans « Modèles… ») puis vidé. Les heures, le réveil et le coucher sont conservés.
let bolRolledOver = false;
function bolPrev() { try { return JSON.parse(localStorage.getItem('nt-leumeal-prev-v1') || 'null'); } catch(e) { return null; } }
function bolRollover() {
  const t = todayStr(); let d = null;
  try { d = localStorage.getItem('nt-leumeal-date-v1'); } catch(e) {}
  if (d === t) return false;
  const full = MEAL_IDS.some(m => (leuMeals[m] || []).some(i => num(i.grams) > 0));
  if (full) try { localStorage.setItem('nt-leumeal-prev-v1', JSON.stringify({ date: d, meals: leuMeals })); } catch(e) {}
  leuMeals = Object.fromEntries(MEAL_IDS.map(m => [m, []]));
  saveLeuMeals();
  if (full) leuActiveMeal = mealForNow();
  return full;
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDateLabel(ds) {
  const t = todayStr();
  if (ds === t) return "Aujourd'hui";
  const d = new Date(ds + 'T12:00:00');
  const opts = { weekday: 'long', day: 'numeric', month: 'long' };
  const label = d.toLocaleDateString('fr-FR', opts);
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  const ys = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;
  if (ds === ys) return "Hier";
  return label.charAt(0).toUpperCase() + label.slice(1);
}

// ── Data loading ──
async function loadRoutine() {
  // Try fetch from same domain
  try {
    const resp = await fetch('routine_alimentaire.json?v=' + Date.now());
    if (resp.ok) {
      routine = await resp.json();
      localStorage.setItem('nt-routine-cache', JSON.stringify(routine));
      updateStatus('live');
      return;
    }
  } catch(e) {}
  
  // Fallback: cached version
  try {
    const cached = localStorage.getItem('nt-routine-cache');
    if (cached) {
      routine = JSON.parse(cached);
      updateStatus('cached');
      return;
    }
  } catch(e) {}
  
  updateStatus('offline');
}

function updateStatus(mode) {
  const el = document.getElementById('dataStatus');
  const dot = el.querySelector('.status-dot');
  const span = el.querySelector('span');
  dot.className = 'status-dot' + (mode === 'cached' ? ' cached' : mode === 'offline' ? ' offline' : '');
  span.textContent = mode === 'live' ? 'à jour' : mode === 'cached' ? 'cache' : 'hors ligne';
}

// ── Tracking persistence ──
function loadTracking() {
  try {
    const raw = localStorage.getItem('nt-tracking-v1');
    if (raw) tracking = JSON.parse(raw);
  } catch(e) { tracking = {}; }
}

function saveTracking() {
  localStorage.setItem('nt-tracking-v1', JSON.stringify(tracking));
}

function getDayData(date) {
  if (!tracking[date]) tracking[date] = { items: {}, suppl: {}, rotation: null, notes: '' };
  return tracking[date];
}

function toggleItem(date, mealId, itemIdx) {
  const day = getDayData(date);
  const key = `${mealId}:${itemIdx}`;
  day.items[key] = !day.items[key];
  saveTracking();
  render();
}

function toggleSuppl(date, idx) {
  const day = getDayData(date);
  const key = `supp:${idx}`;
  day.suppl[key] = !day.suppl[key];
  saveTracking();
  render();
}

function setRotation(date, rotIdx) {
  const day = getDayData(date);
  day.rotation = day.rotation === rotIdx ? null : rotIdx;
  saveTracking();
  render();
}

function setNotes(date, text) {
  const day = getDayData(date);
  day.notes = text;
  saveTracking();
}

// ── Rendering ──
function render() {
  if (!routine) {
    document.getElementById('mainContent').innerHTML = `<div class="loading"><div class="loading-spinner"></div>Aucune donnée disponible</div>`;
    return;
  }
  
  document.getElementById('headerVersion').textContent = 'v' + routine.meta.version;
  renderHeaderMacros();
  if (currentTab === 'bol' || currentTab === 'journal' || currentTab === 'week') document.getElementById('dateNavContainer').innerHTML = '';
  else renderDateNav();
  syncStickyOffset();
  
  switch(currentTab) {
    case 'meals': renderMeals(); break;
    case 'suppl': renderSupplements(); break;
    case 'info': renderInfo(); break;
    case 'data': renderData(); break;
    case 'bol': renderBol(); break;
    case 'journal': renderJournal(); break;
    case 'week': renderWeek(); break;
  }
}

function renderHeaderMacros() {
  let consumed, targets;
  if (currentTab === 'week' && foodList.length && weekPlan()) {
    // onglet Semaine : bandeau = journée sélectionnée du programme face aux cibles de meal_scoring
    const P = weekPlan(), day = (P.days || []).find(d => d.id === (weekDay || todayWeekId())) || (P.days || [])[0];
    const st = day ? weekDayStats(weekEval(day)) : { kcal: 0, prot: 0, carb: 0, fat: 0 };
    consumed = { kcal: st.kcal, protein: st.prot, carb: st.carb, fat: st.fat };
    const S = scoring();
    targets = { kcal: S.muscle.kcal_day.target, protein_g: S.muscle.protein_day_g.target, carb_g: routine.meta.target_carb_g, fat_g: routine.meta.target_fat_g };
  } else if ((currentTab === 'bol' || currentTab === 'journal') && foodList.length) {
    // v2 : bandeau = journée de l'onglet Bol (repas notés ou composés) face aux cibles de meal_scoring
    const dm = dayMeals();
    consumed = dm.reduce((a, d) => ({ kcal: a.kcal + d.n.kcal, protein: a.protein + d.n.prot, carb: a.carb + d.n.carb, fat: a.fat + d.n.fat }), { kcal: 0, protein: 0, carb: 0, fat: 0 });
    const S = scoring();
    targets = { kcal: S.muscle.kcal_day.target, protein_g: S.muscle.protein_day_g.target, carb_g: routine.meta.target_carb_g, fat_g: routine.meta.target_fat_g };
  } else {
    const day = getDayData(currentDate);
    consumed = calcConsumedMacros(day);
    targets = routine.daily_totals.confirmed;
  }
  
  const macros = [
    { lbl: 'Kcal', val: consumed.kcal, target: targets.kcal, unit: '' },
    { lbl: 'Prot', val: consumed.protein, target: targets.protein_g, unit: 'g' },
    { lbl: 'Gluc', val: consumed.carb, target: targets.carb_g, unit: 'g' },
    { lbl: 'Lip', val: consumed.fat, target: targets.fat_g, unit: 'g' },
  ];
  
  document.getElementById('headerMacros').innerHTML = macros.map((m, i) => `
    <div class="macro-pill${i===0?' highlight':''}">
      <span class="val">${Math.round(m.val)}</span>
      <span class="lbl">/ ${Math.round(m.target)}${m.unit} ${m.lbl}</span>
    </div>
  `).join('');
}

function calcConsumedMacros(day) {
  let protein = 0, carb = 0, fat = 0, kcal = 0;
  if (!routine) return { protein, carb, fat, kcal };
  
  for (const meal of routine.meals) {
    const items = meal.items || meal.fixed_items || [];
    items.forEach((item, idx) => {
      if (day.items[`${meal.id}:${idx}`]) {
        protein += item.protein_g || 0;
        carb += item.carb_g || 0;
        fat += item.fat_g || 0;
        kcal += item.kcal || 0;
      }
    });
    // Juice
    if (meal.juice && day.items[`${meal.id}:juice`]) {
      protein += meal.juice.protein_g || 0;
      carb += meal.juice.carb_g || 0;
      fat += meal.juice.fat_g || 0;
      kcal += meal.juice.kcal || 0;
    }
    // Protein rotation for dinner
    if (meal.protein_source_rotation && day.rotation !== null) {
      const rot = meal.protein_source_rotation[day.rotation];
      if (rot && day.items[`${meal.id}:rotation`]) {
        protein += rot.protein_g || 0;
        carb += rot.carb_g || 0;
        fat += rot.fat_g || 0;
        kcal += rot.kcal || 0;
      }
    }
  }
  
  // Supplements (omega-3)
  for (const [i, s] of routine.supplements.entries()) {
    if (day.suppl[`supp:${i}`] && s.name.includes('Oméga')) {
      // Already counted in meal items (3 gélules R2 + 3 dîner)
    }
  }
  
  return { protein, carb, fat, kcal };
}

  return `<div class="daily-summary">

function gaugeOf(key, label, v, cfg, unit) {

  return g;
}

function computeMeal(mealId, items) {
  const cfg = mealCfg(mealId);

  const t = { n: 0, solids: 0, liquids: 0, massEff: 0, kcal: 0, fat: 0, prot: 0, carb: 0, leuRaw: 0, leu: 0, mx: 0,
    fermHigh: 0, fermMod: 0, trig: {}, estLeu: false, unknown: 0, contrib: { mass: [], fat: [], kcal: [], prot: [] } };
  for (const it of items || []) {
    const f = foodsById[it.id], g = num(it.grams);
    if (!f) { t.unknown++; continue; }
    if (g <= 0) continue;
    const k = g / 100;
    const liquid = f.state === 'liquide';
    const mass = liquid ? g * lf : g * f.massCoef;
    if (liquid) t.liquids += g; else t.solids += g * f.massCoef;
    t.massEff += mass;

    if (f.lEst && lr * f.dig >= 0.1) t.estLeu = true;
    if (!liquid) { if (/élev/i.test(f.ferm)) t.fermHigh += g; else if (/mod/i.test(f.ferm)) t.fermMod += g; }
    f.trig.forEach(tr => { (t.trig[tr] = t.trig[tr] || []).push(f.n); });

  return t;
}

function whyLines(t) {

    out.push(`<b>${g.label} ${fmt(g.v)} ${g.unit}</b> (vert ≤ ${fmt(g.max)}) — surtout : ${list}`);

    const k = g / 100;
    const row = { f, g, kcal: f.kcal * k, prot: f.pr * k, fat: f.fat * k, carb: f.carb * k, fib: f.fib * k, na: f.na * k, mx: f.mx * k, cg: 0 };
    r.kcal += row.kcal; r.prot += row.prot; r.fat += row.fat; r.carb += row.carb; r.fib += row.fib; r.na += row.na;
    r.fe += f.fe * k; r.zn += f.zn * k; r.vitc += f.vitc * k; r.poly += f.poly * k; r.mx += row.mx; r.osm += f.osm * k; r.o3 += f.o3 * k;

    add('reflux', lvl, `Au coucher (${hLabel(bed)}), ~${fmt(res)} kcal encore dans l'estomac (${fmt(lo)}–${fmt(hi)})`, fix);
    const gap = bed - h, D = S.reflux.dinner_to_bed_h;
    if (gap < D.warn_below) add('reflux', gap < D.red_below ? 'over' : 'warn', `Dîner ${fmt(gap, 1)} h avant le coucher (≥ ${D.warn_below} h)`, `dîner avant ${hLabel(bed - D.warn_below)} ou se coucher après ${hLabel(h + D.warn_below)}`);
  }

  // ─ Muscle ─
  const M = S.muscle, pmin = (M.protein_slot_min_g || {})[slot];
  if (pmin && n.prot < pmin) {
    const sug = suggestFood(slot, 'pr', pmin - n.prot, { lean: true, minDensity: 8 });
    add('muscle', 'warn', `Protéines ${fmt(n.prot)} g (repère ≥ ${pmin} g pour ce repas)`, sug.length ? `ajouter ${sug.join(' ou ')}` : '');
  } else info('muscle', `Protéines ${fmt(n.prot)} g`);
  const dayP = day.reduce((a, d) => a + d.n.prot, 0), dayK = day.reduce((a, d) => a + d.n.kcal, 0);
  const complete = MAIN_IDS.every(m => day.some(d => d.m === m));
  const PD = M.protein_day_g, KD = M.kcal_day;
  if (complete) {
    if (dayP < PD.min) add('muscle', 'warn', `Journée : ${fmt(dayP)} g de protéines (cible ${PD.min}-${PD.max})`, `ajouter ~${fmt(PD.target - dayP)} g de protéines sur la journée`);
    else if (dayP > PD.high) add('muscle', 'warn', `Journée : ${fmt(dayP)} g de protéines, bien au-delà de la cible (${PD.min}-${PD.max})`, 'réduire une source protéique');
    else info('muscle', `Journée : ${fmt(dayP)} g de protéines (cible ${PD.min}-${PD.max})${dayP > PD.max ? ', un peu au-dessus' : ''}`);
    info('muscle', `Énergie de la journée : voir le voyant Énergie (${fmt(dayK)} kcal)`);
  } else info('muscle', `Journée en cours : ${fmt(dayP)} g de protéines sur ${PD.target} visés, ${fmt(dayK)} kcal`);

  // ─ Énergie : confort de la journée ─
  const E = S.energy;
  const kD = (E.kcal_day && E.kcal_day.target) || KD.target;
  const wk0 = wakeH(), awake = Math.max(8, bed - wk0), perH = kD / awake;
  const mains = day.filter(d => MAIN_IDS.includes(d.m)).sort((a, b) => a.h - b.h);
  if (slot === 'inter') info('energy', `En-cas : ${fmt(n.kcal)} kcal, compté dans l'autonomie du repas précédent`);
  else {
    const next = mains.find(d => d.h > h + 1e-6);
    const endH = next ? next.h : bed;
    const interK = day.filter(d => d.m === 'inter' && d.h >= h && d.h < endH).reduce((a, d) => a + d.n.kcal, 0);
    const windowK = n.kcal + interK, cover = windowK / perH, gap = endH - h;
    if (next) {

        const sug = suggestFood(slot, 'carb', need / 4, { minDensity: 15 });
        add('energy', 'warn', `Ce repas${interK ? ' (+ en-cas)' : ''} couvre ~${fmt(cover, 1)} h d'activité ; le suivant est dans ${fmt(gap, 1)} h : risque de faim ou de baisse d'énergie`, `ajouter ~${fmt(Math.ceil(need / 25) * 25)} kcal${sug.length ? ', par ex. ' + sug[0] : ''}`);
      } else info('energy', `Autonomie ~${fmt(cover, 1)} h pour ${fmt(gap, 1)} h jusqu'au repas suivant`);
      if (gap > E.max_gap_h) add('energy', 'warn', `${fmt(gap, 1)} h sans repas jusqu'au suivant (repère ≤ ${E.max_gap_h} h)`, 'ajouter une collation au milieu');
    } else {
      const EH = E.evening_hunger;
      if (n.kcal < EH.dinner_kcal_below && gap > EH.gap_to_bed_h_above) add('energy', 'warn', `Dernier repas léger (${fmt(n.kcal)} kcal) et ${fmt(gap, 1)} h avant le coucher : faim possible en soirée`, 'ajouter un féculent ou avancer le coucher');
      else info('energy', `Dernier repas : ${fmt(gap, 1)} h avant le coucher`);
    }
    if (mains.length && mains[0].m === slot) {
      const firstAny = Math.min(...day.map(d => d.h));
      const fast = firstAny - wk0;
      if (fast >= E.morning_fast_h.warn) add('energy', 'warn', `${fmt(fast, 1)} h à jeun depuis le réveil (${hLabel(wk0)})`, 'si vous manquez d\'énergie à l\'entraînement : un en-cas liquide avant (Greenwhey 15 g dans l\'eau ou 150 ml de lait d\'avoine), qui quitte vite l\'estomac');
      else if (fast >= E.morning_fast_h.info) info('energy', `${fmt(fast, 1)} h à jeun depuis le réveil : notez dans le journal tout coup de fatigue à l'entraînement`);
    }
  }
  const GD = E.glycemic_dip;
  if (n.carb >= GD.carb_min_g && n.prot < GD.protein_max_g && n.fib < GD.fiber_max_g)
    add('energy', 'warn', `${fmt(n.carb)} g de glucides avec peu de protéines (${fmt(n.prot)} g) et de fibres (${fmt(n.fib)} g) : pic puis baisse d'énergie probables`, 'ajouter une source de protéines ou de fibres');
  if (complete) {
    const KDm = (E.kcal_day && E.kcal_day.min) || KD.min;
    const carbMin = E.carb_day_g_per_kg_min * (num(routine?.meta?.weight_kg) || 85);
    const dayC = day.reduce((a, d) => a + d.n.carb, 0);
    if (dayK < KDm) add('energy', 'warn', `Journée : ${fmt(dayK)} kcal (repère ≥ ${fmt(KDm)})`, 'ajouter des glucides au R1 ou au R2, jamais au dîner');
    else info('energy', `Journée : ${fmt(dayK)} kcal`);
    if (dayC < carbMin) add('energy', 'warn', `Journée : ${fmt(dayC)} g de glucides (repère ≥ ${fmt(carbMin)} g, soit ${E.carb_day_g_per_kg_min} g/kg les jours d'entraînement)`, 'ajouter un féculent au R1 ou au R2');
    else info('energy', `Journée : ${fmt(dayC)} g de glucides`);
  } else info('energy', `Journée en cours : ${fmt(dayK)} kcal sur ~${fmt(kD)} visées`);

  // ─ Longévité ─
  const L = S.longevity;
  if (n.cg > L.cg_meal.max) {
    const top = topBy(n, 'cg');
    add('longevity', n.cg > L.cg_meal.red ? 'over' : 'warn', `Charge glycémique ${fmt(n.cg)} (vert ≤ ${L.cg_meal.max})`, top ? `réduire ${nm(top.f)}` : '');
  } else if (n.cgCov > 0) info('longevity', `Charge glycémique ${fmt(n.cg)}`);
  if (n.na > L.sodium_meal_mg.max) { const top = topBy(n, 'na'); add('longevity', n.na > L.sodium_meal_mg.red ? 'over' : 'warn', `Sodium ${fmt(n.na)} mg`, top ? `réduire ${nm(top.f)}` : ''); }
  const I = L.iron;
  if (n.fe >= I.fe_rich_meal_mg && (I.windows || ['r2', 'diner']).includes(slot)) {

      const who = inhibitors.length ? inhibitors.map(nm).join(', ') : `polyphénols ${fmt(n.poly)} mg`;
      add('longevity', 'warn', `Fer ${fmt(n.fe, 1)} mg, absorption freinée par ${who}`, `déplacer ${inhibitors.length ? inhibitors.map(nm).join(', ') : 'les aliments riches en polyphénols'} hors du repas, ou ajouter un filet de citron`);
    } else info('longevity', `Fer ${fmt(n.fe, 1)} mg${n.vitc >= I.vitc_enhancer_mg ? `, vitamine C ${fmt(n.vitc)} mg (favorise l'absorption)` : ''}`);
  }
  const wk = weekStats(day);
  if (n.redMeat > 0 && wk.redMeat > L.red_meat_week_g.max) add('longevity', 'warn', `Viande rouge : ${fmt(wk.redMeat)} g sur 7 jours (repère ≤ ${L.red_meat_week_g.max} g)`, 'remplacer par volaille, poisson ou tempeh');
  const dayF = day.reduce((a, d) => a + d.n.fib, 0), dayNa = day.reduce((a, d) => a + d.n.na, 0);
  if (complete) {
    if (dayF < L.fiber_day_g.min) { const sug = suggestFood(slot, 'fib', L.fiber_day_g.target - dayF); add('longevity', 'warn', `Journée : ${fmt(dayF)} g de fibres (repère ≥ ${L.fiber_day_g.min})`, sug.length ? `ajouter ${sug[0]}` : ''); }
    else info('longevity', `Journée : ${fmt(dayF)} g de fibres`);
    if (dayNa > L.sodium_day_mg.max) add('longevity', 'warn', `Journée : sodium ${fmt(dayNa)} mg (repère ≤ ${fmt(L.sodium_day_mg.max)})`, '');
  } else info('longevity', `Fibres : ${fmt(n.fib)} g dans ce repas, ${fmt(dayF)} g sur la journée en cours`);
  info('longevity', `Plantes différentes sur 7 jours : ${fmt(wk.plants, wk.plants % 1 ? 1 : 0)} / ${L.plants_week_target}`);

  // ─ Sommeil ─
  const Z = S.sleep;
  if (h >= Z.methylxanthine_cutoff_h && n.mx >= Z.methylxanthine_late_mg.max) {
    const who = n.by.filter(x => x.mx > 0).map(x => nm(x.f)).join(', ');
    add('sleep', n.mx >= Z.methylxanthine_late_mg.red ? 'over' : 'warn', `Caféine + théobromine ${fmt(n.mx)} mg après ${hLabel(Z.methylxanthine_cutoff_h)} (${who})`, `décaler ${who} avant ${hLabel(Z.methylxanthine_cutoff_h)}`);
  }

    const DP = Z.dinner_protein_g;

      add('sleep', n.prot > DP.red ? 'over' : 'warn', `Protéines du dîner ${fmt(n.prot)} g (charge rénale la nuit, repère ≤ ${DP.max})`, top ? cutTxt(top.f, cut) : ''); }
    if (n.carb < Z.dinner_carb_min_g) { const sug = suggestFood(slot, 'carb', Z.dinner_carb_min_g - n.carb, { minDensity: 15 });
      add('sleep', 'warn', `Glucides du dîner ${fmt(n.carb)} g (repère ≥ ${Z.dinner_carb_min_g} g pour la nuit)`, sug.length ? `ajouter ${sug[0]}` : ''); }
  }

function gaugeHtml(g) {
  const pct = v => Math.max(0, Math.min(100, v / g.domain * 100));
  let zones = '';
  const seg = (a, b, cls) => { if (b > a) zones += `<div class="g-zone ${cls}" style="left:${pct(a)}%;width:${pct(b) - pct(a)}%"></div>`; };
  if (g.min != null) seg(0, g.min, 'z-low');
  const okStart = g.min != null ? g.min : 0;
  if (g.max != null) { seg(okStart, g.max, 'z-ok'); seg(g.max, g.red ?? g.domain, 'z-warn'); if (g.red != null) seg(g.red, g.domain, 'z-over'); }
  else seg(okStart, g.domain, 'z-ok');
  const d = g.key === 'leu' ? 2 : g.key === 'fod' ? 1 : 0;
  let rule = '';
  if (g.key === 'leu') rule = `seuil ≥ ${fmt(g.min, 1)} g`;
  else if (g.key === 'fod') rule = `vert ≤ ${fmt(g.max)} · rouge > ${fmt(g.red)} (× la portion verte)`;
  else if (g.min != null) rule = `vert ${fmt(g.min)}–${fmt(g.max)} ${g.unit}`;
  else rule = `vert ≤ ${fmt(g.max)} ${g.unit} · rouge > ${fmt(g.red)}`;
  return `<div class="g-row">
    <div class="g-head"><span class="g-name">${g.label}</span><span class="g-val l-${g.level}">${fmt(g.v, d)} ${g.unit}</span></div>
    <div class="g-track"><div class="g-zones">${zones}</div><div class="g-marker" style="left:${pct(g.v)}%"></div></div>
    <div class="g-sub">${rule}</div>
  </div>`;
}

function unitLabel(f, g) {
  if (!f.unit) return f.state === 'liquide' ? 'ml' : 'g';
  const c = g / num(f.unit.g);
  if (c <= 0) return '0 ' + f.unit.s;
  const r = Math.round(c);
  if (Math.abs(c - r) < 0.08) return `${r} ${r > 1 ? f.unit.p : f.unit.s}`;
  return `≈ ${fmt(c, 1)} ${c > 1 ? f.unit.p : f.unit.s}`;
}

// ── Bol : actions ──
function bolSetMeal(id) { leuActiveMeal = id; renderBol(); }
function bolSetGrams(idx, val) {
  const arr = leuMeals[leuActiveMeal]; if (!arr || !arr[idx]) return;
  arr[idx].grams = Math.max(0, Math.round(num(String(val).replace(',', '.')) * 10) / 10);
  saveLeuMeals(); renderBol();
}
function bolStep(idx, dir) {
  const arr = leuMeals[leuActiveMeal]; if (!arr || !arr[idx]) return;
  const f = foodsById[arr[idx].id]; if (!f) return;
  const step = f.unit ? num(f.unit.g) : (f.p <= 30 ? 5 : 10);
  const units = Math.round(num(arr[idx].grams) / step);
  arr[idx].grams = Math.max(0, Math.round((units + dir) * step * 10) / 10);
  saveLeuMeals(); renderBol();
}
function bolRemove(idx) { const arr = leuMeals[leuActiveMeal]; if (arr) { arr.splice(idx, 1); saveLeuMeals(); renderBol(); } }
function bolClear() {

}

function leuShowSearch() {

// ── Journal reflux ──
function logMeal(mealId) {
  const items = (leuMeals[mealId] || []).filter(i => num(i.grams) > 0 && foodsById[i.id]);
  if (!items.length) return showToast('Repas vide');
  const t = computeMeal(mealId, items);
  const prevActive = leuActiveMeal; leuActiveMeal = mealId;
  const ev = evaluateSlot(mealId); leuActiveMeal = prevActive;
  const now = Date.now();
  journal.entries.push({
    id: 'm' + now, type: 'meal', ts: now, meal: mealId,
    items: items.map(i => ({ id: i.id, g: Math.round(num(i.grams) * 10) / 10 })),
    totals: { massEff: Math.round(t.massEff), solids: Math.round(t.solids), liquids: Math.round(t.liquids), fat: Math.round(t.fat * 10) / 10,
      kcal: Math.round(t.kcal), prot: Math.round(t.prot * 10) / 10, leu: Math.round(t.leu * 100) / 100, mx: Math.round(t.mx),
      fib: Math.round(ev.n.fib * 10) / 10 },
    verdict: t.verdict, axes: Object.fromEntries(AXES.map(([k]) => [k, ev.empty ? null : ev.ax[k].level])), symptom: null,

}
function draftFrom(sym) {

function jNewSymptom() { jOpenId = 'new'; jDraft = { ...draftFrom(null), when: localDT(Date.now()), kind: 'burn' }; renderJournal(); window.scrollTo(0, 0); }
function jNewEnergy() { jOpenId = 'new'; jDraft = { ...draftFrom(null), when: localDT(Date.now()), kind: 'energy' }; renderJournal(); window.scrollTo(0, 0); }

function jCancel() { jOpenId = null; jDraft = null; renderJournal(); }
function jSave() {
  if (!jDraft || jDraft.score == null) return showToast('Choisis une intensité (0 si rien)');

function analysisHtml() {
  const rated = journal.entries.filter(e => e.type === 'meal' && e.symptom && e.totals);
  const free = journal.entries.filter(e => e.type === 'symptom');
  let h = `<div class="daily-summary"><div class="summary-title">📈 Analyse</div>`;
  if (rated.length < 6) {
    h += `<div class="j-note">Disponible à partir de 6 repas notés (${rated.length}/6). Chaque note compte, y compris les 0.</div>`;
  } else {
    const order = ['ok', 'low', 'warn', 'over'];
    h += `<table class="j-table"><tr><th>Verdict du bol</th><th>Repas</th><th>Moy.</th><th>≥ 3</th></tr>`;
    order.forEach(v => {
      const g = rated.filter(e => e.verdict === v); if (!g.length) return;
      const mean = g.reduce((a, e) => a + e.symptom.score, 0) / g.length;
      const hi = g.filter(e => e.symptom.score >= 3).length / g.length * 100;
      h += `<tr><td><span class="dot v-${v}"></span>${VERDICT_TXT[v][0]}</td><td>${g.length}</td><td>${fmt(mean, 1)}</td><td>${fmt(hi)} %</td></tr>`;
    });
    h += `</table>${scatterSvg(rated)}`;
  }
  if (free.length) {
    const night = free.filter(e => { const hh = new Date(e.ts).getHours(); return hh >= 22 || hh < 7; }).length;
    h += `<div class="j-note" style="margin-top:8px">Brûlures signalées hors repas : ${free.length} (dont ${night} entre 22 h et 7 h).</div>`;
  }
  return h + `</div>`;
}
function scatterSvg(rated) {
  const W = 320, H = 210, L = 34, B = 26, T = 8, R = 8;
  const xMax = Math.ceil(Math.max(1200, ...rated.map(e => e.totals.massEff * 1.05)) / 400) * 400;
  const yMax = Math.ceil(Math.max(60, ...rated.map(e => e.totals.fat * 1.05)) / 20) * 20;
  const X = v => L + v / xMax * (W - L - R), Y = v => H - B - v / yMax * (H - B - T);
  const col = s => s === 0 ? '#7CAA6E' : s <= 3 ? '#D9963A' : '#C47A6A';
  let s = `<svg class="j-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Repas selon remplissage et graisses">`;
  for (let i = 0; i <= 4; i++) {
    const xv = xMax * i / 4, yv = yMax * i / 4;
    s += `<line x1="${X(xv)}" y1="${T}" x2="${X(xv)}" y2="${H - B}" stroke="#E8E0D4" stroke-width="1"/><text x="${X(xv)}" y="${H - B + 13}" font-size="9" text-anchor="middle" fill="#8C7E6A">${Math.round(xv)}</text>`;
    s += `<line x1="${L}" y1="${Y(yv)}" x2="${W - R}" y2="${Y(yv)}" stroke="#E8E0D4" stroke-width="1"/><text x="${L - 4}" y="${Y(yv) + 3}" font-size="9" text-anchor="end" fill="#8C7E6A">${Math.round(yv)}</text>`;
  }
  const r2 = mealCfg('r2');
  if (r2.mass_g && r2.fat_g) {
    s += `<line x1="${X(r2.mass_g.max)}" y1="${T}" x2="${X(r2.mass_g.max)}" y2="${H - B}" stroke="#8C7E6A" stroke-dasharray="3 3"/>`;
    s += `<line x1="${L}" y1="${Y(r2.fat_g.max)}" x2="${W - R}" y2="${Y(r2.fat_g.max)}" stroke="#8C7E6A" stroke-dasharray="3 3"/>`;
    s += `<text x="${X(r2.mass_g.max) + 3}" y="${T + 9}" font-size="9" fill="#8C7E6A">vert R2</text>`;
  }
  rated.forEach(e => { s += `<circle cx="${X(e.totals.massEff)}" cy="${Y(e.totals.fat)}" r="5" fill="${col(e.symptom.score)}" fill-opacity="0.85" stroke="#fff" stroke-width="1"/>`; });
  s += `<text x="${(W + L) / 2}" y="${H - 2}" font-size="9" text-anchor="middle" fill="#8C7E6A">Remplissage (g)</text>`;
  s += `<text x="10" y="${(H - B) / 2}" font-size="9" text-anchor="middle" fill="#8C7E6A" transform="rotate(-90 10 ${(H - B) / 2})">Graisses (g)</text></svg>`;
  s += `<div class="j-legend"><span><i style="background:#7CAA6E"></i>0</span><span><i style="background:#D9963A"></i>1–3</span><span><i style="background:#C47A6A"></i>≥ 4</span></div>`;
  return s;
}

function renderJournal() {

  let html = `<div class="daily-summary"><div class="summary-title">🔥 Journal reflux</div>
    <div class="j-note">Note chaque repas depuis l’onglet Bol (« J’ai mangé »), puis la brûlure éventuelle une à deux heures après : un 0 compte autant qu’un 8. Les brûlures de la nuit ou du matin se signalent ici.</div>

function exportJournalCsv() {
  if (!journal.entries.length) return showToast('Journal vide');
  const rows = [['date', 'heure', 'type', 'repas', 'verdict', 'remplissage_g', 'solides_g', 'liquides_ml', 'lipides_g', 'kcal', 'proteines_g', 'leucine_corrigee_g', 'methylxanthines_mg', 'score', 'localisation', 'contexte', 'note', 'aliments']];
  [...journal.entries].sort((a, b) => a.ts - b.ts).forEach(e => {
    const t = e.totals || {}, s = e.symptom || {};
    const items = (e.items || []).map(i => { const f = foodsById[i.id]; return `${f ? shortName(f.n) : i.id} ${i.g} g`; }).join(' | ');
    const meal = e.type === 'meal' ? mealCfg(e.meal).label : (e.mealRef ? 'après ' + ((journal.entries.find(x => x.id === e.mealRef) || {}).meal || '') : '');
    rows.push([dayStr(e.ts), timeStr(e.ts), e.type === 'meal' ? 'repas' : e.type === 'energy' ? 'énergie' : 'brûlure', meal, e.verdict || '', t.massEff ?? '', t.solids ?? '', t.liquids ?? '', t.fat ?? '', t.kcal ?? '', t.prot ?? '', t.leu ?? '', t.mx ?? '',
      s.score ?? '', (s.loc || []).join(', '), (s.ctx || []).join(', '), s.note || '', items]);
  });
  const csv = rows.map(r => r.map(v => { const x = String(v); return /[";\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(';')).join('\n');
  downloadText('﻿' + csv, `journal-reflux-${todayStr()}.csv`, 'text/csv');
  showToast('Journal exporté');
}

// ── Actions ──
function exportBackup() {
  const data = {
    type: 'nutrition-tracker-backup',
    version: '1.1',
    exportDate: new Date().toISOString(),
    routineVersion: routine?.meta?.version || '?',
    tracking: tracking,
    bol: leuMeals,
    templates: userTemplates,
    journal: journal
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `nutrition-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup exporté');
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.type !== 'nutrition-tracker-backup') throw new Error('Format invalide');
      tracking = data.tracking || {};
      saveTracking();
      if (data.bol && typeof data.bol === 'object') {
        MEAL_IDS.forEach(m => { leuMeals[m] = Array.isArray(data.bol[m]) ? data.bol[m].filter(i => i && i.id).map(i => ({ id: i.id, grams: num(i.grams) })) : []; });
        saveLeuMeals();
      }
      if (Array.isArray(data.templates)) { userTemplates = data.templates; saveTemplates(); }
      if (data.journal && Array.isArray(data.journal.entries)) { journal = data.journal; saveJournal(); }
      render();
      showToast(`Backup importé (${Object.keys(tracking).length} jours, ${journal.entries.length} entrées journal)`);
    } catch(err) {
      showToast('Erreur: fichier invalide');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function clearDay() {
  if (!confirm(`Effacer les données d'aujourd'hui (${formatDateLabel(currentDate)}) ?`)) return;
  delete tracking[currentDate];
  saveTracking();
  render();
  showToast('Jour effacé');
}

async function refreshRoutine() {
  await loadRoutine();
  render();
  showToast('Routine rechargée');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function syncStickyOffset() {

}
window.addEventListener('resize', syncStickyOffset);

// ── Semaine : programme de la semaine (routine_alimentaire.json → week_plans) ──
const WEEK_IDS = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
let weekView = 'jours', weekDay = null;
const weekEvalCache = {};
function weekPlan() { return routine && Array.isArray(routine.week_plans) && routine.week_plans.length ? routine.week_plans[0] : null; }
function todayWeekId() { return WEEK_IDS[(new Date().getDay() + 6) % 7]; }
function planItems(list) { return (list || []).map(i => ({ id: i.id, grams: num(i.g) })); }
const wkH = t => String(t || "").replace(":", "h");
// évalue une journée du programme avec les mêmes règles que le Bol, sans toucher au Bol ni au journal
function withPlanDay(day, fn) {
  const saved = { leuMeals, leuActiveMeal, bolTimes, bedtime, wake, entries: journal.entries };
  try {
    leuMeals = Object.fromEntries(MEAL_IDS.map(m => [m, planItems((day.meals || {})[m])]));
    bolTimes = { ...(day.times || {}) }; bedtime = day.bed || null; wake = day.wake || null;
    journal.entries = [];
    return fn();
  } finally {
    leuMeals = saved.leuMeals; leuActiveMeal = saved.leuActiveMeal; bolTimes = saved.bolTimes;
    bedtime = saved.bedtime; wake = saved.wake; journal.entries = saved.entries;
  }
}
function weekEval(day) {
  const key = `${routine.meta.version}|${(baseNutritionelle && baseNutritionelle.meta && baseNutritionelle.meta.version) || ''}|${day.id}`;
  if (!weekEvalCache[key]) weekEvalCache[key] = withPlanDay(day, () => {
    const evs = {}; MEAL_IDS.forEach(m => { leuActiveMeal = m; evs[m] = evaluateSlot(m); }); return evs;
  });
  return weekEvalCache[key];
}
function weekDayStats(evs) {
  const ev = MEAL_IDS.map(m => evs[m]).find(e => !e.empty);
  const day = ev ? ev.day : [];
  const lv = worst(MEAL_IDS.filter(m => !evs[m].empty).map(m => overallLevel(evs[m])));
  return { kcal: day.reduce((a, d) => a + d.n.kcal, 0), prot: day.reduce((a, d) => a + d.n.prot, 0), fib: day.reduce((a, d) => a + d.n.fib, 0), carb: day.reduce((a, d) => a + d.n.carb, 0), fat: day.reduce((a, d) => a + d.n.fat, 0), lv: lv || 'empty' };
}
function planQty(f, g) {
  if (f && f.unit && num(f.unit.g) > 0) {
    const u = g / num(f.unit.g), k = Math.round(u);
    if (k >= 1 && Math.abs(u - k) < 0.15) return `${k} ${k > 1 ? f.unit.p : f.unit.s}`;
  }
  return /^jus|lait d/i.test((f && f.n) || '') ? `${fmt(g)} ml` : `${fmt(g)} g`;
}
function weekSetView(v) { weekView = v; renderWeek(); window.scrollTo(0, 0); }
function weekSetDay(d) { weekDay = d; renderHeaderMacros(); renderWeek(); }
function weekGoBol(msg) { currentTab = 'bol'; setActiveTab('bol'); render(); window.scrollTo(0, 0); if (msg) showToast(msg); }
function weekLoadMeal(dayId, m) {
  const day = (weekPlan().days || []).find(d => d.id === dayId); if (!day) return;
  leuMeals[m] = planItems((day.meals || {})[m]);
  if (day.times && day.times[m]) bolTimes[m] = day.times[m];
  saveLeuMeals(); saveTimes(); leuActiveMeal = m;
  weekGoBol(`${mealCfg(m).label} (${day.label.toLowerCase()}) chargé dans le Bol`);
}
function weekLoadDay(dayId) {
  const day = (weekPlan().days || []).find(d => d.id === dayId); if (!day) return;
  MEAL_IDS.forEach(m => { leuMeals[m] = planItems((day.meals || {})[m]); if (day.times && day.times[m]) bolTimes[m] = day.times[m]; });
  if (day.wake) wake = day.wake; if (day.bed) bedtime = day.bed;
  saveLeuMeals(); saveTimes(); leuActiveMeal = mealForNow();
  weekGoBol(`Journée du ${day.label.toLowerCase()} chargée dans le Bol`);
}
function weekLoadVariant(id) {
  const v = (weekPlan().variants || []).find(x => x.id === id); if (!v) return;
  Object.entries(v.meals || {}).forEach(([m, list]) => { leuMeals[m] = planItems(list); });
  (v.add || []).forEach(a => { (leuMeals[a.slot] = leuMeals[a.slot] || []).push({ id: a.id, grams: num(a.g) }); });
  Object.entries(v.times || {}).forEach(([m, t]) => { bolTimes[m] = t; });
  if (v.bed) bedtime = v.bed;
  saveLeuMeals(); saveTimes();
  const first = Object.keys(v.meals || {})[0] || ((v.add || [])[0] || {}).slot; if (first) leuActiveMeal = first;
  weekGoBol(`Variante « ${v.name} » appliquée au Bol`);
}
function weekShopState() { try { return JSON.parse(localStorage.getItem('nt-week-shop-v1') || '{}'); } catch(e) { return {}; } }
function weekShopToggle(key) {
  const st = weekShopState(), P = weekPlan(), k = P.id;
  st[k] = st[k] || {}; st[k][key] = !st[k][key];
  try { localStorage.setItem('nt-week-shop-v1', JSON.stringify(st)); } catch(e) {}
  renderWeek();
}
function weekShopReset() {
  const st = weekShopState(); delete st[weekPlan().id];
  try { localStorage.setItem('nt-week-shop-v1', JSON.stringify(st)); } catch(e) {}
  renderWeek();
}
function weekMealHtml(day, m, ev) {
  const items = (day.meals || {})[m], free = (day.free || {})[m], note = (day.notes || {})[m];
  if (!items && !free) return '';
  const cfg = mealCfg(m), time = (day.times || {})[m] || '';
  let h = `<div class="wk-meal"><div class="wk-meal-head"><span class="wk-time">${esc(wkH(time))}</span><span class="wk-label">${esc(cfg.label)}</span>`;
  if (items && !ev.empty) h += `<span class="wk-kcal">${fmt(ev.n.kcal)} kcal · ${fmt(ev.n.prot)} g prot</span>`;
  h += `</div>`;
  if (items && !ev.empty) h += `<div class="wk-dots">` + AXES.map(([k, lab]) => `<span><span class="dot v-${ev.ax[k].level}"></span>${lab}</span>`).join('') + `</div>`;
  if (items) h += `<ul class="wk-items">` + items.map(i => {
    const f = foodsById[i.id];
    return `<li><span>${f ? esc(nm(f)) : esc(i.id)}</span><span class="wk-q">${f ? planQty(f, num(i.g)) : fmt(i.g) + ' g'}</span></li>`;
  }).join('') + `</ul>`;
  if (note) h += `<div class="wk-note">${esc(note)}</div>`;
  if (free) h += `<div class="wk-note">${esc(free)}</div>`;
  if (items) h += `<button class="wk-btn" onclick="weekLoadMeal('${day.id}','${m}')">Charger ce repas dans le Bol</button>`;
  return h + `</div>`;
}
function weekDaysHtml(P) {
  const days = P.days || [];
  if (!days.some(d => d.id === weekDay)) weekDay = days.length ? days[0].id : null;
  let h = `<div class="wk-days">` + days.map(d => {
    const st = weekDayStats(weekEval(d));
    return `<button class="wk-day${d.id === weekDay ? ' active' : ''}" onclick="weekSetDay('${d.id}')"><span class="dot v-${st.lv}"></span>${esc(d.label.slice(0, 3))}</button>`;
  }).join('') + `</div>`;
  const day = days.find(d => d.id === weekDay); if (!day) return h;
  const evs = weekEval(day), st = weekDayStats(evs), free = Object.keys(day.free || {}).length;
  h += `<div class="wk-total"><b>${esc(day.label)}</b> · réveil ${esc(wkH(day.wake))} · coucher ${esc(wkH(day.bed))}<br>`;
  h += `<b>${fmt(st.kcal)} kcal</b> · <b>${fmt(st.prot)}</b> g prot · ${fmt(st.carb)} g glucides · ${fmt(st.fat)} g lipides · ${fmt(st.fib)} g fibres${free ? ' · sans le repas libre' : ''}</div>`;
  h += `<button class="wk-btn primary" onclick="weekLoadDay('${day.id}')">Charger toute la journée dans le Bol</button><div style="height:8px"></div>`;
  MEAL_IDS.forEach(m => { h += weekMealHtml(day, m, evs[m]); });
  return h;
}
function weekShopHtml(P) {
  const st = (weekShopState()[P.id]) || {};
  let h = `<div class="wk-sub">Quantités pour la semaine (aliments crus ou secs ; samedi soir libre non compté). Cochez au fil des courses.</div>`;
  (P.shopping || []).forEach(sec => {
    h += `<div class="wk-sec">${esc(sec.place)}</div><div class="wk-meal">`;
    sec.items.forEach(([name, qty, note]) => {
      const key = sec.place + '|' + name, done = !!st[key];
      h += `<label class="wk-check${done ? ' done' : ''}"><input type="checkbox" ${done ? 'checked' : ''} onchange="weekShopToggle(${esc(JSON.stringify(key))})"><span class="wk-check-name">${esc(name)}${note ? `<span class="wk-check-note">${esc(note)}</span>` : ''}</span><span class="wk-check-q">${esc(qty)}</span></label>`;
    });
    h += `</div>`;
  });
  return h + `<button class="wk-btn" onclick="weekShopReset()">Tout décocher</button>`;
}
function weekBatchHtml(P) {
  let h = '';
  (P.batch || []).forEach(b => { h += `<div class="wk-sec">${esc(b.when)}</div><div class="wk-meal"><ul class="wk-list">${b.tasks.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`; });
  return h;
}
function weekRulesHtml(P) {
  let h = `<div class="wk-sec">Repères de la semaine</div><div class="wk-meal"><ul class="wk-list">${(P.rules || []).map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>`;
  h += `<div class="wk-sec">Variantes de secours</div>`;
  (P.variants || []).forEach(v => {
    h += `<div class="wk-meal"><div class="wk-label">${esc(v.name)}</div><div class="wk-note">${esc(v.when || '')}</div>`;
    if (v.notes && v.notes.length) h += `<ul class="wk-list" style="margin-top:6px">${v.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`;
    ['collation', 'diner'].forEach(m => {
      const list = (v.meals || {})[m]; if (!list) return;
      h += `<div class="wk-note"><b>${esc(mealCfg(m).label)}${v.times && v.times[m] ? ' (' + esc(wkH(v.times[m])) + ')' : ''}</b> : ${list.map(i => { const f = foodsById[i.id]; return f ? `${esc(nm(f))} ${planQty(f, num(i.g))}` : esc(i.id); }).join(' · ')}</div>`;
    });
    if (v.tested) h += `<div class="wk-note">✓ ${esc(v.tested)}</div>`;
    if (v.meals || v.add) h += `<button class="wk-btn" onclick="weekLoadVariant('${v.id}')">Appliquer au Bol d'aujourd'hui</button>`;
    h += `</div>`;
  });
  return h;
}
function weekPrintHtml(P) {
  let h = `<button class="wk-btn primary" onclick="window.print()">🖨 Imprimer ou enregistrer en PDF</button>`;
  (P.days || []).forEach(day => {
    const evs = weekEval(day), st = weekDayStats(evs);
    h += `<div class="wk-print-day"><h3>${esc(day.label)} — ${fmt(st.kcal)} kcal, ${fmt(st.prot)} g prot${Object.keys(day.free || {}).length ? ' (sans le repas libre)' : ''}</h3><table class="wk-print-table">`;
    MEAL_IDS.forEach(m => {
      const items = (day.meals || {})[m], free = (day.free || {})[m];
      if (!items && !free) return;
      const txt = items ? items.map(i => { const f = foodsById[i.id]; return f ? `${nm(f)} ${planQty(f, num(i.g))}` : i.id; }).join(' · ') : free;
      h += `<tr><td>${esc(wkH((day.times || {})[m]))}</td><td><b>${esc(mealCfg(m).label)}</b> — ${esc(txt)}</td><td>${items && !evs[m].empty ? fmt(evs[m].n.kcal) : '—'}</td></tr>`;
    });
    h += `</table></div>`;
  });
  h += `<div class="wk-sec">Courses</div>` + (P.shopping || []).map(sec => `<div class="wk-note"><b>${esc(sec.place)}</b> : ${sec.items.map(([n, q]) => esc(n) + (q ? ' ' + esc(q) : '')).join(' · ')}</div>`).join('');
  h += weekBatchHtml(P) + weekRulesHtml(P).replace(/<button[^>]*>.*?<\/button>/g, '');
  return h;
}
function renderWeek() {
  const c = document.getElementById('mainContent'), P = weekPlan();
  if (!P) { c.innerHTML = `<div class="loading">Aucun programme de semaine dans routine_alimentaire.json.</div>`; return; }
  if (!foodList.length) { c.innerHTML = `<div class="loading">Base nutritionnelle non chargée.</div>`; return; }
  if (!weekDay) weekDay = todayWeekId();
  const views = [['jours', 'Jours'], ['courses', 'Courses'], ['cuisine', 'Cuisine'], ['regles', 'Règles'], ['imprimer', 'Récap']];
  let html = `<div class="wk-title">${esc(P.name)}</div><div class="wk-sub">${esc(P.status || '')}</div>`;
  html += `<div class="wk-views">` + views.map(([k, l]) => `<button class="wk-view${k === weekView ? ' active' : ''}" onclick="weekSetView('${k}')">${l}</button>`).join('') + `</div>`;
  if (weekView === 'courses') html += weekShopHtml(P);
  else if (weekView === 'cuisine') html += weekBatchHtml(P);
  else if (weekView === 'regles') html += weekRulesHtml(P);
  else if (weekView === 'imprimer') html += weekPrintHtml(P);
  else html += weekDaysHtml(P);
  c.innerHTML = html;
}

// ── Tabs ──
function setActiveTab(tab) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
}

document.getElementById('navTabs').addEventListener('click', (e) => {
  const tab = e.target.dataset.tab;
  if (!tab) return;
  currentTab = tab;
  setActiveTab(tab);
  render();
});

  loadTracking();
  loadJournal();
  await Promise.all([loadRoutine(), loadBaseNutritionelle()]);
  render();
  if (bolRolledOver) showToast('Nouvelle journée : bol vidé (celui d’hier est dans « Modèles… »)');
}

init();
