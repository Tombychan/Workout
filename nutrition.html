<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nutrition Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #FAF7F2;
  --bg-card: #FFFFFF;
  --bg-card-alt: #F5F0E8;
  --text: #2C2416;
  --text-muted: #8C7E6A;
  --text-light: #B5A898;
  --accent: #D4A574;
  --accent-dark: #B8854A;
  --accent-light: #F0DCC8;
  --green: #7CAA6E;
  --green-light: #E8F2E4;
  --green-bg: #D4E8CC;
  --red: #C47A6A;
  --red-light: #F5E0DA;
  --blue: #6A94B8;
  --blue-light: #DDE9F2;
  --border: #E8E0D4;
  --shadow: 0 2px 8px rgba(44,36,22,0.06);
  --shadow-lg: 0 4px 16px rgba(44,36,22,0.1);
  --radius: 14px;
  --radius-sm: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: 'DM Sans', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
  -webkit-tap-highlight-color: transparent;
}

/* Header */
.header {
  background: linear-gradient(135deg, #3D3024 0%, #2C2416 100%);
  color: #FAF7F2;
  padding: 20px 16px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
.header-version {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  background: rgba(255,255,255,0.12);
  padding: 3px 8px;
  border-radius: 20px;
  color: var(--accent-light);
}
.header-date {
  font-size: 0.85rem;
  color: var(--accent);
  font-weight: 500;
}
.header-macros {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.macro-pill {
  flex: 1;
  text-align: center;
  padding: 6px 4px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.08);
  font-size: 0.72rem;
  line-height: 1.3;
}
.macro-pill .val {
  display: block;
  font-weight: 700;
  font-size: 0.95rem;
  font-family: 'DM Mono', monospace;
}
.macro-pill .lbl { color: var(--accent-light); }
.macro-pill.highlight { background: rgba(212,165,116,0.2); }

/* Navigation tabs */
.nav-tabs {
  display: flex;
  gap: 4px;
  padding: 8px 16px;
  background: var(--bg);
  position: sticky;
  top: 94px;
  z-index: 99;
  border-bottom: 1px solid var(--border);
}
.nav-tab {
  flex: 1;
  padding: 8px 2px;
  text-align: center;
  font-size: 0.74rem;
  font-weight: 600;
  border: none;
  background: transparent;
  color: var(--text-muted);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
}
.nav-tab.active {
  background: var(--text);
  color: var(--bg);
}

/* Content */
.content { padding: 12px 12px; }

/* Meal Card */
.meal-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
  border: 1px solid var(--border);
  transition: box-shadow 0.2s;
}
.meal-card.completed {
  border-color: var(--green);
  background: linear-gradient(135deg, var(--bg-card) 90%, var(--green-light) 100%);
}
.meal-header {
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
}
.meal-header:active { background: var(--bg-card-alt); }
.meal-left { flex: 1; }
.meal-time {
  font-family: 'DM Mono', monospace;
  font-size: 0.8rem;
  color: var(--accent-dark);
  font-weight: 500;
}
.meal-name { font-size: 1rem; font-weight: 600; margin-top: 2px; }
.meal-right { text-align: right; }
.meal-kcal {
  font-family: 'DM Mono', monospace;
  font-size: 0.95rem;
  font-weight: 700;
}
.meal-macros-mini {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 2px;
}
.leucine-badge {
  display: inline-block;
  font-size: 0.6rem;
  font-weight: 700;
  background: var(--green-bg);
  color: var(--green);
  padding: 2px 6px;
  border-radius: 10px;
  margin-top: 4px;
}
.meal-expand {
  color: var(--text-light);
  font-size: 1.2rem;
  margin-left: 10px;
  transition: transform 0.2s;
}
.meal-card.open .meal-expand { transform: rotate(180deg); }

.meal-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}
.meal-card.open .meal-body { max-height: 2000px; }

.meal-items { padding: 0 16px 14px; }

/* Item row */
.item-row {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid var(--border);
  gap: 10px;
}
.item-check {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  font-size: 0.8rem;
  color: transparent;
}
.item-check.checked {
  background: var(--green);
  border-color: var(--green);
  color: white;
}
.item-info { flex: 1; min-width: 0; }
.item-name { font-size: 0.88rem; font-weight: 500; line-height: 1.3; }
.item-detail {
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-top: 2px;
  font-family: 'DM Mono', monospace;
}
.item-qty {
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--accent-dark);
  flex-shrink: 0;
  text-align: right;
  min-width: 50px;
}

/* Juice section */
.juice-section {
  margin: 0 16px 14px;
  padding: 10px 12px;
  background: var(--bg-card-alt);
  border-radius: var(--radius-sm);
}
.juice-title {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--green);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.juice-ingredients {
  font-size: 0.75rem;
  color: var(--text-muted);
  line-height: 1.5;
}

/* Rotation (diner) */
.rotation-section {
  margin: 0 16px 14px;
  padding: 10px 12px;
  background: var(--blue-light);
  border-radius: var(--radius-sm);
}
.rotation-title {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--blue);
  margin-bottom: 6px;
}
.rotation-options { display: flex; flex-wrap: wrap; gap: 6px; }
.rotation-opt {
  font-size: 0.72rem;
  padding: 5px 10px;
  background: var(--bg-card);
  border: 1.5px solid var(--blue);
  border-radius: 20px;
  cursor: pointer;
  color: var(--blue);
  font-weight: 500;
  transition: all 0.15s;
}
.rotation-opt.selected {
  background: var(--blue);
  color: white;
}

/* Progress bar */
.meal-progress {
  height: 3px;
  background: var(--border);
}
.meal-progress-fill {
  height: 100%;
  background: var(--green);
  transition: width 0.3s;
  border-radius: 0 3px 3px 0;
}

/* Notes */
.meal-notes {
  padding: 0 16px 10px;
  font-size: 0.72rem;
  color: var(--text-muted);
  font-style: italic;
  line-height: 1.4;
}

/* Supplements tab */
.supp-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.supp-check {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border);
  background: transparent; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; font-size: 0.8rem; color: transparent;
}
.supp-check.checked { background: var(--green); border-color: var(--green); color: white; }
.supp-info { flex: 1; }
.supp-name { font-size: 0.88rem; font-weight: 600; }
.supp-dose { font-size: 0.75rem; color: var(--text-muted); font-family: 'DM Mono', monospace; }
.supp-timing { font-size: 0.7rem; color: var(--accent-dark); margin-top: 2px; }

/* Interactions tab */
.interaction-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  font-size: 0.82rem;
  line-height: 1.5;
  color: var(--text);
}
.interaction-card::first-line { font-weight: 600; }

/* Changelog tab */
.changelog-entry {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.changelog-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.changelog-version {
  font-family: 'DM Mono', monospace;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--accent-dark);
}
.changelog-date { font-size: 0.75rem; color: var(--text-muted); }
.changelog-changes { list-style: none; padding: 0; }
.changelog-changes li {
  font-size: 0.78rem;
  padding: 4px 0;
  border-top: 1px solid var(--border);
  color: var(--text);
  line-height: 1.4;
}
.changelog-changes li::before {
  content: "→ ";
  color: var(--accent-dark);
  font-weight: 600;
}

/* Daily summary */
.daily-summary {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.summary-title {
  font-size: 0.85rem;
  font-weight: 700;
  margin-bottom: 10px;
  color: var(--text);
}
.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.82rem;
}
.summary-row:last-child { border: none; }
.summary-bar-container {
  width: 80px;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-left: 8px;
}
.summary-bar {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s;
}
.summary-bar.good { background: var(--green); }
.summary-bar.over { background: var(--red); }
.summary-bar.under { background: var(--accent); }

/* Notes textarea */
.daily-notes {
  width: 100%;
  min-height: 60px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  resize: vertical;
  background: var(--bg-card);
  color: var(--text);
  margin-top: 8px;
}
.daily-notes::placeholder { color: var(--text-light); }

/* Settings / actions */
.action-bar {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.action-btn {
  flex: 1;
  min-width: 100px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}
.action-btn:active { background: var(--bg-card-alt); transform: scale(0.97); }
.action-btn.danger { border-color: var(--red); color: var(--red); }

/* Toast */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text);
  color: var(--bg);
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 0.82rem;
  font-weight: 500;
  z-index: 200;
  opacity: 0;
  transition: all 0.3s;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* Loading */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-size: 0.9rem;
}
.loading-spinner {
  width: 30px; height: 30px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Date nav */
.date-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 10px 16px;
  background: var(--bg);
}
.date-nav-btn {
  width: 34px; height: 34px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--bg-card);
  cursor: pointer;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
}
.date-nav-btn:active { background: var(--bg-card-alt); }
.date-nav-label {
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 12px;
  border-radius: var(--radius-sm);
}
.date-nav-label:active { background: var(--bg-card-alt); }

/* Status indicator */
.data-status {
  font-size: 0.65rem;
  font-family: 'DM Mono', monospace;
  color: var(--text-light);
  display: flex;
  align-items: center;
  gap: 4px;
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
}
.status-dot.cached { background: var(--accent); }
.status-dot.offline { background: var(--red); }
/* ── Leucine Calculator ── */
.leu-summary { background: var(--bg-card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.leu-summary-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
.leu-summary-stat .leu-val { font-family: 'DM Mono', monospace; font-size: 1.4rem; font-weight: 700; }
.leu-summary-stat .leu-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.leu-bar-row { margin-bottom: 6px; }
.leu-bar-label { display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 3px; color: var(--text-muted); }
.leu-bar-label .leu-bar-val { font-weight: 600; }
.leu-bar-label .leu-bar-val.ok { color: var(--green); }
.leu-bar-label .leu-bar-val.low { color: var(--red); }
.leu-bar-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.leu-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.leu-bar-fill.ok { background: var(--green); }
.leu-bar-fill.low { background: linear-gradient(90deg, var(--red), var(--accent)); }
.leu-meal-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.leu-meal-tab { flex: 1; padding: 8px 4px; font-size: 0.72rem; font-weight: 500; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); cursor: pointer; text-align: center; transition: all 0.2s; line-height: 1.3; font-family: 'DM Sans', sans-serif; }
.leu-meal-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.leu-meal-card { background: var(--bg-card); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); min-height: 80px; }
.leu-meal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.leu-meal-title { font-size: 0.88rem; font-weight: 600; color: var(--accent-dark); }
.leu-meal-totals { font-size: 0.75rem; color: var(--text-muted); font-family: 'DM Mono', monospace; }
.leu-item-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
.leu-item-info { flex: 1; min-width: 0; }
.leu-item-name { font-size: 0.82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.leu-item-detail { font-size: 0.7rem; color: var(--text-muted); font-family: 'DM Mono', monospace; }
.leu-item-qty { display: flex; align-items: center; gap: 4px; }
.leu-item-qty input { width: 50px; padding: 4px 6px; font-size: 0.82rem; font-family: 'DM Mono', monospace; background: var(--bg-card-alt); color: var(--text); border: 1px solid var(--border); border-radius: 6px; text-align: right; }
.leu-item-qty span { font-size: 0.7rem; color: var(--text-muted); }
.leu-item-remove { background: none; border: none; color: var(--red); opacity: 0.5; cursor: pointer; font-size: 1.1rem; padding: 0 4px; }
.leu-add-btn { width: 100%; padding: 10px; margin-top: 8px; background: var(--bg-card-alt); color: var(--accent-dark); border: 1px dashed var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.82rem; font-weight: 500; font-family: 'DM Sans', sans-serif; }
.leu-empty { color: var(--text-light); font-size: 0.82rem; text-align: center; padding: 20px 0; }
.leu-search-overlay { position: fixed; inset: 0; background: rgba(44,36,22,0.5); z-index: 200; display: flex; flex-direction: column; padding: 50px 12px 12px; }
.leu-search-panel { background: var(--bg-card); border-radius: 16px; max-height: 75vh; display: flex; flex-direction: column; border: 1px solid var(--border); box-shadow: var(--shadow-lg); overflow: hidden; }
.leu-search-input { width: 100%; padding: 12px 14px; font-size: 0.92rem; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); border: none; border-bottom: 1px solid var(--border); outline: none; box-sizing: border-box; }
.leu-search-results { overflow-y: auto; flex: 1; }
.leu-search-item { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 10px 14px; background: none; border: none; border-bottom: 1px solid var(--border); color: var(--text); cursor: pointer; text-align: left; font-size: 0.82rem; font-family: 'DM Sans', sans-serif; }
.leu-search-item:active { background: var(--bg-card-alt); }
.leu-search-item-name { font-weight: 500; }
.leu-search-item-cat { font-size: 0.7rem; color: var(--text-muted); }
.leu-search-item-vals { text-align: right; white-space: nowrap; font-family: 'DM Mono', monospace; font-size: 0.75rem; }
.leu-search-item-leu { color: var(--green); }
.leu-search-item-leu.low { color: var(--text-muted); }

/* ── Bol : charge gastrique ── */
:root { --amber: #D9963A; --amber-light: #F7E7CF; --amber-text: #A86A18; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--border); }
.dot.v-ok { background: var(--green); } .dot.v-warn { background: var(--amber); }
.dot.v-over { background: var(--red); } .dot.v-low { background: var(--blue); }
.bol-meal-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
.bol-meal-tab { flex: 1; padding: 7px 2px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-card); font-family: 'DM Sans', sans-serif; font-size: 0.74rem; font-weight: 600; color: var(--text-muted); cursor: pointer; line-height: 1.3; }
.bol-meal-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.bol-kcal { display: block; font-family: 'DM Mono', monospace; font-weight: 400; font-size: 0.64rem; opacity: 0.85; }
.bol-day { font-size: 0.74rem; color: var(--text-muted); margin: 0 2px 10px; }
.bol-day b { color: var(--text); }
.verdict { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; border: 1.5px solid var(--border); background: var(--bg-card); box-shadow: var(--shadow); }
.verdict.v-ok { border-color: var(--green); background: linear-gradient(180deg, var(--green-light), var(--bg-card) 70px); }
.verdict.v-warn { border-color: var(--amber); background: linear-gradient(180deg, var(--amber-light), var(--bg-card) 70px); }
.verdict.v-over { border-color: var(--red); background: linear-gradient(180deg, var(--red-light), var(--bg-card) 70px); }
.verdict.v-low { border-color: var(--blue); background: linear-gradient(180deg, var(--blue-light), var(--bg-card) 70px); }
.verdict-title { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
.verdict-sub { font-size: 0.76rem; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
.verdict-why { font-size: 0.76rem; margin-top: 8px; line-height: 1.45; display: flex; flex-direction: column; gap: 3px; }
.g-row { margin-top: 11px; }
.g-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.78rem; margin-bottom: 4px; }
.g-name { font-weight: 600; }
.g-val { font-family: 'DM Mono', monospace; font-weight: 600; font-size: 0.82rem; }
.g-val.l-ok { color: var(--green); } .g-val.l-warn { color: var(--amber-text); }
.g-val.l-over { color: var(--red); } .g-val.l-low { color: var(--blue); }
.g-track { position: relative; height: 10px; }
.g-zones { position: absolute; inset: 0; border-radius: 5px; overflow: hidden; background: var(--border); }
.g-zone { position: absolute; top: 0; bottom: 0; }
.z-low { background: var(--blue-light); } .z-ok { background: var(--green-bg); }
.z-warn { background: #F1D5A8; } .z-over { background: #EBC2B8; }
.g-marker { position: absolute; top: -3px; bottom: -3px; width: 4px; margin-left: -2px; background: var(--text); border-radius: 2px; box-shadow: 0 0 0 1.5px var(--bg-card); }
.g-sub { font-size: 0.64rem; color: var(--text-muted); margin-top: 3px; font-family: 'DM Mono', monospace; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.chip { font-size: 0.68rem; padding: 3px 8px; border-radius: 12px; background: var(--bg-card-alt); border: 1px solid var(--border); color: var(--text); line-height: 1.35; }
.chip.c-warn { background: var(--amber-light); border-color: var(--amber); }
.bol-card { background: var(--bg-card); border-radius: var(--radius); padding: 4px 12px 12px; margin-bottom: 10px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.bol-item { display: flex; align-items: center; gap: 6px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.bol-item-info { flex: 1; min-width: 0; }
.bol-item-name { font-size: 0.8rem; font-weight: 500; line-height: 1.25; }
.bol-item-detail { font-size: 0.64rem; color: var(--text-muted); font-family: 'DM Mono', monospace; margin-top: 2px; }
.bol-item-hint { font-size: 0.64rem; color: var(--accent-dark); margin-top: 2px; font-style: italic; line-height: 1.3; }
.qty-col { flex-shrink: 0; }
.qty { display: flex; align-items: center; gap: 3px; }
.qty button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-card-alt); font-size: 1rem; color: var(--text); cursor: pointer; line-height: 1; padding: 0; }
.qty input { width: 56px; padding: 5px 4px; font-family: 'DM Mono', monospace; font-size: 0.8rem; text-align: right; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
.qty-unit { font-size: 0.6rem; color: var(--text-muted); text-align: center; margin-top: 3px; max-width: 112px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bol-remove { background: none; border: none; color: var(--red); opacity: 0.55; font-size: 1.15rem; cursor: pointer; padding: 0 2px; }
.scale-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 0.72rem; color: var(--text-muted); margin: 10px 0 0; }
.bol-tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.bol-select { flex: 1; min-width: 0; padding: 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-card); font-family: 'DM Sans', sans-serif; font-size: 0.78rem; color: var(--text); }
.mini-btn { padding: 7px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-card); font-family: 'DM Sans', sans-serif; font-size: 0.74rem; font-weight: 600; color: var(--text); cursor: pointer; }
.mini-btn:active, .tag:active, .score-btn:active { transform: scale(0.96); }
.eat-btn { width: 100%; padding: 13px; border: none; border-radius: var(--radius-sm); background: var(--green); color: #fff; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 700; cursor: pointer; }
.eat-btn:active { transform: scale(0.98); }
.bol-foot { font-size: 0.66rem; color: var(--text-light); margin: 8px 2px 0; line-height: 1.4; }
.reflux-banner { display: flex; align-items: center; gap: 10px; background: var(--amber-light); border: 1px solid var(--amber); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; font-size: 0.8rem; cursor: pointer; line-height: 1.35; }
.reflux-banner-sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

/* ── Journal reflux ── */
.j-note { font-size: 0.76rem; color: var(--text-muted); line-height: 1.45; }
.j-newform { margin-top: 6px; padding-top: 4px; border-top: 1px solid var(--border); }
.j-day { font-size: 0.78rem; font-weight: 700; color: var(--accent-dark); margin: 14px 2px 6px; }
.j-entry { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 8px; overflow: hidden; }
.j-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; }
.j-time { font-family: 'DM Mono', monospace; font-size: 0.76rem; color: var(--accent-dark); width: 38px; flex-shrink: 0; }
.j-main { flex: 1; min-width: 0; }
.j-title { font-size: 0.84rem; font-weight: 600; }
.j-sub { font-size: 0.66rem; color: var(--text-muted); font-family: 'DM Mono', monospace; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.j-score { width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-weight: 700; font-size: 0.9rem; }
.s-none { background: var(--bg-card-alt); color: var(--text-muted); border: 1px dashed var(--accent); font-size: 0.56rem; font-family: 'DM Sans', sans-serif; font-weight: 600; text-align: center; line-height: 1.1; }
.s-0 { background: var(--green-light); color: var(--green); }
.s-low { background: var(--amber-light); color: var(--amber-text); }
.s-high { background: var(--red-light); color: var(--red); }
.j-body { padding: 0 12px 12px; border-top: 1px solid var(--border); }
.j-items { font-size: 0.72rem; color: var(--text-muted); line-height: 1.5; margin-top: 8px; }
.j-label { font-size: 0.66rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 12px; }
.score-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 6px; }
.score-btn { padding: 9px 0; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-card); font-family: 'DM Mono', monospace; font-weight: 600; font-size: 0.85rem; cursor: pointer; color: var(--text); }
.score-btn.sel { background: var(--text); color: var(--bg); border-color: var(--text); }
.tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.tag { padding: 6px 10px; border-radius: 16px; border: 1px solid var(--border); background: var(--bg-card); font-size: 0.72rem; cursor: pointer; color: var(--text); font-family: 'DM Sans', sans-serif; }
.tag.sel { background: var(--accent-light); border-color: var(--accent-dark); font-weight: 600; }
.j-input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 0.82rem; background: var(--bg); color: var(--text); margin-top: 6px; }
.action-btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.j-del { background: none; border: none; color: var(--red); font-size: 0.72rem; margin-top: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; padding: 0; }
.j-table { width: 100%; border-collapse: collapse; font-size: 0.76rem; margin-top: 4px; }
.j-table th { text-align: left; font-size: 0.64rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; font-weight: 700; padding: 4px 2px; border-bottom: 1px solid var(--border); }
.j-table td { padding: 6px 2px; border-bottom: 1px solid var(--border); font-family: 'DM Mono', monospace; }
.j-table td:first-child { font-family: 'DM Sans', sans-serif; }
.j-svg { width: 100%; height: auto; margin-top: 10px; display: block; }
.j-legend { display: flex; gap: 12px; font-size: 0.68rem; color: var(--text-muted); justify-content: center; margin-top: 2px; }
.j-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
</style>

<body>
<div class="header">
  <div class="header-top">
    <h1>🥬 Nutrition</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="data-status" id="dataStatus">
        <div class="status-dot"></div>
        <span>chargement…</span>
      </div>
      <div class="header-version" id="headerVersion">–</div>
    </div>
  </div>
  <div class="header-macros" id="headerMacros"></div>
</div>

<div class="nav-tabs" id="navTabs">
  <button class="nav-tab active" data-tab="meals">Repas</button>
  <button class="nav-tab" data-tab="bol">Bol</button>
  <button class="nav-tab" data-tab="journal">Journal</button>
  <button class="nav-tab" data-tab="suppl">Suppl.</button>
  <button class="nav-tab" data-tab="info">Infos</button>
  <button class="nav-tab" data-tab="data">Données</button>
</div>

<div id="dateNavContainer"></div>
<div class="content" id="mainContent">
  <div class="loading">
    <div class="loading-spinner"></div>
    Chargement de la routine…
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── State ──
let routine = null;
let currentDate = todayStr();
let currentTab = 'meals';
let tracking = {};

// ── Bol : composition des repas et charge gastrique ──
const MEAL_IDS = ['r1', 'r2', 'collation', 'diner'];
// Valeurs de secours si routine_alimentaire.json (bloc meal_corridors) n'est pas chargé
const DEFAULT_CORRIDORS = {
  liquid_mass_factor: 0.5,
  meals: {
    r1: { label: 'R1', time: '8h', kcal: { min: 600, max: 850, red: 1000 }, fat_g: { max: 22, red: 30 }, mass_g: { max: 600, red: 800 }, leucine_min_g: 2.5 },
    r2: { label: 'R2', time: '12h30', kcal: { min: 650, max: 850, red: 1000 }, fat_g: { max: 35, red: 45 }, mass_g: { max: 850, red: 1050 }, leucine_min_g: 2.5 },
    collation: { label: 'Collation', time: '16h', kcal: { min: 300, max: 500, red: 650 }, fat_g: { max: 10, red: 15 }, mass_g: { max: 450, red: 600 }, leucine_min_g: 2.5 },
    diner: { label: 'Dîner', time: '18h30', kcal: { min: 450, max: 650, red: 800 }, fat_g: { max: 20, red: 28 }, mass_g: { max: 700, red: 900 }, protein_g: { max: 30, red: 40 }, leucine_min_g: null },
  },
};
const VEG_CATS = ['Légumes cuits', 'Crudités', 'Féculents', 'Légumes jus'];
const TRIG_LABEL = { acide: 'Acide', menthe: 'Menthe', allium: 'Ail / oignon / poireau' };
const LOC_TAGS = ['Derrière le sternum', 'Creux de l’estomac', 'Gorge / bouche', 'Remontées acides'];
const CTX_TAGS = ['Chant', 'Sol / gainage', 'Flexion (hinge, rows)', 'Allongé', 'Sauna', 'Effort intense', 'Stress', 'Mangé vite'];
const VERDICT_TXT = {
  ok: ['Dans le couloir', 'Volume, graisses et énergie dans les clous.'],
  warn: ['Limite', 'Un paramètre dépasse le vert : risque de brûlures accru.'],
  over: ['Trop chargé', 'Au moins un paramètre est dans le rouge : allège avant de manger.'],
  low: ['Pas assez', 'Rien de trop, mais il manque de quoi nourrir l’entraînement.'],
  empty: ['Compose ton repas', 'Charge un modèle ou ajoute des aliments.'],
};

let baseNutritionelle = null;
let foodsById = {};
let foodList = [];
let leuMeals = { r1: [], r2: [], collation: [], diner: [] }; // { id, grams }
let leuActiveMeal = mealForNow();
let userTemplates = [];
let journal = { entries: [] };
let jOpenId = null, jDraft = null;

const num = v => { const x = typeof v === 'number' ? v : parseFloat(v); return Number.isFinite(x) ? x : 0; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (v, d = 0) => num(v).toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });

function mealForNow() {
  const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  return h < 10.5 ? 'r1' : h < 14.5 ? 'r2' : h < 17.25 ? 'collation' : 'diner';
}
function corridors() { return (routine && routine.meal_corridors && routine.meal_corridors.meals) ? routine.meal_corridors : DEFAULT_CORRIDORS; }
function mealCfg(id) { return corridors().meals[id] || DEFAULT_CORRIDORS.meals[id]; }

async function loadBaseNutritionelle() {
  try {
    const resp = await fetch('base_nutritionnelle.json?v=' + Date.now());
    if (resp.ok) {
      baseNutritionelle = await resp.json();
      try { localStorage.setItem('nt-basenutri-cache', JSON.stringify(baseNutritionelle)); } catch(e) {}
    }
  } catch(e) {}
  if (!baseNutritionelle) {
    try {
      const cached = localStorage.getItem('nt-basenutri-cache');
      if (cached) baseNutritionelle = JSON.parse(cached);
    } catch(e) {}
  }
  buildFoods();
  try {
    const saved = localStorage.getItem('nt-leumeal-v1');
    if (saved) {
      const s = JSON.parse(saved);
      MEAL_IDS.forEach(m => { leuMeals[m] = Array.isArray(s[m]) ? s[m].filter(i => i && i.id).map(i => ({ id: i.id, grams: num(i.grams) })) : []; });
    }
  } catch(e) {}
  try { const t = localStorage.getItem('nt-templates-v1'); if (t) userTemplates = JSON.parse(t) || []; } catch(e) { userTemplates = []; }
}

function buildFoods() {
  foodsById = {}; foodList = [];
  if (!baseNutritionelle || !baseNutritionelle.items) return;
  for (const v of Object.values(baseNutritionelle.items)) {
    const f = {
      id: v.id || '', n: v.Aliment || '', c: v['Catégorie'] || '', p: num(v['Portion type (g)']) || 100,
      kcal: num(v['kcal/100g']), pr: num(v['Prot (g/100g)']), fat: num(v['Lip (g/100g)']), carb: num(v['Glu (g/100g)']),
      l: num(v['Leucine /100g (g)']), lEst: !!v['Leucine estimée'], dig: num(v['Digest. prot. (coef)']) || 0.8,
      state: v['État'] || 'solide', massCoef: num(v['Masse ingérée (coef)']) || 1,
      mx: num(v['Méthylxanthines (mg/100g)']), trig: Array.isArray(v['Déclencheurs']) ? v['Déclencheurs'] : [],
      ferm: v['Fermentesc.'] || '', unit: (v['Unité'] && num(v['Unité'].g) > 0) ? v['Unité'] : null, hint: v['Repères'] || '',
    };
    foodsById[f.id] = f;
    if (f.kcal === 0 && f.state !== 'liquide') continue; // compléments sans énergie : inutiles ici
    foodList.push(f);
  }
  foodList.sort((a, b) => a.n.localeCompare(b.n, 'fr'));
}
function saveLeuMeals() { try { localStorage.setItem('nt-leumeal-v1', JSON.stringify(leuMeals)); } catch(e) {} }
function saveTemplates() { try { localStorage.setItem('nt-templates-v1', JSON.stringify(userTemplates)); } catch(e) {} }
function loadJournal() {
  try { const s = localStorage.getItem('nt-reflux-v1'); if (s) journal = JSON.parse(s); } catch(e) {}
  if (!journal || !Array.isArray(journal.entries)) journal = { entries: [] };
}
function saveJournal() { try { localStorage.setItem('nt-reflux-v1', JSON.stringify(journal)); } catch(e) { showToast('Stockage plein : exporte une sauvegarde'); } }

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDateLabel(ds) {
  const t = todayStr();
  if (ds === t) return "Aujourd'hui";
  const d = new Date(ds + 'T12:00:00');
  const opts = { weekday: 'long', day: 'numeric', month: 'long' };
  const label = d.toLocaleDateString('fr-FR', opts);
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  const ys = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;
  if (ds === ys) return "Hier";
  return label.charAt(0).toUpperCase() + label.slice(1);
}

// ── Data loading ──
async function loadRoutine() {
  // Try fetch from same domain
  try {
    const resp = await fetch('routine_alimentaire.json?v=' + Date.now());
    if (resp.ok) {
      routine = await resp.json();
      localStorage.setItem('nt-routine-cache', JSON.stringify(routine));
      updateStatus('live');
      return;
    }
  } catch(e) {}
  
  // Fallback: cached version
  try {
    const cached = localStorage.getItem('nt-routine-cache');
    if (cached) {
      routine = JSON.parse(cached);
      updateStatus('cached');
      return;
    }
  } catch(e) {}
  
  updateStatus('offline');
}

function updateStatus(mode) {
  const el = document.getElementById('dataStatus');
  const dot = el.querySelector('.status-dot');
  const span = el.querySelector('span');
  dot.className = 'status-dot' + (mode === 'cached' ? ' cached' : mode === 'offline' ? ' offline' : '');
  span.textContent = mode === 'live' ? 'à jour' : mode === 'cached' ? 'cache' : 'hors ligne';
}

// ── Tracking persistence ──
function loadTracking() {
  try {
    const raw = localStorage.getItem('nt-tracking-v1');
    if (raw) tracking = JSON.parse(raw);
  } catch(e) { tracking = {}; }
}

function saveTracking() {
  localStorage.setItem('nt-tracking-v1', JSON.stringify(tracking));
}

function getDayData(date) {
  if (!tracking[date]) tracking[date] = { items: {}, suppl: {}, rotation: null, notes: '' };
  return tracking[date];
}

function toggleItem(date, mealId, itemIdx) {
  const day = getDayData(date);
  const key = `${mealId}:${itemIdx}`;
  day.items[key] = !day.items[key];
  saveTracking();
  render();
}

function toggleSuppl(date, idx) {
  const day = getDayData(date);
  const key = `supp:${idx}`;
  day.suppl[key] = !day.suppl[key];
  saveTracking();
  render();
}

function setRotation(date, rotIdx) {
  const day = getDayData(date);
  day.rotation = day.rotation === rotIdx ? null : rotIdx;
  saveTracking();
  render();
}

function setNotes(date, text) {
  const day = getDayData(date);
  day.notes = text;
  saveTracking();
}

// ── Rendering ──
function render() {
  if (!routine) {
    document.getElementById('mainContent').innerHTML = `<div class="loading"><div class="loading-spinner"></div>Aucune donnée disponible</div>`;
    return;
  }
  
  document.getElementById('headerVersion').textContent = 'v' + routine.meta.version;
  renderHeaderMacros();
  if (currentTab === 'bol' || currentTab === 'journal') document.getElementById('dateNavContainer').innerHTML = '';
  else renderDateNav();
  syncStickyOffset();
  
  switch(currentTab) {
    case 'meals': renderMeals(); break;
    case 'suppl': renderSupplements(); break;
    case 'info': renderInfo(); break;
    case 'data': renderData(); break;
    case 'bol': renderBol(); break;
    case 'journal': renderJournal(); break;
  }
}

function renderHeaderMacros() {
  const day = getDayData(currentDate);
  const consumed = calcConsumedMacros(day);
  const targets = routine.daily_totals.confirmed;
  
  const macros = [
    { lbl: 'Kcal', val: consumed.kcal, target: targets.kcal, unit: '' },
    { lbl: 'Prot', val: consumed.protein, target: targets.protein_g, unit: 'g' },
    { lbl: 'Gluc', val: consumed.carb, target: targets.carb_g, unit: 'g' },
    { lbl: 'Lip', val: consumed.fat, target: targets.fat_g, unit: 'g' },
  ];
  
  document.getElementById('headerMacros').innerHTML = macros.map((m, i) => `
    <div class="macro-pill${i===0?' highlight':''}">
      <span class="val">${Math.round(m.val)}</span>
      <span class="lbl">/ ${Math.round(m.target)}${m.unit} ${m.lbl}</span>
    </div>
  `).join('');
}

function calcConsumedMacros(day) {
  let protein = 0, carb = 0, fat = 0, kcal = 0;
  if (!routine) return { protein, carb, fat, kcal };
  
  for (const meal of routine.meals) {
    const items = meal.items || meal.fixed_items || [];
    items.forEach((item, idx) => {
      if (day.items[`${meal.id}:${idx}`]) {
        protein += item.protein_g || 0;
        carb += item.carb_g || 0;
        fat += item.fat_g || 0;
        kcal += item.kcal || 0;
      }
    });
    // Juice
    if (meal.juice && day.items[`${meal.id}:juice`]) {
      protein += meal.juice.protein_g || 0;
      carb += meal.juice.carb_g || 0;
      fat += meal.juice.fat_g || 0;
      kcal += meal.juice.kcal || 0;
    }
    // Protein rotation for dinner
    if (meal.protein_source_rotation && day.rotation !== null) {
      const rot = meal.protein_source_rotation[day.rotation];
      if (rot && day.items[`${meal.id}:rotation`]) {
        protein += rot.protein_g || 0;
        carb += rot.carb_g || 0;
        fat += rot.fat_g || 0;
        kcal += rot.kcal || 0;
      }
    }
  }
  
  // Supplements (omega-3)
  for (const [i, s] of routine.supplements.entries()) {
    if (day.suppl[`supp:${i}`] && s.name.includes('Oméga')) {
      // Already counted in meal items (3 gélules R2 + 3 dîner)
    }
  }
  
  return { protein, carb, fat, kcal };
}

function renderDateNav() {
  document.getElementById('dateNavContainer').innerHTML = `
    <div class="date-nav">
      <button class="date-nav-btn" onclick="changeDate(-1)">‹</button>
      <span class="date-nav-label" onclick="goToday()">${formatDateLabel(currentDate)}</span>
      <button class="date-nav-btn" onclick="changeDate(1)">›</button>
    </div>
  `;
}

function changeDate(delta) {
  const d = new Date(currentDate + 'T12:00:00');
  d.setDate(d.getDate() + delta);
  currentDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

// ── Bol : calculs ──
function gaugeOf(key, label, v, cfg, unit) {
  const g = { key, label, v, unit, min: cfg.min ?? null, max: cfg.max ?? null, red: cfg.red ?? null, level: 'ok' };
  if (g.red != null && v > g.red) g.level = 'over';
  else if (g.max != null && v > g.max) g.level = 'warn';
  else if (g.min != null && v < g.min) g.level = 'low';
  g.domain = Math.max(g.red != null ? g.red * 1.25 : (g.min || 1) * 2, v * 1.05, 1);
  return g;
}

function computeMeal(mealId, items) {
  const cfg = mealCfg(mealId);
  const lf = num(corridors().liquid_mass_factor) || 0.5;
  const t = { n: 0, solids: 0, liquids: 0, massEff: 0, kcal: 0, fat: 0, prot: 0, carb: 0, leuRaw: 0, leu: 0, mx: 0,
    fermHigh: 0, fermMod: 0, trig: {}, estLeu: false, unknown: 0, contrib: { mass: [], fat: [], kcal: [], prot: [] } };
  for (const it of items || []) {
    const f = foodsById[it.id], g = num(it.grams);
    if (!f) { t.unknown++; continue; }
    if (g <= 0) continue;
    const k = g / 100;
    const liquid = f.state === 'liquide';
    const mass = liquid ? g * lf : g * f.massCoef;
    if (liquid) t.liquids += g; else t.solids += g * f.massCoef;
    t.massEff += mass;
    const kc = f.kcal * k, ft = f.fat * k, pr = f.pr * k, lr = f.l * k;
    t.n++; t.kcal += kc; t.fat += ft; t.prot += pr; t.carb += f.carb * k; t.leuRaw += lr; t.leu += lr * f.dig; t.mx += f.mx * k;
    if (f.lEst && lr * f.dig >= 0.1) t.estLeu = true;
    if (!liquid) { if (/élev/i.test(f.ferm)) t.fermHigh += g; else if (/mod/i.test(f.ferm)) t.fermMod += g; }
    f.trig.forEach(tr => { (t.trig[tr] = t.trig[tr] || []).push(f.n); });
    t.contrib.mass.push([f, mass]); t.contrib.fat.push([f, ft]); t.contrib.kcal.push([f, kc]); t.contrib.prot.push([f, pr]);
  }
  t.gauges = [
    gaugeOf('mass', 'Remplissage', t.massEff, cfg.mass_g || {}, 'g'),
    gaugeOf('fat', 'Graisses', t.fat, cfg.fat_g || {}, 'g'),
    gaugeOf('kcal', 'Énergie', t.kcal, cfg.kcal || {}, 'kcal'),
  ];
  if (cfg.protein_g) t.gauges.push(gaugeOf('prot', 'Protéines', t.prot, cfg.protein_g, 'g'));
  if (cfg.leucine_min_g) t.gauges.push(gaugeOf('leu', 'Leucine corrigée', t.leu, { min: cfg.leucine_min_g }, 'g'));
  const lv = t.gauges.map(g => g.level);
  t.verdict = !t.n ? 'empty' : lv.includes('over') ? 'over' : lv.includes('warn') ? 'warn' : lv.includes('low') ? 'low' : 'ok';
  return t;
}

function shortName(n) { return String(n).replace(/\s*\(.*?\)\s*/g, ' ').replace(/\s+/g, ' ').trim(); }

function whyLines(t) {
  const out = [];
  const upper = t.gauges.filter(g => g.level === 'over' || g.level === 'warn').sort((a, b) => b.v / b.max - a.v / a.max);
  for (const g of upper) {
    const list = (t.contrib[g.key] || []).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 3)
      .map(([f, v]) => `${esc(shortName(f.n))} ${fmt(v, g.key === 'fat' ? 1 : 0)} ${g.unit}`).join(' · ');
    out.push(`<b>${g.label} ${fmt(g.v)} ${g.unit}</b> (vert ≤ ${fmt(g.max)}) — surtout : ${list}`);
  }
  for (const g of t.gauges.filter(g => g.level === 'low')) {
    if (g.key === 'leu') {
      const miss = g.min - g.v, sk = foodsById.skyr_vache_classique_holstein, egg = foodsById.oeuf_entier_bio_1_oeuf_65g_sans_coquille_75g_avec;
      let hint = '';
      if (sk && egg) {
        const skG = Math.ceil(miss / (sk.l * sk.dig / 100) / 10) * 10;
        const eggN = Math.ceil(miss / (egg.l * egg.dig * 0.65) * 2) / 2;
        hint = ` ≈ ${fmt(skG)} g de skyr ou ${fmt(eggN, eggN % 1 ? 1 : 0)} œuf${eggN > 1 ? 's' : ''}`;
      }
      out.push(`<b>Leucine corrigée ${fmt(g.v, 2)} g</b> : il manque ${fmt(miss, 2)} g${hint}.`);
    } else if (g.key === 'kcal') {
      out.push(`<b>Énergie ${fmt(g.v)} kcal</b> : ${fmt(g.min - g.v)} kcal sous le plancher du repas.`);
    }
  }
  return out;
}

// ── Bol : rendu ──
function gaugeHtml(g) {
  const pct = v => Math.max(0, Math.min(100, v / g.domain * 100));
  let zones = '';
  const seg = (a, b, cls) => { if (b > a) zones += `<div class="g-zone ${cls}" style="left:${pct(a)}%;width:${pct(b) - pct(a)}%"></div>`; };
  if (g.min != null) seg(0, g.min, 'z-low');
  const okStart = g.min != null ? g.min : 0;
  if (g.max != null) { seg(okStart, g.max, 'z-ok'); seg(g.max, g.red ?? g.domain, 'z-warn'); if (g.red != null) seg(g.red, g.domain, 'z-over'); }
  else seg(okStart, g.domain, 'z-ok');
  const d = g.key === 'leu' ? 2 : 0;
  let rule = '';
  if (g.key === 'leu') rule = `seuil ≥ ${fmt(g.min, 1)} g`;
  else if (g.min != null) rule = `vert ${fmt(g.min)}–${fmt(g.max)} ${g.unit}`;
  else rule = `vert ≤ ${fmt(g.max)} ${g.unit} · rouge > ${fmt(g.red)}`;
  return `<div class="g-row">
    <div class="g-head"><span class="g-name">${g.label}</span><span class="g-val l-${g.level}">${fmt(g.v, d)} ${g.unit}</span></div>
    <div class="g-track"><div class="g-zones">${zones}</div><div class="g-marker" style="left:${pct(g.v)}%"></div></div>
    <div class="g-sub">${rule}</div>
  </div>`;
}

function unitLabel(f, g) {
  if (!f.unit) return f.state === 'liquide' ? 'ml' : 'g';
  const c = g / num(f.unit.g);
  if (c <= 0) return '0 ' + f.unit.s;
  const r = Math.round(c);
  if (Math.abs(c - r) < 0.08) return `${r} ${r > 1 ? f.unit.p : f.unit.s}`;
  return `≈ ${fmt(c, 1)} ${c > 1 ? f.unit.p : f.unit.s}`;
}
const inputVal = g => String(Math.round(num(g) * 10) / 10);

  c.innerHTML = html;
}

// ── Bol : actions ──
function bolSetMeal(id) { leuActiveMeal = id; renderBol(); }
function bolSetGrams(idx, val) {
  const arr = leuMeals[leuActiveMeal]; if (!arr || !arr[idx]) return;
  arr[idx].grams = Math.max(0, Math.round(num(String(val).replace(',', '.')) * 10) / 10);
  saveLeuMeals(); renderBol();
}
function bolStep(idx, dir) {
  const arr = leuMeals[leuActiveMeal]; if (!arr || !arr[idx]) return;
  const f = foodsById[arr[idx].id]; if (!f) return;
  const step = f.unit ? num(f.unit.g) : (f.p <= 30 ? 5 : 10);
  const units = Math.round(num(arr[idx].grams) / step);
  arr[idx].grams = Math.max(0, Math.round((units + dir) * step * 10) / 10);
  saveLeuMeals(); renderBol();
}
function bolRemove(idx) { const arr = leuMeals[leuActiveMeal]; if (arr) { arr.splice(idx, 1); saveLeuMeals(); renderBol(); } }
function bolClear() {
  if (!(leuMeals[leuActiveMeal] || []).length) return;
  if (!confirm('Vider ce repas ?')) return;
  leuMeals[leuActiveMeal] = []; saveLeuMeals(); renderBol();
}
function bolScale(factor) {
  const arr = leuMeals[leuActiveMeal] || []; let n = 0;
  arr.forEach(it => { const f = foodsById[it.id]; if (f && VEG_CATS.includes(f.c)) { it.grams = Math.round(num(it.grams) * factor); n++; } });
  if (!n) return showToast('Aucun légume ni féculent dans ce repas');
  saveLeuMeals(); renderBol();
}
function findTemplate(id) {
  return userTemplates.find(tp => tp.id === id) || ((routine && routine.meal_templates) || []).find(tp => tp.id === id) || null;
}
function bolLoadTemplate() {
  const sel = document.getElementById('tplSelect'); const tp = sel && findTemplate(sel.value);
  if (!tp) return showToast('Choisis un modèle');
  if ((leuMeals[leuActiveMeal] || []).length && !confirm(`Remplacer le repas actuel par « ${tp.name} » ?`)) return;
  leuMeals[leuActiveMeal] = tp.items.map(i => ({ id: i.id, grams: num(i.g) }));
  saveLeuMeals(); renderBol(); showToast('Modèle chargé');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function bolSaveTemplate() {
  const items = (leuMeals[leuActiveMeal] || []).filter(i => num(i.grams) > 0);
  if (!items.length) return showToast('Repas vide');
  const name = prompt('Nom du modèle :', `${mealCfg(leuActiveMeal).label} — mon bol`);
  if (!name) return;
  userTemplates.push({ id: 'u' + Date.now(), meal: leuActiveMeal, name: name.trim(), items: items.map(i => ({ id: i.id, g: num(i.grams) })) });
  saveTemplates(); renderBol(); showToast('Modèle enregistré');
}
function bolDeleteTemplate() {
  const sel = document.getElementById('tplSelect'); const id = sel && sel.value;
  const i = userTemplates.findIndex(tp => tp.id === id);
  if (i < 0) return showToast('Sélectionne d’abord un de tes modèles ★');
  if (!confirm(`Supprimer « ${userTemplates[i].name} » ?`)) return;
  userTemplates.splice(i, 1); saveTemplates(); renderBol();
}

function leuShowSearch() {
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const overlay = document.createElement('div');
  overlay.className = 'leu-search-overlay'; overlay.id = 'leuSearchOverlay';
  overlay.onclick = e => { if (e.target === overlay) leuCloseSearch(); };
  const panel = document.createElement('div'); panel.className = 'leu-search-panel';
  const input = document.createElement('input'); input.className = 'leu-search-input'; input.placeholder = 'Rechercher un aliment…'; input.type = 'text';
  const results = document.createElement('div'); results.className = 'leu-search-results';
  function renderResults(q) {
    const query = norm(q);
    const filtered = query ? foodList.filter(f => norm(f.n).includes(query) || norm(f.c).includes(query)) : foodList;
    results.innerHTML = filtered.slice(0, 120).map(f => {
      const g = f.unit ? num(f.unit.g) : f.p, k = g / 100;

    }).join('') || '<div style="text-align:center;padding:20px;color:var(--text-muted)">Aucun résultat</div>';

// ── Journal reflux ──
function logMeal(mealId) {
  const items = (leuMeals[mealId] || []).filter(i => num(i.grams) > 0 && foodsById[i.id]);
  if (!items.length) return showToast('Repas vide');
  const t = computeMeal(mealId, items);
  const now = Date.now();
  journal.entries.push({
    id: 'm' + now, type: 'meal', ts: now, meal: mealId,
    items: items.map(i => ({ id: i.id, g: Math.round(num(i.grams) * 10) / 10 })),
    totals: { massEff: Math.round(t.massEff), solids: Math.round(t.solids), liquids: Math.round(t.liquids), fat: Math.round(t.fat * 10) / 10,
      kcal: Math.round(t.kcal), prot: Math.round(t.prot * 10) / 10, leu: Math.round(t.leu * 100) / 100, mx: Math.round(t.mx) },
    verdict: t.verdict, symptom: null,

  showToast('Repas noté — je te demanderai comment il passe');
}
function draftFrom(sym) {
  return sym ? { score: sym.score, loc: [...(sym.loc || [])], ctx: [...(sym.ctx || [])], note: sym.note || '' } : { score: null, loc: [], ctx: [], note: '' };
}
function openSymptomFor(id) {

  jOpenId = id; jDraft = draftFrom(e.symptom);

}
function localDT(ts) { return `${dayStr(ts)}T${timeStr(ts)}`; }
function jNewSymptom() { jOpenId = 'new'; jDraft = { ...draftFrom(null), when: localDT(Date.now()) }; renderJournal(); window.scrollTo(0, 0); }
function jToggleOpen(id) {
  if (jOpenId === id) { jOpenId = null; jDraft = null; }
  else { const e = journal.entries.find(x => x.id === id); jOpenId = id; jDraft = draftFrom(e && e.symptom); }
  renderJournal();
}
function jSet(key, val) { if (!jDraft) return; jDraft[key] = val; renderJournal(); }
function jToggle(key, i) {
  if (!jDraft) return;
  const list = key === 'loc' ? LOC_TAGS : CTX_TAGS, v = list[i], arr = jDraft[key];
  const at = arr.indexOf(v); if (at >= 0) arr.splice(at, 1); else arr.push(v);

}
function jCancel() { jOpenId = null; jDraft = null; renderJournal(); }
function jSave() {

}
function jSetTime(id, hhmm) {

function analysisHtml() {
  const rated = journal.entries.filter(e => e.type === 'meal' && e.symptom && e.totals);
  const free = journal.entries.filter(e => e.type === 'symptom');
  let h = `<div class="daily-summary"><div class="summary-title">📈 Analyse</div>`;
  if (rated.length < 6) {
    h += `<div class="j-note">Disponible à partir de 6 repas notés (${rated.length}/6). Chaque note compte, y compris les 0.</div>`;
  } else {
    const order = ['ok', 'low', 'warn', 'over'];
    h += `<table class="j-table"><tr><th>Verdict du bol</th><th>Repas</th><th>Moy.</th><th>≥ 3</th></tr>`;
    order.forEach(v => {
      const g = rated.filter(e => e.verdict === v); if (!g.length) return;
      const mean = g.reduce((a, e) => a + e.symptom.score, 0) / g.length;
      const hi = g.filter(e => e.symptom.score >= 3).length / g.length * 100;
      h += `<tr><td><span class="dot v-${v}"></span>${VERDICT_TXT[v][0]}</td><td>${g.length}</td><td>${fmt(mean, 1)}</td><td>${fmt(hi)} %</td></tr>`;
    });
    h += `</table>${scatterSvg(rated)}`;
  }
  if (free.length) {
    const night = free.filter(e => { const hh = new Date(e.ts).getHours(); return hh >= 22 || hh < 7; }).length;
    h += `<div class="j-note" style="margin-top:8px">Brûlures signalées hors repas : ${free.length} (dont ${night} entre 22 h et 7 h).</div>`;
  }
  return h + `</div>`;
}
function scatterSvg(rated) {
  const W = 320, H = 210, L = 34, B = 26, T = 8, R = 8;
  const xMax = Math.ceil(Math.max(1200, ...rated.map(e => e.totals.massEff * 1.05)) / 400) * 400;
  const yMax = Math.ceil(Math.max(60, ...rated.map(e => e.totals.fat * 1.05)) / 20) * 20;
  const X = v => L + v / xMax * (W - L - R), Y = v => H - B - v / yMax * (H - B - T);
  const col = s => s === 0 ? '#7CAA6E' : s <= 3 ? '#D9963A' : '#C47A6A';
  let s = `<svg class="j-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Repas selon remplissage et graisses">`;
  for (let i = 0; i <= 4; i++) {
    const xv = xMax * i / 4, yv = yMax * i / 4;
    s += `<line x1="${X(xv)}" y1="${T}" x2="${X(xv)}" y2="${H - B}" stroke="#E8E0D4" stroke-width="1"/><text x="${X(xv)}" y="${H - B + 13}" font-size="9" text-anchor="middle" fill="#8C7E6A">${Math.round(xv)}</text>`;
    s += `<line x1="${L}" y1="${Y(yv)}" x2="${W - R}" y2="${Y(yv)}" stroke="#E8E0D4" stroke-width="1"/><text x="${L - 4}" y="${Y(yv) + 3}" font-size="9" text-anchor="end" fill="#8C7E6A">${Math.round(yv)}</text>`;
  }
  const r2 = mealCfg('r2');
  if (r2.mass_g && r2.fat_g) {
    s += `<line x1="${X(r2.mass_g.max)}" y1="${T}" x2="${X(r2.mass_g.max)}" y2="${H - B}" stroke="#8C7E6A" stroke-dasharray="3 3"/>`;
    s += `<line x1="${L}" y1="${Y(r2.fat_g.max)}" x2="${W - R}" y2="${Y(r2.fat_g.max)}" stroke="#8C7E6A" stroke-dasharray="3 3"/>`;
    s += `<text x="${X(r2.mass_g.max) + 3}" y="${T + 9}" font-size="9" fill="#8C7E6A">vert R2</text>`;
  }
  rated.forEach(e => { s += `<circle cx="${X(e.totals.massEff)}" cy="${Y(e.totals.fat)}" r="5" fill="${col(e.symptom.score)}" fill-opacity="0.85" stroke="#fff" stroke-width="1"/>`; });
  s += `<text x="${(W + L) / 2}" y="${H - 2}" font-size="9" text-anchor="middle" fill="#8C7E6A">Remplissage (g)</text>`;
  s += `<text x="10" y="${(H - B) / 2}" font-size="9" text-anchor="middle" fill="#8C7E6A" transform="rotate(-90 10 ${(H - B) / 2})">Graisses (g)</text></svg>`;
  s += `<div class="j-legend"><span><i style="background:#7CAA6E"></i>0</span><span><i style="background:#D9963A"></i>1–3</span><span><i style="background:#C47A6A"></i>≥ 4</span></div>`;
  return s;
}

    <div class="j-note">Note chaque repas depuis l’onglet Bol (« J’ai mangé »), puis la brûlure éventuelle une à deux heures après : un 0 compte autant qu’un 8. Les brûlures de la nuit ou du matin se signalent ici.</div>

function exportJournalCsv() {
  if (!journal.entries.length) return showToast('Journal vide');

  [...journal.entries].sort((a, b) => a.ts - b.ts).forEach(e => {
    const t = e.totals || {}, s = e.symptom || {};
    const items = (e.items || []).map(i => { const f = foodsById[i.id]; return `${f ? shortName(f.n) : i.id} ${i.g} g`; }).join(' | ');
    const meal = e.type === 'meal' ? mealCfg(e.meal).label : (e.mealRef ? 'après ' + ((journal.entries.find(x => x.id === e.mealRef) || {}).meal || '') : '');
    rows.push([dayStr(e.ts), timeStr(e.ts), e.type === 'meal' ? 'repas' : 'brûlure', meal, e.verdict || '', t.massEff ?? '', t.solids ?? '', t.liquids ?? '', t.fat ?? '', t.kcal ?? '', t.prot ?? '', t.leu ?? '', t.mx ?? '',
      s.score ?? '', (s.loc || []).join(', '), (s.ctx || []).join(', '), s.note || '', items]);
  });
  const csv = rows.map(r => r.map(v => { const x = String(v); return /[";\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(';')).join('\n');
  downloadText('﻿' + csv, `journal-reflux-${todayStr()}.csv`, 'text/csv');
  showToast('Journal exporté');
}

// ── Actions ──
function exportBackup() {
  const data = {
    type: 'nutrition-tracker-backup',
    version: '1.1',
    exportDate: new Date().toISOString(),
    routineVersion: routine?.meta?.version || '?',
    tracking: tracking,
    bol: leuMeals,
    templates: userTemplates,
    journal: journal
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `nutrition-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup exporté');
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.type !== 'nutrition-tracker-backup') throw new Error('Format invalide');
      tracking = data.tracking || {};
      saveTracking();
      if (data.bol && typeof data.bol === 'object') {
        MEAL_IDS.forEach(m => { leuMeals[m] = Array.isArray(data.bol[m]) ? data.bol[m].filter(i => i && i.id).map(i => ({ id: i.id, grams: num(i.grams) })) : []; });
        saveLeuMeals();
      }
      if (Array.isArray(data.templates)) { userTemplates = data.templates; saveTemplates(); }
      if (data.journal && Array.isArray(data.journal.entries)) { journal = data.journal; saveJournal(); }
      render();
      showToast(`Backup importé (${Object.keys(tracking).length} jours, ${journal.entries.length} entrées journal)`);
    } catch(err) {
      showToast('Erreur: fichier invalide');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function clearDay() {
  if (!confirm(`Effacer les données d'aujourd'hui (${formatDateLabel(currentDate)}) ?`)) return;
  delete tracking[currentDate];
  saveTracking();
  render();
  showToast('Jour effacé');
}

async function refreshRoutine() {
  await loadRoutine();
  render();
  showToast('Routine rechargée');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Les onglets restent collés juste sous l'en-tête, quelle que soit sa hauteur
function syncStickyOffset() {
  const h = document.querySelector('.header'), nav = document.getElementById('navTabs');
  if (h && nav) nav.style.top = h.offsetHeight + 'px';
}
window.addEventListener('resize', syncStickyOffset);

// ── Tabs ──
function setActiveTab(tab) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
}

document.getElementById('navTabs').addEventListener('click', (e) => {
  const tab = e.target.dataset.tab;
  if (!tab) return;
  currentTab = tab;
  setActiveTab(tab);
  render();
});

// ── Init ──
async function init() {
  loadTracking();
  loadJournal();
  await Promise.all([loadRoutine(), loadBaseNutritionelle()]);
  render();
}

init();
</script>
