<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nutrition Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #FAF7F2;
  --bg-card: #FFFFFF;
  --bg-card-alt: #F5F0E8;
  --text: #2C2416;
  --text-muted: #8C7E6A;
  --text-light: #B5A898;
  --accent: #D4A574;
  --accent-dark: #B8854A;
  --accent-light: #F0DCC8;
  --green: #7CAA6E;
  --green-light: #E8F2E4;
  --green-bg: #D4E8CC;
  --red: #C47A6A;
  --red-light: #F5E0DA;
  --blue: #6A94B8;
  --blue-light: #DDE9F2;
  --border: #E8E0D4;
  --shadow: 0 2px 8px rgba(44,36,22,0.06);
  --shadow-lg: 0 4px 16px rgba(44,36,22,0.1);
  --radius: 14px;
  --radius-sm: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: 'DM Sans', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
  -webkit-tap-highlight-color: transparent;
}

/* Header */
.header {
  background: linear-gradient(135deg, #3D3024 0%, #2C2416 100%);
  color: #FAF7F2;
  padding: 20px 16px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
.header-version {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  background: rgba(255,255,255,0.12);
  padding: 3px 8px;
  border-radius: 20px;
  color: var(--accent-light);
}
.header-date {
  font-size: 0.85rem;
  color: var(--accent);
  font-weight: 500;
}
.header-macros {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.macro-pill {
  flex: 1;
  text-align: center;
  padding: 6px 4px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.08);
  font-size: 0.72rem;
  line-height: 1.3;
}
.macro-pill .val {
  display: block;
  font-weight: 700;
  font-size: 0.95rem;
  font-family: 'DM Mono', monospace;
}
.macro-pill .lbl { color: var(--accent-light); }
.macro-pill.highlight { background: rgba(212,165,116,0.2); }

/* Navigation tabs */
.nav-tabs {
  display: flex;
  gap: 4px;
  padding: 8px 16px;
  background: var(--bg);
  position: sticky;
  top: 94px;
  z-index: 99;
  border-bottom: 1px solid var(--border);
}
.nav-tab {
  flex: 1;
  padding: 8px 4px;
  text-align: center;
  font-size: 0.78rem;
  font-weight: 600;
  border: none;
  background: transparent;
  color: var(--text-muted);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
}
.nav-tab.active {
  background: var(--text);
  color: var(--bg);
}

/* Content */
.content { padding: 12px 12px; }

/* Meal Card */
.meal-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
  border: 1px solid var(--border);
  transition: box-shadow 0.2s;
}
.meal-card.completed {
  border-color: var(--green);
  background: linear-gradient(135deg, var(--bg-card) 90%, var(--green-light) 100%);
}
.meal-header {
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
}
.meal-header:active { background: var(--bg-card-alt); }
.meal-left { flex: 1; }
.meal-time {
  font-family: 'DM Mono', monospace;
  font-size: 0.8rem;
  color: var(--accent-dark);
  font-weight: 500;
}
.meal-name { font-size: 1rem; font-weight: 600; margin-top: 2px; }
.meal-right { text-align: right; }
.meal-kcal {
  font-family: 'DM Mono', monospace;
  font-size: 0.95rem;
  font-weight: 700;
}
.meal-macros-mini {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 2px;
}
.leucine-badge {
  display: inline-block;
  font-size: 0.6rem;
  font-weight: 700;
  background: var(--green-bg);
  color: var(--green);
  padding: 2px 6px;
  border-radius: 10px;
  margin-top: 4px;
}
.meal-expand {
  color: var(--text-light);
  font-size: 1.2rem;
  margin-left: 10px;
  transition: transform 0.2s;
}
.meal-card.open .meal-expand { transform: rotate(180deg); }

.meal-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}
.meal-card.open .meal-body { max-height: 2000px; }

.meal-items { padding: 0 16px 14px; }

/* Item row */
.item-row {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid var(--border);
  gap: 10px;
}
.item-check {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  font-size: 0.8rem;
  color: transparent;
}
.item-check.checked {
  background: var(--green);
  border-color: var(--green);
  color: white;
}
.item-info { flex: 1; min-width: 0; }
.item-name { font-size: 0.88rem; font-weight: 500; line-height: 1.3; }
.item-detail {
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-top: 2px;
  font-family: 'DM Mono', monospace;
}
.item-qty {
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--accent-dark);
  flex-shrink: 0;
  text-align: right;
  min-width: 50px;
}

/* Juice section */
.juice-section {
  margin: 0 16px 14px;
  padding: 10px 12px;
  background: var(--bg-card-alt);
  border-radius: var(--radius-sm);
}
.juice-title {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--green);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.juice-ingredients {
  font-size: 0.75rem;
  color: var(--text-muted);
  line-height: 1.5;
}

/* Rotation (diner) */
.rotation-section {
  margin: 0 16px 14px;
  padding: 10px 12px;
  background: var(--blue-light);
  border-radius: var(--radius-sm);
}
.rotation-title {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--blue);
  margin-bottom: 6px;
}
.rotation-options { display: flex; flex-wrap: wrap; gap: 6px; }
.rotation-opt {
  font-size: 0.72rem;
  padding: 5px 10px;
  background: var(--bg-card);
  border: 1.5px solid var(--blue);
  border-radius: 20px;
  cursor: pointer;
  color: var(--blue);
  font-weight: 500;
  transition: all 0.15s;
}
.rotation-opt.selected {
  background: var(--blue);
  color: white;
}

/* Progress bar */
.meal-progress {
  height: 3px;
  background: var(--border);
}
.meal-progress-fill {
  height: 100%;
  background: var(--green);
  transition: width 0.3s;
  border-radius: 0 3px 3px 0;
}

/* Notes */
.meal-notes {
  padding: 0 16px 10px;
  font-size: 0.72rem;
  color: var(--text-muted);
  font-style: italic;
  line-height: 1.4;
}

/* Supplements tab */
.supp-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.supp-check {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border);
  background: transparent; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; font-size: 0.8rem; color: transparent;
}
.supp-check.checked { background: var(--green); border-color: var(--green); color: white; }
.supp-info { flex: 1; }
.supp-name { font-size: 0.88rem; font-weight: 600; }
.supp-dose { font-size: 0.75rem; color: var(--text-muted); font-family: 'DM Mono', monospace; }
.supp-timing { font-size: 0.7rem; color: var(--accent-dark); margin-top: 2px; }

/* Interactions tab */
.interaction-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  font-size: 0.82rem;
  line-height: 1.5;
  color: var(--text);
}
.interaction-card::first-line { font-weight: 600; }

/* Changelog tab */
.changelog-entry {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.changelog-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.changelog-version {
  font-family: 'DM Mono', monospace;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--accent-dark);
}
.changelog-date { font-size: 0.75rem; color: var(--text-muted); }
.changelog-changes { list-style: none; padding: 0; }
.changelog-changes li {
  font-size: 0.78rem;
  padding: 4px 0;
  border-top: 1px solid var(--border);
  color: var(--text);
  line-height: 1.4;
}
.changelog-changes li::before {
  content: "→ ";
  color: var(--accent-dark);
  font-weight: 600;
}

/* Daily summary */
.daily-summary {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.summary-title {
  font-size: 0.85rem;
  font-weight: 700;
  margin-bottom: 10px;
  color: var(--text);
}
.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.82rem;
}
.summary-row:last-child { border: none; }
.summary-bar-container {
  width: 80px;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-left: 8px;
}
.summary-bar {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s;
}
.summary-bar.good { background: var(--green); }
.summary-bar.over { background: var(--red); }
.summary-bar.under { background: var(--accent); }

/* Notes textarea */
.daily-notes {
  width: 100%;
  min-height: 60px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem;
  resize: vertical;
  background: var(--bg-card);
  color: var(--text);
  margin-top: 8px;
}
.daily-notes::placeholder { color: var(--text-light); }

/* Settings / actions */
.action-bar {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.action-btn {
  flex: 1;
  min-width: 100px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}
.action-btn:active { background: var(--bg-card-alt); transform: scale(0.97); }
.action-btn.danger { border-color: var(--red); color: var(--red); }

/* Toast */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text);
  color: var(--bg);
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 0.82rem;
  font-weight: 500;
  z-index: 200;
  opacity: 0;
  transition: all 0.3s;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* Loading */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-size: 0.9rem;
}
.loading-spinner {
  width: 30px; height: 30px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Date nav */
.date-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 10px 16px;
  background: var(--bg);
}
.date-nav-btn {
  width: 34px; height: 34px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--bg-card);
  cursor: pointer;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
}
.date-nav-btn:active { background: var(--bg-card-alt); }
.date-nav-label {
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 12px;
  border-radius: var(--radius-sm);
}
.date-nav-label:active { background: var(--bg-card-alt); }

/* Status indicator */
.data-status {
  font-size: 0.65rem;
  font-family: 'DM Mono', monospace;
  color: var(--text-light);
  display: flex;
  align-items: center;
  gap: 4px;
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
}
.status-dot.cached { background: var(--accent); }
.status-dot.offline { background: var(--red); }
/* ── Leucine Calculator ── */
.leu-summary { background: var(--bg-card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.leu-summary-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
.leu-summary-stat .leu-val { font-family: 'DM Mono', monospace; font-size: 1.4rem; font-weight: 700; }
.leu-summary-stat .leu-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.leu-bar-row { margin-bottom: 6px; }
.leu-bar-label { display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 3px; color: var(--text-muted); }
.leu-bar-label .leu-bar-val { font-weight: 600; }
.leu-bar-label .leu-bar-val.ok { color: var(--green); }
.leu-bar-label .leu-bar-val.low { color: var(--red); }
.leu-bar-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.leu-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.leu-bar-fill.ok { background: var(--green); }
.leu-bar-fill.low { background: linear-gradient(90deg, var(--red), var(--accent)); }
.leu-meal-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.leu-meal-tab { flex: 1; padding: 8px 4px; font-size: 0.72rem; font-weight: 500; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); cursor: pointer; text-align: center; transition: all 0.2s; line-height: 1.3; font-family: 'DM Sans', sans-serif; }
.leu-meal-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.leu-meal-card { background: var(--bg-card); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); min-height: 80px; }
.leu-meal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.leu-meal-title { font-size: 0.88rem; font-weight: 600; color: var(--accent-dark); }
.leu-meal-totals { font-size: 0.75rem; color: var(--text-muted); font-family: 'DM Mono', monospace; }
.leu-item-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
.leu-item-info { flex: 1; min-width: 0; }
.leu-item-name { font-size: 0.82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.leu-item-detail { font-size: 0.7rem; color: var(--text-muted); font-family: 'DM Mono', monospace; }
.leu-item-qty { display: flex; align-items: center; gap: 4px; }
.leu-item-qty input { width: 50px; padding: 4px 6px; font-size: 0.82rem; font-family: 'DM Mono', monospace; background: var(--bg-card-alt); color: var(--text); border: 1px solid var(--border); border-radius: 6px; text-align: right; }
.leu-item-qty span { font-size: 0.7rem; color: var(--text-muted); }
.leu-item-remove { background: none; border: none; color: var(--red); opacity: 0.5; cursor: pointer; font-size: 1.1rem; padding: 0 4px; }
.leu-add-btn { width: 100%; padding: 10px; margin-top: 8px; background: var(--bg-card-alt); color: var(--accent-dark); border: 1px dashed var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.82rem; font-weight: 500; font-family: 'DM Sans', sans-serif; }
.leu-empty { color: var(--text-light); font-size: 0.82rem; text-align: center; padding: 20px 0; }
.leu-search-overlay { position: fixed; inset: 0; background: rgba(44,36,22,0.5); z-index: 200; display: flex; flex-direction: column; padding: 50px 12px 12px; }
.leu-search-panel { background: var(--bg-card); border-radius: 16px; max-height: 75vh; display: flex; flex-direction: column; border: 1px solid var(--border); box-shadow: var(--shadow-lg); overflow: hidden; }
.leu-search-input { width: 100%; padding: 12px 14px; font-size: 0.92rem; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); border: none; border-bottom: 1px solid var(--border); outline: none; box-sizing: border-box; }
.leu-search-results { overflow-y: auto; flex: 1; }
.leu-search-item { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 10px 14px; background: none; border: none; border-bottom: 1px solid var(--border); color: var(--text); cursor: pointer; text-align: left; font-size: 0.82rem; font-family: 'DM Sans', sans-serif; }
.leu-search-item:active { background: var(--bg-card-alt); }
.leu-search-item-name { font-weight: 500; }
.leu-search-item-cat { font-size: 0.7rem; color: var(--text-muted); }
.leu-search-item-vals { text-align: right; white-space: nowrap; font-family: 'DM Mono', monospace; font-size: 0.75rem; }
.leu-search-item-leu { color: var(--green); }
.leu-search-item-leu.low { color: var(--text-muted); }
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <h1>🥬 Nutrition</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="data-status" id="dataStatus">
        <div class="status-dot"></div>
        <span>chargement…</span>
      </div>
      <div class="header-version" id="headerVersion">–</div>
    </div>
  </div>
  <div class="header-macros" id="headerMacros"></div>
</div>

<div class="nav-tabs" id="navTabs">
  <button class="nav-tab active" data-tab="meals">Repas</button>
  <button class="nav-tab" data-tab="suppl">Suppléments</button>
  <button class="nav-tab" data-tab="info">Infos</button>
  <button class="nav-tab" data-tab="data">Données</button>
  <button class="nav-tab" data-tab="leucine">Leucine</button>
</div>

<div id="dateNavContainer"></div>
<div class="content" id="mainContent">
  <div class="loading">
    <div class="loading-spinner"></div>
    Chargement de la routine…
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── State ──
let routine = null;
let currentDate = todayStr();
let currentTab = 'meals';
let tracking = {};

// ── Leucine calculator state ──
let baseNutritionelle = null;
let leuFoods = [];
let leuMeals = { r1: [], r2: [], collation: [], diner: [] };
let leuActiveMeal = 'r1';
const LEU_MEALS = [
  { id: 'r1', label: 'R1', time: '8h' },
  { id: 'r2', label: 'R2', time: '12h30' },
  { id: 'collation', label: 'Collation', time: '16h' },
  { id: 'diner', label: 'Dîner', time: '18h30' },
];
const LEU_THRESHOLD = 2.5;

async function loadBaseNutritionelle() {
  try {
    const resp = await fetch('base_nutritionnelle.json?v=' + Date.now());
    if (resp.ok) {
      baseNutritionelle = await resp.json();
      localStorage.setItem('nt-basenutri-cache', JSON.stringify(baseNutritionelle));
    }
  } catch(e) {}
  if (!baseNutritionelle) {
    try {
      const cached = localStorage.getItem('nt-basenutri-cache');
      if (cached) baseNutritionelle = JSON.parse(cached);
    } catch(e) {}
  }
  if (baseNutritionelle && baseNutritionelle.items) {
    leuFoods = [];
    for (const [, v] of Object.entries(baseNutritionelle.items)) {
      const leu = parseFloat(v['Leucine /100g (g)']) || 0;
      const pr = parseFloat(v['Prot (g/100g)']) || 0;
      if (leu > 0 || pr > 0) {
        leuFoods.push({ id: v.id || '', n: v.Aliment || '', p: parseFloat(v['Portion type (g)']) || 100, l: leu, pr: pr, c: v['Catégorie'] || '' });
      }
    }
    leuFoods.sort((a, b) => (a.l > 0 && b.l === 0) ? -1 : (a.l === 0 && b.l > 0) ? 1 : b.l - a.l);
  }
  try { const saved = localStorage.getItem('nt-leumeal-v1'); if (saved) leuMeals = JSON.parse(saved); } catch(e) {}
}
function saveLeuMeals() { localStorage.setItem('nt-leumeal-v1', JSON.stringify(leuMeals)); }

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDateLabel(ds) {
  const t = todayStr();
  if (ds === t) return "Aujourd'hui";
  const d = new Date(ds + 'T12:00:00');
  const opts = { weekday: 'long', day: 'numeric', month: 'long' };
  const label = d.toLocaleDateString('fr-FR', opts);
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  const ys = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;
  if (ds === ys) return "Hier";
  return label.charAt(0).toUpperCase() + label.slice(1);
}

// ── Data loading ──
async function loadRoutine() {
  // Try fetch from same domain
  try {
    const resp = await fetch('routine_alimentaire.json?v=' + Date.now());
    if (resp.ok) {
      routine = await resp.json();
      localStorage.setItem('nt-routine-cache', JSON.stringify(routine));
      updateStatus('live');
      return;
    }
  } catch(e) {}
  
  // Fallback: cached version
  try {
    const cached = localStorage.getItem('nt-routine-cache');
    if (cached) {
      routine = JSON.parse(cached);
      updateStatus('cached');
      return;
    }
  } catch(e) {}
  
  updateStatus('offline');
}

function updateStatus(mode) {
  const el = document.getElementById('dataStatus');
  const dot = el.querySelector('.status-dot');
  const span = el.querySelector('span');
  dot.className = 'status-dot' + (mode === 'cached' ? ' cached' : mode === 'offline' ? ' offline' : '');
  span.textContent = mode === 'live' ? 'à jour' : mode === 'cached' ? 'cache' : 'hors ligne';
}

// ── Tracking persistence ──
function loadTracking() {
  try {
    const raw = localStorage.getItem('nt-tracking-v1');
    if (raw) tracking = JSON.parse(raw);
  } catch(e) { tracking = {}; }
}

function saveTracking() {
  localStorage.setItem('nt-tracking-v1', JSON.stringify(tracking));
}

function getDayData(date) {
  if (!tracking[date]) tracking[date] = { items: {}, suppl: {}, rotation: null, notes: '' };
  return tracking[date];
}

function toggleItem(date, mealId, itemIdx) {
  const day = getDayData(date);
  const key = `${mealId}:${itemIdx}`;
  day.items[key] = !day.items[key];
  saveTracking();
  render();
}

function toggleSuppl(date, idx) {
  const day = getDayData(date);
  const key = `supp:${idx}`;
  day.suppl[key] = !day.suppl[key];
  saveTracking();
  render();
}

function setRotation(date, rotIdx) {
  const day = getDayData(date);
  day.rotation = day.rotation === rotIdx ? null : rotIdx;
  saveTracking();
  render();
}

function setNotes(date, text) {
  const day = getDayData(date);
  day.notes = text;
  saveTracking();
}

// ── Rendering ──
function render() {
  if (!routine) {
    document.getElementById('mainContent').innerHTML = `<div class="loading"><div class="loading-spinner"></div>Aucune donnée disponible</div>`;
    return;
  }
  
  document.getElementById('headerVersion').textContent = 'v' + routine.meta.version;
  renderHeaderMacros();
  renderDateNav();
  
  switch(currentTab) {
    case 'meals': renderMeals(); break;
    case 'suppl': renderSupplements(); break;
    case 'info': renderInfo(); break;
    case 'data': renderData(); break;
      case 'leucine': renderLeucine(); break;
  }
}

function renderHeaderMacros() {
  const day = getDayData(currentDate);
  const consumed = calcConsumedMacros(day);
  const targets = routine.daily_totals.confirmed;
  
  const macros = [
    { lbl: 'Kcal', val: consumed.kcal, target: targets.kcal, unit: '' },
    { lbl: 'Prot', val: consumed.protein, target: targets.protein_g, unit: 'g' },
    { lbl: 'Gluc', val: consumed.carb, target: targets.carb_g, unit: 'g' },
    { lbl: 'Lip', val: consumed.fat, target: targets.fat_g, unit: 'g' },
  ];
  
  document.getElementById('headerMacros').innerHTML = macros.map((m, i) => `
    <div class="macro-pill${i===0?' highlight':''}">
      <span class="val">${Math.round(m.val)}</span>
      <span class="lbl">/ ${Math.round(m.target)}${m.unit} ${m.lbl}</span>
    </div>
  `).join('');
}

function calcConsumedMacros(day) {
  let protein = 0, carb = 0, fat = 0, kcal = 0;
  if (!routine) return { protein, carb, fat, kcal };
  
  for (const meal of routine.meals) {
    const items = meal.items || meal.fixed_items || [];
    items.forEach((item, idx) => {
      if (day.items[`${meal.id}:${idx}`]) {
        protein += item.protein_g || 0;
        carb += item.carb_g || 0;
        fat += item.fat_g || 0;
        kcal += item.kcal || 0;
      }
    });
    // Juice
    if (meal.juice && day.items[`${meal.id}:juice`]) {
      protein += meal.juice.protein_g || 0;
      carb += meal.juice.carb_g || 0;
      fat += meal.juice.fat_g || 0;
      kcal += meal.juice.kcal || 0;
    }
    // Protein rotation for dinner
    if (meal.protein_source_rotation && day.rotation !== null) {
      const rot = meal.protein_source_rotation[day.rotation];
      if (rot && day.items[`${meal.id}:rotation`]) {
        protein += rot.protein_g || 0;
        carb += rot.carb_g || 0;
        fat += rot.fat_g || 0;
        kcal += rot.kcal || 0;
      }
    }
  }
  
  // Supplements (omega-3)
  for (const [i, s] of routine.supplements.entries()) {
    if (day.suppl[`supp:${i}`] && s.name.includes('Oméga')) {
      // Already counted in meal items (3 gélules R2 + 3 dîner)
    }
  }
  
  return { protein, carb, fat, kcal };
}

// ── Leucine Calculator ──
function leuCalc(food, grams) {
  return { leu: (food.l / 100) * grams, prot: (food.pr / 100) * grams };
}
function leuMealTotals(mealId) {
  const items = leuMeals[mealId] || [];
  let leu = 0, prot = 0;
  items.forEach(i => { const c = leuCalc(i, i.grams); leu += c.leu; prot += c.prot; });
  return { leu, prot };
}

function renderLeucine() {
  if (!leuFoods.length) {
    document.getElementById('mainContent').innerHTML = `<div class="loading">Base nutritionnelle non chargée.<br><small>Vérifier que base_nutritionnelle.json est déployé.</small></div>`;
    return;
  }
  let dayLeu = 0, dayProt = 0, thresholds = 0;
  const mealData = LEU_MEALS.map(m => {
    const t = leuMealTotals(m.id);
    dayLeu += t.leu; dayProt += t.prot;
    if (t.leu >= LEU_THRESHOLD) thresholds++;
    return { ...m, ...t };
  });

  let html = `<div class="leu-summary">
    <div class="leu-summary-header">
      <div class="leu-summary-stat"><div class="leu-label">PROTÉINES JOUR</div><div class="leu-val">${Math.round(dayProt)}g <span style="font-size:0.85rem;font-weight:400;color:var(--text-muted)">/ 136g</span></div></div>
      <div class="leu-summary-stat" style="text-align:right"><div class="leu-label">STIMULATIONS</div><div class="leu-val">${thresholds} <span style="font-size:0.85rem;font-weight:400;color:var(--text-muted)">/ 3</span>${thresholds >= 3 ? ' <span style="color:var(--green)">✓</span>' : ''}</div></div>
    </div>`;
  mealData.forEach(m => {
    const pct = Math.min((m.leu / LEU_THRESHOLD) * 100, 100);
    const ok = m.leu >= LEU_THRESHOLD;
    html += `<div class="leu-bar-row"><div class="leu-bar-label"><span>${m.label} — ${m.time}</span><span class="leu-bar-val ${ok?'ok':'low'}">${m.leu.toFixed(2)}g ${ok ? '✓' : '(−'+(LEU_THRESHOLD-m.leu).toFixed(2)+'g)'}</span></div><div class="leu-bar-track"><div class="leu-bar-fill ${ok?'ok':'low'}" style="width:${pct}%"></div></div></div>`;
  });
  html += `</div>`;

  html += `<div class="leu-meal-tabs">`;
  LEU_MEALS.forEach(m => {
    html += `<button class="leu-meal-tab${leuActiveMeal===m.id?' active':''}" onclick="leuSetMeal('${m.id}')">${m.label}<br><span style="font-size:0.65rem;opacity:0.7">${m.time}</span></button>`;
  });
  html += `</div>`;

  const active = LEU_MEALS.find(m => m.id === leuActiveMeal);
  const activeT = leuMealTotals(leuActiveMeal);
  const items = leuMeals[leuActiveMeal] || [];
  html += `<div class="leu-meal-card"><div class="leu-meal-header"><span class="leu-meal-title">${active.label} — ${active.time}</span><span class="leu-meal-totals">${activeT.prot.toFixed(1)}g prot · ${activeT.leu.toFixed(2)}g leu</span></div>`;
  if (!items.length) html += `<div class="leu-empty">Aucun aliment ajouté</div>`;
  items.forEach((item, idx) => {
    const c = leuCalc(item, item.grams);
    html += `<div class="leu-item-row"><div class="leu-item-info"><div class="leu-item-name">${item.n}</div><div class="leu-item-detail">${c.prot.toFixed(1)}g prot · ${c.leu.toFixed(2)}g leu</div></div><div class="leu-item-qty"><input type="number" value="${item.grams}" onchange="leuUpdateGrams(${idx},this.value)"><span>g</span></div><button class="leu-item-remove" onclick="leuRemoveItem(${idx})">×</button></div>`;
  });
  html += `<button class="leu-add-btn" onclick="leuShowSearch()">+ Ajouter un aliment</button></div>`;
  html += `<div style="margin-top:12px"><button class="action-btn" onclick="leuReset()">Réinitialiser</button></div>`;
  document.getElementById('mainContent').innerHTML = html;
}

function leuSetMeal(id) { leuActiveMeal = id; renderLeucine(); }
function leuAddItem(food) {
  if (!leuMeals[leuActiveMeal]) leuMeals[leuActiveMeal] = [];
  leuMeals[leuActiveMeal].push({ ...food, grams: food.p });
  saveLeuMeals(); leuCloseSearch(); renderLeucine();
}
function leuUpdateGrams(idx, val) {
  const g = parseFloat(val) || 0;
  if (leuMeals[leuActiveMeal] && leuMeals[leuActiveMeal][idx]) {
    leuMeals[leuActiveMeal][idx].grams = Math.max(0, g);
    saveLeuMeals(); renderLeucine();
  }
}
function leuRemoveItem(idx) {
  if (leuMeals[leuActiveMeal]) { leuMeals[leuActiveMeal].splice(idx, 1); saveLeuMeals(); renderLeucine(); }
}
function leuReset() {
  if (!confirm('Réinitialiser tous les repas du calculateur leucine ?')) return;
  leuMeals = { r1: [], r2: [], collation: [], diner: [] };
  saveLeuMeals(); renderLeucine(); showToast('Calculateur réinitialisé');
}
function leuShowSearch() {
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const overlay = document.createElement('div');
  overlay.className = 'leu-search-overlay'; overlay.id = 'leuSearchOverlay';
  overlay.onclick = e => { if (e.target === overlay) leuCloseSearch(); };
  const panel = document.createElement('div'); panel.className = 'leu-search-panel';
  const input = document.createElement('input'); input.className = 'leu-search-input'; input.placeholder = 'Rechercher un aliment…'; input.type = 'text';
  const results = document.createElement('div'); results.className = 'leu-search-results';
  function renderResults(q) {
    const query = norm(q);
    const filtered = query ? leuFoods.filter(f => norm(f.n).includes(query) || norm(f.c).includes(query)) : leuFoods;
    results.innerHTML = filtered.map(f => {
      const lp = (f.l*f.p/100).toFixed(2), pp = (f.pr*f.p/100).toFixed(1);
      return `<button class="leu-search-item" data-fid="${f.id}"><div><div class="leu-search-item-name">${f.n}</div><div class="leu-search-item-cat">${f.c} · ${f.p}g</div></div><div class="leu-search-item-vals"><div class="leu-search-item-leu${f.l>1.5?'':' low'}">${lp}g leu</div><div style="color:var(--text-muted);font-size:0.7rem">${pp}g prot</div></div></button>`;
    }).join('') || '<div style="text-align:center;padding:20px;color:var(--text-muted)">Aucun résultat</div>';
  }
  input.oninput = () => renderResults(input.value);
  results.onclick = e => { const btn = e.target.closest('.leu-search-item'); if (!btn) return; const food = leuFoods.find(f => f.id === btn.dataset.fid); if (food) leuAddItem(food); };
  panel.appendChild(input); panel.appendChild(results); overlay.appendChild(panel);
  document.body.appendChild(overlay); renderResults('');
  setTimeout(() => input.focus(), 100);
}
function leuCloseSearch() { const el = document.getElementById('leuSearchOverlay'); if (el) el.remove(); }

// ── Actions ──
function exportBackup() {
  const data = {
    type: 'nutrition-tracker-backup',
    version: '1.0',
    exportDate: new Date().toISOString(),
    routineVersion: routine?.meta?.version || '?',
    tracking: tracking
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `nutrition-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup exporté');
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.type !== 'nutrition-tracker-backup') throw new Error('Format invalide');
      tracking = data.tracking || {};
      saveTracking();
      render();
      showToast(`Backup importé (${Object.keys(tracking).length} jours)`);
    } catch(err) {
      showToast('Erreur: fichier invalide');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function clearDay() {
  if (!confirm(`Effacer les données d'aujourd'hui (${formatDateLabel(currentDate)}) ?`)) return;
  delete tracking[currentDate];
  saveTracking();
  render();
  showToast('Jour effacé');
}

async function refreshRoutine() {
  await loadRoutine();
  render();
  showToast('Routine rechargée');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Tabs ──
function setActiveTab(tab) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
}

document.getElementById('navTabs').addEventListener('click', (e) => {
  const tab = e.target.dataset.tab;
  if (!tab) return;
  currentTab = tab;
  setActiveTab(tab);
  render();
});

// ── Init ──
async function init() {
  loadTracking();
  await Promise.all([loadRoutine(), loadBaseNutritionelle()]);
  render();
}

init();
</script>
</body>
