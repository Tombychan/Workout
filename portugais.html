*pior** | grande → **maior** | pequeno → **mais pequeno** (Portugal) / *menor* |\n| bem → **melhor** | mal → **pior** | | |\nAu Portugal, *mais pequeno* est la forme courante ; *menor* s'emploie surtout pour l'âge ou dans un registre soutenu.\n\n**Superlatif relatif** : article + *mais / menos* + adj. + *de* : *É a cidade mais bonita de Portugal. É o melhor restaurante da rua.*\n\n**Superlatif absolu** : *muito* + adj. (*muito caro*) ou suffixe **-íssimo** : *caríssimo, lindíssimo, muitíssimo* ; formes savantes : *facílimo, dificílimo, ótimo, péssimo*.","ex":[{"pt":"Lisboa é maior do que o Porto.","fr":"Lisbonne est plus grande que Porto."},{"pt":"Este vinho é melhor que aquele.","fr":"Ce vin est meilleur que celui-là."},{"pt":"Ela fala tão bem como tu.","fr":"Elle parle aussi bien que toi."},{"pt":"É o restaurante mais caro da cidade.","fr":"C'est le restaurant le plus cher de la ville."},{"pt":"O exame foi facílimo.","fr":"L'examen était très facile."}],"pit":["Jamais *mais bom* : on dit *melhor*.","« Le plus … de » : *de* (contracté) — *o mais alto da turma*.","*Tão … como* pour l'égalité, et non *tão … que* (qui marque la conséquence : *tão cansado que adormeci*)."],"qs":[{"t":"fill","q":"O Pedro é mais alto ___ o irmão. (que)","e":"Supériorité : mais … do que (ou que).","a":["do que","que"]},{"t":"fill","q":"Este café é ___ que aquele. (meilleur)","e":"bom → melhor.","a":["melhor"]},{"t":"fill","q":"O tempo hoje está ___ do que ontem. (pire)","e":"mau → pior.","a":["pior"]},{"t":"fill","q":"Lisboa é ___ do que Coimbra. (plus grande)","e":"grande → maior.","a":["maior"]},{"t":"fill","q":"Ela é ___ simpática como a mãe. (aussi)","e":"Égalité : tão … como.","a":["tão"]},{"t":"fill","q":"Tenho ___ trabalho como tu. (autant de)","e":"tanto + nom masculin singulier.","a":["tanto"]},{"t":"fill","q":"É o restaurante mais barato ___ bairro. (du)","e":"Superlatif : de + o = do.","a":["do"]},{"t":"fill","q":"Este livro é ___. (très cher, en -íssimo)","e":"caro → caríssimo.","a":["caríssimo"]},{"t":"choice","q":"« Plus petit » au Portugal, dans l'usage courant :","e":"mais pequeno est courant au Portugal.","o":["mais pequeno","menos grande"],"c":0},{"t":"trans","q":"C'est la plus belle ville du Portugal.","e":"Portugal sans article : de Portugal.","a":["é a cidade mais bonita de portugal","é a mais bonita cidade de portugal"]}],"prod":{"c":"Comparez Caen et une ville portugaise que vous connaissez (taille, climat, prix, vie culturelle), avec comparatifs et superlatifs.","n":"6 phrases"}},{"id":"L30","lv":"A2","title":"Por ou para ?","obj":"Distinguer por et para, les deux traductions principales de « pour » et « par ».","refs":"EG §11.3-11.4, p. 120-121 ; UP §3.3.13, p. 75-79","expl":"| **para** | **por** |\n| but, destinataire : *Isto é para ti. Estudo para aprender.* | cause, motif : *Obrigado pelo presente. Por causa da chuva.* |\n| destination : *Vou para Lisboa* (pour y rester). | passage, lieu traversé : *Passei por Coimbra. Andei pela cidade.* |\n| échéance : *O trabalho é para sexta-feira.* | durée approximative, moment vague : *por volta das oito, pela manhã* |\n| opinion : *Para mim, é caro.* | moyen, agent : *por email ; escrito por Saramago* |\n| | échange, prix, fréquence : *Paguei dez euros por isto. Duas vezes por semana.* |\n\nContractions de *por* : *pelo, pela, pelos, pelas*.\n\n**Para + infinitif** = « pour + infinitif » (but) : *Vim para te ver.* **Por + infinitif** = « à faire » ou cause : *O trabalho está por fazer.*\n\n*Ir a* / *ir para* : *Vou a Lisboa* (aller-retour, court séjour) / *Vou para Lisboa* (destination durable ou retour chez soi).","ex":[{"pt":"Este presente é para a minha mãe.","fr":"Ce cadeau est pour ma mère."},{"pt":"Obrigado pela ajuda.","fr":"Merci pour l'aide."},{"pt":"Passámos pelo centro da cidade.","fr":"Nous sommes passés par le centre-ville."},{"pt":"Vou ao ginásio três vezes por semana.","fr":"Je vais à la salle de sport trois fois par semaine."},{"pt":"O livro foi escrito por José Saramago.","fr":"Le livre a été écrit par José Saramago."}],"pit":["« Merci pour » : *obrigado **por*** (cause), jamais *para*.","« Partir pour Lisbonne » : *partir **para** Lisboa*.","« Par semaine » : *por semana*."],"qs":[{"t":"fill","q":"Este bolo é ___ ti.","e":"Destinataire : para.","a":["para"]},{"t":"fill","q":"Obrigado ___ (por + o) convite.","e":"Cause : por + o = pelo.","a":["pelo"]},{"t":"fill","q":"Vou ___ Lisboa amanhã e fico lá um ano.","e":"Destination durable : para.","a":["para"]},{"t":"fill","q":"Passei ___ (por + a) praça.","e":"Lieu traversé : pela.","a":["pela"]},{"t":"fill","q":"Estudo ___ falar com os meus amigos portugueses.","e":"But + infinitif : para.","a":["para"]},{"t":"fill","q":"Vou à piscina duas vezes ___ semana.","e":"Fréquence : por.","a":["por"]},{"t":"fill","q":"Paguei vinte euros ___ este livro.","e":"Échange, prix : por.","a":["por"]},{"t":"fill","q":"___ mim, o fado é lindo. (selon moi)","e":"Opinion : para mim.","a":["para"]},{"t":"fill","q":"Chego ___ volta das oito. (vers huit heures)","e":"Approximation : por volta de.","a":["por"]},{"t":"choice","q":"« Le travail est pour vendredi. »","e":"Échéance : para.","o":["O trabalho é por sexta-feira.","O trabalho é para sexta-feira."],"c":1},{"t":"trans","q":"Merci pour le dîner.","e":"Cause : por + o = pelo.","a":["obrigado pelo jantar","obrigada pelo jantar"]}],"prod":{"c":"Racontez un trajet en indiquant par où vous êtes passé, pour qui étaient les achats et pourquoi vous remerciez quelqu'un (por / para).","n":"5 à 6 phrases"}},{"id":"L31","lv":"A2","title":"L'impératif","obj":"Donner un ordre, un conseil ou une indication, à tu et à você / o senhor.","refs":"EG §7.4, p. 90-91 ; UP §5.6, p. 154-155 ; EG §14.7, p. 169-170","expl":"| | **tu** (affirmatif) | **você, o senhor** | **vocês** | **tu** (négatif) |\n| falar | **fala** | **fale** | **falem** | não **fales** |\n| comer | **come** | **coma** | **comam** | não **comas** |\n| abrir | **abre** | **abra** | **abram** | não **abras** |\n\n- *tu* affirmatif = 3e personne du présent : *fala, come, abre* ;\n- *você / o senhor / vocês* et toutes les formes **négatives** = subjonctif présent : on part de la 1re personne du présent (*falo, como, faço*), on retire -o et on inverse la voyelle (-ar → **-e**, -er/-ir → **-a**) : *fale, coma, faça*.\n\nIrréguliers : *ser* (sê / seja), *estar* (está / esteja), *ir* (vai / vá), *ter* (tem / tenha), *fazer* (faz / faça), *dizer* (diz / diga), *pôr* (põe / ponha), *vir* (vem / venha), *dar* (dá / dê), *saber* (sabe / saiba).\n\nPronoms : après l'impératif affirmatif (*Diz-me. Sente-se.*), avant le négatif (*Não te preocupes.*).\n\nL'impératif sonne souvent trop direct. Pour adoucir : **pode + infinitif** (*Pode repetir?*), **faz favor de + infinitif** (*Faz favor de fechar a porta*, tournure européenne), ou l'imparfait de politesse (*Podia ajudar-me?*).","ex":[{"pt":"Fala mais devagar, por favor.","fr":"Parle plus lentement, s'il te plaît."},{"pt":"Siga em frente e vire à esquerda.","fr":"Continuez tout droit et tournez à gauche."},{"pt":"Sente-se, faz favor.","fr":"Asseyez-vous, je vous en prie."},{"pt":"Não te preocupes!","fr":"Ne t'inquiète pas !"},{"pt":"Venham jantar connosco!","fr":"Venez dîner avec nous !"}],"pit":["*Não fales* : le négatif de *tu* change de forme (subjonctif), contrairement au français.","*Sente-se* (asseyez-vous) / *senta-te* (assieds-toi).","*Diga!* (Je vous écoute, au téléphone ou au comptoir) est très courant."],"qs":[{"t":"fill","q":"___ (falar, tu) mais devagar!","e":"tu affirmatif = 3e personne du présent.","a":["fala"]},{"t":"fill","q":"___ (falar, você) mais devagar, por favor.","e":"você : subjonctif, -ar → -e.","a":["fale"]},{"t":"fill","q":"Não ___ (comer, tu) isso!","e":"Négatif : subjonctif.","a":["comas"]},{"t":"fill","q":"___ (abrir, vocês) os livros.","e":"vocês : -ir → -am.","a":["abram"]},{"t":"fill","q":"___ (fazer, o senhor) o favor de esperar.","e":"fazer → faço → faça.","a":["faça"]},{"t":"fill","q":"___ (dizer, você)! (au téléphone)","e":"dizer → digo → diga.","a":["diga"]},{"t":"fill","q":"___ (ir, você) pela avenida.","e":"ir : vá.","a":["vá"]},{"t":"fill","q":"___ (pôr, tu) a mesa, por favor.","e":"tu : põe.","a":["põe"]},{"t":"choice","q":"« Ne t'inquiète pas ! »","e":"Négatif : pronom devant + subjonctif.","o":["Não preocupa-te!","Não te preocupes!","Não te preocupa!"],"c":1},{"t":"choice","q":"« Asseyez-vous » (o senhor) :","e":"você / o senhor : subjonctif + se.","o":["Senta-te.","Sente-se.","Senta-se."],"c":1},{"t":"trans","q":"Tourne à droite.","e":"tu affirmatif : vira.","a":["vira à direita","volta à direita"]}],"prod":{"c":"Rédigez les indications pour aller de la gare à votre domicile, une fois à tu et une fois à você / o senhor.","n":"2 × 4 phrases"}},{"id":"L32","lv":"A2","title":"Le futur, le conditionnel et l'imparfait de politesse","obj":"Reconnaître et former le futur et le conditionnel, et savoir quand l'oral les évite.","refs":"EG §7.2, p. 77-81 ; UP §5.1.4-5.1.5, p. 141-142 ; LI §3.5.2.3, p. 72-73","expl":"**Futur** : infinitif + **-ei, -ás, -á, -emos, -ão** — *falarei, comerás, partirá, viveremos, abrirão*.\n**Conditionnel** : infinitif + **-ia, -ias, -ia, -íamos, -iam** — *falaria, comeríamos*.\nTrois verbes raccourcissent le radical : **fazer** → *farei, faria* ; **dizer** → *direi, diria* ; **trazer** → *trarei, traria*.\n\n**Usage réel au Portugal** :\n- à l'oral, le futur proche (*vou falar*) remplace presque toujours le futur simple, réservé à l'écrit, aux prévisions et aux promesses solennelles : *Amanhã choverá no norte* ;\n- le futur sert aussi à **supposer** : *Onde estará ele?* (Où peut-il bien être ?) ;\n- le conditionnel exprime l'hypothèse et la politesse (*Gostaria de…*), mais l'oral lui préfère souvent **l'imparfait** : *Se pudesse, ia* (si je pouvais, j'irais) ; *Podia ajudar-me?*\n\nAvec un pronom, l'écrit soutenu intercale le pronom dans le verbe (*dir-lhe-ei*, je vous dirai). L'oral contourne la forme : *vou dizer-lhe*.","ex":[{"pt":"Amanhã choverá no norte do país.","fr":"Demain il pleuvra dans le nord du pays."},{"pt":"Um dia viveremos em Portugal.","fr":"Un jour nous vivrons au Portugal."},{"pt":"Onde estará a minha chave?","fr":"Où peut bien être ma clé ?"},{"pt":"Eu faria isso de outra maneira.","fr":"Je ferais cela autrement."},{"pt":"Gostaria de marcar uma consulta.","fr":"Je voudrais prendre un rendez-vous."}],"pit":["*Farei, direi, trarei* : sans -ze-.","À l'oral, *vou fazer* est bien plus naturel que *farei*.","*Íamos* (nous allions) / *iríamos* (nous irions) : ne confondez pas imparfait et conditionnel."],"qs":[{"t":"fill","q":"Amanhã eu ___ (falar) com ele. (futur simple)","e":"Infinitif + -ei.","a":["falarei"]},{"t":"fill","q":"Nós ___ (viver) no Algarve um dia. (futur simple)","e":"Infinitif + -emos.","a":["viveremos"]},{"t":"fill","q":"Eles ___ (partir) amanhã. (futur simple)","e":"Infinitif + -ão.","a":["partirão"]},{"t":"fill","q":"Eu ___ (fazer) isso amanhã. (futur simple)","e":"fazer → farei.","a":["farei"]},{"t":"fill","q":"Ele ___ (dizer) a verdade. (futur simple)","e":"dizer → dirá.","a":["dirá"]},{"t":"fill","q":"Eu ___ (gostar) de reservar uma mesa. (conditionnel)","e":"Infinitif + -ia.","a":["gostaria"]},{"t":"fill","q":"Nós ___ (comprar) uma casa maior. (conditionnel)","e":"Infinitif + -íamos.","a":["compraríamos"]},{"t":"transf","q":"Dites-le comme à l'oral au Portugal (futur proche) : Comprarei o pão.","e":"Futur proche : vou + infinitif.","a":["vou comprar o pão"]},{"t":"choice","q":"« Où peut-il bien être ? »","e":"Futur de supposition : estará.","o":["Onde é ele?","Onde estará ele?","Onde estaria ele vai?"],"c":1},{"t":"trans","q":"Je voudrais un café. (poli, au comptoir)","e":"Imparfait de politesse : queria.","a":["queria um café","gostaria de um café","queria um café, por favor","queria um café, se faz favor"]}],"prod":{"c":"Imaginez votre vie au Portugal dans dix ans (futur simple), puis dites ce que vous feriez avec une année sabbatique (conditionnel ou imparfait).","n":"6 phrases"}},{"id":"L33","lv":"A2","title":"Adverbes : -mente, já, ainda, também","obj":"Former les adverbes en -mente et manier já, ainda, também et leurs négations.","refs":"EG §8.1-8.5, p. 107-110 ; §11.9, p. 123-124 ; LI §3.6, p. 77-83","expl":"**-mente** s'ajoute au **féminin** de l'adjectif : *rápido → rapidamente, lento → lentamente, fácil → facilmente, feliz → felizmente*. L'accent écrit de l'adjectif disparaît : *rápida → rapidamente*. Dans une série, seul le dernier prend -mente : *clara e rapidamente*.\n\n**Já / ainda** :\n| *já* | déjà ; maintenant, tout de suite | *Já comi. Vou já!* |\n| *ainda* | encore, toujours | *Ainda estás aqui?* |\n| *já não* | ne… plus | *Já não moro em Paris.* |\n| *ainda não* | pas encore | *Ainda não comi.* |\n\n**Também / também não** : *Eu também* (moi aussi) ; *Eu também não* (moi non plus). *Nem eu* est aussi très courant pour « moi non plus ».\n\nAutres adverbes fréquents : *depressa* (vite), *devagar* (lentement), *bem, mal, sempre, nunca, às vezes, muitas vezes* (souvent), *logo* (tout à l'heure, aussitôt), *cá / lá* (ici / là-bas, avec mouvement ou en tournure idiomatique : *Vem cá!*).\n\n*Já* et *também* entraînent la proclise : *Já me lembro. Também se chama Ana.*","ex":[{"pt":"Ela fala português perfeitamente.","fr":"Elle parle parfaitement portugais."},{"pt":"Já acabaste? — Ainda não.","fr":"Tu as déjà fini ? — Pas encore."},{"pt":"Já não fumo.","fr":"Je ne fume plus."},{"pt":"Gosto de fado. — Eu também.","fr":"J'aime le fado. — Moi aussi."},{"pt":"Não gosto de futebol. — Nem eu.","fr":"Je n'aime pas le foot. — Moi non plus."}],"pit":["*Rapidamente*, sans accent (de *rápida*).","*Já* peut signifier « tout de suite » : *Vou já!* (J'arrive !)","« Moi non plus » : *eu também não* ou *nem eu*, jamais *eu também*."],"qs":[{"t":"transf","q":"Formez l'adverbe : rápido","e":"Féminin rápida + -mente, sans accent.","a":["rapidamente"]},{"t":"transf","q":"Formez l'adverbe : fácil","e":"fácil + -mente, sans accent.","a":["facilmente"]},{"t":"transf","q":"Formez l'adverbe : feliz","e":"feliz + -mente.","a":["felizmente"]},{"t":"fill","q":"___ comeste? — Ainda não. (déjà)","e":"já = déjà.","a":["já"]},{"t":"fill","q":"___ não moro aqui. (ne… plus)","e":"já não = ne… plus.","a":["já"]},{"t":"fill","q":"___ não acabei. (pas encore)","e":"ainda não = pas encore.","a":["ainda"]},{"t":"fill","q":"Não gosto de chá. — Eu também ___ .","e":"Moi non plus : também não.","a":["não"]},{"t":"choice","q":"« Moi non plus. »","e":"nem eu = moi non plus.","o":["Eu também.","Nem eu.","Eu não também."],"c":1},{"t":"choice","q":"« J'arrive tout de suite ! »","e":"já = tout de suite.","o":["Vou ainda!","Vou já!","Vou também!"],"c":1},{"t":"trans","q":"Je n'habite plus à Paris.","e":"já não = ne… plus.","a":["já não moro em paris","já não vivo em paris","eu já não moro em paris"]}],"prod":{"c":"Faites le point sur votre apprentissage : ce que vous savez déjà faire, ce que vous ne faites pas encore, ce que vous ne faites plus (já, ainda, já não, ainda não, também).","n":"5 phrases"}},{"id":"L34","lv":"A2","title":"Le pretérito perfeito composto et le plus-que-parfait","obj":"Comprendre tenho feito (répétition jusqu'à maintenant) et tinha feito (plus-que-parfait).","refs":"EG §7.2, p. 79-81 ; §7.8, p. 94-95 ; UP §5.2.1-5.2.2, p. 145-146 ; LI §3.5.4, p. 77","expl":"**Faux ami grammatical majeur** : *ter* (présent) + participe ne correspond **pas** au passé composé français.\n**Tenho trabalhado muito** = « j'ai beaucoup travaillé **ces derniers temps** (et ça continue) ». Ce temps exprime une action **répétée ou prolongée jusqu'au présent**.\n\n| *Fui ao cinema.* | Je suis allé au cinéma (une fois, c'est fini). |\n| *Tenho ido ao cinema.* | Je vais souvent au cinéma ces temps-ci. |\n| *Estive doente.* | J'ai été malade (épisode terminé). |\n| *Tenho estado doente.* | Je suis souvent malade ces derniers temps. |\n\n**Le plus-que-parfait** : *tinha* + participe = « j'avais fait » : *Quando cheguei, o comboio já tinha partido.*\n\n**Participes** : *-ar → -ado* (*falado*), *-er / -ir → -ido* (*comido, partido*). Irréguliers fréquents : *fazer → feito, dizer → dito, ver → visto, vir → vindo, pôr → posto, escrever → escrito, abrir → aberto*. Avec *ter*, certains verbes ont une forme courte usuelle : *ganhar → ganho, gastar → gasto, pagar → pago*.\n\nAvec *ter*, le participe est **invariable** : *Tenho feito muitas viagens.*","ex":[{"pt":"Tenho estudado muito este mês.","fr":"J'ai beaucoup étudié ce mois-ci (et je continue)."},{"pt":"Ultimamente tem chovido muito.","fr":"Ces derniers temps, il a beaucoup plu."},{"pt":"Ontem estudei três horas.","fr":"Hier, j'ai étudié trois heures."},{"pt":"Quando chegámos, eles já tinham jantado.","fr":"Quand nous sommes arrivés, ils avaient déjà dîné."},{"pt":"Nunca tinha visto o mar.","fr":"Je n'avais jamais vu la mer."}],"pit":["« Hier j'ai mangé » : *ontem comi*, jamais *ontem tenho comido*.","*Tenho feito* = action répétée jusqu'à maintenant.","Participes en -to : *feito, dito, visto, posto, escrito, aberto*."],"qs":[{"t":"choice","q":"« Hier, j'ai travaillé. »","e":"Action ponctuelle achevée : perfeito simples.","o":["Ontem tenho trabalhado.","Ontem trabalhei."],"c":1},{"t":"choice","q":"« Ces derniers temps, je travaille beaucoup (j'ai beaucoup travaillé). »","e":"Répétition jusqu'au présent : perfeito composto.","o":["Ultimamente tenho trabalhado muito.","Ultimamente trabalhei muito uma vez."],"c":0},{"t":"fill","q":"Ultimamente ___ (ter) dormido mal. (je)","e":"ter au présent + participe.","a":["tenho"]},{"t":"fill","q":"Eles têm ___ (fazer) muito exercício.","e":"fazer → feito.","a":["feito"]},{"t":"fill","q":"Nunca tinha ___ (ver) o Porto.","e":"ver → visto.","a":["visto"]},{"t":"fill","q":"Quando cheguei, ela já ___ (sair, plus-que-parfait).","e":"tinha + participe.","a":["tinha saído"]},{"t":"fill","q":"Já tinham ___ (abrir) a loja.","e":"abrir → aberto.","a":["aberto"]},{"t":"fill","q":"Ele tem ___ (escrever) muitos livros.","e":"escrever → escrito.","a":["escrito"]},{"t":"fill","q":"Paguei? Sim, já tinha ___ (pagar).","e":"Forme courte usuelle : pago.","a":["pago"]},{"t":"trans","q":"Ces derniers temps, il a beaucoup plu.","e":"Répétition jusqu'au présent : tem chovido.","a":["ultimamente tem chovido muito","tem chovido muito ultimamente"]}],"prod":{"c":"Racontez ce que vous avez fait ces derniers temps (tenho feito…) et ce qui s'était déjà passé avant votre arrivée au travail ce matin (tinha…).","n":"6 phrases"}}]};</script>
<script>

/* ===== Outils ===== */

const pad = n => String(n).padStart(2, '0');
const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => fmt(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return fmt(d); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms); }
const frDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

/* ===== Données ===== */
const VOC = DATA.vocab, VERBS = DATA.verbes, LESSONS = DATA.lecons;
const VOC_BY = Object.fromEntries(VOC.entries.map(e => [e.id, e]));

TENSE_LABEL.impv = 'Impératif'; TENSE_LABEL.pp = 'Participe passé';

const IMPV_PERS = ['tu', 'você, o senhor', 'vocês'];

/* Ordre par défaut des nouveaux mots : A1 thème par thème, puis A2 */
const DEFAULT_ORDER = [...VOC.entries.filter(e => e.lv === 'A1'), ...VOC.entries.filter(e => e.lv === 'A2')].map(e => 'v:' + e.id);

/* Déblocage des exercices de conjugaison par leçon */
const IRR_PPS = ['ser', 'ir', 'estar', 'ter', 'fazer', 'dizer', 'trazer', 'poder', 'querer', 'saber', 'pôr', 'vir', 'ver', 'dar', 'caber', 'haver'];

  L31: { impv: VERBS.verbs.filter(v => v.inf !== 'haver').map(v => v.inf) },

};

/* ===== État ===== */
const KEY = 'pt-quotidien-v1';
const DEF_SETTINGS = { newPerDay: 8, maxReviews: 40, verbPerDay: 8, gramRemind: 5, voice: '', rate: 0.9, showBR: true, autoSay: false,
  projectUrl: 'https://claude.ai/project/01a19bd6-ae6d-75c3-b07b-6dedb2fd46c3', gistToken: '', gistId: '', autoSync: true,
  persoPerDay: 6, remindDays: 7, remindCount: 5 };
function loadState() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { s = null; }
  s = s && typeof s === 'object' ? s : {};
  s.v = 1;
  s.settings = Object.assign({}, DEF_SETTINGS, s.settings || {});
  for (const k of ['cards', 'lessons', 'days', 'bookEx', 'pcards', 'pdel', 'ndel', 'weakSent']) s[k] = s[k] || {};
  for (const k of ['journal', 'queue', 'notes', 'submissions']) s[k] = s[k] || [];
  return s;
}
let S = loadState();
function save() { S.updated = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Enregistrement impossible dans ce navigateur.'); } }
function day(d = today()) { const x = S.days[d] = S.days[d] || { steps: {} }; for (const k of ['v', 'vn', 'c', 'g', 'gok', 'p', 'pv', 'pn']) x[k] = x[k] || 0; x.steps = x.steps || {}; return x; }
function activeDay(d) { const x = S.days[d]; return !!x && ((x.v || 0) + (x.vn || 0) + (x.c || 0) + (x.g || 0) + (x.p || 0) + (x.pv || 0) + (x.pn || 0)) > 0; }
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
function streak() {
  let n = 0, d = today();
  if (!activeDay(d)) d = addDays(d, -1);
  while (activeDay(d)) { n++; d = addDays(d, -1); }
  return n;
}

/* ===== Leçons : progression ===== */
const lst = id => S.lessons[id] = S.lessons[id] || {};
function currentLesson() { return LESSONS.find(l => !(S.lessons[l.id] || {}).done) || null; }
function lessonUnlocked(id) { const st = S.lessons[id]; return !!st && (st.read || st.done); }
function unlockedDrills() {
  const out = [];
  for (const L of LESSONS) {
    if (!lessonUnlocked(L.id) || !UNLOCK[L.id]) continue;
    for (const [t, infs] of Object.entries(UNLOCK[L.id])) for (const inf of infs) out.push('c:' + inf + '|' + t);
  }

}

/* ===== Révision espacée (variante de SM-2) ===== */
function schedule(id, g, kind) {
  const c = S.cards[id] || { iv: 0, ef: 2.5, reps: 0, lapses: 0 };
  let iv;
  if (g === 0) { c.lapses = (c.lapses || 0) + 1; c.reps = 0; c.ef = Math.max(1.3, c.ef - 0.2); iv = 1; }
  else if (c.reps === 0) { iv = g === 3 ? 4 : 1; c.reps = 1; if (g === 3) c.ef += 0.15; }
  else if (c.reps === 1) { iv = g === 1 ? 2 : g === 2 ? 3 : 7; c.reps = 2; if (g === 1) c.ef = Math.max(1.3, c.ef - 0.15); if (g === 3) c.ef += 0.15; }
  else {
    if (g === 1) { iv = Math.max(c.iv + 1, Math.round(c.iv * 1.2)); c.ef = Math.max(1.3, c.ef - 0.15); }
    else if (g === 2) iv = Math.round(c.iv * c.ef);
    else { iv = Math.round(c.iv * c.ef * 1.3); c.ef += 0.15; }
    c.reps++;
  }
  if (iv > 4) iv = Math.round(iv * (0.95 + Math.random() * 0.1));
  c.iv = Math.min(iv, 365); c.due = addDays(today(), c.iv); c.t = Date.now(); if (kind) c.k = kind;
  S.cards[id] = c;
}
function markKnown(id) { S.cards[id] = { iv: 30, ef: 2.6, reps: 3, lapses: 0, due: addDays(today(), 30), t: Date.now(), known: 1 }; }
const isDue = c => c && c.due <= today();

/* ===== Voix ===== */
let VOICES = [];
function loadVoices() { if (!('speechSynthesis' in window)) return; VOICES = speechSynthesis.getVoices().filter(v => /^pt/i.test(v.lang)); }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); if (location.hash.startsWith('#/settings')) route(); }; }
function ptVoice() { return VOICES.find(v => v.name === S.settings.voice) || VOICES.find(v => /pt[-_]PT/i.test(v.lang)) || null; }
function say(text) {
  if (!('speechSynthesis' in window)) { toast('La synthèse vocale n\'est pas disponible dans ce navigateur.'); return; }
  const clean = String(text).replace(/\([^)]*\)/g, ' ').replace(/[…_]/g, ' ').replace(/\s*;\s*/g, ', ');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean); const v = ptVoice();
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'pt-PT';
  u.rate = +S.settings.rate || 0.9;
  speechSynthesis.speak(u);
}
const sayBtn = t => `<button class="say" data-say="${esc(t)}" aria-label="Écouter" title="Écouter">🔊</button>`;

/* ===== Mini-Markdown des leçons ===== */
function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>'); }
function md(src) {
  const L = src.split('\n'), out = []; let i = 0;
  while (i < L.length) {
    const l = L[i].trim();
    if (!l) { i++; continue; }
    if (l.startsWith('|')) {
      const rows = [];
      while (i < L.length && L[i].trim().startsWith('|')) { rows.push(L[i].trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim())); i++; }
      const first = rows[0].join(' ').replace(/\*\*/g, '');
      const head = !first.includes('*') && !first.includes('→');
      out.push('<div class="tbl"><table>' + rows.map((r, ri) => '<tr>' + r.map(c => { const t = ri === 0 && head ? 'th' : 'td'; return `<${t}>${inline(c)}</${t}>`; }).join('') + '</tr>').join('') + '</table></div>');
      continue;
    }
    if (l.startsWith('### ')) { out.push('<h4>' + inline(l.slice(4)) + '</h4>'); i++; continue; }
    if (l.startsWith('- ')) {
      let h = '<ul>';
      while (i < L.length && L[i].trim().startsWith('- ')) { h += '<li>' + inline(L[i].trim().slice(2)) + '</li>'; i++; }
      out.push(h + '</ul>'); continue;
    }
    const p = [];
    while (i < L.length && L[i].trim() && !L[i].trim().startsWith('|') && !L[i].trim().startsWith('- ') && !L[i].trim().startsWith('### ')) { p.push(L[i].trim()); i++; }
    out.push('<p>' + inline(p.join(' ')) + '</p>');
  }
  return out.join('');
}

/* ===== Vérification des réponses ===== */
const norm = s => String(s || '').normalize('NFC').toLowerCase().replace(/[’`´]/g, "'").replace(/[.,!?;:…«»"“”()¡¿—–]/g, ' ').replace(/\s+/g, ' ').trim();
const deacc = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
const stripArt = s => s.replace(/^(o|a|os|as|um|uma|uns|umas)\s+/, '');
const words = s => stripArt(norm(s)).split(' ').filter(Boolean);
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
/* Formes acceptées pour une entrée de vocabulaire : synonymes (;), masculin/féminin (,) */
function vocabAlts(pt) {
  const out = new Set([pt]);
  for (const syn of pt.split(/\s*;\s*/)) {
    out.add(syn);
    const parts = syn.split(/\s*,\s*/);
    if (parts.length > 1) {
      const bare = parts.map(p => words(p));
      const sameStem = bare.every(w => w.length && w.join(' ').slice(0, 2) === bare[0].join(' ').slice(0, 2));
      const short = bare.every(w => w.length <= 3);
      const q = parts.every(p => /[?!]$/.test(p)) || !/[?!]$/.test(syn);
      if (sameStem && short && q) parts.forEach(p => out.add(p));
    }
  }
  return [...out];
}
function checkVocab(input, pt) {
  const n = norm(input); if (!n) return { r: 'bad' };
  const alts = vocabAlts(pt);
  for (const a of alts) { const na = norm(a); if (n === na || n === stripArt(na) || stripArt(n) === na) return { r: 'ok', a, art: n !== na && stripArt(na) !== na }; }
  for (const a of alts) { const na = norm(a); if (stripArt(na) !== na && stripArt(n) === stripArt(na)) return { r: 'near', a, msg: 'Attention au genre : ' + a + '.' }; }
  for (const a of alts) { const na = norm(a); if (deacc(stripArt(n)) === deacc(stripArt(na))) return { r: 'near', a, msg: 'Presque : vérifiez les accents.' }; }
  for (const a of alts) { const b = stripArt(norm(a)); if (b.length > 5 && lev(stripArt(n), b) <= 1) return { r: 'near', a, msg: 'Presque : une lettre de différence.' }; }
  return { r: 'bad' };
}
function checkList(input, answers) {
  const n = norm(input); if (!n) return { r: 'bad' };
  for (const a of answers) if (n === norm(a)) return { r: 'ok', a };
  for (const a of answers) if (deacc(n) === deacc(norm(a))) return { r: 'near', a, msg: 'Presque : vérifiez les accents.' };
  for (const a of answers) { const na = norm(a); if (na.length > 8 && lev(n, na) <= 1) return { r: 'near', a, msg: 'Presque : une lettre de différence.' }; }
  return { r: 'bad' };

const SUBJ = /^(eu|tu|ele|ela|você|o senhor|a senhora|nós|eles|elas|vocês)\s+/;

/* ===== Séance : construction des étapes ===== */
const STEPS = [

  { k: 'gram', t: 'Grammaire', ic: '📘' },
  { k: 'perso', t: 'Mes points', ic: '📌' },

/* L'étape « Mes points » n'existe que si Claude a fourni des cartes personnelles */
const activeSteps = () => STEPS.filter(s => s.k !== 'perso' || Object.keys(S.pcards).length);
function entryOf(id) {
  if (id.startsWith('v:')) { const e = VOC_BY[id.slice(2)]; return e && { pt: e.pt, fr: e.fr, br: e.br, n: e.n, th: VOC.themes[e.th], lv: e.lv }; }
  if (id.startsWith('p:')) { const c = S.pcards[id.slice(2)]; return c && c.t === 'mot' && { pt: c.pt, fr: c.fr, br: c.br, n: c.note, th: 'Mes points' + (c.L ? ' · ' + c.L : '') }; }
  if (id.startsWith('b:') && PACK) { const e = PACK.lexique[+id.slice(2)]; return e && { pt: e.pt, fr: e.fr, br: e.br, th: 'Livre, ch. ' + e.c + ' — ' + (PACK.chapters[e.c] || ''), p: e.p }; }
  return null;
}
function nextNewIds(n) {
  const out = [];
  if (n <= 0) return out;
  const free = id => !S.cards[id] && !out.includes(id) && entryOf(id);
  for (const q of S.queue) {
    let ids = [];
    if (q.t === 'theme') ids = VOC.entries.filter(e => e.th === q.i).map(e => 'v:' + e.id);
    else if (q.t === 'book' && PACK) ids = PACK.lexique.filter(e => e.c === q.c).map(e => 'b:' + e.i);
    for (const id of ids) { if (out.length >= n) return out; if (free(id)) out.push(id); }
  }
  for (const id of DEFAULT_ORDER) { if (out.length >= n) break; if (free(id)) out.push(id); }
  return out;
}
function dueVocab() {
  return Object.entries(S.cards).filter(([id, c]) => (id.startsWith('v:') || id.startsWith('b:')) && isDue(c) && entryOf(id))
    .sort((a, b) => a[1].due.localeCompare(b[1].due)).map(([id]) => id);
}
function vocabCounts() {
  const d = day();
  const rev = Math.min(dueVocab().length, Math.max(0, S.settings.maxReviews - d.v));
  const nw = nextNewIds(Math.max(0, S.settings.newPerDay - d.vn)).length;
  return { rev, nw };
}
function buildVocab() {
  const d = day();
  const rev = dueVocab().slice(0, Math.max(0, S.settings.maxReviews - d.v)).map(id => ({ k: 'vcard', id }));
  const nw = nextNewIds(Math.max(0, S.settings.newPerDay - d.vn));
  const out = []; const pending = []; let ri = 0, ni = 0, guard = 0;
  while ((ri < rev.length || ni < nw.length || pending.length) && guard++ < 5000) {
    if (pending.length && pending[0].wait <= 0) out.push(pending.shift().item);
    else if (ni < nw.length && (out.length % 3 !== 2 || ri >= rev.length)) {
      out.push({ k: 'vnew', id: nw[ni] }); pending.push({ wait: 2, item: { k: 'vcard', id: nw[ni], first: true } }); ni++;
    } else if (ri < rev.length) out.push(rev[ri++]);
    else if (pending.length) out.push(pending.shift().item);
    pending.forEach(p => p.wait--);
  }
  return out;
}
function verbDueIds() { return Object.entries(S.cards).filter(([id, c]) => id.startsWith('c:') && isDue(c)).map(([id]) => id); }
function verbCounts() {
  const unl = unlockedDrills(); const d = day();
  const due = verbDueIds().filter(id => unl.includes(id));
  const room = Math.max(0, S.settings.verbPerDay - d.c);
  const fresh = unl.filter(id => !S.cards[id]);
  return { due: Math.min(due.length, room), fresh: Math.min(fresh.length, Math.max(0, room - due.length)), unlocked: unl.length };
}
function buildVerbs() {
  const unl = unlockedDrills(); const d = day();
  const room = Math.max(0, S.settings.verbPerDay - d.c);
  const due = shuffle(verbDueIds().filter(id => unl.includes(id))).slice(0, room);
  const fresh = unl.filter(id => !S.cards[id]).slice(0, Math.max(0, room - due.length));
  return [...due, ...fresh].map(id => ({ k: 'verb', id }));
}
function gramReminders() {
  return Object.entries(S.cards).filter(([id, c]) => id.startsWith('g:') && isDue(c)).map(([id]) => id).slice(0, S.settings.gramRemind);
}
function buildGram(lessonId, standalone) {
  const L = lessonId ? LES_BY[lessonId] : currentLesson();
  const items = [];
  if (L) {
    const st = lst(L.id);
    if (!standalone && !st.read) items.push({ k: 'read', L: L.id });
    let idx = L.qs.map((_, i) => i);
    if (!standalone && st.best != null && st.best < 0.8 && st.miss && st.miss.length) {
      const extra = shuffle(idx.filter(i => !st.miss.includes(i))).slice(0, 3);
      idx = shuffle([...st.miss, ...extra]);
    }
    idx.forEach(i => items.push({ k: 'q', L: L.id, qi: i }));
    items.push({ k: 'lessonEnd', L: L.id, total: idx.length });
  }
  if (!standalone) gramReminders().forEach(id => { const [, lid, qi] = id.split(':'); if (LES_BY[lid] && LES_BY[lid].qs[+qi]) items.push({ k: 'q', L: lid, qi: +qi, rem: id }); });
  return items;
}
function prodLesson() {

  if (cur && lessonUnlocked(cur.id)) return cur;
  const done = LESSONS.filter(l => (S.lessons[l.id] || {}).done && !(S.lessons[l.id] || {}).skipped);
  return done.length ? done[done.length - 1] : (cur || LESSONS[LESSONS.length - 1]);
}

/* ===== Séance : exécution ===== */
const RUN = { step: null, items: [], i: 0, ok: 0, n: 0, chain: false, standalone: false, lesson: null, done: new Set(), lessonScore: { ok: 0, n: 0, miss: [] } };
function startStep(step, opts = {}) {
  Object.assign(RUN, { step, i: 0, ok: 0, n: 0, chain: !!opts.chain, standalone: !!opts.standalone, lesson: opts.lesson || null, done: new Set(), lessonScore: { ok: 0, n: 0, miss: [] } });
  if (step === 'vocab') RUN.items = buildVocab();
  else if (step === 'gram') RUN.items = buildGram(opts.lesson, opts.standalone);

  else if (step === 'perso') RUN.items = buildPerso();
  else if (step === 'prod') RUN.items = [{ k: 'prod', L: (opts.lesson ? LES_BY[opts.lesson] : prodLesson()).id }];

function nextStepAfter(step) {

        <p>${passed ? '✓ Leçon acquise.' + (nx ? ` La prochaine séance passera à <b>${esc(nx.id)} — ${esc(nx.title)}</b>.` : ' Vous avez terminé le programme A1-A2 !') : 'Leçon à consolider : la prochaine séance reprendra les questions manquées, avec quelques autres.'}</p>
        ${s.miss.length ? '<p class="small muted">Les questions manquées reviendront aussi en rappel dans les jours qui viennent.</p>' : ''}
        <div class="field"><label for="lnote">Ce que je ne connaissais pas ou ne comprends pas bien (facultatif)</label>
        <textarea id="lnote" class="lnote" style="min-height:90px" placeholder="Par exemple : je ne vois pas quand employer ficar plutôt que estar…"></textarea>
        <div class="small muted">La note rejoint votre carnet de difficultés ; vous la soumettrez à Claude avec les autres.</div></div>
        <button class="btn primary" data-next>Continuer</button></div>`;
    },
    bind: (it, v) => {
      $('[data-next]', v).addEventListener('click', () => {
        const t = $('#lnote', v).value.trim();
        if (t) { addNote({ L: it.L, ctx: 'Fin de la leçon ' + it.L + ' — ' + LES_BY[it.L].title, txt: t }); toast('Note ajoutée au carnet de difficultés.'); }
        advance();
      });
    }
  },
  verb: {
    html: it => {
      const [inf, t] = it.id.slice(2).split('|'); const V = VERB_BY[inf];
      let asks;
      if (t === 'pp') asks = [{ lab: 'participe passé', exp: V.pp }];
      else if (t === 'impv') asks = shuffle([0, 1, 2]).slice(0, 2).map(i => ({ lab: IMPV_PERS[i], exp: V.imp[i] }));
      else if (inf === 'haver') asks = [{ lab: 'ele (impersonnel : « il y a »)', exp: V.t[t][2] }];
      else asks = shuffle([0, 1, 2, 3, 4]).slice(0, 2).map(i => ({ lab: PERS[i], exp: V.t[t][i], pi: i }));
      it.asks = asks;
      return `<div class="card"><div class="small muted">Conjugaison · ${esc(TENSE_LABEL[t])}</div>
        <div class="row" style="margin:8px 0"><span class="big pt">${esc(inf)}</span>${sayBtn(inf)}<span class="muted">${esc(V.fr)}</span></div>
        <form class="ans">${asks.map((a, i) => `<div class="field"><label>${esc(a.lab)}</label><input class="answer" type="text" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`).join('')}
        <button class="btn primary block" type="submit">Vérifier ↵</button></form><div class="after"></div></div>`;
    },
    bind: (it, v) => {
      const [inf, t] = it.id.slice(2).split('|'); const V = VERB_BY[inf];
      const form = $('form.ans', v);
      form.addEventListener('submit', e => {
        e.preventDefault(); if (form.dataset.checked) return; form.dataset.checked = 1;
        let worst = 2; const lines = [];
        it.asks.forEach((a, i) => {
          const inp = $(`input[data-i="${i}"]`, form); inp.setAttribute('readonly', '');
          const extra = (t === 'pps' && a.pi === 3 && a.exp.endsWith('ámos')) ? [a.exp.replace('ámos', 'amos')] : [];
          const res = checkVerb(inp.value, a.exp, extra);
          const g = res.r === 'ok' ? 2 : res.r === 'near' ? 1 : 0; worst = Math.min(worst, g);
          const note = extra.length && norm(inp.value).endsWith('amos') && res.r === 'ok' ? ' <span class="small">(au Portugal, on écrit plutôt <b>' + esc(a.exp) + '</b>)</span>' : '';
          lines.push(`<div class="verdict ${res.r}">${res.r === 'ok' ? '✓' : res.r === 'near' ? '≈' : '✗'} ${esc(a.lab)} : <b>${esc(a.exp)}</b>${note}</div>`);
        });
        const table = t === 'pp' ? '' : t === 'impv' ? `<table class="conj" style="margin-top:10px">${V.imp.map((f, i) => `<tr><td>${esc(IMPV_PERS[i])}</td><td class="pt">${esc(f)}</td></tr>`).join('')}</table>`
          : `<table class="conj" style="margin-top:10px">${V.t[t].map((f, i) => `<tr><td>${esc(PERS[i])}</td><td class="pt">${esc(f)}</td></tr>`).join('')}</table>`;
        $('.after', v).innerHTML = lines.join('') + table + `<div class="row" style="margin-top:10px">${worst < 2 ? '<button class="btn ghost" data-over>J\'avais juste</button>' : ''}<button class="btn primary" data-cont>Continuer ↵</button></div>`;
        const fin = g => { schedule(it.id, g, 'c'); if (g === 0 && !it.relearn) requeue(it); day().c++; RUN.n++; if (g >= 1) RUN.ok++; save(); advance(); };
        $('[data-over]', v)?.addEventListener('click', () => fin(2));
        $('[data-cont]', v).addEventListener('click', () => fin(worst)); $('[data-cont]', v).focus();
      });
      $$('input.answer', form).forEach((inp, i, all) => inp.addEventListener('keydown', e => { if (e.key === 'Enter' && i < all.length - 1) { e.preventDefault(); all[i + 1].focus(); } }));
    }
  },
  prod: {
    html: it => {
      const L = LES_BY[it.L];
      const draft = (S.drafts || {})[L.id] || '';
      return `<div class="card"><div class="small muted">Production écrite · ${esc(L.id)} — ${esc(L.title)}</div>
        <p class="q">${esc(L.prod.c)}</p><p class="small muted">Longueur conseillée : ${esc(L.prod.n)}. Écrivez sans dictionnaire d'abord ; l'essentiel est de vous lancer.</p>
        <textarea class="answer" placeholder="Escreva aqui…">${esc(draft)}</textarea>
        <div class="row" style="margin-top:10px"><button class="btn primary" data-send>Préparer la correction par Claude</button><button class="btn ghost" data-skip>Passer pour aujourd'hui</button></div>
        <div class="after small muted" style="margin-top:8px">La demande sera copiée ; collez-la dans une conversation du Projet « Portugais » qui s'ouvrira dans un nouvel onglet.</div></div>`;
    },
    bind: (it, v) => {
      const L = LES_BY[it.L]; const ta = $('textarea', v);
      ta.addEventListener('input', () => { S.drafts = S.drafts || {}; S.drafts[L.id] = ta.value; save(); });
      $('[data-skip]', v).addEventListener('click', advance);
      $('[data-send]', v).addEventListener('click', async () => {
        const txt = ta.value.trim(); if (txt.length < 10) { toast('Écrivez au moins une phrase.'); return; }
        const prompt = correctionPrompt(L, L.prod.c, txt);
        const ok = await copyText(prompt);
        S.journal.unshift({ id: Date.now().toString(36), d: today(), L: L.id, c: L.prod.c, txt });
        if (S.drafts) delete S.drafts[L.id];
        day().p++; save();
        window.open(S.settings.projectUrl || 'https://claude.ai', '_blank', 'noopener');
        $('.after', v).innerHTML = `<div class="verdict ${ok ? 'ok' : 'near'}">${ok ? '✓ Demande copiée : collez-la (⌘V) dans la conversation qui vient de s\'ouvrir.' : 'Copie automatique impossible : retrouvez la demande dans le Journal pour la copier à la main.'}</div><button class="btn primary" style="margin-top:10px" data-cont>Terminer</button>`;
        $('[data-cont]', v).addEventListener('click', advance);
      });
    }
  },
};

function searchVocab(q) {

function vVerb(inf) {

  const tbl = (t) => `<h3>${esc(TENSE_LABEL[t])}</h3><table class="conj">${V.t[t].map((f, i) => `<tr><td>${esc(PERS[i])}</td><td class="pt">${esc(f)}</td><td>${sayBtn(f)}</td></tr>`).join('')}</table>`;

/* Contexte joint automatiquement à une note prise pendant un exercice */
function qOf(it) { if (it.k === 'q') return LES_BY[it.L].qs[it.qi]; if (it.k === 'pq') return pQ(S.pcards[it.id.slice(2)]); return null; }
function noteContext(it) {
  if (!it) return '';
  const q = qOf(it);
  if (q) {
    const where = it.k === 'q' ? `${it.L} — ${LES_BY[it.L].title}` : 'Mes points';
    const exp = q.t === 'choice' ? q.o[q.c] : q.a[0];
    return `${where} · Question : ${q.q}${q.t === 'choice' ? ' (choix : ' + q.o.join(' / ') + ')' : ''} · Réponse attendue : ${exp}`;
  }
  if (it.k === 'vnew' || it.k === 'vcard') { const e = entryOf(it.id); return e ? `Mot : ${e.pt} = ${e.fr} (${e.th})` : ''; }
  if (it.k === 'verb') { const [inf, t] = it.id.slice(2).split('|'); return `Conjugaison : ${inf}, ${TENSE_LABEL[t]}`; }
  if (it.k === 'read' || it.k === 'lessonEnd') return `Leçon ${it.L} — ${LES_BY[it.L].title}`;
  if (it.k === 'prod') return `Production écrite, leçon ${it.L}`;
  if (it.k === 'pnotion') { const c = S.pcards[it.id.slice(2)]; return c ? `Notion : ${c.recto} → ${c.verso}` : ''; }
  if (it.k === 'bookq') return `Livre, ch. ${it.x.c}, exercice ${it.x.ex} : ${(it.x.qm || it.x.q).slice(0, 160)}`;
  return '';
}
function lessonOfItem(it) { return it && (it.L || (it.k === 'pq' || it.k === 'pnotion' ? (S.pcards[it.id.slice(2)] || {}).L : null)) || (currentLesson() || {}).id || null; }

/* ===== Points faibles détectés par l'application ===== */
function weakPoints() {
  const sent = S.weakSent;
  const fresh = ([id, c], min) => (c.lapses || 0) >= min && (c.lapses || 0) > (sent[id] || 0);
  const all = Object.entries(S.cards);
  const words = all.filter(([id, c]) => (id[0] === 'v' || id[0] === 'b') && id[1] === ':' && fresh([id, c], 2) && entryOf(id))
    .sort((a, b) => b[1].lapses - a[1].lapses).slice(0, 15);
  const verbs = all.filter(([id, c]) => id.startsWith('c:') && fresh([id, c], 2)).slice(0, 10);
  const gram = all.filter(([id, c]) => id.startsWith('g:') && fresh([id, c], 1)).filter(([id]) => { const [, L, qi] = id.split(':'); return LES_BY[L] && LES_BY[L].qs[+qi]; }).slice(0, 15);
  const perso = all.filter(([id, c]) => id.startsWith('p:') && S.pcards[id.slice(2)] && fresh([id, c], 2)).slice(0, 10);
  const lessons = LESSONS.filter(l => { const st = S.lessons[l.id]; return st && !st.done && st.best != null && st.best < 0.8; });
  return { words, verbs, gram, perso, lessons, total: words.length + verbs.length + gram.length + perso.length + lessons.length };
}

/* ===== Import de la réponse de Claude ===== */
function normCard(x) {
  const s = v => (typeof v === 'string' ? v.trim() : '');
  const base = { L: /^L\d\d$/.test(s(x.lecon)) ? s(x.lecon) : null, src: s(x.source) };
  switch (s(x.type).toLowerCase()) {
    case 'mot': if (!s(x.pt) || !s(x.fr)) return null; return { t: 'mot', pt: s(x.pt), fr: s(x.fr), br: s(x.br) || undefined, note: s(x.note) || undefined, ...base };
    case 'question': {
      const r = (Array.isArray(x.r) ? x.r : [x.r]).map(s).filter(Boolean);
      if (!s(x.q) || !r.length) return null;
      const f = ['fill', 'trans', 'transf'].includes(s(x.forme)) ? s(x.forme) : (s(x.q).includes('___') ? 'fill' : 'trans');
      return { t: 'q', forme: f, q: s(x.q), r, e: s(x.e), ...base };
    }
    case 'qcm': {
      const o = (Array.isArray(x.options) ? x.options : []).map(s).filter(Boolean);
      const b = Number.isInteger(x.bonne) ? x.bonne : -1;
      if (!s(x.q) || o.length < 2 || b < 0 || b >= o.length) return null;
      return { t: 'qcm', q: s(x.q), o, c: b, e: s(x.e), ...base };
    }
    case 'notion': if (!s(x.recto) || !s(x.verso)) return null; return { t: 'notion', recto: s(x.recto), verso: s(x.verso), e: s(x.e), ...base };
  }
  return null;
}
function parseCards(text) {
  let raw = null;
  const m = text.match(/<<<\s*CARTES-PT\s*([\s\S]*?)\s*CARTES-PT\s*>>>/);
  if (m) raw = m[1];
  else { const i = text.indexOf('{"envoi"') >= 0 ? text.indexOf('{"envoi"') : text.indexOf('{'), j = text.lastIndexOf('}'); if (i >= 0 && j > i) raw = text.slice(i, j + 1); }
  if (!raw) throw new Error('bloc de cartes introuvable');
  raw = raw.replace(/^```[a-z]*\s*/i, '').replace(/\s*```$/, '');
  const o = JSON.parse(raw);
  if (!o || !Array.isArray(o.cartes)) throw new Error('liste « cartes » absente');
  return o;
}
function importCards(text) {
  const o = parseCards(text);
  let added = 0, dup = 0, bad = 0;
  for (const x of o.cartes) {
    const c = normCard(x); if (!c) { bad++; continue; }
    const id = 'k' + hash(JSON.stringify([c.t, c.pt, c.fr, c.q, c.recto]));
    if (S.pcards[id] || S.pdel[id]) { dup++; continue; }
    S.pcards[id] = Object.assign(c, { id, d: today(), env: typeof o.envoi === 'string' ? o.envoi : '' });
    added++;
  }
  const env = typeof o.envoi === 'string' ? o.envoi : (S.submissions[0] || {}).id;
  S.notes.forEach(n => { if (n.st === 'sent' && n.env === env) n.st = 'done'; });
  const sub = S.submissions.find(s => s.id === env); if (sub) sub.imported = today();
  save(); maybeSync();
  return { added, dup, bad };
}

/* ===== Révision des cartes personnelles ===== */
function pQ(c) {
  if (!c) return { t: 'trans', q: '?', a: ['?'] };
  if (c.t === 'qcm') return { t: 'choice', q: c.q, o: c.o, c: c.c, e: c.e };
  return { t: c.forme, q: c.q, a: c.r, e: c.e };
}
function cardLabel(c) {
  if (!c) return '';
  if (c.t === 'mot') return `${c.pt} = ${c.fr}`;
  if (c.t === 'notion') return `${c.recto} → ${c.verso}`;
  return `${c.q} → ${c.t === 'qcm' ? c.o[c.c] : c.r[0]}`;
}
const persoDueIds = () => Object.keys(S.pcards).filter(id => isDue(S.cards['p:' + id])).sort((a, b) => S.cards['p:' + a].due.localeCompare(S.cards['p:' + b].due));
const persoNewIds = n => n > 0 ? Object.values(S.pcards).filter(c => !S.cards['p:' + c.id]).sort((a, b) => (a.d + a.id).localeCompare(b.d + b.id)).slice(0, n).map(c => c.id) : [];

function persoItem(id, first) { const c = S.pcards[id]; const pid = 'p:' + id; return c.t === 'mot' ? { k: 'vcard', id: pid, first } : c.t === 'notion' ? { k: 'pnotion', id: pid, first } : { k: 'pq', id: pid, first }; }

  const d = day(), out = [];
  persoDueIds().slice(0, Math.max(0, S.settings.maxReviews - d.pv)).forEach(id => out.push(persoItem(id, false)));
  persoNewIds(Math.max(0, S.settings.persoPerDay - d.pn)).forEach(id => {

}

/* ===== Stockage du paquet privé (IndexedDB) ===== */
function idb() { return new Promise((res, rej) => { const r = indexedDB.open('pt-quotidien', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbOp(mode, fn) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('kv', mode); const q = fn(tx.objectStore('kv')); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); }); }
const idbGet = k => idbOp('readonly', s => s.get(k));
const idbSet = (k, v) => idbOp('readwrite', s => s.put(v, k));
const idbDel = k => idbOp('readwrite', s => s.delete(k));

function mergeState(a, b) {

  for (const [id, l] of Object.entries(b.lessons || {})) {
    const m = out.lessons[id] || {};
    out.lessons[id] = Object.assign({}, m, (l.last || 0) > (m.last || 0) ? l : {}, { done: !!(m.done || l.done), read: m.read || l.read, best: Math.max(m.best || 0, l.best || 0) });
    if (!m.best && !l.best) delete out.lessons[id].best;
  }
  for (const [d, x] of Object.entries(b.days || {})) {
    const m = out.days[d]; if (!m) { out.days[d] = x; continue; }
    for (const k of ['v', 'vn', 'c', 'g', 'gok', 'p', 'pv', 'pn']) m[k] = Math.max(m[k] || 0, x[k] || 0);
    m.steps = Object.assign({}, x.steps || {}, m.steps || {});
  }
  const ids = new Set(out.journal.map(j => j.id));
  for (const j of b.journal || []) if (!ids.has(j.id)) out.journal.push(j);
  out.journal.sort((x, y) => (y.d + y.id).localeCompare(x.d + x.id));
  out.bookEx = Object.assign({}, b.bookEx || {}, out.bookEx || {});
  if ((b.updated || 0) > (a.updated || 0)) out.queue = b.queue || out.queue;
  out.started = out.started || b.started;
  // Carnet de difficultés : notes (statut le plus avancé), cartes personnelles, suppressions
  out.ndel = Object.assign({}, b.ndel || {}, out.ndel || {}); out.pdel = Object.assign({}, b.pdel || {}, out.pdel || {});
  const rank = { pending: 0, sent: 1, done: 2 }, nb = Object.fromEntries((out.notes || []).map(n => [n.id, n]));
  for (const n of b.notes || []) { const m = nb[n.id]; if (!m) nb[n.id] = n; else if (rank[n.st] > rank[m.st]) nb[n.id] = Object.assign({}, m, { st: n.st, env: n.env }); }
  out.notes = Object.values(nb).filter(n => !out.ndel[n.id]).sort((x, y) => y.id.localeCompare(x.id));
  out.pcards = Object.assign({}, b.pcards || {}, out.pcards || {});
  for (const id of Object.keys(out.pdel)) { delete out.pcards[id]; delete out.cards['p:' + id]; }
  const sb = Object.fromEntries((out.submissions || []).map(s => [s.id, s]));
  for (const s of b.submissions || []) sb[s.id] = Object.assign({}, s, sb[s.id] || {}, { imported: (sb[s.id] || {}).imported || s.imported });
  out.submissions = Object.values(sb).sort((x, y) => (y.d + y.id).localeCompare(x.d + x.id)).slice(0, 30);
  out.weakSent = Object.assign({}, b.weakSent || {}, out.weakSent || {});
  out.lastSubmit = [out.lastSubmit, b.lastSubmit].filter(Boolean).sort().pop();
  return out;
}
function syncPayload() { const p = JSON.parse(JSON.stringify(S)); p.settings = { newPerDay: S.settings.newPerDay, maxReviews: S.settings.maxReviews, verbPerDay: S.settings.verbPerDay, gramRemind: S.settings.gramRemind }; delete p.drafts; delete p.syncMsg; return JSON.stringify(p); }
let syncing = false;
async function syncNow(silent) {
  const s = S.settings; if (!s.gistToken) { if (!silent) toast('Renseignez d\'abord un jeton GitHub dans les réglages.'); return; }
  if (syncing) return; syncing = true;
  const H = { 'Authorization': 'Bearer ' + s.gistToken.trim(), 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
  try {
    if (s.gistId) {
      const r = await fetch('https://api.github.com/gists/' + encodeURIComponent(s.gistId.trim()), { headers: H, cache: 'no-store' });
      if (!r.ok) throw new Error('lecture du Gist : ' + r.status);
      const g = await r.json(); const f = g.files && g.files['progression.json'];
      if (f) {
        let txt = f.content; if (f.truncated) txt = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
        const remote = JSON.parse(txt); const settings = S.settings, drafts = S.drafts;
        S = Object.assign(loadStateFrom(mergeState(S, remote)), { settings, drafts });
      }
      const w = await fetch('https://api.github.com/gists/' + encodeURIComponent(s.gistId.trim()), { method: 'PATCH', headers: H, body: JSON.stringify({ files: { 'progression.json': { content: syncPayload() } } }) });
      if (!w.ok) throw new Error('écriture du Gist : ' + w.status);
    } else {
      const w = await fetch('https://api.github.com/gists', { method: 'POST', headers: H, body: JSON.stringify({ description: 'Portugais au quotidien — progression', public: false, files: { 'progression.json': { content: syncPayload() } } }) });
      if (!w.ok) throw new Error('création du Gist : ' + w.status);
      const g = await w.json(); S.settings.gistId = g.id;
    }
    S.lastSync = Date.now(); S.syncMsg = 'Synchronisé le ' + new Date().toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) + '.';
    save(); if (!silent) toast('Progression synchronisée.');
    if (!RUN.step || location.hash !== '#/run') route();
  } catch (e) {
    S.syncMsg = 'Échec de la synchronisation (' + e.message + '). Vérifiez le jeton et l\'identifiant du Gist.'; save();
    if (!silent) toast('Échec de la synchronisation.');
    const m = $('#syncMsg'); if (m) m.textContent = S.syncMsg;
  } finally { syncing = false; }
}
function loadStateFrom(obj) { localStorage.setItem(KEY, JSON.stringify(obj)); return loadState(); }
function maybeSync() { if (S.settings.gistToken && S.settings.autoSync) syncNow(true); }

/* ===== Actions ===== */
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function setLessonTo(id) {
  const idx = LESSONS.findIndex(l => l.id === id);
  LESSONS.forEach((l, i) => {
    const st = lst(l.id);
    if (i < idx) { if (!st.done) { st.done = true; st.skipped = true; st.read = st.read || Date.now(); } }
    else if (st.skipped || i === idx) { delete st.done; delete st.skipped; }
  });
  save();
}
const ACT = {
  go: b => { location.hash = b.dataset.href; },
  step: b => startStep(b.dataset.step, { chain: !!b.dataset.chain }),
  session: () => { if (activeSteps().every(s => day().steps[s.k])) location.hash = '#/bilan'; else startSession(); },
  quit: () => { if (RUN.n) save(); RUN.step = null; location.hash = '#/today'; route(); },
  welcome: () => { const i = +$('#startL').value; S.started = today(); setLessonTo(LESSONS[i].id); save(); route(); },
  practice: b => startStep('gram', { lesson: b.dataset.l, standalone: true }),
  prodL: b => startStep('prod', { lesson: b.dataset.l, standalone: true }),
  markdone: b => { const st = lst(b.dataset.l); st.done = true; st.read = st.read || Date.now(); save(); route(); },
  undone: b => { const st = lst(b.dataset.l); delete st.done; delete st.skipped; save(); route(); },
  queueTheme: b => { const i = +b.dataset.i; const k = S.queue.findIndex(q => q.t === 'theme' && q.i === i); if (k >= 0) S.queue.splice(k, 1); else S.queue.unshift({ t: 'theme', i }); save(); route(); },
  queueBook: b => { const c = +b.dataset.c; const k = S.queue.findIndex(q => q.t === 'book' && q.c === c); if (k >= 0) S.queue.splice(k, 1); else S.queue.push({ t: 'book', c }); save(); route(); },
  bookex: b => startStep('bookex', { items: bookExItems(+b.dataset.c), standalone: true }),
  preset: b => { Object.assign(S.settings, { newPerDay: +b.dataset.n, maxReviews: +b.dataset.r, verbPerDay: +b.dataset.c }); save(); route(); },
  testvoice: () => say('Bom dia! Hoje vamos aprender português de Portugal.'),
  sync: () => syncNow(false),
  export: () => download('portugais-progression-' + today() + '.json', JSON.stringify(S)),
  recopy: async b => { const j = S.journal.find(x => x.id === b.dataset.id); if (!j) return; const ok = await copyText(correctionPrompt(LES_BY[j.L], j.c, j.txt)); toast(ok ? 'Demande copiée.' : 'Copie impossible.'); },
  deljournal: b => { if (!confirm('Supprimer cette production ?')) return; S.journal = S.journal.filter(x => x.id !== b.dataset.id); save(); route(); },
  dropPack: async () => { if (!confirm('Retirer le paquet du livre de cet appareil ? Votre progression est conservée.')) return; await idbDel('pack'); PACK = null; route(); },
  reset: () => { if (!confirm('Effacer toute la progression sur cet appareil ? Exportez d\'abord une sauvegarde si besoin.')) return; localStorage.removeItem(KEY); S = loadState(); location.hash = '#/today'; route(); },
};
Object.assign(ACT, NOTE_ACT);
const CHANGE = {
  importPack: async inp => {
    const f = inp.files[0]; if (!f) return;
    try { const p = JSON.parse(await f.text()); if (p.format !== 'pt-livre-v1' || !Array.isArray(p.lexique)) throw new Error('format');
      await idbSet('pack', p); PACK = p; toast(`Paquet importé : ${p.lexique.length} entrées, ${p.exercices.length} exercices.`); route();
    } catch (e) { toast('Fichier non reconnu.'); }
  },
  importState: async inp => {
    const f = inp.files[0]; if (!f) return;
    try { const o = JSON.parse(await f.text()); if (!o || !o.cards) throw new Error('format');
      if (!confirm('Fusionner cette sauvegarde avec la progression actuelle ?')) return;
      const settings = S.settings; S = Object.assign(loadStateFrom(mergeState(S, o)), { settings }); save(); toast('Sauvegarde fusionnée.'); route();
    } catch (e) { toast('Fichier non reconnu.'); }
  },
  setLesson: sel => { setLessonTo(sel.value); toast('Leçon en cours : ' + sel.value); route(); },
};
document.addEventListener('click', e => {
  const s = e.target.closest('[data-say]'); if (s) { e.preventDefault(); say(s.dataset.say); return; }
  const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) { e.preventDefault(); ACT[b.dataset.act](b); }
  const t = e.target.closest('.tabs button'); if (t) { RUN.step = null; if (location.hash === t.dataset.href) route(); else location.hash = t.dataset.href; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.actChange && CHANGE[el.dataset.actChange]) { CHANGE[el.dataset.actChange](el); return; }
  if (el.dataset.set) {
    const k = el.dataset.set; let val = el.type === 'checkbox' ? el.checked : el.value;
    if (el.type === 'number' || el.type === 'range') val = Math.max(0, +val || 0);
    S.settings[k] = val; save();
    if (k === 'rate') $('#rateV').textContent = val;
  }
});
document.addEventListener('input', e => { if (e.target.dataset.set === 'rate') $('#rateV').textContent = e.target.value; });
document.addEventListener('keydown', e => {
  const tag = (document.activeElement || {}).tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (/^[1-4]$/.test(e.key)) { const b = $(`[data-g="${+e.key - 1}"]`); if (b) { e.preventDefault(); b.click(); } }
  if (e.key === ' ') { const b = $('[data-show]'); if (b) { e.preventDefault(); b.click(); } }
});
window.addEventListener('hashchange', () => { if (location.hash !== '#/run') RUN.step = null; route(); });

/* ===== Démarrage ===== */
(async function init() {
  try { PACK = await idbGet('pack') || null; } catch (e) { PACK = null; }
  route();
  maybeSync();
})();

</script>
