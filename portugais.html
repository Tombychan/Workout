arro novo : une voiture neuve |\n| um simples empregado : un simple employé | um homem simples : un homme simple, sans prétention |\n| certas pessoas : certaines personnes | a resposta certa : la bonne réponse |\n| o único filho : le seul fils | um filho único : un fils unique (sans frère ni sœur) |\n| pura mentira : un pur mensonge | água pura : de l'eau pure |\n| os altos dignitários : les hauts dignitaires | um prédio alto : un immeuble élevé |\n\n### Plusieurs adjectifs\nOn les relie par *e* ou par des virgules, en allant du plus général au plus particulier : *Vivem num casarão enorme, velho, feio e frio.*\n\n### L'adjectif employé comme nom\nAvec l'article, l'adjectif devient nom : *o importante* (l'important), *os pobres* (les pauvres), *o difícil é começar* (le difficile, c'est de commencer), *um francês* (un Français).\n\nLes **comparatifs et superlatifs** (*mais… do que, o melhor, -íssimo*) font l'objet de L29.","ex":[{"pt":"A Ana é uma rapariga simpática.","fr":"Ana est une fille sympathique."},{"pt":"Os meus amigos franceses chegam amanhã.","fr":"Mes amis français arrivent demain."},{"pt":"É uma cidade antiga e muito bonita.","fr":"C'est une ville ancienne et très jolie."},{"pt":"Ele é um velho amigo.","fr":"C'est un vieil ami (un ami de longue date)."},{"pt":"Comprei um carro novo.","fr":"J'ai acheté une voiture neuve."},{"pt":"O livro e a caneta são novos.","fr":"Le livre et le stylo sont neufs."},{"pt":"Fernando Pessoa é um grande poeta.","fr":"Fernando Pessoa est un grand poète."},{"pt":"A senhora está cansada?","fr":"Vous êtes fatiguée, madame ?"},{"pt":"Elas falam muito alto.","fr":"Elles parlent très fort."},{"pt":"Não há problema nenhum.","fr":"Il n'y a aucun problème."},{"pt":"O difícil é começar.","fr":"Le plus difficile, c'est de commencer."}],"pit":["*Francesa, portuguesa* : sans accent au féminin, contrairement à *francês, português*.","*Grande, feliz, fácil, azul* ne changent pas au féminin ; *espanhol* fait *espanhola*.","*Melhor, pior, maior, menor* sont invariables en genre : *uma ideia melhor*.","*Muito* devant un adjectif est invariable : *muito bonitas*.","Un masculin et un féminin réunis : accord au masculin pluriel.","*Um carro novo* (neuf) ≠ *um novo carro* (une autre voiture).","*Cor-de-rosa, laranja* restent invariables : *camisas cor-de-rosa*."],"qs":[{"t":"fill","q":"A casa é ___ (bonito).","e":"Féminin de bonito : bonita.","a":["bonita"]},{"t":"fill","q":"A Marie é ___ (francês).","e":"Féminin de francês : francesa, sans accent.","a":["francesa"]},{"t":"fill","q":"As cidades são ___ (grande).","e":"grande est invariable en genre ; pluriel grandes.","a":["grandes"]},{"t":"fill","q":"Os exercícios são ___ (fácil).","e":"Pluriel de fácil : fáceis.","a":["fáceis"]},{"t":"fill","q":"A minha irmã é muito ___ (trabalhador).","e":"-or → -ora.","a":["trabalhadora"]},{"t":"fill","q":"Elas são ___ (alemão).","e":"alemão → alemã → alemãs.","a":["alemãs"]},{"t":"fill","q":"A carne está ___ (cru).","e":"-u → -ua.","a":["crua"]},{"t":"fill","q":"A Carla é ___ (europeu).","e":"-eu → -eia.","a":["europeia"]},{"t":"fill","q":"A minha filha é muito ___ (brincalhão).","e":"-ão → -ona.","a":["brincalhona"]},{"t":"fill","q":"Esta solução é ___ (melhor).","e":"melhor est invariable en genre.","a":["melhor"]},{"t":"fill","q":"A Lola é ___ (espanhol).","e":"Gentilé en -ol : espanhola.","a":["espanhola"]},{"t":"fill","q":"O livro e a revista são ___ (caro).","e":"Masculin et féminin réunis : masculin pluriel.","a":["caros"]},{"t":"fill","q":"A revista e os jornais ___ (francês) estão na mesa.","e":"Un nom masculin dans la série : masculin pluriel.","a":["franceses"]},{"t":"choice","q":"« Une mauvaise nouvelle » :","e":"Féminin de mau : má (mal est un adverbe).","o":["uma mau notícia","uma má notícia","uma mal notícia"],"c":1},{"t":"choice","q":"« Un ami de longue date » :","e":"Devant le nom, velho signifie « de longue date ».","o":["um velho amigo","um amigo velho"],"c":0},{"t":"choice","q":"« Une voiture neuve » :","e":"Après le nom, novo = neuf ; avant, une autre voiture.","o":["um novo carro","um carro novo"],"c":1},{"t":"choice","q":"« Un homme pauvre » (sans argent) :","e":"Après le nom : sens littéral.","o":["um pobre homem","um homem pobre"],"c":1},{"t":"choice","q":"« Certaines personnes » :","e":"Avant le nom, certo = certain(es) ; après, juste, correct.","o":["pessoas certas","certas pessoas"],"c":1},{"t":"choice","q":"« Des chemises roses » :","e":"Couleur exprimée par un nom : invariable.","o":["camisas cor-de-rosas","camisas cor-de-rosa"],"c":1},{"t":"choice","q":"« Elles parlent fort. »","e":"Adjectif employé comme adverbe : invariable.","o":["Elas falam altas.","Elas falam alto."],"c":1},{"t":"trans","q":"une voiture rouge","e":"carro est masculin : vermelho.","a":["um carro vermelho"]},{"t":"trans","q":"des maisons blanches","e":"Accord au féminin pluriel : brancas.","a":["casas brancas","umas casas brancas"]},{"t":"trans","q":"la langue et la culture portugaises","e":"Deux noms féminins : féminin pluriel.","a":["a língua e a cultura portuguesas"]}],"prod":{"c":"Décrivez votre ville ou votre quartier avec au moins six adjectifs bien accordés, dont deux placés avant le nom (a velha ponte, um grande parque…) et un accord avec des noms de genres différents.","n":"5 à 7 phrases"}},{"id":"L07","lv":"A1","title":"Les prépositions contractées ; les emplois de a, de, em et por","obj":"Contracter les prépositions de, em, a et por avec les articles, les démonstratifs, les pronoms et les adverbes, et choisir la bonne préposition pour le lieu, le temps, le moyen et la manière.","refs":"EG §3.4, p. 27-28 ; EG §3.8, p. 30-31 ; EG §10.3-10.4, p. 117-118 ; UP §3.3.1, p. 55-59 ; UP §3.3.8, p. 64-69 ; UP §3.3.11, p. 70-75","expl":"### Les contractions avec l'article\n| | o | a | os | as |\n| **de** | do | da | dos | das |\n| **em** | no | na | nos | nas |\n| **a** | ao | à | aos | às |\n| **por** | pelo | pela | pelos | pelas |\n\n| | um | uma | uns | umas |\n| **de** | dum | duma | duns | dumas |\n| **em** | num | numa | nuns | numas |\n*A* et *por* ne se contractent pas avec l'article indéfini : *a um amigo, por uma semana*.\n\n- Avec l'**article défini**, la contraction est **obligatoire** : *a casa do João, estou no café, vou ao cinema, passo pela praça*.\n- Avec l'**article indéfini**, *num, numa* sont la norme au Portugal, à l'oral comme à l'écrit. *Dum, duma* sont courants à l'oral, mais l'écrit soigné préfère *de um, de uma*.\n- *À, às* (a + a, a + as) portent l'accent grave.\n\n### Les contractions avec les démonstratifs, les pronoms et les adverbes\n| | de | em | a |\n| este, esta, isto | deste, desta, disto | neste, nesta, nisto | — |\n| esse, essa, isso | desse, dessa, disso | nesse, nessa, nisso | — |\n| aquele, aquela, aquilo | daquele, daquela, daquilo | naquele, naquela, naquilo | àquele, àquela, àquilo |\n| ele, ela, eles, elas | dele, dela, deles, delas | nele, nela, neles, nelas | — |\n| aqui, aí, ali | daqui, daí, dali | — | — |\n| onde | donde (ou de onde) | — | — |\n| outro, outra | doutro, doutra | noutro, noutra | — |\n| algum, alguma | dalgum, dalguma | nalgum, nalguma | — |\n*Noutro dia, noutra altura, doutra maneira* sont courants au Portugal ; le Brésil dit *em outro, de outra*. Les démonstratifs sont étudiés en L16, les pronoms en L28.\n\n### Quand ne pas contracter\nQuand l'article appartient au **sujet d'un infinitif**, la norme interdit la contraction : *antes de o comboio partir* (avant que le train ne parte), *apesar de a casa ser pequena*. À l'oral, on entend souvent *antes do comboio partir* ; l'écrit soigné l'évite.\n\n### De : origine, appartenance, matière, caractérisation\n- **Possession** : *o carro do João, a casa dos meus pais.*\n- **Origine, provenance** : *Sou de Caen. Venho do Porto. Saí de casa às oito.*\n- **Matière, contenu** : *uma mesa de madeira, um copo de água, uma chávena de chá.*\n- **Caractérisation** : *o livro de português, a aula de dança, o homem de barba, o quarto de casal.*\n- **Moyen de transport** : *de carro, de comboio, de avião, de autocarro* — mais *a pé, a cavalo*.\n- **Moment de la journée** : *de manhã, de tarde, de noite, de dia.*\n- **Cause** : *morrer de fome, chorar de alegria, tremer de frio.*\n- **Prix, mesure** : *um bilhete de dez euros, uma garrafa de um litro.*\n- **De… a…** : *de segunda a sexta, de Lisboa ao Porto.*\n- **Superlatif** : *o melhor restaurante da cidade* ; **partie d'un tout** : *um dos meus amigos.*\n- **Verbes construits avec *de*** : *gostar de, precisar de, lembrar-se de, esquecer-se de, mudar de, sair de, acabar de* (venir de), *deixar de* (cesser de).\n\n### Em : situation dans l'espace et dans le temps\n- **Lieu où l'on est**, sans mouvement : *em casa* (à la maison, chez soi, sans article), *no escritório, na praia, em Lisboa, em Portugal, no Brasil, em França.*\n- **À l'intérieur, sur** : *no saco, na gaveta, na mesa* (on précise *em cima da mesa* pour « sur ») ; dans un véhicule : *no comboio* (à bord du train).\n- **Temps** : mois, années, saisons, fêtes, jours précis : *em maio, em 2026, no verão, no Natal, no dia cinco, na segunda-feira.*\n- **Durée nécessaire** : *Faço isto em duas horas.* (en deux heures)\n- **Manière, état, langue** : *em silêncio, em pé, em português, em direto.*\n- **Verbes construits avec *em*** : *pensar em, entrar em, acreditar em, confiar em, reparar em* (remarquer).\n*Em casa* (chez soi) ≠ *na casa do João* (chez João). *Em vez de* : au lieu de.\n\n### A : direction, destinataire, heure, distance, manière\n- **Destination** d'un déplacement bref : *Vou a Lisboa. Vou ao médico.* Pour un séjour durable, on dit *ir para* (L30). Avec *chegar*, le Portugal dit *chegar a* : *Cheguei a casa às dez.* (Le Brésil dit couramment *chegar em*.)\n- **Destinataire** : *Dei o livro ao João. Telefonei à Ana.*\n- **Heure** : *às três, à uma, ao meio-dia, à meia-noite.*\n- **Date** : *Estamos a cinco de novembro.*\n- **Jour de la semaine, habitude** : *à segunda-feira, aos sábados* (le lundi, le samedi : chaque semaine), alors que *na segunda-feira* désigne un lundi précis.\n- **Distance et délai** : *a dois quilómetros, a dez minutos de casa, daqui a uma semana.*\n- **Taux, prix unitaire, fréquence** : *a dois euros o quilo, a oitenta à hora, duas vezes ao dia.*\n- **Manière** : *à mão, a pé, à pressa, à vontade, às escuras, à portuguesa, bacalhau à Brás.*\n- **Position** : *à direita, à esquerda, ao lado de, à porta, à janela, ao sol, à sombra, ao telefone.*\n- **Ao + infinitif** = au moment de, en : *Ao chegar, telefonei-te.* (En arrivant, je t'ai téléphoné.)\n- **Estar a + infinitif** : l'action en cours (L17).\n\n### Por : passage, cause, moyen (aperçu ; détails en L30)\n*Passei pela ponte. Obrigado pelo presente. Escrito por Saramago. Enviei por email. Paguei dez euros por isto. Duas vezes por semana. Chego por volta das oito.*\n\n### Noms de lieux et prépositions\n- Villes sans article : *em Lisboa, de Lisboa, a Lisboa* ; villes avec article : *no Porto, do Porto, ao Porto*.\n- Pays : *em Portugal, de Portugal* (sans article) ; *no Brasil, do Brasil* ; *em França, de Espanha* au Portugal, *na França, da Espanha* au Brésil.\n\n### Au Brésil\nOn entend *em* avec les verbes de mouvement (*vou na praia*, familier), *em um* plutôt que *num*, et *de outro* plutôt que *doutro*.","ex":[{"pt":"O livro do professor está na mesa.","fr":"Le livre du professeur est sur la table."},{"pt":"Vou ao cinema com os amigos da Ana.","fr":"Je vais au cinéma avec les amis d'Ana."},{"pt":"Moramos num apartamento perto da estação.","fr":"Nous habitons un appartement près de la gare."},{"pt":"Passámos pela ponte às seis horas.","fr":"Nous sommes passés par le pont à six heures."},{"pt":"Hoje fico em casa.","fr":"Aujourd'hui je reste à la maison."},{"pt":"Vou de comboio, mas volto a pé.","fr":"J'y vais en train, mais je reviens à pied."},{"pt":"A praia fica a dez minutos daqui.","fr":"La plage est à dix minutes d'ici."},{"pt":"Ao sair do escritório, encontrei o Rui.","fr":"En sortant du bureau, j'ai rencontré Rui."},{"pt":"Gosto muito desta cidade.","fr":"J'aime beaucoup cette ville."},{"pt":"Penso muito nele.","fr":"Je pense beaucoup à lui."},{"pt":"Falamos disso noutra altura.","fr":"On en reparlera une autre fois."},{"pt":"Cheguei a casa à meia-noite.","fr":"Je suis rentré à la maison à minuit."}],"pit":["« Habiter à Lisbonne » : *morar **em** Lisboa* (et non *a Lisboa*).","*Às* (à + as) avec l'heure : *às três horas* ; mais *à uma hora*.","*Em casa* = chez soi, sans article ; *na casa do João* = chez João.","*De carro, de comboio*, mais *a pé*.","« Penser à » : *pensar **em*** ; « se souvenir de » : *lembrar-se **de***.","*Obrigado pela ajuda* : *pela* vient de *por*.","Au Portugal, *chegar a casa*, et non *chegar em casa*."],"qs":[{"t":"fill","q":"O carro ___ (de + o) João é azul.","e":"de + o = do.","a":["do"]},{"t":"fill","q":"Estou ___ (em + a) escola.","e":"em + a = na.","a":["na"]},{"t":"fill","q":"Vamos ___ (a + o) restaurante.","e":"a + o = ao.","a":["ao"]},{"t":"fill","q":"Ela vai ___ (a + a) praia.","e":"a + a = à (accent grave).","a":["à"]},{"t":"fill","q":"Moro ___ (em + um) apartamento pequeno.","e":"em + um = num.","a":["num","em um"]},{"t":"fill","q":"Obrigado ___ (por + a) ajuda.","e":"por + a = pela.","a":["pela"]},{"t":"fill","q":"A aula começa ___ (a + as) nove horas.","e":"a + as = às.","a":["às"]},{"t":"fill","q":"Eles moram ___ Lisboa.","e":"Ville sans article : em Lisboa.","a":["em"]},{"t":"fill","q":"A casa ___ (de + os) meus pais é grande.","e":"de + os = dos.","a":["dos"]},{"t":"fill","q":"Gosto muito ___ (de + esta) cidade.","e":"de + esta = desta.","a":["desta"]},{"t":"fill","q":"Penso muito ___ (em + ela).","e":"em + ela = nela.","a":["nela"]},{"t":"fill","q":"Vivo a cinco minutos ___ (de + aqui).","e":"de + aqui = daqui.","a":["daqui"]},{"t":"fill","q":"Mostrei a casa ___ (a + aquele) senhor.","e":"a + aquele = àquele.","a":["àquele"]},{"t":"fill","q":"Falamos disso ___ (em + outra) altura.","e":"em + outra = noutra (usage du Portugal).","a":["noutra","em outra"]},{"t":"fill","q":"Vou para o trabalho ___ comboio.","e":"Moyen de transport : de.","a":["de"]},{"t":"fill","q":"Volto para casa ___ pé.","e":"À pied : a pé.","a":["a"]},{"t":"fill","q":"Hoje fico ___ casa.","e":"Chez soi : em casa, sans article.","a":["em"]},{"t":"fill","q":"Penso muito ___ (em + os) meus filhos.","e":"pensar em : em + os = nos.","a":["nos"]},{"t":"choice","q":"« Avant que le train ne parte » (écrit soigné) :","e":"L'article appartient au sujet de l'infinitif : pas de contraction dans la norme.","o":["antes do comboio partir","antes de o comboio partir"],"c":1},{"t":"choice","q":"« Je suis rentré à la maison à dix heures. » (Portugal)","e":"Au Portugal : chegar a.","o":["Cheguei em casa às dez.","Cheguei a casa às dez."],"c":1},{"t":"choice","q":"« En arrivant, je t'ai appelé. »","e":"ao + infinitif = au moment de, en.","o":["Em chegar, liguei-te.","Ao chegar, liguei-te."],"c":1},{"t":"trans","q":"Je suis au café.","e":"Localisation : em + o = no.","a":["estou no café","eu estou no café"]},{"t":"trans","q":"une tasse de thé","e":"Contenu : de, sans article.","a":["uma chávena de chá"]},{"t":"trans","q":"Je vais chez le médecin.","e":"a + o = ao.","a":["vou ao médico","eu vou ao médico"]}],"prod":{"c":"Racontez une journée ordinaire : où vous êtes, où vous allez, comment (de comboio, a pé…) et à quelle heure (às oito, ao meio-dia…). Employez des contractions avec les articles (no, na, ao, à, do, pelo…) et au moins deux avec un démonstratif ou un pronom (deste, nele, daqui…).","n":"6 à 8 phrases"}},{"id":"L08","lv":"A1","title":"Estar ; ser ou estar ?","obj":"Conjuguer estar au présent et choisir entre ser et estar.","refs":"EG §11.13, p. 128-130 ; UP §5.9, p. 156-159","expl":"| | **estar** |\n| eu | estou |\n| tu | estás |\n| ele / ela / você | está |\n| nós | estamos |\n| eles / elas / vocês | estão |\n\n**Ser** dit ce qu'est une chose ou une personne ; **estar**, l'état dans lequel elle se trouve.\n| ser | estar |\n| identité, profession, nationalité | état passager : *Estou cansado.* |\n| caractère : *Ele é nervoso* (de nature) | humeur du moment : *Ele está nervoso* (aujourd'hui) |\n| heure, date : *São dez horas.* | météo : *Está frio. Está sol.* |\n| lieu d'un événement : *A festa é em casa da Ana.* | lieu d'une personne ou d'un objet mobile : *Estou em casa.* |\n\nPour les lieux **fixes** (bâtiments, villes), on emploie **ficar** ou **ser** : *Onde fica a estação?* (Où se trouve la gare ?) — *A estação fica perto.*\n\nComparez : *A sopa é boa* (cette soupe est bonne, en général) / *A sopa está boa* (elle est bonne aujourd'hui, à point). *Ela é bonita* (elle est belle) / *Ela está bonita* (elle est belle ce soir).","ex":[{"pt":"Estou em casa.","fr":"Je suis à la maison."},{"pt":"Hoje está muito calor.","fr":"Aujourd'hui il fait très chaud."},{"pt":"O café está frio.","fr":"Le café est froid."},{"pt":"Ele é professor, mas hoje está doente.","fr":"Il est professeur, mais aujourd'hui il est malade."},{"pt":"Onde fica o museu?","fr":"Où se trouve le musée ?"}],"pit":["« Être marié » : *ser casado* (état civil) et *estar casado* (*estou casado há dez anos*) s'emploient tous deux.","« Il fait froid » : *está frio* (ou *faz frio*), jamais *é frio* dans ce sens.","*Estar* + adjectif décrit une impression actuelle : *Estás magro!* (Tu as maigri !)"],"qs":[{"t":"fill","q":"Eu ___ (estar) cansado.","e":"estar, 1re personne : estou.","a":["estou"]},{"t":"fill","q":"Vocês ___ (estar) em casa?","e":"3e du pluriel : estão.","a":["estão"]},{"t":"fill","q":"Nós ___ (estar) no café.","e":"1re du pluriel : estamos.","a":["estamos"]},{"t":"choice","q":"« Il fait froid aujourd'hui. »","e":"Météo : estar.","o":["Hoje é frio.","Hoje está frio."],"c":1},{"t":"choice","q":"« Elle est professeure. »","e":"Profession : ser.","o":["Ela está professora.","Ela é professora."],"c":1},{"t":"choice","q":"« Je suis malade. »","e":"État passager : estar.","o":["Sou doente.","Estou doente."],"c":1},{"t":"choice","q":"« Où se trouve la gare ? »","e":"Lieu fixe : ficar (ou ser), plus naturel que estar.","o":["Onde está a estação?","Onde fica a estação?"],"c":1},{"t":"choice","q":"« La fête est chez Ana. »","e":"Lieu d'un événement : ser.","o":["A festa está em casa da Ana.","A festa é em casa da Ana."],"c":1},{"t":"fill","q":"O João ___ (ser) muito simpático.","e":"Caractère : ser.","a":["é"]},{"t":"fill","q":"Tu ___ (estar) muito bonita hoje!","e":"Impression du moment : estar.","a":["estás"]},{"t":"trans","q":"Le café est froid.","e":"État actuel du café : estar.","a":["o café está frio"]}],"prod":{"c":"Décrivez votre humeur et votre état aujourd'hui, puis votre caractère en général : opposez ser et estar.","n":"4 à 6 phrases"}},{"id":"L09","lv":"A1","title":"Le présent des verbes en -ar","obj":"Conjuguer les verbes réguliers en -ar au présent de l'indicatif.","refs":"EG §7.2, p. 69-72 ; UP §5.1.1, p. 137-138 ; LI §3.5.2.1, p. 70-71","expl":"Les verbes en **-ar** forment le groupe le plus nombreux. On retire **-ar** et on ajoute les terminaisons :\n| | **falar** (parler) | terminaison |\n| eu | falo | **-o** |\n| tu | falas | **-as** |\n| ele / ela / você | fala | **-a** |\n| nós | falamos | **-amos** |\n| eles / elas / vocês | falam | **-am** |\n\nLe **présent portugais** couvre l'habitude (*Trabalho em Caen*) et les vérités générales. Pour une action **en cours**, le portugais européen préfère *estar a* + infinitif (L17).\n\nModifications orthographiques au présent : *começar → começo* (la cédille reste devant o) ; *jogar → jogo* (rien ne change à la 1re personne du présent, mais voir le passé, L22).\n\nQuelques verbes en -ar utiles : *morar, trabalhar, estudar, gostar (de), comprar, chegar, ficar, tomar, jantar, almoçar, procurar, esperar, precisar (de)*.\n\n**Verbe + préposition** : *gostar **de***, *precisar **de***, *morar **em*** : *Gosto de café. Preciso de ajuda. Moro em Caen.*","ex":[{"pt":"Eu moro em Caen e trabalho na universidade.","fr":"J'habite à Caen et je travaille à l'université."},{"pt":"Tu falas português muito bem.","fr":"Tu parles très bien portugais."},{"pt":"Nós jantamos às oito.","fr":"Nous dînons à huit heures."},{"pt":"Eles chegam amanhã.","fr":"Ils arrivent demain."},{"pt":"Gosto muito de Lisboa.","fr":"J'aime beaucoup Lisbonne."}],"pit":["*Gostar* se construit toujours avec *de* : *gosto de ti* (je t'aime bien).","*Precisar de* + nom : *preciso de um táxi*.","Au présent, *nós falamos* s'écrit sans accent (il apparaîtra au passé : *falámos*)."],"qs":[{"t":"fill","q":"Eu ___ (falar) francês.","e":"-ar, 1re personne : -o.","a":["falo"]},{"t":"fill","q":"Tu ___ (morar) em Lisboa?","e":"2e personne : -as.","a":["moras"]},{"t":"fill","q":"A Ana ___ (trabalhar) num banco.","e":"3e personne : -a.","a":["trabalha"]},{"t":"fill","q":"Nós ___ (estudar) português.","e":"1re du pluriel : -amos.","a":["estudamos"]},{"t":"fill","q":"Eles ___ (chegar) amanhã.","e":"3e du pluriel : -am.","a":["chegam"]},{"t":"fill","q":"Você ___ (gostar) de café?","e":"você : 3e personne.","a":["gosta"]},{"t":"fill","q":"Eu ___ (começar) às nove.","e":"La cédille reste : começo.","a":["começo"]},{"t":"fill","q":"Preciso ___ um táxi.","e":"precisar de.","a":["de"]},{"t":"trans","q":"Nous habitons à Caen.","e":"morar em + ville.","a":["moramos em caen","nós moramos em caen","vivemos em caen","nós vivemos em caen"]},{"t":"trans","q":"Tu aimes le thé ?","e":"gostar de ; tu : gostas.","a":["gostas de chá?","tu gostas de chá?"]}],"prod":{"c":"Décrivez votre semaine de travail avec des verbes en -ar (trabalhar, chegar, almoçar, jantar, estudar…).","n":"5 à 6 phrases"}},{"id":"L10","lv":"A1","title":"Le présent des verbes en -er et -ir","obj":"Conjuguer les verbes réguliers en -er et -ir, et repérer les changements de voyelle du radical.","refs":"EG §7.2, p. 69-72 ; §7.13, p. 106 ; UP §5.1.1, p. 137-138 ; LI §3.5.2.1, p. 70-71","expl":"| | **comer** (manger) | **partir** (partir) |\n| eu | como | parto |\n| tu | comes | partes |\n| ele / ela / você | come | parte |\n| nós | comemos | **partimos** |\n| eles / elas / vocês | comem | partem |\n\nSeule la 1re personne du pluriel distingue les deux groupes : *comemos / partimos*.\n\n**Changements de radical** fréquents :\n- *-cer* : c → **ç** devant o : *conhecer → conheço* ;\n- *-guir* : *seguir → sigo, conseguir → consigo* ;\n- e → **i** à la 1re personne : *preferir → prefiro, sentir → sinto, servir → sirvo, vestir → visto, repetir → repito* ;\n- o → **u** à la 1re personne : *dormir → durmo* (mais *dormes, dorme*) ;\n- u → **o** aux 2e et 3e personnes : *subir → subo, sobes, sobe, sobem*.\n\nVerbes utiles : *comer, beber, viver, escrever, aprender, perceber (comprendre, au Portugal), responder, abrir, partir, decidir, dormir, preferir*.","ex":[{"pt":"Eu como pouco ao almoço.","fr":"Je mange peu au déjeuner."},{"pt":"Nós vivemos perto do mar.","fr":"Nous vivons près de la mer."},{"pt":"Não percebo a pergunta.","fr":"Je ne comprends pas la question."},{"pt":"Prefiro chá.","fr":"Je préfère le thé."},{"pt":"Eles abrem a loja às nove.","fr":"Ils ouvrent le magasin à neuf heures."}],"pit":["*Perceber* signifie « comprendre » au Portugal (et non « percevoir » en premier lieu).","*Prefiro, durmo, sigo* : seule la 1re personne change.","*Subir* : *ele sobe* (avec o)."],"qs":[{"t":"fill","q":"Eu ___ (comer) pão ao pequeno-almoço.","e":"-er, 1re personne : -o.","a":["como"]},{"t":"fill","q":"Tu ___ (beber) vinho?","e":"2e personne : -es.","a":["bebes"]},{"t":"fill","q":"Nós ___ (viver) em França.","e":"-er : -emos.","a":["vivemos"]},{"t":"fill","q":"Nós ___ (partir) amanhã.","e":"-ir : -imos.","a":["partimos"]},{"t":"fill","q":"Eles ___ (escrever) muitas cartas.","e":"3e du pluriel : -em.","a":["escrevem"]},{"t":"fill","q":"Eu ___ (conhecer) o João.","e":"c → ç : conheço.","a":["conheço"]},{"t":"fill","q":"Eu ___ (preferir) peixe.","e":"e → i à la 1re personne.","a":["prefiro"]},{"t":"fill","q":"Eu ___ (dormir) oito horas.","e":"o → u à la 1re personne.","a":["durmo"]},{"t":"fill","q":"Ela ___ (subir) as escadas.","e":"u → o : sobe.","a":["sobe"]},{"t":"fill","q":"Não ___ (perceber) nada! (je)","e":"perceber = comprendre.","a":["percebo"]},{"t":"trans","q":"Je ne comprends pas.","e":"Au Portugal : não percebo.","a":["não percebo","não compreendo","eu não percebo","eu não compreendo"]}],"prod":{"c":"Décrivez vos habitudes alimentaires et de lecture avec des verbes en -er et -ir (comer, beber, ler, escrever, preferir, dormir).","n":"5 à 6 phrases"}},{"id":"L11","lv":"A1","title":"Présents irréguliers (1) : ter, ir, vir, ver, dar, ler","obj":"Maîtriser six verbes irréguliers très fréquents.","refs":"EG §7.2, p. 69-72 ; LI §3.5.3, p. 73-77","expl":"| | ter | ir | vir | ver | dar | ler |\n| eu | tenho | vou | venho | vejo | dou | leio |\n| tu | tens | vais | vens | vês | dás | lês |\n| ele / você | tem | vai | vem | vê | dá | lê |\n| nós | temos | vamos | vimos | vemos | damos | lemos |\n| eles / vocês | têm | vão | vêm | veem | dão | leem |\n\nRepères :\n- **tem / têm**, **vem / vêm** : l'accent circonflexe marque le pluriel (la prononciation est très proche) ;\n- **veem, leem** s'écrivent sans accent depuis l'Accord de 1990 ;\n- **vimos** est à la fois « nous venons » (vir) et « nous avons vu » (ver, au passé) : le contexte tranche ;\n- **ter** sert aussi pour l'âge : *Tenho quarenta anos* ; et pour l'obligation : *Tenho de sair* (je dois sortir ; *ter que* est aussi courant).\n\n**Ir** + lieu : *vou a Lisboa* (aller-retour, court séjour), *vou para casa* (je rentre chez moi). **Ir de** + transport : *vou de comboio, de carro* — mais *a pé* (à pied).","ex":[{"pt":"Tenho dois filhos.","fr":"J'ai deux enfants."},{"pt":"Vou ao mercado. Vens comigo?","fr":"Je vais au marché. Tu viens avec moi ?"},{"pt":"Eles têm uma casa no Algarve.","fr":"Ils ont une maison en Algarve."},{"pt":"Leio o jornal todos os dias.","fr":"Je lis le journal tous les jours."},{"pt":"Tenho de trabalhar amanhã.","fr":"Je dois travailler demain."}],"pit":["*Têm* (ils ont) prend l'accent ; *tem* (il a), non.","« J'ai 40 ans » : *tenho 40 anos* (pas d'équivalent de « être âgé de »).","*Ir de comboio* mais *ir a pé*."],"qs":[{"t":"fill","q":"Eu ___ (ter) um irmão.","e":"ter : tenho.","a":["tenho"]},{"t":"fill","q":"Eles ___ (ter) muitos amigos.","e":"Pluriel : têm, avec accent.","a":["têm"]},{"t":"fill","q":"Nós ___ (ir) ao cinema.","e":"ir : vamos.","a":["vamos"]},{"t":"fill","q":"Tu ___ (vir) à festa?","e":"vir : vens.","a":["vens"]},{"t":"fill","q":"Eles ___ (vir) de Paris.","e":"Pluriel : vêm.","a":["vêm"]},{"t":"fill","q":"Eu não ___ (ver) nada.","e":"ver : vejo.","a":["vejo"]},{"t":"fill","q":"Ela ___ (ler) muito.","e":"ler : lê.","a":["lê"]},{"t":"fill","q":"Eu ___ (dar) aulas de inglês.","e":"dar : dou.","a":["dou"]},{"t":"fill","q":"Vocês ___ (ver) o mar daqui?","e":"veem : sans accent depuis l'Accord.","a":["veem"]},{"t":"trans","q":"J'ai trente ans.","e":"L'âge : ter.","a":["tenho trinta anos","eu tenho trinta anos"]},{"t":"trans","q":"Je dois partir.","e":"Obligation : ter de (ou ter que) + infinitif.","a":["tenho de sair","tenho que sair","tenho de ir","tenho que ir","tenho de partir","tenho que partir"]}],"prod":{"c":"Présentez votre famille : qui a quel âge, qui vient vous voir, qui lit quoi (ter, vir, ler, ver, dar, ir).","n":"5 à 6 phrases"}},{"id":"L12","lv":"A1","title":"Présents irréguliers (2) : fazer, dizer, trazer, poder, querer, saber, pôr, sair, ouvir, pedir","obj":"Conjuguer les autres verbes irréguliers essentiels.","refs":"EG §7.2, p. 69-72 ; UP §5.10-5.11, p. 159-161 ; LI §3.5.3, p. 73-77","expl":"La plupart ne sont irréguliers qu'à la **1re personne du singulier** :\n| infinitif | eu | tu | ele / você | nós | eles / vocês |\n| fazer | **faço** | fazes | faz | fazemos | fazem |\n| dizer | **digo** | dizes | diz | dizemos | dizem |\n| trazer | **trago** | trazes | traz | trazemos | trazem |\n| poder | **posso** | podes | pode | podemos | podem |\n| querer | quero | queres | **quer** | queremos | querem |\n| saber | **sei** | sabes | sabe | sabemos | sabem |\n| pôr | **ponho** | **pões** | **põe** | **pomos** | **põem** |\n| sair | saio | sais | sai | **saímos** | saem |\n| ouvir | **ouço** | ouves | ouve | ouvimos | ouvem |\n| pedir | **peço** | pedes | pede | pedimos | pedem |\n\n**Saber / conhecer** : *saber* = savoir (un fait, faire quelque chose) — *Sei nadar* ; *conhecer* = connaître (une personne, un lieu) — *Conheço Lisboa*.\n\n**Poder / saber** : *Sei nadar* (j'ai appris) ; *Posso nadar* (j'en ai la permission ou la possibilité).\n\n*Fazer* sert aussi pour la durée écoulée et l'anniversaire : *Faz dois anos que moro aqui* (cela fait deux ans) ; *Faço anos amanhã* (c'est mon anniversaire demain).","ex":[{"pt":"O que fazes ao fim de semana?","fr":"Que fais-tu le week-end ?"},{"pt":"Posso abrir a janela?","fr":"Puis-je ouvrir la fenêtre ?"},{"pt":"Não sei onde fica a estação.","fr":"Je ne sais pas où se trouve la gare."},{"pt":"Quero um café, se faz favor.","fr":"Je veux un café, s'il vous plaît."},{"pt":"Ponho o livro na mesa.","fr":"Je pose le livre sur la table."}],"pit":["*Quer* (il veut) : sans -e final.","*Pôr* garde son accent pour se distinguer de la préposition *por*.","« Je connais la réponse » : *sei a resposta* (un fait), et non *conheço*."],"qs":[{"t":"fill","q":"Eu ___ (fazer) o jantar.","e":"fazer : faço.","a":["faço"]},{"t":"fill","q":"Eu não ___ (saber) a resposta.","e":"saber : sei.","a":["sei"]},{"t":"fill","q":"___ (poder) entrar? (je)","e":"poder : posso.","a":["posso"]},{"t":"fill","q":"Ele ___ (querer) um café.","e":"querer, 3e personne : quer.","a":["quer"]},{"t":"fill","q":"Eu ___ (pôr) a mesa.","e":"pôr : ponho.","a":["ponho"]},{"t":"fill","q":"Eles ___ (pôr) os livros aqui.","e":"pôr, 3e du pluriel : põem.","a":["põem"]},{"t":"fill","q":"Nós ___ (sair) às oito.","e":"sair : saímos (accent).","a":["saímos"]},{"t":"fill","q":"Eu ___ (pedir) a conta.","e":"pedir : peço.","a":["peço"]},{"t":"fill","q":"Eu ___ (ouvir) música.","e":"ouvir : ouço.","a":["ouço"]},{"t":"choice","q":"« Je connais Lisbonne. »","e":"Un lieu : conhecer.","o":["Sei Lisboa.","Conheço Lisboa."],"c":1},{"t":"choice","q":"« Je sais nager. »","e":"Savoir-faire : saber.","o":["Conheço nadar.","Sei nadar."],"c":1},{"t":"fill","q":"O que é que tu ___ (dizer)?","e":"dizer : dizes.","a":["dizes"]}],"prod":{"c":"Écrivez un court message à un ami pour organiser un dîner : ce que vous faites, ce que vous pouvez apporter, ce que vous voulez (fazer, trazer, poder, querer, saber, pôr).","n":"5 phrases"}},{"id":"L13","lv":"A1","title":"La négation et les questions","obj":"Nier une phrase, poser une question et répondre « oui » en portugais du Portugal.","refs":"EG §11.8, p. 123 ; §5.5, p. 60-62 ; §13.3, p. 155-157","expl":"**La négation** : *não* se place devant le verbe — *Não falo alemão.* Les mots négatifs suivent le verbe et gardent *não* devant : *Não vejo ninguém. Não quero nada. Não vou nunca.* Placés devant le verbe, ils remplacent *não* : *Nunca vou. Ninguém sabe.*\n\n**Les questions fermées** se forment par la seule intonation : *Falas português?* On ne change pas l'ordre des mots.\n\n**Répondre « oui »** : au Portugal, on reprend volontiers **le verbe** au lieu de *sim* — *Falas português? — **Falo.*** (Oui.) *Tens tempo? — **Tenho.*** On répond « non » avec *não* + verbe : *Não, não tenho.*\n\n**Les mots interrogatifs** : *quem* (qui), *o que* (quoi), *onde* (où), *quando* (quand), *como* (comment), *quanto / quanta / quantos / quantas* (combien), *qual / quais* (lequel, quel), *porque* (pourquoi, en tête), *porquê* (pourquoi, en fin de phrase).\n\nLe portugais européen intercale très souvent **é que** après l'interrogatif : *Onde é que moras?* = *Onde moras?* (Où habites-tu ?). *O que é que queres?* (Que veux-tu ?) *Porque é que estás triste?* (Pourquoi es-tu triste ?)\n\n*Qual* demande un choix ou une précision : *Qual é o teu nome?* (Quel est ton nom ?) — et non *o que é o teu nome*.","ex":[{"pt":"Não conheço ninguém aqui.","fr":"Je ne connais personne ici."},{"pt":"Tens irmãos? — Tenho, dois.","fr":"Tu as des frères et sœurs ? — Oui, deux."},{"pt":"Onde é que trabalhas?","fr":"Où est-ce que tu travailles ?"},{"pt":"Porque é que não vens? — Porque estou cansado.","fr":"Pourquoi est-ce que tu ne viens pas ? — Parce que je suis fatigué."},{"pt":"Qual é a tua morada?","fr":"Quelle est ton adresse ?"}],"pit":["*Porque* (pourquoi, parce que) en tête ou en réponse ; *porquê* seul ou en fin de phrase : *Não vens? Porquê?*","« Quel est ton nom ? » : *Qual é…*, jamais *Que é…*.","Double négation obligatoire après le verbe : *Não vejo nada.*"],"qs":[{"t":"transf","q":"Mettez à la forme négative : Eu falo alemão.","e":"não devant le verbe.","a":["eu não falo alemão","não falo alemão"]},{"t":"fill","q":"Não vejo ___. (personne)","e":"ninguém après le verbe, avec não devant.","a":["ninguém"]},{"t":"fill","q":"Não quero ___. (rien)","e":"nada après le verbe.","a":["nada"]},{"t":"fill","q":"___ é que moras? (où)","e":"onde = où.","a":["onde"]},{"t":"fill","q":"___ é o teu número de telefone? (quel)","e":"Qual pour « quel est ».","a":["qual"]},{"t":"fill","q":"___ custa o bilhete? (combien)","e":"quanto custa = combien coûte.","a":["quanto"]},{"t":"fill","q":"Não vens? ___ ? (pourquoi, en fin de phrase)","e":"En fin de phrase : porquê.","a":["porquê"]},{"t":"choice","q":"« Tu parles portugais ? — Oui. » Réponse la plus typique au Portugal :","e":"On reprend le verbe : Falo.","o":["Sim.","Falo.","Sim, eu falo."],"c":1},{"t":"choice","q":"« Personne ne sait. »","e":"Mot négatif devant le verbe : pas de não.","o":["Não ninguém sabe.","Ninguém sabe.","Ninguém não sabe."],"c":1},{"t":"trans","q":"Je ne vais jamais au cinéma.","e":"nunca devant le verbe, ou não + verbe + nunca.","a":["nunca vou ao cinema","não vou nunca ao cinema","eu nunca vou ao cinema"]}],"prod":{"c":"Rédigez six questions à poser à un nouveau voisin portugais (onde, quando, como, quem, qual, porque é que), puis répondez à deux d'entre elles à la manière portugaise.","n":"8 lignes"}},{"id":"L14","lv":"A1","title":"Les nombres, l'heure et la date","obj":"Compter, dire l'heure et la date.","refs":"EG §6.1-6.3, p. 64-67 ; UP §3.10-3.11, p. 111-116","expl":"**Accord** : *um / uma*, *dois / duas*, et les centaines à partir de 200 s'accordent : *duas casas, duzentas pessoas*.\n\nOn relie par **e** les dizaines aux unités et les centaines aux dizaines : *vinte e um, cento e vinte e três, mil e quinhentos*. *Cem* (100) devient *cento* devant un autre nombre : *cento e dez*.\n\nAu Portugal : **dezasseis, dezassete, dezanove** (Brésil : *dezesseis, dezessete, dezenove*) ; *catorze* (ou *quatorze*).\n\n**L'heure** (*ser*, accordé) :\n- *É uma hora. São duas horas. É meio-dia. É meia-noite.*\n- *São duas e meia* (2 h 30), *São três e um quarto* (3 h 15), *São cinco e dez* (5 h 10).\n- Avant l'heure : *São quatro menos um quarto* ou *São quinze para as quatro* (3 h 45).\n- « À quelle heure ? » : *A que horas…? — Às oito. À uma.*\n\n**La date** : *Hoje é dia quatro de novembro* ; au Portugal, on dit aussi *Estamos a quatro de novembro*. Les mois et les jours s'écrivent en minuscules. Le premier du mois : *dia um* (ou *primeiro*). L'année : *dois mil e vinte e seis*.\n\nJours de la semaine : *segunda-feira, terça-feira, quarta-feira, quinta-feira, sexta-feira, sábado, domingo* ; « le lundi » : *à segunda-feira* (ou *às segundas* pour l'habitude).","ex":[{"pt":"São três e meia.","fr":"Il est trois heures et demie."},{"pt":"A aula começa às nove e um quarto.","fr":"Le cours commence à neuf heures et quart."},{"pt":"Tenho duas filhas.","fr":"J'ai deux filles."},{"pt":"O bilhete custa vinte e cinco euros.","fr":"Le billet coûte vingt-cinq euros."},{"pt":"Faço anos a dezassete de março.","fr":"Mon anniversaire est le dix-sept mars."}],"pit":["*Duas* pour un nom féminin : *duas horas*, *duas cervejas*.","*É uma hora* (singulier), mais *São duas horas* (pluriel).","*Às segundas-feiras* : le lundi, habituellement."],"qs":[{"t":"fill","q":"Tenho ___ (2) irmãs.","e":"Féminin : duas.","a":["duas"]},{"t":"fill","q":"___ (16)","e":"Forme européenne : dezasseis.","a":["dezasseis"]},{"t":"fill","q":"___ (21)","e":"Dizaine + e + unité.","a":["vinte e um"]},{"t":"fill","q":"___ (110)","e":"cento devant un autre nombre.","a":["cento e dez"]},{"t":"fill","q":"___ (200) pessoas","e":"Féminin : duzentas pessoas.","a":["duzentas"]},{"t":"choice","q":"« Il est une heure. »","e":"Une heure : singulier.","o":["São uma hora.","É uma hora."],"c":1},{"t":"fill","q":"São duas e ___ . (2 h 30)","e":"e meia = et demie.","a":["meia"]},{"t":"choice","q":"« À huit heures » :","e":"a + as = às.","o":["a oito horas","às oito horas","nas oito horas"],"c":1},{"t":"trans","q":"Il est trois heures et quart.","e":"e um quarto.","a":["são três e um quarto","são três e quinze"]},{"t":"choice","q":"3 h 45 se dit :","e":"quatro menos um quarto (ou quinze para as quatro).","o":["São três menos um quarto.","São quatro menos um quarto.","São quatro e um quarto."],"c":1},{"t":"fill","q":"Hoje é dia quatro de ___ . (novembre)","e":"Mois en minuscule : novembro.","a":["novembro"]}],"prod":{"c":"Décrivez votre emploi du temps de demain avec les heures, puis indiquez la date et l'âge de deux proches.","n":"5 à 6 phrases"}},{"id":"L15","lv":"A1","title":"Les possessifs","obj":"Employer les possessifs avec l'article, et dele / dela pour lever l'ambiguïté.","refs":"EG §5.2, p. 53-55 ; UP §4.4.3, p. 136 ; LI §3.3, p. 63-65","expl":"Le possessif s'accorde avec l'**objet possédé**, et le portugais du Portugal le fait **précéder de l'article** :\n| possesseur | masc. sing. | fém. sing. | masc. plur. | fém. plur. |\n| eu | o meu | a minha | os meus | as minhas |\n| tu | o teu | a tua | os teus | as tuas |\n| você, o senhor, ele, ela | o seu | a sua | os seus | as suas |\n| nós | o nosso | a nossa | os nossos | as nossas |\n| vocês | o vosso | a vossa | os vossos | as vossas |\n\n**Seu / sua** renvoie d'abord à la personne à qui l'on parle (*você, o senhor*). Pour « son, sa » (à lui, à elle), on préfère **dele, dela, deles, delas**, placés **après** le nom : *o carro dele* (sa voiture, à lui), *a casa delas* (leur maison, à elles).\n\nAvec **vocês**, le Portugal emploie couramment **vosso / vossa** : *a vossa casa*.\n\nL'article disparaît dans certains cas : en apostrophe (*Meu amor!*), après *ser* pour exprimer l'appartenance (*Este livro é meu*), et souvent devant les noms de parenté au singulier en style familier — mais *o meu pai* reste le plus courant.","ex":[{"pt":"A minha irmã mora em Lisboa.","fr":"Ma sœur habite à Lisbonne."},{"pt":"O teu telemóvel está aqui.","fr":"Ton portable est ici."},{"pt":"O carro dele é vermelho.","fr":"Sa voiture (à lui) est rouge."},{"pt":"Os nossos filhos estudam no Porto.","fr":"Nos enfants étudient à Porto."},{"pt":"Este livro é meu.","fr":"Ce livre est à moi."}],"pit":["*A minha casa* : l'accord se fait avec *casa*, pas avec le possesseur.","« Sa voiture » (à elle) : *o carro dela* est plus clair que *o seu carro*.","Au Brésil, l'article est facultatif : *meu carro*."],"qs":[{"t":"fill","q":"___ irmã é professora. (ma)","e":"casa, irmã… : a minha.","a":["a minha"]},{"t":"fill","q":"___ pais moram no Porto. (mes)","e":"Masculin pluriel : os meus.","a":["os meus"]},{"t":"fill","q":"___ casa é muito bonita. (notre)","e":"Féminin : a nossa.","a":["a nossa"]},{"t":"fill","q":"Onde estão ___ chaves? (tes)","e":"Féminin pluriel : as tuas.","a":["as tuas"]},{"t":"fill","q":"O carro ___ é novo. (à lui)","e":"dele après le nom.","a":["dele"]},{"t":"fill","q":"A mala ___ é azul. (à elle)","e":"dela après le nom.","a":["dela"]},{"t":"choice","q":"« Ce livre est à moi. »","e":"Après ser, appartenance : meu, sans article.","o":["Este livro é de mim.","Este livro é meu."],"c":1},{"t":"choice","q":"« Votre maison » (à vous deux, amis) au Portugal :","e":"vocês → vosso, vossa.","o":["a vossa casa","a vocês casa","a sua casas"],"c":0},{"t":"trans","q":"mes livres","e":"Article + possessif.","a":["os meus livros"]},{"t":"trans","q":"sa maison (à elle)","e":"dela lève l'ambiguïté.","a":["a casa dela","a sua casa"]}],"prod":{"c":"Présentez les membres de votre famille et leurs affaires avec des possessifs et dele / dela.","n":"5 à 6 phrases"}},{"id":"L16","lv":"A1","title":"Les démonstratifs","obj":"Choisir entre este, esse et aquele, et employer isto, isso, aquilo.","refs":"EG §5.3, p. 55-57 ; UP §4.4.2, p. 136","expl":"Le portugais distingue **trois distances**, liées aux personnes de la conversation :\n| | près de moi (aqui) | près de toi (aí) | loin des deux (ali, lá) |\n| masc. | este, estes | esse, esses | aquele, aqueles |\n| fém. | esta, estas | essa, essas | aquela, aquelas |\n| neutre | isto | isso | aquilo |\n\n**Isto, isso, aquilo** sont invariables et désignent une chose non nommée : *O que é isto?* (Qu'est-ce que c'est ?) *Isso é verdade.* (C'est vrai.)\n\nÀ l'oral, la nuance entre *este* et *esse* s'estompe ; *esse / isso* sert aussi à renvoyer à ce qui vient d'être dit : *Isso mesmo!* (Exactement !)\n\n**Contractions** avec *de*, *em* et *a* : *deste, desse, daquele ; neste, nesse, naquele ; àquele, àquela*.\n\nAvec le temps : *este ano* (cette année), *esta semana* ; *nesse dia* (ce jour-là) ; *naquela época* (à cette époque-là).","ex":[{"pt":"Este livro é meu, esse é teu.","fr":"Ce livre-ci est à moi, celui-là est à toi."},{"pt":"O que é aquilo?","fr":"Qu'est-ce que c'est, là-bas ?"},{"pt":"Gosto desta cidade.","fr":"J'aime cette ville."},{"pt":"Nesse dia, chovia muito.","fr":"Ce jour-là, il pleuvait beaucoup."},{"pt":"Isso é muito interessante.","fr":"C'est très intéressant."}],"pit":["*Isto / isso / aquilo* ne s'accordent jamais et ne précèdent pas un nom.","*Gostar de* + *esta* = *gosto desta* : la contraction est obligatoire.","*Este ano* (sans préposition) = cette année."],"qs":[{"t":"fill","q":"___ casa aqui é minha. (cette)","e":"Près de moi : esta.","a":["esta"]},{"t":"fill","q":"O que é ___? (ça, près de toi)","e":"Près de l'interlocuteur : isso.","a":["isso"]},{"t":"fill","q":"___ prédio ali é muito antigo. (cet… là-bas)","e":"Loin des deux : aquele.","a":["aquele"]},{"t":"fill","q":"Gosto muito ___ cidade. (de + esta)","e":"de + esta = desta.","a":["desta"]},{"t":"fill","q":"Moro ___ rua. (em + esta)","e":"em + esta = nesta.","a":["nesta"]},{"t":"fill","q":"___ ano vou a Portugal. (cette année)","e":"este ano, sans préposition.","a":["este"]},{"t":"choice","q":"« Qu'est-ce que c'est ? » (objet près de moi)","e":"Chose non nommée : isto.","o":["O que é este?","O que é isto?"],"c":1},{"t":"fill","q":"___ época, não havia telemóveis. (en + aquela)","e":"em + aquela = naquela.","a":["naquela"]},{"t":"trans","q":"Ces chaussures-ci sont chères.","e":"sapatos : masculin pluriel → estes.","a":["estes sapatos são caros"]}],"prod":{"c":"Vous êtes dans une boutique : demandez des renseignements sur trois objets à des distances différentes (este, esse, aquele, isto, isso).","n":"5 à 6 répliques"}},{"id":"L17","lv":"A1","title":"Estar a + infinitif : l'action en cours","obj":"Exprimer une action en cours avec la construction propre au Portugal.","refs":"EG §7.10, p. 98-103 ; UP §5.8.1, p. 155-156 ; LI §3.5.4, p. 77","expl":"Pour dire « être en train de », le portugais du Portugal emploie **estar a + infinitif** :\n*Estou a trabalhar.* (Je suis en train de travailler / je travaille en ce moment.)\n*O que estás a fazer?* (Qu'est-ce que tu fais ?)\n\nLe Brésil emploie le gérondif : *estou trabalhando*. Au Portugal, cette forme existe dans le sud et dans la langue écrite, mais *estar a* est la norme.\n\nLa même structure se combine avec d'autres verbes :\n- **andar a** + infinitif : action répétée sur une période — *Ando a estudar português* (je me suis mis au portugais, ces temps-ci) ;\n- **ficar a** + infinitif : rester à faire — *Ficámos a conversar* ;\n- **começar a**, **continuar a**, **voltar a** (refaire), **acabar de** (venir de) : *Voltei a ler o livro. Acabo de chegar.*\n\nLes pronoms se placent après l'infinitif, reliés par un trait d'union : *Estou a lavar-me.*","ex":[{"pt":"Estou a ler um livro muito bom.","fr":"Je lis un très bon livre (en ce moment)."},{"pt":"O que é que estás a fazer? — Estou a cozinhar.","fr":"Qu'est-ce que tu fais ? — Je cuisine."},{"pt":"Está a chover.","fr":"Il pleut."},{"pt":"Ando a aprender português.","fr":"J'apprends le portugais (ces temps-ci)."},{"pt":"Acabo de chegar.","fr":"Je viens d'arriver."}],"pit":["*Está a chover* : on n'emploie pas le simple *chove* pour la pluie qui tombe maintenant.","« Je viens de » : *acabo de* + infinitif, jamais *venho de*.","*Voltar a* + infinitif = refaire : *voltei a ligar* (j'ai rappelé)."],"qs":[{"t":"fill","q":"Eu estou ___ trabalhar.","e":"estar a + infinitif.","a":["a"]},{"t":"fill","q":"Nós ___ (estar) a jantar.","e":"estar conjugué + a + infinitif.","a":["estamos"]},{"t":"transf","q":"Transformez à la manière du Portugal : Ela está lendo.","e":"Gérondif brésilien → estar a + infinitif.","a":["ela está a ler"]},{"t":"transf","q":"Transformez à la manière du Portugal : Estou estudando.","e":"estar a + infinitif.","a":["estou a estudar"]},{"t":"fill","q":"Está ___ chover.","e":"Il pleut (en ce moment) : está a chover.","a":["a"]},{"t":"fill","q":"Acabo ___ chegar.","e":"Venir de : acabar de.","a":["de"]},{"t":"choice","q":"« Il travaille en ce moment. » (Portugal)","e":"Norme européenne : estar a + infinitif.","o":["Ele está trabalhando.","Ele está a trabalhar.","Ele trabalha agora mesmo a."],"c":1},{"t":"trans","q":"Que fais-tu ? (en ce moment)","e":"estar a fazer.","a":["o que estás a fazer?","o que é que estás a fazer?","que estás a fazer?"]},{"t":"trans","q":"Je viens d'arriver.","e":"acabar de + infinitif.","a":["acabo de chegar","acabei de chegar"]}],"prod":{"c":"Envoyez un message pour dire ce que fait chaque membre de votre famille en ce moment (estar a + infinitif).","n":"4 à 6 phrases"}},{"id":"L18","lv":"A1","title":"Há, ter et ficar","obj":"Dire « il y a », exprimer la durée et employer ficar.","refs":"EG §7.11, p. 103-104 ; §11.13, p. 128-130 ; UP §5.9, p. 156-159","expl":"**Há** (du verbe *haver*) signifie « il y a » et reste **invariable** :\n- existence : *Há um café na esquina. Há muitas pessoas.* ;\n- temps écoulé : *Cheguei há dois dias* (je suis arrivé il y a deux jours) ; *Moro aqui há três anos* (j'habite ici depuis trois ans).\nAu négatif : *Não há leite.* Au passé : *havia* (il y avait), *houve* (il y a eu).\n\nAu Brésil, on dit couramment *tem* pour « il y a » ; au Portugal, *há* est la norme.\n\n**Ficar** a plusieurs sens très fréquents :\n- se trouver (lieu fixe) : *O hotel fica no centro.* ;\n- rester : *Fico em casa hoje.* ;\n- devenir (changement d'état) : *Ficou contente. Fiquei doente.* ;\n- **ficar com** : garder, prendre — *Fico com este* (je prends celui-ci) ;\n- aller (vêtement) : *Esse casaco fica-te bem* (cette veste te va bien).","ex":[{"pt":"Há um multibanco perto daqui?","fr":"Y a-t-il un distributeur près d'ici ?"},{"pt":"Estudo português há seis meses.","fr":"J'étudie le portugais depuis six mois."},{"pt":"Vi o filme há uma semana.","fr":"J'ai vu le film il y a une semaine."},{"pt":"O museu fica perto do rio.","fr":"Le musée se trouve près du fleuve."},{"pt":"Ela ficou muito contente.","fr":"Elle a été très contente (elle est devenue contente)."}],"pit":["*Há* ne prend jamais de pluriel : *há muitos livros*.","*Há três anos* = « il y a trois ans » avec un passé, « depuis trois ans » avec un présent.","Ne confondez pas *há* (verbe) et *à* (préposition + article) : *Há uma reunião às cinco.*"],"qs":[{"t":"fill","q":"___ muitas pessoas na praia. (il y a)","e":"Existence : há, invariable.","a":["há"]},{"t":"fill","q":"Não ___ pão. (il n'y a pas)","e":"Négation : não há.","a":["há"]},{"t":"fill","q":"Moro em Caen ___ dez anos. (depuis)","e":"Présent + há = depuis.","a":["há"]},{"t":"fill","q":"Cheguei ___ duas horas. (il y a)","e":"Passé + há = il y a.","a":["há"]},{"t":"fill","q":"O hotel ___ (ficar) no centro.","e":"Lieu fixe : ficar.","a":["fica"]},{"t":"fill","q":"Hoje eu ___ (ficar) em casa.","e":"Rester : ficar.","a":["fico"]},{"t":"choice","q":"« Je prends celui-ci. » (dans un magasin)","e":"ficar com = prendre, garder.","o":["Tomo este.","Fico com este.","Estou com este."],"c":1},{"t":"choice","q":"« Il y a un problème. » (Portugal)","e":"Au Portugal : há.","o":["Tem um problema.","Há um problema.","Estão um problema."],"c":1},{"t":"trans","q":"Il y a un café près d'ici.","e":"há + nom.","a":["há um café perto daqui","há um café aqui perto"]},{"t":"fill","q":"Ela ___ (ficar, passé) doente.","e":"Devenir : ficar ; passé ficou.","a":["ficou"]}],"prod":{"c":"Décrivez votre quartier : ce qu'il y a, où se trouvent les lieux importants, depuis quand vous y habitez (há, ficar).","n":"5 à 6 phrases"}},{"id":"L19","lv":"A1","title":"Le futur proche : ir + infinitif","obj":"Parler de ses projets avec ir + infinitif et les expressions de temps.","refs":"EG §7.10, p. 98-103 ; UP §5.1.4, p. 141-142","expl":"À l'oral, le portugais exprime le futur surtout avec **ir (au présent) + infinitif** :\n*Vou estudar.* (Je vais étudier.) *Vamos jantar fora.* (Nous allons dîner dehors.)\n\nLe présent seul sert aussi pour un futur programmé : *Amanhã trabalho em casa.*\n\nAu Portugal, on évite **vou ir** : pour « je vais y aller », on dit *vou lá*, *vou já* ou simplement *vou*. (*Vou ir* est courant au Brésil.)\n\nExpressions de temps utiles :\n| expression | sens |\n| amanhã | demain |\n| depois de amanhã | après-demain |\n| logo / logo à noite | tout à l'heure / ce soir |\n| para a semana | la semaine prochaine (Portugal) |\n| no próximo mês | le mois prochain |\n| daqui a dois dias | dans deux jours |\n| no fim de semana | ce week-end |","ex":[{"pt":"Amanhã vou visitar os meus pais.","fr":"Demain je vais rendre visite à mes parents."},{"pt":"Vamos ao cinema logo à noite?","fr":"On va au cinéma ce soir ?"},{"pt":"Para a semana vou a Lisboa.","fr":"La semaine prochaine, je vais à Lisbonne."},{"pt":"Daqui a dois meses, vamos mudar de casa.","fr":"Dans deux mois, nous allons déménager."}],"pit":["« Dans deux jours » : *daqui a dois dias* (et non *em dois dias*, qui signifie « en l'espace de deux jours »).","*Vou ir* : à éviter au Portugal.","*Para a semana* : tournure européenne ; au Brésil, *na semana que vem*."],"qs":[{"t":"fill","q":"Amanhã eu ___ (ir) trabalhar em casa.","e":"ir au présent + infinitif.","a":["vou"]},{"t":"fill","q":"Nós ___ (ir) jantar fora.","e":"vamos + infinitif.","a":["vamos"]},{"t":"fill","q":"Eles ___ (ir) viajar no verão.","e":"vão + infinitif.","a":["vão"]},{"t":"fill","q":"___ dois dias, vou a Lisboa. (dans)","e":"Dans (délai) : daqui a.","a":["daqui a"]},{"t":"fill","q":"Para ___ semana, vou ao Porto. (la semaine prochaine)","e":"Para a semana.","a":["a"]},{"t":"transf","q":"Mettez au futur proche : Eu como em casa.","e":"vou + infinitif.","a":["eu vou comer em casa","vou comer em casa"]},{"t":"choice","q":"« Je vais y aller. » (Portugal)","e":"Au Portugal, on évite vou ir.","o":["Vou ir.","Vou lá.","Vou a ir."],"c":1},{"t":"trans","q":"Nous allons voyager demain.","e":"ir + infinitif.","a":["vamos viajar amanhã","amanhã vamos viajar","nós vamos viajar amanhã"]},{"t":"trans","q":"Tu vas étudier ce soir ?","e":"ir + infinitif ; logo à noite.","a":["vais estudar logo à noite?","vais estudar esta noite?","vais estudar hoje à noite?","tu vais estudar logo à noite?"]}],"prod":{"c":"Racontez vos projets pour le week-end prochain et pour les vacances (ir + infinitif, daqui a, para a semana).","n":"5 à 6 phrases"}},{"id":"L20","lv":"A1","title":"Gostar de, querer, preferir, apetecer","obj":"Exprimer ses goûts, ses envies et ses préférences comme on le fait au Portugal.","refs":"EG §16.1-16.3, p. 185-188 ; §16.10, p. 194 ; §14.12, p. 173-174","expl":"**Gostar de** (aimer bien, apprécier) prend toujours *de* : *Gosto de café. Gostas de viajar?* La contraction est obligatoire : *Gosto do Porto. Gosto da tua casa.*\n\n**Gostava de** (imparfait) équivaut à un conditionnel poli : *Gostava de reservar uma mesa* (Je voudrais réserver une table). C'est l'usage le plus courant au Portugal ; *gostaria* existe aussi.\n\n**Querer** : *Quero um café.* Pour demander poliment, l'imparfait **queria** est très courant : *Queria uma bica, se faz favor.*\n\n**Preferir X a Y** (préférer X à Y) : *Prefiro chá a café.* À l'oral, on entend souvent *Prefiro chá do que café*, tournure critiquée par la norme.\n\n**Apetecer** se construit comme « plaire » : la chose désirée est sujet et la personne est un pronom complément. *Apetece-me um gelado* (J'ai envie d'une glace). *Apetece-te sair?* (Tu as envie de sortir ?) *Não me apetece* (Je n'en ai pas envie). Cette tournure est typiquement européenne.\n\n**Adorar** (adorer) et **detestar** (détester) se construisent directement : *Adoro música.*","ex":[{"pt":"Gosto muito de cozinhar.","fr":"J'aime beaucoup cuisiner."},{"pt":"Gostava de falar com o diretor.","fr":"Je voudrais parler au directeur."},{"pt":"Queria um galão e uma torrada.","fr":"Je voudrais un café au lait et une tartine grillée."},{"pt":"Prefiro o mar à montanha.","fr":"Je préfère la mer à la montagne."},{"pt":"Apetece-me ir à praia.","fr":"J'ai envie d'aller à la plage."}],"pit":["*Gosto **de** ti* : « je t'aime bien » ; « je t'aime » (amour) se dit *amo-te* ou *gosto muito de ti*.","Avec *apetecer*, le pronom suit le verbe (*apetece-me*), sauf après négation (*não me apetece*).","*Preferir* + *a* : *prefiro o chá ao café* (a + o = ao)."],"qs":[{"t":"fill","q":"Gosto ___ chocolate.","e":"gostar de.","a":["de"]},{"t":"fill","q":"Gostas ___ (de + o) Porto?","e":"de + o = do.","a":["do"]},{"t":"fill","q":"___ um café, se faz favor. (je voudrais, imparfait de politesse)","e":"queria : forme polie courante.","a":["queria"]},{"t":"fill","q":"___ de reservar uma mesa. (je voudrais, avec gostar)","e":"gostava de = je voudrais.","a":["gostava"]},{"t":"fill","q":"Apetece-___ um gelado. (j'ai envie)","e":"apetece-me.","a":["me"]},{"t":"fill","q":"Não ___ apetece sair. (je)","e":"Après não, le pronom passe devant le verbe.","a":["me"]},{"t":"fill","q":"Prefiro o vinho ___ (a + a) cerveja.","e":"preferir X a Y : à cerveja.","a":["à"]},{"t":"choice","q":"« Tu as envie de sortir ? »","e":"apetecer : la personne est un pronom complément.","o":["Apeteces sair?","Apetece-te sair?","Te apetece sair?"],"c":1},{"t":"trans","q":"J'aime beaucoup Lisbonne.","e":"gostar de + nom.","a":["gosto muito de lisboa","eu gosto muito de lisboa","adoro lisboa"]}],"prod":{"c":"Parlez de vos goûts culinaires et culturels, et de ce dont vous avez envie aujourd'hui (gostar de, preferir, apetecer).","n":"5 à 6 phrases"}},{"id":"L21","lv":"A1","title":"Les verbes pronominaux et la place du pronom","obj":"Conjuguer un verbe pronominal et placer le pronom selon la règle européenne.","refs":"EG §7.12, p. 104-106 ; §5.1, p. 43-52 ; LI §4.5.2.1, p. 110-113 ; §4.6, p. 116-117","expl":"Les pronoms réfléchis : **me, te, se, nos, se**.\n| | **levantar-se** (se lever) |\n| eu | levanto-me |\n| tu | levantas-te |\n| ele / ela / você | levanta-se |\n| nós | levantamo-**nos** (le *-s* tombe) |\n| eles / elas / vocês | levantam-se |\n\n**Règle européenne** : dans une phrase affirmative simple, le pronom se place **après** le verbe, avec un trait d'union (*enclise*) : *Chamo-me Ana. Deito-me cedo.*\n\nIl passe **devant** le verbe (*proclise*) :\n- après une **négation** : *Não me lembro.* ;\n- après certains **adverbes** : *já, ainda, também, sempre, só, nunca* — *Também me levanto cedo.* ;\n- dans une **question avec mot interrogatif** : *Como te chamas? A que horas te deitas?* ;\n- dans une **subordonnée** (après *que, quando, se, porque*…) : *Acho que se chama Pedro.* ;\n- après un sujet **indéfini** ou quantifié : *Alguém se lembra? Todos se sentaram.*\n\nAu Brésil, le pronom précède presque toujours le verbe : *Me chamo Ana.*\n\nVerbes pronominaux courants : *chamar-se, levantar-se, deitar-se, sentar-se, lembrar-se de, esquecer-se de, vestir-se, despedir-se, magoar-se, sentir-se*.","ex":[{"pt":"Chamo-me Sébastien. Como te chamas?","fr":"Je m'appelle Sébastien. Comment t'appelles-tu ?"},{"pt":"Levanto-me às sete e deito-me às onze.","fr":"Je me lève à sept heures et je me couche à onze heures."},{"pt":"Não me lembro do nome dele.","fr":"Je ne me souviens pas de son nom."},{"pt":"Sentamo-nos aqui?","fr":"On s'assoit ici ?"},{"pt":"Acho que ela se esqueceu.","fr":"Je crois qu'elle a oublié."}],"pit":["*Levantamo-nos*, *sentamo-nos* : le -s de la 1re personne du pluriel disparaît.","Commencer une phrase par *me* est incorrect au Portugal : *Chamo-me…*, jamais *Me chamo…*.","*Lembrar-se de*, *esquecer-se de* : la préposition est obligatoire."],"qs":[{"t":"fill","q":"Eu ___ às sete. (levantar-se, présent)","e":"Affirmative : pronom après le verbe.","a":["levanto-me"]},{"t":"fill","q":"Como ___ chamas?","e":"Question avec mot interrogatif : te avant le verbe.","a":["te"]},{"t":"fill","q":"Não ___ lembro.","e":"Négation : me avant le verbe.","a":["me"]},{"t":"fill","q":"Nós ___ cedo. (deitar-se, présent)","e":"-mos + nos → -mo-nos.","a":["deitamo-nos"]},{"t":"fill","q":"Ela ___ Marta. (chamar-se, présent)","e":"Affirmative : chama-se.","a":["chama-se"]},{"t":"transf","q":"Mettez à la forme négative : Lembro-me.","e":"Après não, le pronom passe devant.","a":["não me lembro"]},{"t":"fill","q":"Também ___ levanto cedo.","e":"Après também : proclise.","a":["me"]},{"t":"choice","q":"« Je m'appelle Ana. » (Portugal)","e":"Enclise avec trait d'union.","o":["Me chamo Ana.","Chamo-me Ana.","Chamo me Ana."],"c":1},{"t":"fill","q":"Acho que ele ___ esqueceu.","e":"Subordonnée (que) : se avant le verbe.","a":["se"]},{"t":"trans","q":"On s'assoit ici ?","e":"sentar-se, 1re du pluriel : sentamo-nos.","a":["sentamo-nos aqui?","sentamo-nos aqui"]}],"prod":{"c":"Décrivez votre routine du matin et du soir avec des verbes pronominaux, en plaçant correctement les pronoms (y compris après não).","n":"5 à 6 phrases"}},{"id":"L22","lv":"A2","title":"Le passé (pretérito perfeito) : verbes réguliers","obj":"Raconter des actions achevées avec le pretérito perfeito des verbes réguliers.","refs":"EG §7.2, p. 72-75 ; UP §5.1.2, p. 138-139 ; LI §3.5.2.2, p. 71-72","expl":"Le **pretérito perfeito simples** exprime une action **achevée** dans le passé. Il traduit à la fois le passé composé et le passé simple français : *Ontem comi peixe* = Hier, j'ai mangé du poisson.\n\n| | **falar** | **comer** | **partir** |\n| eu | falei | comi | parti |\n| tu | falaste | comeste | partiste |\n| ele / ela / você | falou | comeu | partiu |\n| nós | **falámos** | comemos | partimos |\n| eles / elas / vocês | falaram | comeram | partiram |\n\nAu Portugal, **falámos** (passé) s'écrit avec un accent pour se distinguer de **falamos** (présent) ; la prononciation diffère aussi (a ouvert au passé).\n\n**Changements orthographiques** à la 1re personne, pour garder le son :\n- *-car* → **-quei** : *ficar → fiquei* ;\n- *-gar* → **-guei** : *chegar → cheguei, pagar → paguei, jogar → joguei* ;\n- *-çar* → **-cei** : *começar → comecei, almoçar → almocei*.\n\nRepères temporels : *ontem* (hier), *anteontem*, *na semana passada*, *no ano passado*, *há dois dias*, *em 2020*, *já* (déjà).","ex":[{"pt":"Ontem trabalhei até tarde.","fr":"Hier, j'ai travaillé tard."},{"pt":"Já almoçaste? — Já almocei, obrigado.","fr":"Tu as déjà déjeuné ? — Oui, merci."},{"pt":"Comprámos a casa no ano passado.","fr":"Nous avons acheté la maison l'année dernière."},{"pt":"Eles partiram há uma hora.","fr":"Ils sont partis il y a une heure."},{"pt":"Cheguei às nove.","fr":"Je suis arrivé à neuf heures."}],"pit":["Le passé composé français ne se traduit **pas** par *tenho falado* (voir L34) mais par le *perfeito* : *falei*.","*Cheguei, fiquei, comecei* : pensez aux changements d'orthographe.","Réponse affirmative en reprenant le verbe : *Viste o filme? — Vi.*"],"qs":[{"t":"fill","q":"Ontem eu ___ (trabalhar) muito.","e":"-ar, 1re personne : -ei.","a":["trabalhei"]},{"t":"fill","q":"Tu ___ (comer) bem?","e":"-er, 2e personne : -este.","a":["comeste"]},{"t":"fill","q":"Ela ___ (partir) ontem.","e":"-ir, 3e personne : -iu.","a":["partiu"]},{"t":"fill","q":"Nós ___ (comprar) um carro.","e":"Portugal : -ámos au passé.","a":["comprámos"]},{"t":"fill","q":"Eles ___ (beber) muito.","e":"3e du pluriel : -eram.","a":["beberam"]},{"t":"fill","q":"Eu ___ (chegar) às dez.","e":"-gar → -guei.","a":["cheguei"]},{"t":"fill","q":"Eu ___ (ficar) em casa.","e":"-car → -quei.","a":["fiquei"]},{"t":"fill","q":"Eu ___ (começar) a ler o livro.","e":"-çar → -cei.","a":["comecei"]},{"t":"fill","q":"Vocês ___ (abrir) a janela?","e":"-ir, 3e du pluriel : -iram.","a":["abriram"]},{"t":"trans","q":"Hier, j'ai mangé du poisson.","e":"Passé composé → pretérito perfeito.","a":["ontem comi peixe","ontem eu comi peixe","comi peixe ontem"]},{"t":"trans","q":"Nous avons parlé avec João.","e":"falámos (Portugal).","a":["falámos com o joão","nós falámos com o joão","falamos com o joão"]}],"prod":{"c":"Racontez votre journée d'hier avec des verbes réguliers au pretérito perfeito.","n":"5 à 7 phrases"}},{"id":"L23","lv":"A2","title":"Le pretérito perfeito des verbes irréguliers","obj":"Conjuguer au passé les verbes irréguliers les plus fréquents.","refs":"EG §7.2, p. 72-75 ; LI §3.5.3, p. 73-77","expl":"Ces verbes ont un **radical propre** au passé et des terminaisons particulières (souvent sans accent à la 1re personne) :\n| infinitif | eu | tu | ele / você | nós | eles / vocês |\n| ser / ir | fui | foste | foi | fomos | foram |\n| estar | estive | estiveste | esteve | estivemos | estiveram |\n| ter | tive | tiveste | teve | tivemos | tiveram |\n| fazer | fiz | fizeste | fez | fizemos | fizeram |\n| dizer | disse | disseste | disse | dissemos | disseram |\n| trazer | trouxe | trouxeste | trouxe | trouxemos | trouxeram |\n| poder | pude | pudeste | **pôde** | pudemos | puderam |\n| querer | quis | quiseste | quis | quisemos | quiseram |\n| saber | soube | soubeste | soube | soubemos | souberam |\n| pôr | pus | puseste | **pôs** | pusemos | puseram |\n| vir | vim | vieste | veio | viemos | vieram |\n| ver | vi | viste | viu | vimos | viram |\n| dar | dei | deste | deu | demos | deram |\n| haver | — | — | houve | — | — |\n\n**Ser** et **ir** ont le même passé : *Fui ao Porto* (je suis allé à Porto) ; *Foi incrível* (c'était incroyable). Le contexte tranche.\n\n*Pôde* (il a pu) prend un accent pour se distinguer de *pode* (il peut). *Pôs* (il a mis) s'oppose à *pus* (j'ai mis).","ex":[{"pt":"Fui a Lisboa no verão.","fr":"Je suis allé à Lisbonne cet été."},{"pt":"O que fizeste ontem? — Estive em casa.","fr":"Qu'as-tu fait hier ? — Je suis resté à la maison."},{"pt":"Ela não pôde vir.","fr":"Elle n'a pas pu venir."},{"pt":"Eles vieram de comboio.","fr":"Ils sont venus en train."},{"pt":"Houve um problema.","fr":"Il y a eu un problème."}],"pit":["*Fui* = je suis allé **ou** j'ai été.","*Vimos* : nous avons vu (ver) **ou** nous venons (vir, présent) ; *viemos* : nous sommes venus.","*Estive em casa* : « je suis resté / j'étais à la maison » (état limité dans le temps)."],"qs":[{"t":"fill","q":"Ontem eu ___ (ir) ao cinema.","e":"ir : fui.","a":["fui"]},{"t":"fill","q":"O jantar ___ (ser) ótimo.","e":"ser : foi.","a":["foi"]},{"t":"fill","q":"Eu ___ (estar) doente na semana passada.","e":"estar : estive.","a":["estive"]},{"t":"fill","q":"Tu ___ (ter) sorte!","e":"ter : tiveste.","a":["tiveste"]},{"t":"fill","q":"O que é que vocês ___ (fazer) no domingo?","e":"fazer : fizeram.","a":["fizeram"]},{"t":"fill","q":"Ele não ___ (poder) vir.","e":"poder, 3e personne : pôde (accent).","a":["pôde"]},{"t":"fill","q":"Eu ___ (pôr) as chaves na mesa.","e":"pôr : pus.","a":["pus"]},{"t":"fill","q":"Ela ___ (vir) de autocarro.","e":"vir, 3e personne : veio.","a":["veio"]},{"t":"fill","q":"Nós ___ (ver) o filme ontem.","e":"ver : vimos.","a":["vimos"]},{"t":"fill","q":"Ele ___ (dizer) que sim.","e":"dizer : disse.","a":["disse"]},{"t":"fill","q":"___ (haver) um acidente.","e":"haver au passé : houve.","a":["houve"]},{"t":"trans","q":"Je ne l'ai pas su. / Je n'ai pas su.","e":"saber : soube.","a":["não soube"]}],"prod":{"c":"Racontez un voyage ou une sortie récente avec des verbes irréguliers au passé (fui, estive, fiz, vi, tive, vieram…).","n":"6 à 8 phrases"}},{"id":"L24","lv":"A2","title":"L'imparfait (pretérito imperfeito)","obj":"Décrire le passé et exprimer l'habitude avec l'imparfait.","refs":"EG §7.2, p. 75-77 ; UP §5.1.3, p. 139-141 ; LI §3.5.2.2, p. 71-72","expl":"| | **falar** | **comer** | **partir** |\n| eu | falava | comia | partia |\n| tu | falavas | comias | partias |\n| ele / ela / você | falava | comia | partia |\n| nós | falávamos | comíamos | partíamos |\n| eles / elas / vocês | falavam | comiam | partiam |\n\nQuatre verbes seulement sont irréguliers : **ser** (*era, eras, era, éramos, eram*), **ter** (*tinha*), **vir** (*vinha*), **pôr** (*punha*).\n\nEmplois, proches du français :\n- **habitude** passée : *Quando era criança, ia à praia todos os dias.* ;\n- **description**, cadre, âge, heure : *Era uma casa grande. Tinha dez anos. Eram oito horas.* ;\n- action **en cours** dans le passé : *Estava a ler quando ligaste* (je lisais quand tu as appelé).\n\nEmplois propres au portugais européen :\n- **politesse** : *Queria um café. Podia ajudar-me?* (Pourriez-vous m'aider ?) ;\n- **conditionnel** à l'oral : *Se tivesse tempo, ia contigo* (j'irais avec toi). L'imparfait remplace souvent le conditionnel dans la conversation.","ex":[{"pt":"Quando eu era pequeno, morava em Coimbra.","fr":"Quand j'étais petit, j'habitais à Coimbra."},{"pt":"Todos os sábados, íamos ao mercado.","fr":"Tous les samedis, nous allions au marché."},{"pt":"A casa tinha um jardim enorme.","fr":"La maison avait un jardin immense."},{"pt":"Podia repetir, por favor?","fr":"Pourriez-vous répéter, s'il vous plaît ?"},{"pt":"Eu gostava de ir, mas não posso.","fr":"J'aimerais y aller, mais je ne peux pas."}],"pit":["*Íamos, comíamos, éramos* : accent à la 1re personne du pluriel.","*Podia*, *queria*, *gostava* au sens de « pourrais, voudrais, aimerais » : très courant au Portugal.","*Ia* (j'allais) vient de *ir* ; à ne pas confondre avec *era* (j'étais)."],"qs":[{"t":"fill","q":"Quando era criança, eu ___ (brincar) na rua.","e":"-ar : -ava.","a":["brincava"]},{"t":"fill","q":"Nós ___ (morar) em Paris.","e":"-ar, nous : -ávamos.","a":["morávamos"]},{"t":"fill","q":"Ela ___ (comer) sempre fruta.","e":"-er : -ia.","a":["comia"]},{"t":"fill","q":"Eles ___ (viver) no campo.","e":"-ir : -iam.","a":["viviam"]},{"t":"fill","q":"Eu ___ (ser) muito tímido.","e":"ser : era.","a":["era"]},{"t":"fill","q":"A casa ___ (ter) três quartos.","e":"ter : tinha.","a":["tinha"]},{"t":"fill","q":"Todos os dias nós ___ (ir) à escola a pé.","e":"ir : íamos.","a":["íamos"]},{"t":"fill","q":"___ (poder) ajudar-me? (forme polie, vous)","e":"Imparfait de politesse : podia.","a":["podia"]},{"t":"fill","q":"___ (querer) uma bica, se faz favor. (je)","e":"Politesse : queria.","a":["queria"]},{"t":"fill","q":"Antigamente ela ___ (vir) muitas vezes cá.","e":"vir : vinha.","a":["vinha"]},{"t":"trans","q":"Il était huit heures.","e":"Heure dans le passé : imparfait de ser, au pluriel.","a":["eram oito horas"]}],"prod":{"c":"Décrivez votre enfance : où vous habitiez, ce que vous faisiez le dimanche, comment était votre maison (imparfait).","n":"6 à 8 phrases"}},{"id":"L25","lv":"A2","title":"Perfeito ou imperfeito ?","obj":"Choisir le bon passé pour raconter un événement.","refs":"EG §7.2, p. 72-77 ; UP §5.1.2-5.1.3, p. 138-141","expl":"Le choix suit à peu près celui du français entre **passé composé** et **imparfait** :\n| perfeito (falei) | imperfeito (falava) |\n| événement ponctuel, achevé | décor, description, état |\n| action qui fait avancer le récit | action en cours, interrompue |\n| durée délimitée : *Morei lá dois anos.* | habitude : *Morava lá quando era jovem.* |\n| marqueurs : *ontem, de repente, uma vez, em 2010* | marqueurs : *sempre, todos os dias, antigamente, enquanto* |\n\nDans un récit, l'imparfait **pose le décor** et le perfeito **raconte ce qui arrive** :\n*Estava a chover e eu estava em casa. De repente, o telefone tocou.*\n\nPour l'action en cours dans le passé, le Portugal emploie **estava a + infinitif** : *Estava a jantar quando chegaste.*\n\nUne durée close prend le perfeito, même longue : *Vivi dez anos em Lisboa* (j'ai vécu dix ans à Lisbonne, c'est terminé).","ex":[{"pt":"Quando cheguei, estava a chover.","fr":"Quand je suis arrivé, il pleuvait."},{"pt":"Eu dormia quando o telefone tocou.","fr":"Je dormais quand le téléphone a sonné."},{"pt":"Antigamente ia muito ao cinema; ontem fui outra vez.","fr":"Avant j'allais souvent au cinéma ; hier j'y suis retourné."},{"pt":"Morei três anos no Porto.","fr":"J'ai habité trois ans à Porto."}],"pit":["Durée délimitée = perfeito : *Estudei português dois anos.*","*Quando* + perfeito pour l'événement ; imparfait pour le décor.","*Estava a fazer* : action en cours, interrompue."],"qs":[{"t":"choice","q":"Ontem ___ ao cinema.","e":"Événement ponctuel : perfeito.","o":["ia","fui"],"c":1},{"t":"choice","q":"Quando era criança, ___ ao cinema todos os sábados.","e":"Habitude : imperfeito.","o":["ia","fui"],"c":0},{"t":"choice","q":"Quando cheguei, ___ a chover.","e":"Décor, action en cours : imperfeito.","o":["estava","esteve"],"c":0},{"t":"choice","q":"Eu ___ quando o telefone tocou.","e":"Action interrompue : imperfeito.","o":["dormi","dormia"],"c":1},{"t":"choice","q":"De repente, a luz ___ .","e":"Événement soudain : perfeito.","o":["apagava-se","apagou-se"],"c":1},{"t":"choice","q":"___ dez anos em Lisboa, depois mudei-me.","e":"Durée délimitée et close : perfeito.","o":["Vivia","Vivi"],"c":1},{"t":"fill","q":"Antigamente eu ___ (ler) muito.","e":"Habitude passée : imperfeito.","a":["lia"]},{"t":"fill","q":"No ano passado ___ (ir, eu) ao Brasil.","e":"Événement daté : perfeito.","a":["fui"]},{"t":"fill","q":"A casa ___ (ter) um jardim enorme.","e":"Description : imperfeito (tinha).","a":["tinha"]},{"t":"trans","q":"Il pleuvait quand je suis sorti.","e":"Décor : imperfeito ; événement : perfeito.","a":["estava a chover quando saí","chovia quando saí","quando saí, estava a chover","quando saí estava a chover"]}],"prod":{"c":"Racontez un petit incident en posant le décor à l'imparfait puis en racontant l'action au perfeito.","n":"6 à 8 phrases"}},{"id":"L26","lv":"A2","title":"Les pronoms compléments directs","obj":"Remplacer un complément direct par o, a, os, as et leurs variantes -lo et -no.","refs":"EG §5.1, p. 45-49 ; LI §4.5.2.2, p. 113-114","expl":"| | personne | pronom COD |\n| me | moi | me |\n| te | toi | te |\n| le, la (il, elle, vous) | ele, ela, você, o senhor | **o, a** |\n| nous | nós | nos |\n| les, vous (pl.) | eles, elas, vocês | **os, as** |\n\n**Place** : mêmes règles que les pronoms réfléchis (L21). Affirmative → après le verbe : *Vejo-o.* Négation, adverbe, question avec interrogatif, subordonnée → devant : *Não o vejo.*\n\n**Formes de liaison** après le verbe :\n- verbe terminé par **-r, -s, -z** : la consonne tombe et le pronom devient **lo, la, los, las** — *comprar + o → comprá-lo* ; *fazemos + o → fazemo-lo* ; *fez + o → fê-lo*. Accent sur la voyelle qui devient finale : *comprá-lo, vendê-lo, parti-lo*.\n- verbe terminé par un son **nasal** (*-m, -ão, -õe*) : **no, na, nos, nas** — *compram-no, dão-na, põe-nos*.\n\nÀ l'oral, beaucoup de Portugais évitent ces formes en répétant le nom ou en l'omettant : *Viste o filme? — Vi.*","ex":[{"pt":"Conheces a Ana? — Conheço-a muito bem.","fr":"Tu connais Ana ? — Je la connais très bien."},{"pt":"Não o vejo há anos.","fr":"Je ne l'ai pas vu depuis des années."},{"pt":"Vou comprá-lo amanhã.","fr":"Je vais l'acheter demain."},{"pt":"Eles fizeram-no ontem.","fr":"Ils l'ont fait hier."},{"pt":"Onde é que puseste as chaves? — Pu-las na mesa.","fr":"Où as-tu mis les clés ? — Je les ai mises sur la table."}],"pit":["*Comprá-lo* : le -r disparaît et l'accent apparaît.","*Fazem-no* (ils le font) : après -m, la forme est *no*.","Au Brésil, *eu vi ele* est courant à l'oral, mais incorrect au Portugal."],"qs":[{"t":"fill","q":"Conheces o Pedro? — Sim, conheço-___.","e":"Pedro : masculin singulier → o.","a":["o"]},{"t":"fill","q":"Viste a Maria? — Não, não ___ vi.","e":"Négation : a avant le verbe.","a":["a"]},{"t":"transf","q":"Remplacez « o livro » par un pronom : Vou comprar o livro.","e":"-r tombe : comprá-lo.","a":["vou comprá-lo"]},{"t":"transf","q":"Remplacez « a carta » par un pronom : Eles escrevem a carta.","e":"Après -m : na.","a":["eles escrevem-na","escrevem-na"]},{"t":"transf","q":"Remplacez « o bolo » par un pronom : Fazemos o bolo.","e":"-s tombe : fazemo-lo.","a":["fazemo-lo"]},{"t":"transf","q":"Remplacez « os documentos » par un pronom : Não tenho os documentos.","e":"Négation : os avant le verbe.","a":["não os tenho"]},{"t":"fill","q":"Ajudas-___? (moi)","e":"me après le verbe.","a":["me"]},{"t":"choice","q":"« Je l'ai vu hier. » (Portugal)","e":"Enclise : vi-o.","o":["Eu vi ele ontem.","Vi-o ontem.","O vi ontem."],"c":1},{"t":"choice","q":"« Ils l'achètent. » (la maison)","e":"Après une terminaison nasale : na.","o":["Eles compram-a.","Eles compram-na.","Eles compram-la."],"c":1},{"t":"trans","q":"Je ne le sais pas.","e":"Négation : o avant le verbe (ou omission à l'oral).","a":["não o sei","não sei"]}],"prod":{"c":"Répondez à ces questions en remplaçant le complément par un pronom : Viste o último filme de Almodóvar ? Compraste o pão ? Conheces a Ana ? Fazes o jantar hoje ? Leste os jornais ?","n":"5 réponses"}},{"id":"L27","lv":"A2","title":"Les pronoms compléments indirects","obj":"Employer me, te, lhe, nos, lhes avec les verbes qui se construisent avec a.","refs":"EG §5.1, p. 49-51 ; LI §4.5.2.3, p. 114","expl":"| | COI |\n| à moi | me |\n| à toi | te |\n| à lui, à elle, à vous (você, o senhor) | **lhe** |\n| à nous | nos |\n| à eux, à elles, à vous (vocês) | **lhes** |\n\nLe COI répond à « à qui ? » : *dar, dizer, mostrar, perguntar, responder, telefonar, escrever, emprestar, pedir… **a** alguém*.\n*Dou o livro ao João → Dou-lhe o livro.* *Telefono à Ana → Telefono-lhe.*\n\nLa place suit les mêmes règles que pour les autres pronoms : *Diz-me a verdade. Não lhe disse nada.*\n\n**Lhe** sert aussi de « vous » de politesse : *Posso fazer-lhe uma pergunta?* (Puis-je vous poser une question ?)\n\nQuand COI et COD se rencontrent, ils fusionnent : *me + o = mo, lhe + o = lho* — *Dás-mo?* (Tu me le donnes ?). Ces formes s'entendent surtout à l'écrit et dans un registre soigné ; à l'oral, on omet souvent le COD : *Dás-me?*","ex":[{"pt":"Diz-me o teu nome.","fr":"Dis-moi ton nom."},{"pt":"Telefonei-lhe ontem.","fr":"Je lui ai téléphoné hier."},{"pt":"Não lhes disse nada.","fr":"Je ne leur ai rien dit."},{"pt":"Posso fazer-lhe uma pergunta?","fr":"Puis-je vous poser une question ?"},{"pt":"Mostras-nos a cidade?","fr":"Tu nous montres la ville ?"}],"pit":["*Telefonar a alguém* : COI (*telefonei-lhe*), comme en français.","*Ajudar alguém* : COD en portugais (*ajudo-o*), comme en français.","*Lhe* = à lui, à elle **ou** à vous."],"qs":[{"t":"transf","q":"Remplacez « ao João » par un pronom : Dou o livro ao João.","e":"ao João → lhe.","a":["dou-lhe o livro"]},{"t":"transf","q":"Remplacez « à Ana » par un pronom : Telefono à Ana amanhã.","e":"à Ana → lhe.","a":["telefono-lhe amanhã"]},{"t":"transf","q":"Remplacez « aos alunos » par un pronom : Explico a regra aos alunos.","e":"aos alunos → lhes.","a":["explico-lhes a regra"]},{"t":"fill","q":"Diz-___ a verdade! (à moi)","e":"me après l'impératif affirmatif.","a":["me"]},{"t":"fill","q":"Não ___ disse nada. (à lui)","e":"Négation : lhe avant le verbe.","a":["lhe"]},{"t":"fill","q":"Escreves-___? (à nous)","e":"nos.","a":["nos"]},{"t":"fill","q":"Posso fazer-___ uma pergunta? (à vous, poli)","e":"lhe = à vous.","a":["lhe"]},{"t":"choice","q":"« Je lui ai demandé l'heure. »","e":"perguntar a alguém : COI → lhe.","o":["Perguntei-o as horas.","Perguntei-lhe as horas."],"c":1},{"t":"choice","q":"« Je l'aide. »","e":"ajudar alguém : COD → o.","o":["Ajudo-lhe.","Ajudo-o."],"c":1},{"t":"trans","q":"Je leur ai écrit.","e":"escrever a alguém : lhes.","a":["escrevi-lhes","eu escrevi-lhes"]}],"prod":{"c":"Écrivez un message à un collègue pour lui dire ce que vous avez envoyé, dit et demandé à chacun (lhe, lhes, me, te).","n":"5 phrases"}},{"id":"L28","lv":"A2","title":"Les pronoms après une préposition","obj":"Employer mim, ti, si, comigo, contigo, consigo, connosco.","refs":"EG §5.1, p. 51-52 ; LI §4.5.2.4, p. 114-116","expl":"Après une préposition (*para, de, por, sem, a…*), on emploie :\n| | après préposition | avec com |\n| eu | **mim** | **comigo** |\n| tu | **ti** | **contigo** |\n| ele / ela | ele / ela | com ele / com ela |\n| você, o senhor | **si** (Portugal) ou *você* | **consigo** (Portugal) |\n| nós | nós | **connosco** |\n| vocês | vocês | **convosco** / com vocês |\n\nParticularité européenne : avec *você* ou *o senhor*, on dit volontiers **para si** (pour vous) et **consigo** (avec vous) : *Isto é para si. Posso falar consigo?* *Consigo* signifie aussi « avec soi » (réfléchi).\n\nContractions avec *de* et *em* : *dele, dela, deles, delas ; nele, nela*.\n\n**Connosco** s'écrit avec deux *n* au Portugal (*conosco* au Brésil).","ex":[{"pt":"Este presente é para ti.","fr":"Ce cadeau est pour toi."},{"pt":"Vens comigo?","fr":"Tu viens avec moi ?"},{"pt":"Gosto muito dela.","fr":"Je l'aime beaucoup (elle)."},{"pt":"Posso falar consigo um momento?","fr":"Puis-je vous parler un instant ?"},{"pt":"Eles jantam connosco no sábado.","fr":"Ils dînent avec nous samedi."}],"pit":["« Pour moi » : *para mim* (jamais *para eu*, sauf devant un infinitif : *para eu fazer*).","*Comigo, contigo* : une seule forme, pas de *com mim*.","*Consigo* = avec vous (poli) au Portugal ; c'est aussi la 1re personne de *conseguir* (*consigo* = je réussis)."],"qs":[{"t":"fill","q":"Isto é para ___. (moi)","e":"Après préposition : mim.","a":["mim"]},{"t":"fill","q":"Vens ___? (avec moi)","e":"com + eu = comigo.","a":["comigo"]},{"t":"fill","q":"Vou ___. (avec toi)","e":"com + tu = contigo.","a":["contigo"]},{"t":"fill","q":"Eles vêm jantar ___. (avec nous)","e":"com + nós = connosco (Portugal).","a":["connosco"]},{"t":"fill","q":"Gosto muito ___ . (de + ela)","e":"de + ela = dela.","a":["dela"]},{"t":"fill","q":"Posso falar ___? (avec vous, poli)","e":"Portugal : consigo.","a":["consigo","com o senhor","com a senhora","com você"]},{"t":"choice","q":"« C'est pour toi. »","e":"Après préposition : ti.","o":["É para tu.","É para ti.","É para te."],"c":1},{"t":"choice","q":"« Sans moi » :","e":"Après préposition : mim.","o":["sem eu","sem mim","sem me"],"c":1},{"t":"trans","q":"Ce café est pour vous. (poli, Portugal)","e":"Portugal : para si.","a":["este café é para si","este café é para o senhor","este café é para a senhora","este café é para você"]}],"prod":{"c":"Écrivez un mot d'invitation : avec qui vous venez, pour qui sont les cadeaux, qui dîne avec vous (comigo, contigo, connosco, para si).","n":"5 phrases"}},{"id":"L29","lv":"A2","title":"Comparer : mais… do que, melhor, -íssimo","obj":"Former les comparatifs et les superlatifs, y compris les formes irrégulières.","refs":"EG §4.3, p. 36-40 ; §11.7, p. 122-123","expl":"**Comparatifs** :\n| supériorité | **mais** + adj. + **(do) que** | *O Porto é mais pequeno do que Lisboa.* |\n| infériorité | **menos** + adj. + **(do) que** | *Este é menos caro que aquele.* |\n| égalité | **tão** + adj. + **como** (ou *quanto*) | *Ela é tão alta como o irmão.* |\n| égalité (quantité) | **tanto, tanta, tantos, tantas** + nom + **como** | *Tenho tantos livros como tu.* |\n\n*Do que* et *que* sont tous deux corrects ; *do que* est plus fréquent à l'oral.\n\n**Formes irrégulières** :\n| bom → **melhor** | mau → *
