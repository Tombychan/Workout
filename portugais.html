<style>
:root{
  --bg:#FAF7F2; --card:#FFFFFF; --card-alt:#F5F0E8; --text:#2C2416; --muted:#8C7E6A; --light:#B5A898;
  --accent:#D4A574; --accent-dark:#B8854A; --accent-light:#F0DCC8; --border:#E8E0D4;
  --pt:#2F5D8C; --pt-soft:#E6EEF6;
  --ok:#3F7A4A; --ok-soft:#E4F0E2; --warn:#A8701E; --warn-soft:#FBEFD9; --bad:#A6453A; --bad-soft:#F7E3DF;
  --radius:14px; --radius-sm:8px;
  --f:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono:"DM Mono", ui-monospace, monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);font-size:16px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
a{color:var(--accent-dark)}
button{font:inherit;color:inherit}
.top{background:linear-gradient(135deg,#3D3020,#5A4630);color:#FAF7F2;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top .back{color:#E8D9C4;text-decoration:none;font-size:.85rem;white-space:nowrap}
.top h1{margin:0;font-size:1.25rem;letter-spacing:.01em}
.top p{margin:0;font-size:.78rem;color:#D9C9B2;font-family:var(--mono)}
.top .brand{flex:1;min-width:0}
.streak{font-family:var(--mono);font-size:.82rem;background:rgba(255,255,255,.12);padding:5px 10px;border-radius:999px;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:1.15rem;margin:22px 0 10px}
h3{font-size:1rem;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(44,36,22,.05)}
.card.alt{background:var(--card-alt)}
.muted{color:var(--muted)} .small{font-size:.85rem} .mono{font-family:var(--mono)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:1px solid var(--accent-dark);background:var(--card);color:var(--accent-dark);padding:9px 16px;border-radius:var(--radius-sm);cursor:pointer;font-weight:500;min-height:42px}
.btn.primary{background:var(--accent-dark);color:#fff;border-color:var(--accent-dark)}
.btn.ghost{border-color:var(--border);color:var(--muted)}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--pt);outline-offset:2px}
.btn.g0{border-color:var(--bad);color:var(--bad)} .btn.g1{border-color:var(--warn);color:var(--warn)}
.btn.g2{border-color:var(--ok);color:var(--ok)} .btn.g3{border-color:var(--pt);color:var(--pt)}
.btn.sel{color:#fff} .btn.g0.sel{background:var(--bad)} .btn.g1.sel{background:var(--warn)} .btn.g2.sel{background:var(--ok)} .btn.g3.sel{background:var(--pt)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.grades .btn{padding:8px 4px;font-size:.85rem}
.chip{border:1px solid var(--border);background:var(--card);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--accent-dark);color:#fff;border-color:var(--accent-dark)}
input[type=text],input[type=search],input[type=password],input[type=number],textarea,select{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text)}
textarea{min-height:140px;resize:vertical}
input.answer{font-size:1.1rem}
.pt{color:var(--pt)}
.big{font-size:1.6rem;font-weight:700;line-height:1.25}
.say{border:0;background:var(--pt-soft);color:var(--pt);border-radius:999px;width:34px;height:34px;cursor:pointer;flex:none;font-size:.95rem;vertical-align:middle}
.say:active{transform:scale(.94)}
.verdict{border-radius:var(--radius-sm);padding:10px 12px;margin-top:10px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.near{background:var(--warn-soft);color:var(--warn)} .verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict b{color:var(--text)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;text-align:left;min-height:110px;display:flex;flex-direction:column;gap:4px}
.tile .ic{font-size:1.3rem}
.tile .t{font-weight:700}
.tile .s{font-size:.82rem;color:var(--muted)}
.tile.done{background:var(--ok-soft);border-color:#CFE3CB}
.tile.done .t::after{content:" ✓";color:var(--ok)}
.progress{height:8px;background:var(--card-alt);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.list{list-style:none;padding:0;margin:0}
.list li{border-bottom:1px solid var(--border);padding:10px 2px;display:flex;gap:10px;align-items:center}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list button.link{all:unset;cursor:pointer;display:block;width:100%}
.badge{font-family:var(--mono);font-size:.72rem;padding:2px 7px;border-radius:999px;background:var(--card-alt);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.cur{background:var(--accent-light);color:var(--accent-dark)}
.lesson p{margin:.6em 0}
.lesson ul{padding-left:1.2em;margin:.4em 0}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;font-size:.9rem;min-width:100%}
th,td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--card-alt);font-weight:700}
.ex{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--border)}
.ex:last-child{border-bottom:0}
.ex .fr{color:var(--muted);font-size:.9rem}
.refs{font-size:.82rem;color:var(--muted);font-family:var(--mono)}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;border:1px solid var(--border);background:#fff;border-radius:var(--radius-sm);padding:11px 12px;cursor:pointer}
.opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.runbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.runbar .progress{flex:1}
.runbar .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.9rem}
.q{font-size:1.12rem;margin:4px 0 10px}
.blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--accent);color:var(--accent-dark)}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;max-width:128px;border:0;background:none;padding:8px 2px 9px;cursor:pointer;color:var(--muted);font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .i{font-size:1.15rem;line-height:1}
.tabs button[aria-current="page"]{color:var(--accent-dark);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2C2416;color:#fff;padding:9px 16px;border-radius:999px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:10}
#toast.on{opacity:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:64px;margin-top:8px}
.week div{background:var(--accent-light);border-radius:6px 6px 2px 2px;min-height:4px}
.week div.on{background:var(--accent)}
.weekl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:.7rem;color:var(--muted);text-align:center;font-family:var(--mono)}
.conj{width:100%}
.conj td:first-child{color:var(--muted);white-space:nowrap}
.kbd{font-family:var(--mono);font-size:.75rem;color:var(--light)}
details summary{cursor:pointer;color:var(--accent-dark);font-weight:500}
.field{margin:10px 0}
.field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.hr{height:1px;background:var(--border);margin:14px 0}
@media (max-width:380px){.tiles{grid-template-columns:1fr}.big{font-size:1.35rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.lesson h4{font-size:.98rem;margin:18px 0 6px;color:var(--accent-dark)}
.tile.wide{grid-column:1 / -1;min-height:auto}
.notebox{margin-bottom:12px}
.chip[disabled],.btn[disabled]{opacity:.5;cursor:not-allowed}
details.card>summary{margin:-2px 0}

</style>
</head>

am"],"subj":["construa","construas","construa","construamos","construam"]},"pp":"construído","imp":["constrói","construa","construam"]}]},"lecons":[{"id":"L01","lv":"A1","title":"Les sons et l'écriture du portugais européen","obj":"Lire et prononcer le portugais du Portugal : voyelles ouvertes, fermées, réduites et nasales, consonnes, diphtongues, accent tonique et signes diacritiques.","refs":"EG §1.1-1.5, p. 3-8 ; UP §2.1, p. 35-40 ; LI §2.4, p. 37-43","expl":"### Pourquoi le portugais du Portugal déroute l'oreille\nLe portugais européen **réduit, voire avale, les voyelles qui ne portent pas l'accent tonique**. *Telefone* se dit à peu près « t'l'fón' », *pequeno* « p'kénou », *depois* « d'pôïch ». Dans la conversation rapide, une voyelle finale peut disparaître tout à fait : *hoje* devient « ôj' ». La langue prend ainsi un caractère très consonantique, alors que le portugais du Brésil prononce ses voyelles avec netteté. C'est la première difficulté d'écoute pour un francophone : la syllabe accentuée est claire, les autres sont estompées. Écoutez chaque mot avec le bouton 🔊 et répétez-le en marquant fortement la syllabe tonique.\n\nLes équivalences ci-dessous sont des approximations pour une oreille française ; seule l'écoute les fixe.\n\n### Les voyelles orales\nChaque voyelle a plusieurs timbres selon qu'elle est accentuée ou non.\n| lettre | accentuée, ouverte | accentuée, fermée | non accentuée |\n| a | **á** ouvert, comme dans « patte » : *lá, já, sapato* | **â**, et a devant m, n, nh : *câmara, cama, ano, banho* | [ɐ], proche du « e » de « le » : *casa, pagar, falamos* |\n| e | **é** ouvert, comme « è » : *pé, café, sete* | **ê** fermé, comme « é » : *você, mês, cabelo* | [ə], très bref ou muet : *pequeno, noite, telefone* |\n| o | **ó** ouvert : *avó, loja, porta* | **ô** fermé : *avô, ovo, todo* | [u], « ou » : *obrigado, comer, livro* |\n| i | « i » : *fita, vinho, aqui* | — | « i », souvent très bref |\n| u | « ou » : *luta, rua, tu* | — | « ou » |\n\nTrois cas particuliers :\n- la conjonction **e** (et) se prononce « i » ;\n- un **e initial** non accentué se prononce « i », ou s'efface presque devant s : *elefante* ≈ « ilifant' », *estar* ≈ « ichtar », *escola* ≈ « ichkóla » ;\n- au Portugal, **-amos** du présent (*falamos*, a fermé) s'oppose à **-ámos** du passé (*falámos*, a ouvert). Le Brésil ne fait pas cette différence et n'écrit pas d'accent.\n\n### Le « l » final et le timbre qui change au pluriel\nLe **l en fin de syllabe** est un « l sombre », prononcé au fond de la bouche : *Portugal, mal, alto, Brasil*. Au Brésil, il se vocalise en « ou » (*Brasil* ≈ « braziou »).\n\nBeaucoup de noms et d'adjectifs dont le **o tonique est fermé au masculin singulier l'ouvrent au féminin et au pluriel** : *o ovo* [ô] → *os ovos* [ó] ; *novo* [ô] → *nova, novos, novas* [ó]. Même chose pour *jogo, olho, corpo, porto, povo, fogo, osso, almoço* et tous les adjectifs en *-oso* (*famoso, gostoso, generoso*). Ce changement, appelé métaphonie, ne s'écrit pas et ne se devine pas : *bolo* et *gosto* gardent un o fermé au pluriel.\n\n### Les voyelles nasales\nUne voyelle est nasale :\n- quand elle porte un **tilde** : *lã, irmã, mãe* ;\n- quand elle est suivie de **m ou n dans la même syllabe**, c'est-à-dire devant une consonne ou en fin de mot : *campo, canto, entre, tempo, sim, tinta, onde, com, um, mundo*.\n\nOn ne prononce alors **ni le m ni le n** : *com* ≈ « kõ », *tempo* ≈ « tẽpou ». Si le m ou le n commence la syllabe suivante, la voyelle n'est pas nasale au Portugal : *ca-ma, a-no, ba-nho* ont un a fermé, sans nasalisation (le Brésil, lui, les nasalise légèrement). Exception notable : *muito* se prononce avec un i nasal, « mũĩtou ».\n\n### Les diphtongues\n| diphtongue | exemple | remarque |\n| ai | *pai, mais* | « aï » |\n| au | *mau, Paulo* | « aou » |\n| ei | *lei, primeiro* | à Lisbonne, souvent « âï » ; dans le Nord, « éï » |\n| eu | *teu, meu* | e fermé + ou |\n| éu | *chapéu, céu* | e ouvert + ou |\n| iu | *partiu, viu* | « iou » |\n| oi, ói | *foi, dói, sóis* | « oï » (ouvert si accent aigu) |\n| ou | *sou, outro, ouro* | dans la norme de Lisbonne, un simple ô fermé |\n| ui | *fui, muito* | « ouï » |\n| ãe | *mãe, cães* | nasale « ãï » |\n| ão | *pão, não, falam* | nasale « ãou » |\n| õe | *põe, lições* | nasale « õï » |\n| em, -ens | *bem, também, homem, jovens* | à Lisbonne « ãï » (*bem* ≈ « bãï ») ; dans le Nord, « ẽï » |\n\nLa terminaison verbale **-am** non accentuée se prononce comme **-ão** : *falam* ≈ « FA-lãou ». Seule la place de l'accent la distingue de *falarão* (« fala-RÃO », ils parleront).\n\n### Les consonnes\n| graphie | prononciation | exemples |\n| c + a, o, u | « k » | *casa, cor, curto* |\n| c + e, i ; ç + a, o, u | « s » | *cidade, cinco ; praça, açúcar, aço* |\n| g + a, o, u | « g » dur | *gato, gosto* |\n| g + e, i ; j | « j » | *gelo, gira ; já, hoje* |\n| gu, qu + e, i | « g », « k » : le u est muet | *guerra, guitarra ; quente, quinta, máquina* |\n| gu, qu + a, o | le u se prononce | *água, guarda ; quatro, quando* |\n| h | toujours muet | *hora, homem, hoje* |\n| ch | « ch » | *chave, chá* |\n| lh | « li » mouillé de « million » | *filho, trabalho, mulher* |\n| nh | « gn » de « montagne » | *vinho, amanhã, senhor* |\n| r entre voyelles, après consonne | r battu, un seul coup de langue | *caro, para, três, porta* |\n| r initial, rr, r après l, n, s | r fort, à Lisbonne proche du r français | *rua, carro, honra, Israel* |\n| s initial, après consonne, ss | « s » | *sapato, pensar, passar* |\n| s entre voyelles | « z » | *casa, mesa, rosa* |\n| s final ou devant p, t, c, f | « ch » | *dois, festa, escola, mosca* |\n| s devant b, d, g, l, m, n, r, v | « j » | *mesmo, Lisboa, desde, rasgar* |\n| s final + voyelle du mot suivant | « z » | *os amigos* ≈ « ouzamigouch » |\n| z initial ou entre voyelles | « z » | *zero, dizer* |\n| z final | « ch » | *luz, feliz, dez* |\n\n**Le x** a quatre valeurs, qu'il faut apprendre mot par mot : « ch » (*peixe, baixo, xadrez, explicar*), « z » dans *ex-* suivi d'une voyelle (*exame, existir, exemplo, êxito*), « ks » (*táxi, tórax, fixo*), « s » (*próximo, máximo, trouxe, auxílio*).\n\nLe u se prononce aussi dans quelques mots en *gue, gui, que, qui* : *cinquenta, frequente, tranquilo, aguentar*.\n\n**t et d** restent toujours francs au Portugal : *tia, dia, noite* ; au Brésil, ils deviennent « tch » et « dj » devant un i ou un e final (*tia* ≈ « tchia », *noite* ≈ « noïtchi »).\n\n### L'accent tonique\n- **Sans accent écrit**, un mot terminé par **-a, -e, -o** (suivis ou non de -s), **-am, -em, -ens** porte l'accent sur l'**avant-dernière** syllabe : *ca-sa, ci-da-des, fa-lam, ho-mem, jo-vens*.\n- **Sans accent écrit**, un mot terminé par **-i, -u** (suivis ou non de -s), **-r, -l, -z, -x, -im, -um, -om** porte l'accent sur la **dernière** syllabe : *a-qui, pe-ru, fa-lar, pa-pel, fe-liz, jar-dim, co-mum*.\n- **Tout mot qui échappe à ces deux règles porte un accent écrit** sur la syllabe tonique : *ca-fé, vo-cê, a-vó* (terminés par une voyelle mais accentués à la fin) ; *fá-cil, lá-pis, ú-til* (terminés par -l ou -s mais accentués avant).\n- Tous les mots accentués sur l'**antépénultième** syllabe portent un accent écrit : *mé-di-co, mú-si-ca, úl-ti-mo, fós-fo-ro*.\n- Le **tilde** signale en général la syllabe tonique (*ir-mã, a-le-mão*), sauf si un autre accent figure dans le mot : *ór-fão, ór-gão*.\n- Un **i ou un u tonique placé après une autre voyelle** prend un accent aigu pour ne pas former de diphtongue : *país* (pa-ís, le pays) contre *pais* (les parents), *saúde, saída*.\n- Les mots terminés par une voyelle + *-ia, -io, -ua, -ea* accentués avant cette fin portent un accent : *ciência, água, história, família, Mário*.\n\n### Les signes diacritiques\n- **L'aigu (´)** marque une voyelle tonique ouverte (*já, pé, avó*) ou un i, un u toniques (*país, saúde*).\n- **Le circonflexe (^)** marque une voyelle tonique fermée : *câmara, você, avô, três*.\n- **Le tilde (~)** marque une voyelle nasale : *irmã, põe*.\n- **Le grave (`)** n'apparaît que dans la contraction de la préposition *a* avec l'article *a(s)* ou avec *aquele, aquela, aquilo* : *à, às, àquele, àquilo* (voir L07).\n- **La cédille** ne s'emploie que devant a, o, u : jamais *çe, çi*.\n- **Le tréma** a disparu : *frequente, cinquenta* (l'ancien brésilien écrivait *freqüente*).\n\nCertains **monosyllabes** prennent un accent parce qu'ils sont toniques : *já, lá, cá, pé, pó, só, mês, três, nós, dá, vê, lê*. Les mots atones n'en prennent pas : *me, te, se, de, por, que, mas, o, a*. *Que* et *porque* prennent un circonflexe quand ils sont toniques, en fin de phrase : *O quê? Porquê?*\n\n**Accents qui distinguent deux mots.** L'Accord orthographique de 1990 n'en a gardé que quelques-uns :\n- *pôr* (mettre) / *por* (par) ;\n- *pôde* (il a pu) / *pode* (il peut) ;\n- *têm, vêm* (ils ont, ils viennent) / *tem, vem* (il a, il vient) ;\n- au Portugal, l'usage maintient aussi *comprámos* (passé) / *compramos* (présent).\n\nL'Accord a **supprimé** les anciens *pára* (il s'arrête), *pêlo* (poil), *péla* et *pólo* : on écrit aujourd'hui *para, pelo, pela, polo*, et le contexte tranche. Il a aussi supprimé le circonflexe de *lêem, vêem, crêem, dêem* et de *vôo, enjôo* : on écrit *leem, veem, creem, deem, voo, enjoo*. Les grammaires du Projet, antérieures à la réforme, donnent encore les anciennes graphies.\n\n### Ce qui change au Brésil\n- les voyelles atones restent claires ;\n- t et d se palatalisent devant i (*tia* ≈ « tchia ») ;\n- le s final se prononce « s » dans la plus grande partie du pays (Rio fait exception) ;\n- le l final devient « ou » ;\n- devant m ou n, les voyelles toniques e et o sont fermées : le Portugal écrit *António, ténis, económico*, le Brésil *Antônio, tênis, econômico*.","ex":[{"pt":"O meu avô e a minha avó moram em Lisboa.","fr":"Mon grand-père et ma grand-mère habitent à Lisbonne."},{"pt":"Hoje trabalhamos; ontem não trabalhámos.","fr":"Aujourd'hui nous travaillons ; hier nous n'avons pas travaillé."},{"pt":"Os ovos estão no frigorífico.","fr":"Les œufs sont dans le réfrigérateur."},{"pt":"A filha do vizinho bebe vinho verde.","fr":"La fille du voisin boit du vinho verde."},{"pt":"Três cafés, se faz favor.","fr":"Trois cafés, s'il vous plaît."},{"pt":"O próximo táxi chega daqui a dez minutos.","fr":"Le prochain taxi arrive dans dix minutes."},{"pt":"Os amigos dele são simpáticos.","fr":"Ses amis sont sympathiques."},{"pt":"Mesmo assim, desde ontem estou em casa.","fr":"Malgré tout, depuis hier je suis à la maison."},{"pt":"A saúde é importante.","fr":"La santé est importante."},{"pt":"Quero quatro queijos frescos.","fr":"Je veux quatre fromages frais."}],"pit":["Le *o* final non accentué se prononce « ou » : *obrigado* ≈ « obrigadou ».","Le *s* final se prononce « ch » au Portugal : *três* ≈ « trêch », et non « trèss ».","Le *e* final est presque muet : *noite* ≈ « noït' ».","*Avó* (grand-mère, o ouvert) et *avô* (grand-père, o fermé) ne diffèrent que par l'accent : il n'est jamais décoratif.","Ne prononcez ni le m ni le n d'une voyelle nasale : *com* ≈ « kõ », jamais « komm ».","Le *h* ne se prononce jamais, mais *lh* et *nh* sont des sons à part entière.","Écrivez *leem, veem, voo* sans circonflexe et *para* (il s'arrête) sans accent : ce sont les graphies actuelles."],"qs":[{"t":"choice","q":"Quel mot désigne la grand-mère ?","e":"Accent aigu : o ouvert, avó (grand-mère). Accent circonflexe : o fermé, avô (grand-père).","o":["avó","avô"],"c":0},{"t":"choice","q":"Dans « falar », où tombe l'accent tonique ?","e":"Mot terminé par -r sans accent écrit : accent sur la dernière syllabe.","o":["fa-","-lar"],"c":1},{"t":"choice","q":"Dans « falam », où tombe l'accent tonique ?","e":"Terminaison -am sans accent écrit : accent sur l'avant-dernière syllabe.","o":["fa-","-lam"],"c":0},{"t":"choice","q":"Quel mot porte l'accent tonique sur la dernière syllabe ?","e":"papel se termine par -l sans accent écrit : accent final. útil porte un accent parce qu'il fait exception.","o":["casa","papel","útil"],"c":1},{"t":"choice","q":"Comment se prononce « lh » dans « trabalho » ?","e":"lh se mouille, comme « lli » dans « million ».","o":["comme « l »","comme le « li » de « million »","comme « h »"],"c":1},{"t":"choice","q":"Comment se prononce la conjonction « e » (et) ?","e":"La conjonction e se prononce « i ».","o":["« é »","« i »","elle est muette"],"c":1},{"t":"choice","q":"Quel mot contient une voyelle nasale ?","e":"am suivi d'une consonne : nasale. Dans cama, le m commence la syllabe suivante.","o":["cama","campo","cada"],"c":1},{"t":"choice","q":"Comment sonne le « s » de « casa » ?","e":"Entre deux voyelles, s se prononce « z ».","o":["« s »","« z »","« ch »"],"c":1},{"t":"choice","q":"Comment sonne le « s » final de « dois » au Portugal ?","e":"En fin de mot, s se prononce « ch » au Portugal.","o":["« s »","« ch »","muet"],"c":1},{"t":"choice","q":"Comment sonne le « s » de « mesmo » ?","e":"Devant une consonne sonore (m), s se prononce « j ».","o":["« s »","« ch »","« j »"],"c":2},{"t":"choice","q":"Dans « os amigos », comment sonne le « s » de « os » ?","e":"Un s final suivi d'une voyelle se lie en « z ».","o":["« ch »","« z »","muet"],"c":1},{"t":"choice","q":"Dans « guerra », le u…","e":"gu + e, i : le u est muet.","o":["se prononce","est muet"],"c":1},{"t":"choice","q":"Dans « quatro », le u…","e":"qu + a : le u se prononce.","o":["se prononce","est muet"],"c":0},{"t":"choice","q":"Comment sonne le x de « exame » ?","e":"ex- + voyelle : « z ».","o":["« ch »","« ks »","« z »"],"c":2},{"t":"choice","q":"Comment sonne le x de « próximo » ?","e":"próximo fait partie des mots où x = « s ».","o":["« ks »","« s »","« ch »"],"c":1},{"t":"choice","q":"Au Portugal, « dia » se prononce…","e":"t et d ne se palatalisent pas au Portugal.","o":["avec un d franc","« djia », comme au Brésil"],"c":0},{"t":"choice","q":"Dans « os ovos », le premier o de « ovos » est…","e":"Métaphonie : o ovo [ô], os ovos [ó].","o":["ouvert","fermé, comme dans « o ovo »"],"c":0},{"t":"fill","q":"Complétez avec la lettre qui convient : a pra___a (la place)","e":"Devant a, o, u, le son « s » s'écrit ç : praça.","a":["ç"]},{"t":"transf","q":"Ajoutez l'accent manquant : musica","e":"Accent sur l'antépénultième : accent écrit obligatoire.","a":["música"]},{"t":"transf","q":"Ajoutez l'accent manquant : voce","e":"e tonique fermé en fin de mot : circonflexe.","a":["você"]},{"t":"transf","q":"Ajoutez l'accent manquant (le pays) : pais","e":"i tonique après une voyelle : accent aigu. Sans accent, pais = les parents.","a":["país"]},{"t":"transf","q":"Ajoutez l'accent manquant : saude","e":"u tonique après une voyelle : accent aigu.","a":["saúde"]},{"t":"choice","q":"Quelle graphie est correcte aujourd'hui ?","e":"L'Accord de 1990 a supprimé le circonflexe de lêem.","o":["Eles lêem muito.","Eles leem muito."],"c":1},{"t":"choice","q":"« Le bus s'arrête ici. »","e":"L'accent de pára (verbe parar) a été supprimé en 1990.","o":["O autocarro pára aqui.","O autocarro para aqui."],"c":1},{"t":"choice","q":"« Il n'a pas pu venir hier. »","e":"pôde (passé) garde son accent pour se distinguer de pode (présent).","o":["Ele não pode vir ontem.","Ele não pôde vir ontem."],"c":1},{"t":"choice","q":"« Hier, nous avons acheté du pain. » (usage du Portugal)","e":"Au Portugal, -ámos distingue le passé du présent -amos.","o":["Ontem comprámos pão.","Ontem compramos pão."],"c":0}],"prod":{"c":"Recopiez puis lisez à voix haute ces mots en vous enregistrant, et dites lesquels vous ont posé problème : filho, trabalho, vinho, amanhã, mãe, pão, avô, avó, português, obrigado. Écrivez ensuite une phrase qui en contient au moins trois.","n":"1 phrase"}},{"id":"L02","lv":"A1","title":"Saluer, prendre congé, se présenter : tu, você, o senhor","obj":"Saluer et prendre congé selon le moment et la relation, se présenter, choisir la forme d'adresse adaptée au Portugal, au téléphone comme par écrit.","refs":"EG §12.1-12.10, p. 133-144 ; UP §3.5, p. 84-87","expl":"### Saluer\n- **Olá** : salut, bonjour, entre proches, amis, collègues. On répond *Olá !* Avec un prénom : *Olá, Joana !*\n- **Bom dia, boa tarde, boa noite** servent à la fois à saluer et à prendre congé. *Bom dia* jusqu'au déjeuner (vers 13 h), *boa tarde* jusqu'à la tombée du jour, *boa noite* ensuite. Ces formules servent aussi à entamer une conversation dans une boutique ou à interpeller quelqu'un dans la rue.\n- **Viva !** marque la joie de revoir quelqu'un : *Viva! Há quanto tempo!* (Salut ! Ça fait longtemps !). *Olá! Por aqui?* : Tiens, toi ici ?\n- **Bem-vindo** (bienvenu) s'accorde : *bem-vindo, bem-vinda, bem-vindos, bem-vindas*. *Seja bem-vindo* (soyez le bienvenu). *Dar as boas-vindas a alguém* : souhaiter la bienvenue à quelqu'un.\n\n### Demander des nouvelles et répondre\n| question | registre | réponses possibles |\n| Tudo bem? | familier | Tudo (bem), e contigo? / Tudo bem, e consigo? |\n| Como estás? | tu | Estou bem, obrigado. E tu? |\n| Como está? | politesse | Bem, obrigada. E o senhor? |\n| Então, como vai isso? | familier | Vai-se andando. (On fait aller.) |\n\nAutres réponses : *Muito bem* (très bien), *Mais ou menos* (comme ci comme ça), *Menos mal* (pas trop mal), *Assim-assim* (couci-couça). *Como vai?* existe au Portugal mais est plus fréquent au Brésil.\n\n### Prendre congé\n- **Adeus** : au revoir, formule générale qui suggère une séparation un peu longue ; elle se combine avec d'autres : *Adeus, boa viagem!*\n- **Tchau** : salut, familier.\n- **Até** (jusqu'à) + moment du prochain revoir :\n| formule | sens |\n| Até já! | À tout de suite ! |\n| Até logo! | À tout à l'heure, à plus tard (le jour même) |\n| Até amanhã! | À demain ! |\n| Até sábado! | À samedi ! |\n| Até para a semana! | À la semaine prochaine ! |\n| Até para o ano! | À l'année prochaine ! |\n| Até à próxima! | À la prochaine ! |\n| Até mais! | À plus ! |\n| Até sempre! | Au revoir (adieu chaleureux ; aussi en fin de lettre) |\n*Despedir-se de alguém* : prendre congé de quelqu'un, lui dire au revoir.\n\n### Interpeller, s'excuser\n- **Faz favor !**, plus poli **Faça favor !** : « S'il vous plaît ! », pour attirer l'attention d'un serveur ou d'un vendeur. *Faz favor, têm gravatas de seda?*\n- **Se faz favor** et **por favor** : s'il vous plaît, dans une demande. *Se faz favor* est très courant au Portugal.\n- **Desculpe** (vous) / **Desculpa** (tu) : excusez-moi, pardon.\n- **Com licença** : pardon, pour passer ou pour sortir d'une pièce ; aussi pour clore poliment une conversation.\n- **Olhe !** (vous) / **Olha !** (tu) : « Dites-moi… », « Écoutez… », formule d'amorce très fréquente à l'oral : *Olhe, onde fica a estação?*\n- Pour avertir : *Cuidado!* (Attention !), *Atenção!* ; pour appeler à l'aide : *Socorro!*\nOn ne crie jamais *Empregado !* (garçon !) dans un café portugais. *Pst !* s'entend pour appeler un serveur, mais *Faz favor !* est plus poli.\n\n### Souhaits et félicitations\n| formule | sens |\n| Parabéns! | Félicitations ! / Joyeux anniversaire ! |\n| Feliz aniversário! | Joyeux anniversaire ! |\n| Feliz Natal! / Boas Festas! | Joyeux Noël ! / Bonnes fêtes ! |\n| Feliz Páscoa! | Joyeuses Pâques ! |\n| Feliz Ano Novo! | Bonne année ! |\n| Boas férias! / Bom fim de semana! | Bonnes vacances ! / Bon week-end ! |\n| Boa viagem! / Boa sorte! | Bon voyage ! / Bonne chance ! |\n| Bom apetite! | Bon appétit ! |\n| Saúde! | À votre santé ! / À vos souhaits ! |\n*Dar os parabéns a alguém* : féliciter quelqu'un. *Parabéns pelo exame!* (Félicitations pour ton examen !)\n\n### Se présenter, présenter quelqu'un\n- **Chamo-me** Sébastien ; **O meu nome é** Sébastien ; **Sou o** Sébastien (familier, avec article).\n- **Sou** francês, **sou de** Caen, **moro em** Caen, **sou** professor (sans article devant la profession).\n- Présenter : *Este é o João. Esta é a Ana.* (Voici João, voici Ana.) — *Apresento-lhe o meu colega.* (Je vous présente mon collègue.) — *Posso apresentar-te a minha mulher?* — *Tenho o prazer de apresentar…* (soutenu).\n- Répondre : **Muito prazer** (enchanté) ; **Muito gosto** (même sens, très portugais) ; réponse : **Igualmente** ou **O prazer é (todo) meu**.\nOn donne une poignée de main ; entre femmes, et entre un homme et une femme dans un cadre détendu, on se fait **deux bises** (*dois beijinhos*).\n\n**Obrigado** s'accorde avec la personne qui remercie : un homme dit *obrigado*, une femme *obrigada*. *Muito obrigado* (merci beaucoup), *obrigadinho* (merci bien, familier). Merci **de** quelque chose : *obrigado pelo café, obrigado por ter vindo*. On répond *De nada*, *Não tem de quê*, ou *Ora essa!* (Je vous en prie !).\n\n### Les formes d'adresse\n| forme | à qui ? | verbe |\n| **tu** | famille, amis, enfants, jeunes entre eux, collègues proches | 2e pers. du singulier : *tu falas* |\n| **você** | égal à égal, sans grande intimité ; jugé condescendant, voire impoli, par beaucoup avec un inconnu ou un aîné | 3e pers. : *você fala* |\n| **verbe seul, à la 3e pers.** | la solution la plus sûre quand *tu* est trop familier et *o senhor* trop cérémonieux | *Como está? Quer um café?* |\n| **prénom ou nom, comme sujet** | variante de la précédente | *O Pedro quer um café?* (Voulez-vous un café, Pedro ?) |\n| **o senhor, a senhora** | politesse ordinaire : inconnu, client, aîné | 3e pers. : *o senhor fala* |\n| **o menino, a menina** | enfant, jeune fille (« mademoiselle ») | 3e pers. |\n| **o senhor doutor, a senhora doutora** | toute personne diplômée de l'université, les médecins, les avocats : très courant au Portugal | 3e pers. |\n| **vocês** | pluriel de *tu* et de *você* | 3e pers. du pluriel |\n| **os senhores, as senhoras** | pluriel de politesse | 3e pers. du pluriel |\n| **Vossa Excelência (V. Ex.ª)** | courrier officiel, cérémonies | 3e pers. |\n\n*Vós* ne survit que dans certaines régions du Nord, à l'église et dans les textes anciens.\n\nD'autres titres s'emploient de la même façon : *o senhor engenheiro, a senhora arquiteta, o senhor professor*. **Les titres masculins se combinent avec le nom de famille** (*o senhor Costa, o Dr. Gomes*), **les titres féminins avec le prénom** (*a Dona Laura, a Dra. Ana*) : on n'appelle pas une femme par son nom de famille. En apostrophe, on supprime l'article : *Sente-se, senhor Gomes.*\n\n**En famille**, un enfant peut s'adresser à ses parents ou grands-parents à la 3e personne, par respect : *A avó quer café?* (Tu veux du café, mamie ?), *O pai vem connosco?*\n\n**Au Brésil**, *você* est la forme ordinaire de la deuxième personne ; *tu* n'est courant que dans certaines régions ; *o senhor, a senhora* s'emploient avec les personnes âgées.\n\n### Abréviations\n*Sr.* (senhor), *Sr.ª* (senhora), *D.* (Dona, devant un prénom féminin), *Dr.* et *Dr.ª* (doutor, doutora), *Eng.º* et *Eng.ª*, *Arq.º*, *Prof.* et *Prof.ª*, *Exmo.* et *Exma.* (Excelentíssimo, -a, en tête de lettre : *Exmo. Senhor*, *Exma. Senhora Dona…*).\n\n### Au téléphone\n- On décroche en disant *Estou?*, *Estou sim?*, *Está?* ou *Sim?* ; l'appelant demande *Está lá?* (Allô ?) — au Brésil, *Alô?*\n- *Daqui fala o Sébastien* ou *É o Sébastien* (C'est Sébastien à l'appareil).\n- *Podia falar com o senhor diretor?* (Pourrais-je parler au directeur ?) — on évite la question abrupte « Marcos est là ? ».\n- *É o próprio / É a própria* (C'est moi-même). *É engano* (Vous faites erreur). *Quer deixar recado?* (Voulez-vous laisser un message ?).\n- Pour conclure : *Até logo*, *Com licença*, *Bom dia*.\n\n### Par écrit\n| | ouverture | clôture |\n| proches | Querido João, / Querida Ana, | Beijinhos, Beijos, Um abraço |\n| relation cordiale | Caro colega, / Cara Marta, | Abraços, Cumprimentos |\n| formel | Exmo. Senhor, / Exma. Senhora, | Com os melhores cumprimentos, / Atenciosamente, |","ex":[{"pt":"Bom dia! Como está? — Estou bem, obrigado. E a senhora?","fr":"Bonjour ! Comment allez-vous ? — Je vais bien, merci. Et vous, madame ?"},{"pt":"Olá, tudo bem? — Tudo bem, e contigo?","fr":"Salut, ça va ? — Ça va, et toi ?"},{"pt":"Chamo-me Sébastien. Sou francês e moro em Caen.","fr":"Je m'appelle Sébastien. Je suis français et j'habite à Caen."},{"pt":"Esta é a Ana, uma colega. — Muito prazer. — Igualmente.","fr":"Voici Ana, une collègue. — Enchanté. — Moi de même."},{"pt":"Faz favor! Uma bica e um copo de água, se faz favor.","fr":"S'il vous plaît ! Un expresso et un verre d'eau, s'il vous plaît."},{"pt":"Olhe, desculpe, onde fica a estação?","fr":"Pardon, excusez-moi, où se trouve la gare ?"},{"pt":"Adeus, até para a semana!","fr":"Au revoir, à la semaine prochaine !"},{"pt":"Muito obrigada pelo convite. — Ora essa!","fr":"Merci beaucoup pour l'invitation. — Je vous en prie !"},{"pt":"Estou? — Bom dia, daqui fala a Marta. Podia falar com o senhor doutor Gomes?","fr":"Allô ? — Bonjour, c'est Marta à l'appareil. Pourrais-je parler au docteur Gomes ?"},{"pt":"Parabéns! Feliz aniversário!","fr":"Félicitations ! Joyeux anniversaire !"}],"pit":["Avec un inconnu plus âgé, *você* peut sembler impoli au Portugal : préférez *o senhor / a senhora*, ou le verbe seul.","*Obrigado* s'accorde avec la personne qui remercie, non avec celle qu'on remercie.","*Bom dia* sert aussi à prendre congé : on peut quitter une boutique en disant *Bom dia!*","*Até logo* annonce un revoir le jour même ; pour le lendemain, dites *até amanhã*.","On écrit *bem-vindo* avec un trait d'union, et il s'accorde : *bem-vindas*.","Un titre féminin se combine avec le prénom (*a Dona Laura*), un titre masculin avec le nom (*o senhor Costa*).","Au téléphone, *Estou?* (et non *Alô?*) au Portugal."],"qs":[{"t":"choice","q":"Il est 16 heures. Vous entrez dans une boutique. Vous dites :","e":"Après le déjeuner : boa tarde.","o":["Bom dia","Boa tarde","Boa noite"],"c":1},{"t":"choice","q":"Vous quittez une boutique à 10 heures du matin. Vous pouvez dire :","e":"Bom dia sert aussi à prendre congé.","o":["Bom dia!","Boa noite!","Bem-vindo!"],"c":0},{"t":"choice","q":"Vous demandez à une dame âgée inconnue comment elle va. Le plus adapté :","e":"Avec une inconnue âgée, 3e personne de politesse : Como está?","o":["Como estás?","Como está?","Tudo bem, pá?"],"c":1},{"t":"fill","q":"Une femme remercie : Muito ___ !","e":"La femme qui parle dit obrigada.","a":["obrigada"]},{"t":"fill","q":"___-me Ana. (Je m'appelle Ana.)","e":"Chamo-me : en phrase affirmative, le pronom suit le verbe au Portugal.","a":["chamo"]},{"t":"choice","q":"Quelle forme verbale va avec « o senhor » ?","e":"O senhor se conjugue à la 3e personne du singulier.","o":["falas","fala","falam"],"c":1},{"t":"trans","q":"Enchanté. — Moi de même.","e":"Formule figée : Muito prazer (ou Muito gosto) — Igualmente.","a":["muito prazer. — igualmente","muito prazer — igualmente","muito prazer. igualmente","muito gosto. — igualmente","muito gosto — igualmente"]},{"t":"trans","q":"Je suis français.","e":"Nationalité : verbe ser, adjectif sans article.","a":["sou francês","eu sou francês"]},{"t":"choice","q":"Pour s'adresser à plusieurs amis, on emploie :","e":"Vocês est le pluriel ordinaire au Portugal.","o":["vós","vocês","os senhores"],"c":1},{"t":"choice","q":"Que répond-on à « Muito obrigado » ?","e":"De nada = de rien (on dit aussi Não tem de quê, Ora essa!).","o":["Igualmente","De nada","Bom dia"],"c":1},{"t":"choice","q":"Vous reverrez votre collègue cet après-midi. Vous dites :","e":"Até logo : à plus tard, le jour même.","o":["Até amanhã!","Até logo!","Até para o ano!"],"c":1},{"t":"choice","q":"« À la semaine prochaine ! »","e":"Formule portugaise : Até para a semana!","o":["Até a semana!","Até para a semana!","Até semana próxima!"],"c":1},{"t":"fill","q":"Sejam bem-___ ! (à un groupe de femmes)","e":"bem-vindo s'accorde : bem-vindas.","a":["vindas"]},{"t":"choice","q":"Comment appeler poliment le serveur dans un café ?","e":"Faz favor! (ou Faça favor!) ; on ne crie pas Empregado!","o":["Empregado!","Faz favor!","Olá, garçon!"],"c":1},{"t":"choice","q":"Vous voulez passer devant quelqu'un dans un couloir étroit :","e":"Com licença : pardon, je peux passer ?","o":["Desculpa","Com licença","Faz favor"],"c":1},{"t":"choice","q":"Vous décrochez le téléphone au Portugal :","e":"Au Portugal : Estou? ou Estou sim? (Alô? au Brésil).","o":["Alô?","Estou?","Diga-me?"],"c":1},{"t":"choice","q":"Au téléphone, on vous demande si c'est bien vous : « C'est moi-même. » (un homme)","e":"Formule consacrée : É o próprio (une femme : É a própria).","o":["Sou eu mesmo.","É o próprio.","Está ele."],"c":1},{"t":"choice","q":"Comment s'adresser par écrit à Madame Laura Costa ?","e":"Un titre féminin se combine avec le prénom : Senhora Dona Laura (Costa).","o":["Exma. Senhora Costa","Exma. Senhora Dona Laura Costa","Exmo. Senhor Laura"],"c":1},{"t":"choice","q":"Un titre masculin se combine en général avec…","e":"Les titres masculins se combinent avec le nom de famille.","o":["le prénom : o senhor João","le nom de famille : o senhor Costa"],"c":1},{"t":"trans","q":"Félicitations pour l'examen !","e":"Parabéns por + nom : por + o = pelo.","a":["parabéns pelo exame!","parabéns pelo exame"]},{"t":"choice","q":"Un enfant demande à sa grand-mère si elle veut du café. Forme possible au Portugal :","e":"En famille, la 3e personne avec le lien de parenté marque le respect.","o":["A avó quer café?","Vós quereis café?","O senhor quer café?"],"c":0},{"t":"choice","q":"Clôture d'un courriel à une amie proche :","e":"Beijinhos (ou Beijos) entre proches.","o":["Com os melhores cumprimentos","Beijinhos","Atenciosamente"],"c":1}],"prod":{"c":"Présentez-vous à un collègue portugais que vous rencontrez pour la première fois : salutation, nom, nationalité, ville, formule de politesse. Choisissez la forme d'adresse adaptée.","n":"4 à 5 phrases"}},{"id":"L03","lv":"A1","title":"Les pronoms sujets et le verbe ser","obj":"Employer les pronoms sujets, conjuguer ser au présent et maîtriser ses emplois : identité, origine, profession, caractéristiques, possession, matière, heure, lieu d'un événement, tournures impersonnelles.","refs":"EG §5.1.1, p. 43-44 ; EG §11.13, p. 128-130 ; UP §5.9, p. 156-158 ; LI §3.4, p. 65-67","expl":"### Les pronoms personnels sujets\n| personne | singulier | pluriel |\n| 1re | eu (je) | nós (nous) |\n| 2e, intime | tu (tu) | vocês (vous, pluriel de tu) |\n| 2e, adresse | você, o senhor, a senhora (vous) | vocês, os senhores, as senhoras (vous) |\n| 3e | ele (il), ela (elle) | eles (ils), elas (elles) |\n\n- *Você, o senhor, a senhora* et leurs pluriels sont des **formes d'adresse** qui se conjuguent à la **3e personne** (voir L02). *Vós*, deuxième personne du pluriel, est sorti de l'usage courant ; *vocês* le remplace.\n- *Eles* désigne aussi un groupe mixte : *A Mara e o Joaquim chegaram; eles ficam até ao Natal.*\n\n### Omettre ou exprimer le pronom\nLa terminaison du verbe indique déjà la personne : on **omet le pronom** dans la plupart des cas. *(Tu) Vens ao cinema? — (Nós) Estávamos à tua espera.*\n\nOn l'exprime :\n- **pour lever une ambiguïté**, surtout à la 3e personne, où *é* peut renvoyer à *ele, ela, você* : *Ela é médica, ele é enfermeiro.* ;\n- **pour insister ou opposer** : *Eu quero ir ao cinema, mas eles querem ir ao teatro.* ;\n- dans les réponses courtes : *Quem é o Pedro? — Sou eu.* (C'est moi.)\n\n**Il n'y a pas de pronom « il » impersonnel** : *É verdade.* (C'est vrai.) *É tarde.* (Il est tard.) *Chove.* (Il pleut.) *São três horas.* (Il est trois heures.) On ne dit jamais *ele é tarde*.\n\nDans la conversation, **a gente** (« les gens ») peut remplacer *nós*, avec un verbe à la 3e personne du singulier : *A gente vai ao cinema* (on va au cinéma). C'est familier ; très courant au Brésil, plus limité au Portugal.\n\n### Le présent de ser\n| | **ser** (être) |\n| eu | sou |\n| tu | és |\n| ele, ela, você | é |\n| nós | somos |\n| (vós) | (sois) |\n| eles, elas, vocês | são |\n\n### Les emplois de ser\n**Ser** énonce ce que l'on considère comme **essentiel, définitoire ou durable** ; *estar* décrit un état, une situation passagère (comparaison détaillée en L08).\n\n- **Identité, définition** : *Sou o Sébastien. Isto é um dicionário. O que é isto?*\n- **Profession, fonction, religion** : *Sou professor. Ela é engenheira. Somos católicos.* Pas d'article devant le nom seul ; l'article revient si un adjectif le qualifie : *É um excelente professor.*\n- **Nationalité, origine** (*ser de*) : *Somos franceses. Sou de Caen. De onde é? — Sou do Porto.*\n- **Caractéristiques physiques et morales**, couleur, taille, forme : *O João é alto e simpático. A casa é azul.*\n- **Matière** (*ser de*) : *A mesa é de madeira. O anel é de ouro.*\n- **Possession** (*ser de*) : *O livro é do João. De quem é este casaco? — É meu.*\n- **Heure, date, jour** : *É uma hora. São duas horas. É meio-dia. Hoje é segunda-feira. Hoje é dia cinco.*\n- **Prix total**, à la caisse : *Quanto é? — São dez euros.*\n- **Lieu d'un événement** : *A festa é em casa da Ana. A reunião é na sala 3.*\n- **Situation d'un lieu fixe** (géographie, bâtiments) : *Évora é no Alentejo. O museu é ali.* On dit aussi, plus souvent, *fica* (voir L18).\n- **Tournures impersonnelles** : *É bom, é preciso, é possível, é proibido, é difícil* + infinitif : *É difícil aprender línguas. É proibido fumar.*\n- **Mise en relief** (« c'est… qui ») : *É o João que paga. Fui eu que fiz.* — et dans les questions : *Onde é que moras?* (L13).\n\n### Accord de l'adjectif\nAprès *ser*, l'adjectif s'accorde avec le sujet : *O João é alto ; a Ana é alta ; eles são altos ; elas são altas.* Avec *você* ou *o senhor*, il suit le sexe réel de la personne : *Você é muito simpática* (à une femme).\n\n### Répondre « oui » avec le verbe\nOn répond volontiers en reprenant le verbe : *És francês? — Sou.* (Oui.) *Ela é médica? — É.* La négation se forme avec *não* devant le verbe : *Não, não sou.*\n\n### Au Brésil\n*Você* remplace *tu* dans la plus grande partie du pays ; *a gente* est extrêmement fréquent ; on entend *tu é* dans le parler familier de certaines régions, forme non standard.","ex":[{"pt":"Eu sou francês e ela é portuguesa.","fr":"Je suis français et elle est portugaise."},{"pt":"Somos professores.","fr":"Nous sommes professeurs."},{"pt":"Vocês são de Lisboa? — Não, somos do Porto.","fr":"Vous êtes de Lisbonne ? — Non, nous sommes de Porto."},{"pt":"O livro é do João.","fr":"Le livre est à João."},{"pt":"A mesa é de madeira.","fr":"La table est en bois."},{"pt":"São duas horas.","fr":"Il est deux heures."},{"pt":"Quanto é? — São doze euros.","fr":"Ça fait combien ? — Douze euros."},{"pt":"A festa é em casa da Ana.","fr":"La fête a lieu chez Ana."},{"pt":"É difícil aprender línguas.","fr":"Il est difficile d'apprendre des langues."},{"pt":"És tu o Pedro? — Sou.","fr":"C'est toi, Pedro ? — Oui."},{"pt":"É o João que paga o jantar.","fr":"C'est João qui paie le dîner."}],"pit":["Pas d'article devant une profession seule : *Ela é médica* (elle est médecin) ; mais *É uma boa médica*.","*Vocês são* : 3e personne du pluriel, même si l'on s'adresse aux personnes.","Ne confondez pas *é* (il est) et *e* (et).","Pas de pronom sujet pour « il » impersonnel : *É tarde*, jamais *ele é tarde*.","L'heure se met au pluriel dès deux heures : *São duas horas*, mais *É uma hora*.","« En bois », « en or » : *de madeira, de ouro* (et non *em*)."],"qs":[{"t":"fill","q":"Eu ___ (ser) francês.","e":"ser, 1re personne : sou.","a":["sou"]},{"t":"fill","q":"Tu ___ (ser) muito simpático.","e":"ser, 2e personne : és.","a":["és"]},{"t":"fill","q":"A Ana ___ (ser) médica.","e":"3e personne : é.","a":["é"]},{"t":"fill","q":"Nós ___ (ser) de Caen.","e":"1re du pluriel : somos.","a":["somos"]},{"t":"fill","q":"Vocês ___ (ser) portugueses?","e":"vocês se conjugue à la 3e du pluriel : são.","a":["são"]},{"t":"fill","q":"O senhor ___ (ser) o diretor?","e":"o senhor : 3e personne du singulier.","a":["é"]},{"t":"choice","q":"« Il est professeur. »","e":"Pas d'article devant une profession, et verbe ser.","o":["Ele é um professor.","Ele é professor.","Ele está professor."],"c":1},{"t":"choice","q":"« C'est un excellent professeur. »","e":"Avec un adjectif, l'article indéfini réapparaît.","o":["É excelente professor.","É um excelente professor."],"c":1},{"t":"trans","q":"Nous sommes français.","e":"Pluriel de francês : franceses.","a":["somos franceses","nós somos franceses"]},{"t":"trans","q":"Elle est de Porto.","e":"Porto prend l'article : do Porto.","a":["ela é do porto","é do porto"]},{"t":"fill","q":"O carro ___ (ser) do meu pai.","e":"Possession : ser de.","a":["é"]},{"t":"choice","q":"« La table est en bois. »","e":"Matière : ser de.","o":["A mesa é em madeira.","A mesa é de madeira.","A mesa está de madeira."],"c":1},{"t":"choice","q":"« Il est trois heures. »","e":"L'heure : ser, au pluriel à partir de deux heures.","o":["É três horas.","São três horas.","Estão três horas."],"c":1},{"t":"choice","q":"« Il est une heure. »","e":"Une heure : singulier.","o":["São uma hora.","É uma hora."],"c":1},{"t":"choice","q":"« Il est tard. »","e":"Pas de pronom impersonnel ; ser + tarde.","o":["Ele é tarde.","É tarde.","Está tarde."],"c":1},{"t":"choice","q":"« La réunion a lieu dans la salle 3. »","e":"Lieu d'un événement : ser.","o":["A reunião está na sala 3.","A reunião é na sala 3."],"c":1},{"t":"trans","q":"Il est interdit de fumer.","e":"Tournure impersonnelle : é proibido + infinitif.","a":["é proibido fumar"]},{"t":"choice","q":"« Ça fait combien ? » (à la caisse)","e":"Prix total : Quanto é?","o":["Quanto está?","Quanto é?","Quanto são?"],"c":1},{"t":"choice","q":"« Tu es Pedro ? — Oui. » Réponse la plus naturelle au Portugal :","e":"On reprend le verbe à la bonne personne : Sou.","o":["Sim, eu sou Pedro.","Sou.","É."],"c":1},{"t":"choice","q":"« On va au cinéma. » (familier, avec a gente)","e":"a gente se conjugue à la 3e personne du singulier.","o":["A gente vamos ao cinema.","A gente vai ao cinema."],"c":1},{"t":"fill","q":"Fui eu ___ fiz o bolo. (C'est moi qui ai fait le gâteau.)","e":"Mise en relief : ser + … + que.","a":["que"]},{"t":"choice","q":"Pourquoi dire « Ela é médica, ele é enfermeiro » avec les pronoms ?","e":"On exprime le pronom pour éviter une ambiguïté ou opposer deux personnes.","o":["ils sont obligatoires","pour lever l'ambiguïté de la 3e personne et opposer les deux"],"c":1}],"prod":{"c":"Présentez trois personnes de votre entourage avec le verbe ser : nationalité, origine, profession, un trait de caractère.","n":"4 à 6 phrases"}},{"id":"L04","lv":"A1","title":"Le genre des noms et les articles","obj":"Reconnaître le genre d'un nom, former le féminin des noms de personnes et d'animaux, et employer l'article défini ou indéfini, y compris là où le portugais s'écarte du français.","refs":"EG §2.1-2.2, p. 9-15 ; EG §3.1-3.7, p. 24-30 ; UP §4.1, p. 126-129 ; LI §3.2.1, p. 57-60 ; LI §3.3, p. 63-65","expl":"### Deux genres, à apprendre avec l'article\nTout nom portugais est **masculin ou féminin**. Pour la plupart des choses, ce genre est purement grammatical : la même canne peut être *o bastão* ou *a bengala*. La seule méthode sûre consiste à **apprendre chaque nom avec son article**.\n\n### Les terminaisons : des repères\n| terminaison | genre habituel | exemples | exceptions fréquentes |\n| -o | masculin | o livro, o carro | a tribo ; a foto, a moto (abréviations) |\n| -a | féminin | a casa, a mesa | o dia, o mapa, o planeta ; mots grecs en -ama, -ema, -oma : o problema, o sistema, o programa, o tema, o clima, o telefonema, o idioma, o cinema |\n| -ã | féminin | a irmã, a maçã, a lã | — |\n| -dade, -tude, -ice | féminin | a cidade, a verdade, a juventude, a velhice | — |\n| -gem | féminin | a viagem, a garagem, a mensagem, a paisagem | o personagem / a personagem |\n| -ção, -são abstraits | féminin | a lição, a televisão, a paixão | — |\n| -ez, -eza, -ura | féminin | a rapidez, a beleza, a cultura | — |\n| -ão concrets | masculin | o pão, o limão, o avião, o coração | a mão |\n| -l, -r, -z, -u | souvent masculin | o papel, o colar, o juiz, o chapéu | a flor, a dor, a cor, a luz, a voz, a vez, a paz, a pele |\n| -e | imprévisible | o leite, o pente, o dente, o nome ; a ponte, a noite, a parte, a fome | à apprendre un à un ; noms concrets souvent masculins, abstraits souvent féminins (a morte, a sorte, a arte) |\n\n### Le genre d'après le sens\n**Masculins** :\n- océans, mers, fleuves, lacs, caps et montagnes : *o Atlântico, o Tejo, o Douro, os Alpes* ;\n- vins et voitures : *o Porto, o Alvarinho, um Renault* ;\n- lettres de l'alphabet et nombres : *o a, o p, o três* ;\n- saisons, sauf le printemps : *o verão, o outono, o inverno* (mais *a primavera*) ;\n- *o sábado, o domingo*, et les points cardinaux : *o norte*.\n\n**Féminins** :\n- les autres jours de la semaine, en *-feira* : *a segunda-feira* ;\n- sciences et arts : *a medicina, a música, a pintura* (mais *o teatro, o cinema*) ;\n- la plupart des villes : *Lisboa é bonita*, sauf celles qui ont un article masculin (*o Porto, o Rio de Janeiro*).\n\n### Genre différent du français\n| français masculin, portugais féminin | français féminin, portugais masculin |\n| l'arbre : a árvore | la mer : o mar |\n| le pont : a ponte | la fin : o fim |\n| le voyage : a viagem | la méthode : o método |\n| le garage : a garagem | la planète : o planeta |\n| le message : a mensagem | la carte (géographique) : o mapa |\n| le paysage : a paisagem | la dent : o dente |\n| le lit : a cama | la peur : o medo |\n| le compte, l'addition : a conta | la valeur : o valor |\n| le choix : a escolha | la chaleur : o calor |\n| le dos : as costas | la coutume : o costume |\n\n### Mots qui changent de sens selon le genre\n| masculin | féminin |\n| o capital : le capital (argent) | a capital : la capitale |\n| o rádio : le poste de radio | a rádio : la station de radio |\n| o cabeça : le meneur, le chef | a cabeça : la tête |\n| o moral : le moral | a moral : la morale |\n| o cura : le curé | a cura : la guérison |\n| o lama : le lama (animal ou moine) | a lama : la boue |\n\n### Former le féminin des noms de personnes et d'animaux\n| procédé | exemples |\n| -o → -a | o tio / a tia ; o médico / a médica ; o gato / a gata |\n| consonne, -or → + a | o português / a portuguesa ; o professor / a professora ; o juiz / a juíza |\n| -or → -triz | o ator / a atriz ; o imperador / a imperatriz |\n| -eu → -eia | o europeu / a europeia (mais o judeu / a judia ; o réu / a ré) |\n| -ão → -ã | o irmão / a irmã ; o cidadão / a cidadã ; o alemão / a alemã |\n| -ão → -oa | o leão / a leoa ; o patrão / a patroa |\n| -ão → -ona | o solteirão / a solteirona ; o comilão / a comilona |\n| -e → -a | o mestre / a mestra ; o monge / a monja |\n| suffixes -esa, -essa, -isa, -ina | o cônsul / a consulesa ; o barão / a baronesa ; o conde / a condessa ; o príncipe / a princesa ; o poeta / a poetisa ; o herói / a heroína |\n| mot différent | o homem / a mulher ; o pai / a mãe ; o marido / a mulher (a esposa) ; o genro / a nora ; o padrasto / a madrasta ; o padrinho / a madrinha ; o rei / a rainha ; o rapaz / a rapariga ; o cavalo / a égua ; o boi / a vaca ; o cão / a cadela ; o carneiro / a ovelha ; o bode / a cabra ; o galo / a galinha |\n\n*Embaixador* a deux féminins : *a embaixadora* (la femme ambassadeur) et *a embaixatriz* (l'épouse de l'ambassadeur). Aujourd'hui, on dit souvent *a poeta* plutôt que *a poetisa*.\n\n**Une seule forme, l'article change** : *o/a estudante, o/a artista, o/a colega, o/a jornalista, o/a dentista, o/a turista, o/a guia, o/a jovem, o/a doente, o/a presidente, o/a cliente, o/a intérprete, o/a agente, o/a gerente.*\n\n**Une seule forme et un seul article pour les deux sexes** : *a pessoa, a criança, a testemunha, a vítima, o indivíduo, o cônjuge.* Pour beaucoup d'animaux, on ajoute *macho* ou *fêmea* : *a cobra macho, o tigre fêmea*. L'adjectif s'accorde alors avec le nom, non avec l'animal : *uma bonita foca macho*.\n\n### L'article défini : o, a, os, as\nIl s'emploie **plus souvent qu'en français** :\n- **devant les prénoms**, au Portugal : *O João chegou. Falei com a Ana.* ;\n- **devant les titres et formes d'adresse** : *O senhor Gomes não está. A Dona Laura cozinha muito bem.* — sauf en apostrophe : *Sente-se, senhor Gomes.* ;\n- **devant les possessifs** : *o meu carro, a nossa casa* (L15) ;\n- **devant la plupart des pays, continents, régions, îles et fleuves** : *a França, o Brasil, a Europa, o Algarve, a Madeira, os Açores, o Tejo*. Sans article : *Portugal, Angola, Moçambique, Cabo Verde, Timor, Macau*. Après une préposition, *França, Espanha, Inglaterra, Itália* se passent souvent d'article au Portugal : *vivo em França, venho de Espanha* ;\n- **pour un sujet pris au sens général** : *O tempo é dinheiro. Os gatos são independentes.* ;\n- **avec les jours** : *na segunda-feira* (ce lundi-là) ; *à segunda-feira, às segundas* (le lundi, chaque semaine).\n\nIl s'**omet** :\n- devant la plupart des **villes** : *Lisboa é a capital de Portugal* (mais *o Porto*) ;\n- devant les **personnages célèbres**, sauf nuance de familiarité : *Camões escreveu Os Lusíadas* ;\n- après *falar, estudar*, devant une langue ou une matière : *Falo português. Estudo Direito.* ;\n- devant un complément pris dans un sens général ou partitif : voir ci-dessous.\n\n**L'article défini substantive** n'importe quel mot : *o importante* (l'important), *o bom disto tudo* (le bon côté de tout cela).\n\n### Pas d'article partitif\nLe portugais n'a **pas d'équivalent de « du, de la, des »** : le nom s'emploie seul. *Quero pão.* (Je veux du pain.) *Bebo leite.* (Je bois du lait.) *Há flores na mesa.* (Il y a des fleurs sur la table.) *Adoro flores.* (J'adore les fleurs, en général.)\n\n### L'article indéfini : um, uma, uns, umas\n- *Um, uma* : un, une. *Encontrei um amigo num café.*\n- *Uns, umas* ne correspondent pas à « des » : ils signifient **« quelques »**, **« environ »** ou **« une paire de »** : *Havia umas flores na mesa* (quelques fleurs) ; *uns quarenta homens* (une quarantaine d'hommes) ; *umas calças e uns sapatos* (un pantalon et une paire de chaussures).\n- Exclamations : *Tens umas ideias!* (Tu as de ces idées !) ; *Ela tem uns olhos lindos!*\n- Devant un nom célèbre : *Ele não é propriamente um Camões* ; *Comprou um Vieira da Silva* (un tableau de ce peintre).\n- Omis devant une **profession ou une nationalité non qualifiée** : *O meu tio é dentista* ; mais *é um dentista excelente*.\n- **« Un autre »** se dit **outro**, sans article : *Quero outro café.* (Je veux un autre café.)\n\nLes **contractions** de l'article avec *de, em, a, por* (*do, no, ao, pelo*…) sont l'objet de L07.","ex":[{"pt":"O João e a Maria moram numa cidade pequena.","fr":"João et Maria habitent dans une petite ville."},{"pt":"Quero um café e uma água.","fr":"Je veux un café et une eau."},{"pt":"A viagem foi longa e a paisagem é linda.","fr":"Le voyage a été long et le paysage est magnifique."},{"pt":"O problema é a cor do carro.","fr":"Le problème, c'est la couleur de la voiture."},{"pt":"A capital de Portugal é Lisboa.","fr":"La capitale du Portugal est Lisbonne."},{"pt":"O ator e a atriz são alemães.","fr":"L'acteur et l'actrice sont allemands."},{"pt":"A testemunha é um homem de quarenta anos.","fr":"Le témoin est un homme de quarante ans."},{"pt":"Quero pão e manteiga, se faz favor.","fr":"Je voudrais du pain et du beurre, s'il vous plaît."},{"pt":"Comprei umas calças e uns sapatos.","fr":"J'ai acheté un pantalon et une paire de chaussures."},{"pt":"Estavam lá uns trinta alunos.","fr":"Il y avait là une trentaine d'élèves."},{"pt":"Quero outro café.","fr":"Je veux un autre café."},{"pt":"O Tejo passa por Lisboa.","fr":"Le Tage passe par Lisbonne."}],"pit":["*O dia, o problema, o mapa, o sistema* : masculins malgré le -a.","*A viagem, a garagem, a mensagem* : féminins en -gem, à l'inverse du français.","Pas d'article partitif : *Quero pão* = je veux du pain.","*Uns, umas* = quelques, environ : *uns dez euros* (une dizaine d'euros), et non « des ».","« Un autre » se dit *outro*, sans *um*.","L'article devant le prénom est la norme au Portugal : *O João chegou.*","*Portugal* s'emploie sans article, *o Brasil* et *a França* avec.","*A capital* (la capitale) ≠ *o capital* (le capital)."],"qs":[{"t":"fill","q":"___ casa é grande. (la)","e":"casa est féminin.","a":["a"]},{"t":"fill","q":"___ problema é sério. (le)","e":"problema est masculin malgré le -a.","a":["o"]},{"t":"fill","q":"Quero ___ café. (un)","e":"café est masculin : um.","a":["um"]},{"t":"fill","q":"___ viagem é longa. (le)","e":"viagem (-gem) est féminin.","a":["a"]},{"t":"fill","q":"___ cidade é bonita. (la)","e":"-dade : féminin.","a":["a"]},{"t":"fill","q":"___ mão está fria. (la)","e":"mão : féminin, exception parmi les noms concrets en -ão.","a":["a"]},{"t":"fill","q":"___ clima de Portugal é ameno. (le)","e":"clima : mot grec en -ma, masculin.","a":["o"]},{"t":"choice","q":"« La mer » se dit :","e":"mar est masculin en portugais.","o":["a mar","o mar"],"c":1},{"t":"choice","q":"« L'arbre » se dit :","e":"árvore est féminin.","o":["o árvore","a árvore"],"c":1},{"t":"choice","q":"« La capitale du pays » :","e":"a capital = la capitale ; o capital = l'argent investi.","o":["o capital do país","a capital do país"],"c":1},{"t":"transf","q":"Mettez au féminin : o ator","e":"-or → -triz.","a":["a atriz"]},{"t":"transf","q":"Mettez au féminin : o europeu","e":"-eu → -eia.","a":["a europeia"]},{"t":"transf","q":"Mettez au féminin : o leão","e":"-ão → -oa.","a":["a leoa"]},{"t":"transf","q":"Mettez au féminin : o irmão","e":"-ão → -ã.","a":["a irmã"]},{"t":"transf","q":"Mettez au féminin : o genro","e":"Mot différent : o genro / a nora.","a":["a nora"]},{"t":"transf","q":"Mettez au féminin : o estudante","e":"Nom commun aux deux genres : seul l'article change.","a":["a estudante"]},{"t":"choice","q":"« L'enfant est malade » (une fille).","e":"criança est toujours féminin, quel que soit le sexe.","o":["O criança está doente.","A criança está doente."],"c":1},{"t":"choice","q":"« João est arrivé » se dit le plus naturellement au Portugal :","e":"Au Portugal, on met l'article devant le prénom.","o":["João chegou.","O João chegou."],"c":1},{"t":"choice","q":"« Je veux du pain. »","e":"Pas d'article partitif en portugais.","o":["Quero do pão.","Quero pão.","Quero o pão."],"c":1},{"t":"choice","q":"« Il y avait une vingtaine de personnes. »","e":"uns, umas + nombre = environ.","o":["Havia vinte pessoas mais ou menos uma.","Havia umas vinte pessoas."],"c":1},{"t":"choice","q":"« Je veux un autre café. »","e":"« Un autre » : outro, sans article.","o":["Quero um outro café.","Quero outro café."],"c":1},{"t":"fill","q":"Tenho ___ lição amanhã. (une)","e":"lição (-ção) est féminin : uma.","a":["uma"]},{"t":"choice","q":"Quel pays s'emploie sans article ?","e":"On dit Portugal sans article, mais a França, o Brasil.","o":["França","Brasil","Portugal"],"c":2},{"t":"choice","q":"« Il parle portugais. »","e":"Après falar, pas d'article devant la langue.","o":["Fala o português.","Fala português."],"c":1}],"prod":{"c":"Décrivez ce qu'il y a sur votre bureau ou dans votre sac avec les articles définis et indéfinis (um livro, a caneta…). Employez au moins deux noms dont le genre diffère du français (o leite, a viagem, o sangue…).","n":"5 à 7 phrases"}},{"id":"L05","lv":"A1","title":"Le pluriel ; diminutifs, augmentatifs, noms composés","obj":"Former le pluriel de tous les types de noms et d'adjectifs, comprendre et former les diminutifs et augmentatifs, et mettre au pluriel les noms composés.","refs":"EG §2.3-2.6, p. 15-23 ; EG §4.2, p. 34-36 ; UP §4.2, p. 129-132 ; LI §3.2.2, p. 60-63","expl":"### La règle générale : + s\nLes noms et adjectifs terminés par une **voyelle**, orale ou nasale, ou par une **diphtongue** prennent un **-s** : *casa → casas, café → cafés, lei → leis, chapéu → chapéus, mãe → mães, irmã → irmãs, pai → pais*.\n\n### -r, -z et -s tonique : + es\n- *flor → flores, mulher → mulheres, professor → professores* ;\n- *luz → luzes, voz → vozes, rapaz → rapazes, feliz → felizes* ;\n- *país → países, deus → deuses, ananás → ananases*.\nLes mots en **-ês** perdent leur accent au pluriel, car la syllabe tonique n'est plus la dernière : *mês → meses, inglês → ingleses, português → portugueses, francês → franceses*.\n\n### -m : → -ns\n*homem → homens, jardim → jardins, som → sons, atum → atuns, nuvem → nuvens, viagem → viagens, armazém → armazéns.* Le m devient n : on n'écrit jamais *-ms*.\n\n### -al, -el, -ol, -ul : le l devient i\n| terminaison | pluriel | exemples |\n| -al | -ais | animal → animais ; jornal → jornais ; casal → casais |\n| -el tonique | -éis | papel → papéis ; hotel → hotéis ; anel → anéis |\n| -el atone | -eis | móvel → móveis ; amável → amáveis ; possível → possíveis |\n| -ol | -óis | lençol → lençóis ; espanhol → espanhóis ; sol → sóis |\n| -ul | -uis | azul → azuis ; paul → pauis |\n| -il tonique | -is | barril → barris ; funil → funis ; febril → febris |\n| -il atone | -eis | fácil → fáceis ; difícil → difíceis ; útil → úteis ; fóssil → fósseis |\nDeux exceptions : *mal → males, cônsul → cônsules*.\n\n### -ão : trois pluriels\nC'est le seul cas vraiment imprévisible. Il s'explique par l'histoire : ces mots viennent de formes latines différentes que l'évolution a fondues en un seul *-ão* au singulier.\n| pluriel | fréquence | exemples |\n| **-ões** | la grande majorité, et le seul modèle encore productif | lição → lições ; estação → estações ; avião → aviões ; coração → corações ; limão → limões ; botão → botões ; pensão → pensões ; camião → camiões |\n| **-ães** | une liste fermée | pão → pães ; cão → cães ; alemão → alemães ; capitão → capitães ; catalão → catalães ; charlatão → charlatães ; escrivão → escrivães ; sacristão → sacristães |\n| **-ãos** | une liste fermée | mão → mãos ; irmão → irmãos ; cidadão → cidadãos ; cristão → cristãos ; chão → chãos ; grão → grãos ; órgão → órgãos ; órfão → órfãos ; bênção → bênçãos ; sótão → sótãos ; são (sain) → sãos |\nSont en **-ões** : tous les mots en **-ção** et **-são**, les augmentatifs (*amigão → amigões*) et les emprunts récents. Quelques mots admettent deux ou trois pluriels : *verão → verões* (ou *verãos*), *vulcão → vulcões, vulcãos* ; *ancião → anciãos, anciões, anciães* ; *vilão → vilões, vilãos, vilães*. En cas de doute, *-ões* a les meilleures chances ; mais *pães, cães, alemães, mãos, irmãos, cidadãos* sont à savoir par cœur.\n\n### Mots invariables\nLes mots terminés par un **-s ou un -x atones** ne changent pas : *o lápis → os lápis, o pires → os pires, o vírus → os vírus, o atlas → os atlas, o tórax → os tórax*. Même chose pour les adjectifs *simples* et *reles* : *duas canções simples*.\n\n### Le timbre qui s'ouvre au pluriel\nRappel de L01 : dans beaucoup de mots, le **o tonique fermé du singulier devient ouvert au pluriel**, sans que l'écriture change : *o ovo* [ô] → *os ovos* [ó] ; de même *jogo, olho, corpo, porto, povo, fogo, osso, imposto, almoço*. *Bolo, gosto, esposo* gardent un o fermé : il faut écouter.\n\n### Noms toujours au pluriel, ou dont le pluriel change le sens\n- **Toujours au pluriel** : *os óculos* (les lunettes), *as calças* (le pantalon), *os calções* (le short), *as férias* (les vacances), *as costas* (le dos), *as olheiras* (les cernes), *os parabéns* (les félicitations), *os arredores* (les environs), *os pêsames* (les condoléances), *as algemas* (les menottes).\n- **Le masculin pluriel englobe les deux sexes** : *o pai* → *os pais* (les parents) ; *o filho* → *os filhos* (les enfants) ; *o irmão* → *os irmãos* (frères et sœurs) ; *o tio* → *os tios* (oncle et tante) ; *o avô* → *os avós* (les grands-parents). Attention : *as avós* = les grands-mères.\n\n### Le pluriel des adjectifs composés\nSeul le dernier élément varie : *luso-francês → luso-franceses* ; *socioeconómico → socioeconómicos*. Exception : *surdo-mudo → surdos-mudos*.\n\n### Les diminutifs\nLes suffixes diminutifs expriment la **petitesse**, mais aussi et surtout l'**affection**, la **pitié**, l'**ironie** ou l'**intensité**. On les entend partout, surtout en parlant aux enfants.\n| sens | exemples |\n| petitesse | um carrinho (une petite voiture) ; uma casinha |\n| affection | a mãezinha ; o Joãozinho ; os beijinhos (bisous) |\n| pitié | coitadinho! (le pauvre !) |\n| intensité, adverbes | cedinho (de très bonne heure) ; devagarinho (tout doucement) ; pertinho (tout près) ; baixinho (tout bas) |\n| politesse, familiarité | um minutinho (une petite minute) ; obrigadinho (merci bien) |\n\n**Formation** :\n- les mots terminés par **-a, -e, -o atones** perdent cette voyelle et prennent **-inho, -inha** : *casa → casinha, gato → gatinho, festa → festinha, tarde → tardinha, copo → copinho* ;\n- les mots terminés par une **voyelle tonique, une nasale, une diphtongue** ou souvent **-r, -l** prennent **-zinho, -zinha** : *café → cafezinho, pé → pezinho, chá → chazinho, mãe → mãezinha, pão → pãozinho, avião → aviãozinho, flor → florzinha, mulher → mulherzinha, anel → anelzinho*. L'accent écrit disparaît, sauf le tilde ;\n- **-m** devient **-n** devant *-zinho* : *homem → homenzinho, viagem → viagenzinha* ;\n- les mots en **-s, -z** prennent **-inho** : *rapaz → rapazinho, nariz → narizinho, inglês → inglesinho* ;\n- l'orthographe s'adapte pour garder le son : *pouco → pouquinho, amigo → amiguinho, barco → barquinho, moça → mocinha* ;\n- le Portugal emploie aussi **-ito, -ita, -zito** : *rapazito, pezito, copito* (un petit verre de vin).\nLe **pluriel d'un diminutif en -zinho** se forme sur le pluriel du mot de base, privé de son -s : *avião → aviões → aviõezinhos* ; *pão → pães → pãezinhos* ; *flor → flores → florezinhas*.\n*Pequeno → pequenino* (tout petit).\n\n### Les augmentatifs\n**-ão** pour le masculin, **-ona** pour le féminin, après suppression de la voyelle finale : *livro → livrão, gato → gatão, mulher → mulherona* ; avec un élément de liaison : *rapaz → rapagão, casa → casarão* (grande maison). Ils expriment la grandeur, l'admiration ou la laideur : *um mulherão* (une femme superbe), *uma mulherona* (une femme corpulente). Un nom féminin devient souvent masculin en *-ão* : *a porta → o portão* (le portail).\n\nBeaucoup d'augmentatifs ont pris un **sens propre**, à connaître : *o palavrão* (le gros mot), *o caixão* (le cercueil), *o portão* (le portail), *o cartão* (la carte, le carton), *o salão* (le salon, la grande salle), *o fogão* (la cuisinière). Ces suffixes peuvent être péjoratifs ou comiques : employez-les avec prudence.\n\n### Les noms composés\nIls se forment par **juxtaposition**, avec ou sans trait d'union (*couve-flor, guarda-chuva, segunda-feira, cor-de-rosa*), ou par **agglutination** (*aguardente* = água + ardente, *pontapé, passatempo, girassol*).\n\nDepuis l'Accord de 1990, les composés reliés par une préposition **s'écrivent sans trait d'union** : *fim de semana, caminho de ferro, cor de laranja, mão de obra*. Quelques formes consacrées le gardent : *cor-de-rosa, água-de-colónia, pé-de-meia, mais-que-perfeito*. Les noms de plantes et d'animaux le gardent aussi : *couve-de-bruxelas*. Les grammaires du Projet écrivent encore *fim-de-semana*.\n\n**Pluriel des noms composés**\n| type | ce qui varie | exemples |\n| nom + nom, nom + adjectif, adjectif + nom, numéral + nom | les deux éléments | couves-flores ; obras-primas ; amores-perfeitos ; más-línguas ; segundas-feiras |\n| second nom qui précise le premier (but, type) | le premier, parfois les deux | navios-escola ; palavras-chave (ou palavras-chaves) |\n| verbe + nom | le nom seul | guarda-chuvas ; guarda-roupas ; beija-flores |\n| mot invariable + mot variable | le second | vice-reis ; ex-presidentes ; abaixo-assinados |\n| reliés par une préposition | le premier | fins de semana ; caminhos de ferro |\n| verbe + nom déjà au pluriel, verbe + adverbe | rien | os saca-rolhas ; os arranha-céus ; os fala-barato |\n| composés agglutinés | comme un mot simple | passatempos ; pontapés ; girassóis |\n\n### Les noms collectifs\nUn nom **singulier** peut désigner un **groupe** : *a multidão* (la foule), *a família, o povo, o rebanho* (le troupeau), *a manada* (le troupeau de bovins), *o cardume* (le banc de poissons), *o enxame* (l'essaim), *a matilha* (la meute), *o pomar* (le verger). Le verbe reste au singulier : *A multidão aplaudiu.*\n\n**A gente**, au sens de « les gens », est singulier : *Há muita gente na praia. A gente daqui é simpática.* Pour un pluriel, on dit *as pessoas* : *As pessoas daqui são simpáticas.*","ex":[{"pt":"Os jornais estão em cima da mesa.","fr":"Les journaux sont sur la table."},{"pt":"Comprei dois pães e três limões.","fr":"J'ai acheté deux pains et trois citrons."},{"pt":"As lições são fáceis.","fr":"Les leçons sont faciles."},{"pt":"Os meus irmãos são simpáticos.","fr":"Mes frères et sœurs sont sympathiques."},{"pt":"Os hotéis desta cidade são caros.","fr":"Les hôtels de cette ville sont chers."},{"pt":"Vou passar os fins de semana no campo.","fr":"Je vais passer les week-ends à la campagne."},{"pt":"Esqueci-me dos óculos e dos guarda-chuvas.","fr":"J'ai oublié les lunettes et les parapluies."},{"pt":"Bebe um cafezinho e come um bolinho!","fr":"Bois un petit café et mange un petit gâteau !"},{"pt":"Levanto-me cedinho e ando devagarinho.","fr":"Je me lève de très bonne heure et je marche tout doucement."},{"pt":"Há muita gente na praia.","fr":"Il y a beaucoup de monde sur la plage."},{"pt":"Os alemães e os espanhóis chegaram de avião.","fr":"Les Allemands et les Espagnols sont arrivés en avion."}],"pit":["*papel → papéis* : l'accent écrit apparaît au pluriel ; *inglês → ingleses* : il disparaît.","*mão → mãos*, *pão → pães*, *lição → lições* : trois pluriels pour -ão.","*O lápis / os lápis* : invariable.","*Os pais* = les parents ; *os avós* = les grands-parents (mais *as avós* = les grands-mères).","*As calças* (le pantalon), *os óculos* (les lunettes) : toujours au pluriel.","*Fim de semana* s'écrit sans trait d'union depuis 1990 ; pluriel *fins de semana*.","*A gente* (les gens) est singulier : *a gente é simpática*.","*Palavrão* n'est pas une « grande parole » mais un gros mot."],"qs":[{"t":"transf","q":"Mettez au pluriel : a flor","e":"-r : + es.","a":["as flores"]},{"t":"transf","q":"Mettez au pluriel : o jornal","e":"-al → -ais.","a":["os jornais"]},{"t":"transf","q":"Mettez au pluriel : o homem","e":"-m → -ns.","a":["os homens"]},{"t":"transf","q":"Mettez au pluriel : a lição","e":"-ção → -ções.","a":["as lições"]},{"t":"transf","q":"Mettez au pluriel : o pão","e":"Pluriel en -ães, à savoir par cœur.","a":["os pães"]},{"t":"transf","q":"Mettez au pluriel : a mão","e":"Pluriel en -ãos.","a":["as mãos"]},{"t":"transf","q":"Mettez au pluriel : o cidadão","e":"Pluriel en -ãos.","a":["os cidadãos"]},{"t":"transf","q":"Mettez au pluriel : o papel","e":"-el tonique → -éis (accent écrit).","a":["os papéis"]},{"t":"transf","q":"Mettez au pluriel : o móvel","e":"-el atone → -eis, sans accent.","a":["os móveis"]},{"t":"transf","q":"Mettez au pluriel : fácil","e":"-il atone → -eis.","a":["fáceis"]},{"t":"transf","q":"Mettez au pluriel : o barril","e":"-il tonique → -is.","a":["os barris"]},{"t":"transf","q":"Mettez au pluriel : o lençol","e":"-ol → -óis.","a":["os lençóis"]},{"t":"transf","q":"Mettez au pluriel : a luz","e":"-z : + es.","a":["as luzes"]},{"t":"transf","q":"Mettez au pluriel : o mês","e":"-ês → -eses, l'accent disparaît.","a":["os meses"]},{"t":"transf","q":"Mettez au pluriel : o lápis","e":"-s atone : invariable.","a":["os lápis"]},{"t":"transf","q":"Mettez au pluriel : o irmão alemão","e":"irmão → irmãos ; alemão → alemães.","a":["os irmãos alemães"]},{"t":"transf","q":"Mettez au pluriel : o guarda-chuva","e":"verbe + nom : seul le nom varie.","a":["os guarda-chuvas"]},{"t":"transf","q":"Mettez au pluriel : a obra-prima","e":"nom + adjectif : les deux varient.","a":["as obras-primas"]},{"t":"transf","q":"Mettez au pluriel : o fim de semana","e":"Composé avec préposition : seul le premier élément varie.","a":["os fins de semana"]},{"t":"transf","q":"Formez le diminutif en -inho : o gato","e":"Voyelle atone finale supprimée + -inho.","a":["o gatinho"]},{"t":"transf","q":"Formez le diminutif : o café","e":"Voyelle tonique : -zinho, l'accent disparaît.","a":["o cafezinho"]},{"t":"transf","q":"Formez le diminutif : pouco","e":"c → qu devant i pour garder le son « k ».","a":["pouquinho"]},{"t":"transf","q":"Formez le diminutif : a flor","e":"-r : -zinha.","a":["a florzinha"]},{"t":"choice","q":"« Mes parents habitent à Coimbra. »","e":"Os pais = le père et la mère ; os parentes = la famille au sens large.","o":["Os meus parentes moram em Coimbra.","Os meus pais moram em Coimbra."],"c":1},{"t":"choice","q":"« Il y a beaucoup de monde. »","e":"gente est un collectif singulier.","o":["Há muitas gentes.","Há muita gente."],"c":1},{"t":"choice","q":"Que signifie « um palavrão » ?","e":"Augmentatif au sens figé : le gros mot.","o":["une longue phrase","un gros mot","un grand discours"],"c":1}],"prod":{"c":"Faites la liste de courses d'un repas pour six personnes, chaque article au pluriel (dois pães, três limões…). Ajoutez deux phrases avec un diminutif (um cafezinho, um bocadinho…) et un nom composé au pluriel (os fins de semana, os guarda-chuvas…).","n":"8 à 10 lignes"}},{"id":"L06","lv":"A1","title":"L'adjectif : genre, nombre, accord et place","obj":"Former le féminin et le pluriel des adjectifs, les accorder dans tous les cas, et les placer avant ou après le nom selon le sens voulu.","refs":"EG §4.1-4.2, p. 32-36 ; EG §4.4-4.5, p. 40-42 ; UP §4.3-4.4, p. 132-136 ; LI §3.2.1, p. 59-60","expl":"### Le féminin des adjectifs\n| terminaison | règle | exemples | exceptions |\n| -o | → -a | bonito / bonita ; magro / magra | — |\n| -ês | → -esa | francês / francesa ; português / portuguesa ; inglês / inglesa | cortês, montês : invariables |\n| -or | → -ora | trabalhador / trabalhadora ; encantador / encantadora | invariables : melhor, pior, maior, menor, superior, inferior, anterior, posterior, interior, exterior |\n| -u | → -ua | cru / crua ; nu / nua | hindu, zulu : invariables |\n| -eu | → -eia | europeu / europeia ; ateu / ateia | judeu / judia ; ilhéu / ilhoa |\n| -ão | → -ã | alemão / alemã ; são / sã ; cristão / cristã | — |\n| -ão | → -ona | brincalhão / brincalhona ; comilão / comilona ; mandão / mandona | — |\n| bom, mau | irréguliers | bom / boa ; mau / má | — |\n| -a, -e, -l, -z, -m, -ar, -s | invariables | otimista ; hipócrita ; grande ; verde ; doce ; triste ; azul ; fácil ; útil ; feliz ; capaz ; comum ; jovem ; popular ; simples | gentilés : espanhol / espanhola ; andaluz / andaluza |\n\nDans un adjectif composé, seul le **dernier élément** prend la marque du féminin : *uma relação luso-francesa, a política socioeconómica*. Exception : *surdo-mudo → surda-muda*.\n\n### Le timbre qui s'ouvre\nBeaucoup d'adjectifs dont le **o tonique est fermé au masculin singulier** l'ouvrent au féminin et au pluriel : *novo* [ô] → *nova, novos, novas* [ó]. C'est le cas de **tous les adjectifs en -oso** : *famoso, gostoso, generoso, curioso, formoso, idoso*, et de *grosso, morto, posto*. Quelques-uns, comme *moço / moça*, gardent le o fermé. Rien ne l'indique à l'écrit.\n\n### Le pluriel des adjectifs\nMêmes règles que pour les noms (L05) : *branco → brancos, francês → franceses, feliz → felizes, comum → comuns, azul → azuis, fácil → fáceis, útil → úteis, espanhol → espanhóis, alemão → alemães, são → sãos, simples → simples*. Adjectifs composés : *luso-franceses*, mais *surdos-mudos*.\n\n### L'accord\n- L'adjectif s'accorde **en genre et en nombre** avec le nom : *um senhor alto, duas senhoras altas*.\n- Un adjectif placé **après plusieurs noms de même genre** prend ce genre au pluriel : *a língua e a cultura portuguesas*.\n- **Noms de genres différents** : masculin pluriel. *O livro e a caneta são novos. As mulheres e os homens britânicos.*\n- **Noms de nombres différents** : pluriel, au masculin dès qu'un nom est masculin. *A revista e os livros franceses ; os cães e o gato vadios ; a comida e as bebidas frias.*\n- Avec ***você*, *o senhor*, *a senhora***, l'adjectif suit le sexe réel de la personne : *A senhora está cansada? Você é muito simpático* (à un homme).\n- **Les couleurs désignées par un nom** restent invariables : *saias cor-de-rosa, sapatos laranja, meias azul-marinho*.\n- **Un adjectif employé comme adverbe** reste invariable : *Elas falam alto. Os morangos custam caro.*\n\n### La place de l'adjectif\n**Après le nom**, c'est la place normale :\n- pour la couleur, la nationalité, la forme, la matière, la religion, le goût : *um carro vermelho, uma mulher holandesa, um saco redondo, a religião católica, vinho doce* ;\n- pour un adjectif accompagné d'un adverbe : *uma casa muito grande* ;\n- pour les adjectifs de relation : *a política económica, o ensino superior*.\n\n**Avant le nom** :\n- *bom* et *mau* le plus souvent : *um bom vinho, uma má notícia* ;\n- les superlatifs relatifs : *o melhor amigo, o pior castigo, o maior problema* ;\n- une épithète de nature ou une mise en valeur affective : *a bela Lisboa, o conhecido escritor* ;\n- pour éviter une longue suite d'adjectifs après le nom : *uma excelente escola profissional* ;\n- les numéraux, possessifs, démonstratifs et indéfinis, qui précèdent toujours le nom : *dois livros, o meu carro, este ano, vários amigos, outro dia, cada semana, certas pessoas*.\n*Nenhum* se place devant le nom, ou après pour insister : *Não há problema nenhum.*\n\n### Les adjectifs qui changent de sens selon leur place\nAprès le nom, le sens est concret ou littéral ; avant, il est figuré ou affectif.\n| avant le nom | après le nom |\n| um grande homem : un grand homme (important) | um homem grande : un homme de grande taille |\n| um pobre homem : un pauvre homme (malheureux) | um homem pobre : un homme sans argent |\n| um velho amigo : un vieil ami (de longue date) | um amigo velho : un ami âgé |\n| o meu antigo carro : ma voiture précédente | um carro antigo : une voiture ancienne, de collection |\n| um novo carro : une autre voiture, nouvelle pour moi | um c
