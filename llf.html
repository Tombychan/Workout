<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LLF">
<meta name="theme-color" content="#08080f">
<title>Lower Limb Foundations</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%2308080f' width='100' height='100' rx='20'/><text y='68' x='50' text-anchor='middle' font-size='50'>🦶</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --bg:#08080f; --s1:#0e0e1a; --s2:#151524; --s3:#1c1c30;
  --b:#252540; --bh:#353558;
  --t:#e4e4f0; --t2:#9494ae; --t3:#6a6a84;
  --a:#6366f1; --ah:#818cf8; --ag:rgba(99,102,241,.10);
  --g:#10b981; --gg:rgba(16,185,129,.10); --gb:rgba(16,185,129,.28);
  --o:#f59e0b; --og:rgba(245,158,11,.10); --ob:rgba(245,158,11,.30);
  --r:#ef4444; --rg:rgba(239,68,68,.08); --rb:rgba(239,68,68,.28);
  --cy:#06b6d4; --cyg:rgba(6,182,212,.10);
  --pk:#ec4899; --pkg:rgba(236,72,153,.10);
  --vi:#8b5cf6; --vig:rgba(139,92,246,.10);
  --rd:12px; --rs:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
a{color:var(--ah);text-decoration:none}
.m{font-family:'JetBrains Mono',monospace}
.app{max-width:560px;margin:0 auto;padding-bottom:80px}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;gap:16px;color:var(--t2)}
.spinner{width:32px;height:32px;border:3px solid var(--b);border-top-color:var(--a);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{background:var(--rg);color:var(--r);padding:16px;border-radius:var(--rd);margin:20px 16px;font-size:13px;text-align:center}

/* Header */
.hdr{position:sticky;top:0;z-index:50;background:rgba(8,8,15,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--b);padding:10px 16px 0;padding-top:max(10px,env(safe-area-inset-top))}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.back{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:var(--rs);background:var(--s2);border:1px solid var(--b);color:var(--t2);font-size:15px;flex-shrink:0}
.hdr h1{font-size:16px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.hdr .sub{font-size:10px;color:var(--a);font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.offline{font-size:10px;color:var(--o);margin-left:auto;white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--s1);border-radius:var(--rs);padding:2px;margin-bottom:8px}
.tab{flex:1;padding:8px 2px;text-align:center;font-size:12px;font-weight:600;color:var(--t3);border-radius:6px;position:relative;min-height:38px;line-height:1.15}
.tab small{display:block;font-size:9px;font-weight:500;opacity:.8}
.tab.on{background:var(--s3);color:var(--t)}
.tab.on::after{content:'';position:absolute;bottom:0;left:25%;right:25%;height:2px;background:var(--a);border-radius:1px}

.cnt{padding:12px 16px}

/* Bloc intro */
.intro{background:var(--s1);border:1px solid var(--b);border-radius:var(--rd);padding:14px;margin-bottom:14px}
.intro h2{font-size:15px;font-weight:700;margin-bottom:4px}
.intro p{font-size:13px;color:var(--t2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--s2);border:1px solid var(--b);color:var(--t2);white-space:nowrap}
.chip b{color:var(--t);font-weight:600}
.chip.g{background:var(--gg);border-color:var(--gb);color:var(--g)}
.chip.o{background:var(--og);border-color:var(--ob);color:var(--o)}
.chip.r{background:var(--rg);border-color:var(--rb);color:var(--r)}
.est{font-size:11px;color:var(--t3);margin-top:8px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filter{font-size:12px;padding:6px 12px;border-radius:20px;background:var(--s2);border:1px solid var(--b);color:var(--t2);min-height:32px}
.filter.on{border-color:var(--a);color:var(--t);background:var(--ag)}

/* Category */
.cat{margin-bottom:18px}
.cat-hdr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 8px}
.cat-hdr h3{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t2)}
.cat-hdr span{font-size:11px;color:var(--t3)}
.cat-quotidien h3{color:var(--cy)} .cat-isometrique h3{color:var(--vi)} .cat-force h3{color:var(--ah)} .cat-pliometrique h3{color:var(--pk)}

/* Exercise card */
.ex{background:var(--s1);border:1px solid var(--b);border-radius:var(--rd);margin-bottom:8px;overflow:hidden;scroll-margin-top:130px}
.ex.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{border-color:var(--ah);box-shadow:0 0 0 2px var(--ag)}100%{border-color:var(--b);box-shadow:none}}
.ex-hdr{display:flex;align-items:flex-start;gap:10px;padding:12px;width:100%;text-align:left}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0}
.dot.vert{background:var(--g)} .dot.orange{background:var(--o)} .dot.rouge{background:var(--r)}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:600;line-height:1.3}
.ex-en{font-size:11px;color:var(--t3);margin-top:1px}
.ex-params{font-size:11px;color:var(--t2);margin-top:5px;font-family:'JetBrains Mono',monospace;line-height:1.45}
.chev{color:var(--t3);font-size:12px;margin-top:3px;transition:transform .15s;flex-shrink:0}
.ex.open .chev{transform:rotate(90deg)}
.ex-body{display:none;padding:0 12px 12px;border-top:1px solid var(--b)}
.ex.open .ex-body{display:block}
.sec{margin-top:12px}
.sec-t{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin-bottom:4px}
.sec ul{list-style:none}
.sec li{font-size:13px;color:var(--t);padding-left:14px;position:relative;margin-bottom:3px}
.sec li::before{content:'·';position:absolute;left:3px;color:var(--t3);font-weight:700}
.sec.ok li::before{content:'✓';left:0;color:var(--g);font-size:11px;top:1px}
.sec p{font-size:13px;color:var(--t2)}
.recap{font-size:12px;color:var(--t3)}
.verdict{margin-top:12px;padding:10px 12px;border-radius:var(--rs);font-size:13px;line-height:1.5;border:1px solid}
.verdict.vert{background:var(--gg);border-color:var(--gb)}
.verdict.orange{background:var(--og);border-color:var(--ob)}
.verdict.rouge{background:var(--rg);border-color:var(--rb)}
.verdict .vt{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.verdict.vert .vt{color:var(--g)} .verdict.orange .vt{color:var(--o)} .verdict.rouge .vt{color:var(--r)}
.conf{font-size:11px;color:var(--t2);margin-top:6px;font-style:italic}
.meta-line{font-size:12px;color:var(--t2);margin-top:8px}
.meta-line b{color:var(--t3);font-weight:600}

/* Video */
.vids{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.vbtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:8px 12px;border-radius:var(--rs);background:var(--rg);color:#fca5a5;border:1px solid var(--rb);min-height:36px}
.vbtn.alt{background:var(--s2);color:var(--t2);border-color:var(--b)}
.vbtn.on{outline:2px solid var(--ah);outline-offset:1px}
.vframe{margin-top:8px}
.vframe .embed{position:relative;padding-top:56.25%;border-radius:var(--rs);overflow:hidden;background:#000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vframe .vmeta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--t3);margin-top:5px}
.vframe .vmeta a{white-space:nowrap}

/* Prose panels */
.panel{background:var(--s1);border:1px solid var(--b);border-radius:var(--rd);padding:14px;margin-bottom:12px}
.panel h2{font-size:15px;font-weight:700;margin-bottom:6px}
.panel h3{font-size:13px;font-weight:700;margin:12px 0 4px}
.panel h3:first-child{margin-top:0}
.panel p{font-size:13px;color:var(--t2);margin-bottom:6px}
.panel p:last-child{margin-bottom:0}
.panel ol,.panel ul{padding-left:18px;font-size:13px;color:var(--t2)}
.panel li{margin-bottom:4px}
.type-row{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--b)}
.type-row:first-of-type{border-top:none;padding-top:2px}
.type-row .tn{font-size:13px;font-weight:700;min-width:94px}
.type-row .tf{font-size:10px;color:var(--t3);display:block;font-weight:500}
.type-row p{margin:0}
.callout{background:var(--ag);border:1px solid rgba(99,102,241,.3);border-radius:var(--rs);padding:10px 12px;font-size:13px;color:var(--t);margin-top:8px}
.point{border-top:1px solid var(--b);padding-top:12px;margin-top:12px}
.point:first-of-type{border-top:none;padding-top:0;margin-top:0}
.xlinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.xlink{font-size:11px;padding:5px 9px;border-radius:20px;background:var(--s2);border:1px solid var(--b);color:var(--ah);min-height:28px;text-align:left}
.errata li{margin-bottom:6px}
.errata .pg{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t3)}
.foot{font-size:11px;color:var(--t3);text-align:center;margin-top:18px;line-height:1.6}
em{color:var(--t);font-style:italic}

/* Segmented (niveau 1) */
.seg{display:flex;gap:2px;background:var(--s1);border-radius:var(--rs);padding:2px;margin-bottom:6px}
.seg button{flex:1;padding:9px 4px;font-size:13px;font-weight:700;color:var(--t3);border-radius:6px;min-height:40px}
.seg button.on{background:var(--a);color:#fff}

/* Aujourd'hui */
.daycard{background:linear-gradient(135deg,rgba(99,102,241,.16),rgba(6,182,212,.08));border:1px solid rgba(99,102,241,.35);border-radius:var(--rd);padding:14px;margin-bottom:14px}
.daycard .kick{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ah)}
.daycard h2{font-size:17px;font-weight:700;margin:2px 0 4px;letter-spacing:-.2px}
.daycard p{font-size:13px;color:var(--t2)}
.squares{display:flex;gap:4px;margin:10px 0 4px}
.sq{flex:1;height:8px;border-radius:2px;background:var(--s3)}
.sq.on{background:var(--g)}
.sq.today{background:var(--ah)}
.sqlbl{font-size:11px;color:var(--t2);display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px}
.prog{display:flex;align-items:center;gap:8px;margin-top:10px}
.prog .bar{flex:1;height:6px;background:var(--s3);border-radius:3px;overflow:hidden}
.prog .fill{height:100%;background:var(--g);border-radius:3px;transition:width .3s}
.prog span{font-size:11px;color:var(--t2);font-family:'JetBrains Mono',monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;padding:9px 14px;border-radius:var(--rs);background:var(--s2);border:1px solid var(--b);color:var(--t);min-height:40px}
.btn.pri{background:var(--a);border-color:var(--a);color:#fff}
.btn.ghost{background:none}
.btn.warn{color:var(--r);border-color:var(--rb)}
.btn.sm{font-size:12px;padding:6px 10px;min-height:34px}
.hint{font-size:12px;color:var(--t3);margin:0 2px 8px}
.row{background:var(--s1);border:1px solid var(--b);border-radius:var(--rd);margin-bottom:8px;overflow:hidden;scroll-margin-top:150px}
.row.done{border-color:var(--gb)}
.row-top{display:flex;gap:10px;padding:12px 12px 4px;align-items:flex-start}
.row-top .ex-info{cursor:pointer}
.row .chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--bh);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.row.done .chk{background:var(--g);border-color:var(--g)}
.consigne{font-size:12px;color:var(--t2);margin:2px 12px 0 42px;line-height:1.45}
.consigne.orange{color:#fcd34d}
.trk{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px 12px 42px}
.cnt-n{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;min-width:44px}
.cnt-n.ok{color:var(--g)}
.side{display:flex;align-items:center;gap:6px;width:100%}
.side .lbl{font-size:11px;font-weight:700;color:var(--t3);width:14px}
.holds{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.hold{font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 6px;border-radius:4px;background:var(--gg);color:var(--g);border:1px solid var(--gb)}
.tgt{font-size:11px;color:var(--t3);width:100%;padding-left:20px}
.undo{width:34px;height:34px;border-radius:var(--rs);background:var(--s2);border:1px solid var(--b);color:var(--t2);font-size:15px}
.row .ex-body{display:block;border-top:1px solid var(--b);padding-top:2px}
.setup{background:var(--s1);border:1px solid var(--b);border-radius:var(--rd);padding:14px;margin-bottom:12px}
.setup h3{font-size:13px;font-weight:700;margin:12px 0 6px}
.setup h3:first-child{margin-top:0}
.setup p{font-size:13px;color:var(--t2);margin-bottom:8px}
.setup input[type=date]{font-family:inherit;font-size:14px;color:var(--t);background:var(--s2);border:1px solid var(--b);border-radius:var(--rs);padding:8px 10px;min-height:40px;color-scheme:dark}
.daychips{display:flex;gap:4px}
.daychip{flex:1;min-height:38px;border-radius:var(--rs);background:var(--s2);border:1px solid var(--b);font-size:12px;font-weight:700;color:var(--t3)}
.daychip.on{background:var(--ag);border-color:var(--a);color:var(--t)}
.blocsel{display:flex;flex-wrap:wrap;gap:6px}
textarea.note{width:100%;min-height:64px;font-family:inherit;font-size:13px;color:var(--t);background:var(--s2);border:1px solid var(--b);border-radius:var(--rs);padding:8px 10px;resize:vertical}
details.set{margin-top:14px}
details.set summary{font-size:12px;color:var(--t2);cursor:pointer;padding:8px 2px;list-style:none}
details.set summary::-webkit-details-marker{display:none}
.fullbox{margin-top:12px;padding-top:12px;border-top:1px solid rgba(99,102,241,.25)}
.fullon{font-size:13px;font-weight:600;color:var(--g);text-align:center}
.adv{font-size:12px;color:var(--t2);margin-top:8px;line-height:1.5}
.adv.o{color:#fcd34d}
.adv.g{color:var(--g)}
.timerbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));z-index:100;width:calc(100% - 24px);max-width:536px;display:none;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(14,14,26,.97);border:1px solid var(--a);box-shadow:0 6px 30px rgba(0,0,0,.6)}
.timerbar.on{display:flex}
.timerbar.done{border-color:var(--g)}
.timerbar .tn{flex:1;min-width:0;font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timerbar .tt{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;min-width:64px;text-align:right}
.timerbar .tg{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t3)}
.timerbar.done .tt{color:var(--g)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading" id="loading"><div class="spinner"></div><span>Chargement…</span></div>
</div>
<div class="timerbar" id="timerbar" role="timer" aria-live="polite">
  <div class="tn" id="tb-name"></div>
  <div style="text-align:right"><div class="tt" id="tb-time">0s</div><div class="tg" id="tb-target"></div></div>
  <button class="btn pri sm" onclick="stopHold(true)">■ Stop</button>
  <button class="undo" onclick="stopHold(false)" aria-label="Annuler">✕</button>
</div>
<script>
/* ═══════════ STATE ═══════════ */
const DATA_URL = 'data/sport/llf_program.json';
const CACHE_KEY = 'llf-cache-v1';
const TAB_KEY = 'llf-tab-v1';
const CAT_LABELS = {quotidien:'Drills quotidiens', isometrique:'Isométriques', force:'Force', pliometrique:'Pliométrie'};
const VERDICT_LABELS = {vert:'Compatible', orange:'Avec adaptation', rouge:'À écarter'};
const VCLS = {vert:'g', orange:'o', rouge:'r'};
const VCOUNT = {vert:'compatibles', orange:'avec adaptation', rouge:'à écarter'};
let D = null;
let OFFLINE = false;
const S = { tab: 'jour', libTab: 'b1', open: {}, video: {}, filter: 'tous', confirmReset: false };
const PLAN_KEY = 'llf-plan-v1';
const LOG_KEY = 'llf-log-v1';
const JOURS_C = ['L','Ma','Me','J','V','S','D'];
const JOURS_N = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
let PLAN = null;   // { start:'YYYY-MM-DD', days:[0,2,4], forceBloc:null }
let LOG = {};      // { 'YYYY-MM-DD': { bloc, full, note, ex: { id: { sets, holds:[{c:'G'|'D'|'', t}] } } } }
let TIMER = null;

function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

/* ═══════════ LOAD ═══════════ */
async function load(){
  try {
    const r = await fetch(DATA_URL + '?v=' + Date.now());
    if (!r.ok) throw new Error(DATA_URL + ' : ' + r.status);
    D = await r.json();
    lsSet(CACHE_KEY, JSON.stringify(D));
  } catch(e) {
    const c = lsGet(CACHE_KEY);
    if (c) { try { D = JSON.parse(c); OFFLINE = true; } catch(_){} }
    if (!D) {
      document.getElementById('app').innerHTML = `<div class="error-msg">Erreur de chargement<br><small>${esc(e.message)}</small></div>`;
      return;
    }
  }
  loadState();
  // Ouverture toujours sur « Aujourd'hui » ; on ne mémorise que le dernier onglet de la bibliothèque
  const saved = lsGet(TAB_KEY);
  const validLib = t => t === 'principes' || t === 'profil' || D.blocs.some(b => b.id === t);
  if (saved && validLib(saved)) S.libTab = saved;
  S.tab = 'jour';
  const h = location.hash.match(/ex=([\w-]+)/);
  if (h && D.exercices[h[1]]) { S.tab = S.libTab = D.exercices[h[1]].bloc; S.open[h[1]] = true; render(); focusEx(h[1]); return; }
  render();
}

/* ═══════════ HELPERS ═══════════ */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(s){ return esc(s).replace(/\*(.+?)\*/g, '<em>$1</em>'); }
function list(arr, cls){ return arr && arr.length ? `<ul>${arr.map(x => `<li>${fmt(x)}</li>`).join('')}</ul>` : ''; }
function exName(id){ const e = D.exercices[id]; return e ? e.nom_fr : id; }

/* ═══════════ RENDER ═══════════ */
function render(){
  let h = header();
  h += '<div class="cnt">';
  if (S.tab === 'jour') h += today();
  else if (S.tab === 'principes') h += principes();
  else if (S.tab === 'profil') h += profil();
  else h += bloc(D.blocs.find(b => b.id === S.tab));
  h += `<div class="foot">${esc(D.meta.source)}<br>v${esc(D.meta.version)} · ${esc(D.meta.date)}</div>`;
  h += '</div>';
  document.getElementById('app').innerHTML = h;
}

function header(){
  let h = '<div class="hdr"><div class="hdr-top">';
  // Flèche : depuis la bibliothèque → accueil de l'app (Aujourd'hui) ; depuis Aujourd'hui → hub (icône maison)
  if (S.tab === 'jour') h += '<a class="back" href="hub.html" aria-label="Retour au hub" title="Hub">⌂</a>';
  else h += `<button class="back" onclick="setTab('jour')" aria-label="Retour à Aujourd'hui" title="Aujourd'hui">←</button>`;
  h += `<div><h1>${esc(D.meta.titre)}</h1><div class="sub">Conor Harris · 6 semaines</div></div>`;
  if (OFFLINE) h += '<span class="offline">● hors ligne</span>';
  h += '</div>';
  h += `<div class="seg"><button class="${S.tab==='jour'?'on':''}" onclick="setTab('jour')">Aujourd'hui</button><button class="${S.tab!=='jour'?'on':''}" onclick="setTab(S.libTab)">Bibliothèque</button></div>`;
  if (S.tab === 'jour') { h += '</div>'; return h; }
  h += '<div class="tabs" role="tablist">';
  D.blocs.forEach(b => {
    h += `<button class="tab ${S.tab===b.id?'on':''}" role="tab" onclick="setTab('${b.id}')">S${esc(b.semaines)}<small>${esc(b.titre)}</small></button>`;
  });
  h += `<button class="tab ${S.tab==='principes'?'on':''}" role="tab" onclick="setTab('principes')">Principes<small>mode d'emploi</small></button>`;
  h += `<button class="tab ${S.tab==='profil'?'on':''}" role="tab" onclick="setTab('profil')">Profil<small>filtre & errata</small></button>`;
  h += '</div></div>';
  return h;
}

function bloc(b){
  const allIds = b.categories.flatMap(c => c.exercices);
  const counts = {vert:0, orange:0, rouge:0};
  allIds.forEach(id => counts[D.exercices[id].verdict]++);
  let h = '<div class="intro">';
  h += `<h2>Semaines ${esc(b.semaines)} — ${esc(b.titre)}</h2><p>${fmt(b.objectif)}</p>`;
  h += '<div class="chips">';
  h += `<span class="chip">Quotidien <b>${esc(b.duree_estimee.quotidien_min)} min</b></span>`;
  h += `<span class="chip">3×/sem <b>${esc(b.duree_estimee.tri_hebdo_min)} min</b></span>`;
  ['vert','orange','rouge'].forEach(v => { if (counts[v]) h += `<span class="chip ${VCLS[v]}">${counts[v]} ${VCOUNT[v]}</span>`; });
  h += '</div>';
  h += '<p class="est">Durées estimées par Claude : repos inclus, nombre minimal de séries des fiches.</p>';
  h += '</div>';

  h += '<div class="filters">';
  [['tous','Tous'],['vert','Compatibles'],['orange','Avec adaptation']].forEach(([k,l]) => {
    const dot = k === 'tous' ? '' : `<span class="dot ${k}" style="display:inline-block;width:7px;height:7px;margin:0 6px 1px 0"></span>`;
    h += `<button class="filter ${S.filter===k?'on':''}" onclick="setFilter('${k}')">${dot}${l}</button>`;
  });
  h += '</div>';

  b.categories.forEach(c => {
    const exs = c.exercices.filter(id => S.filter === 'tous' || D.exercices[id].verdict === S.filter);
    if (!exs.length) return;
    h += `<div class="cat cat-${c.type}"><div class="cat-hdr"><h3>${CAT_LABELS[c.type]}</h3><span>${esc(c.frequence)}</span></div>`;
    exs.forEach(id => { h += exCard(D.exercices[id]); });
    h += '</div>';
  });
  return h;
}

function exCard(e){

  h += `<button class="ex-hdr" onclick="toggleEx('${e.id}')" aria-expanded="${open}">`;

  h += `<div class="ex-info"><div class="ex-name">${esc(e.nom_fr)}</div><div class="ex-en">${esc(e.rang)} · ${esc(e.nom)}</div>`;
  h += `<div class="ex-params">${esc(e.parametres.fiche)}</div></div>`;

/* ═══════════ ACTIONS ═══════════ */
function setTab(t){ S.tab = t; if (t !== 'jour') S.libTab = t; S.filter = 'tous'; lsSet(TAB_KEY, t); render(); window.scrollTo(0,0); }
function setFilter(f){ S.filter = f; render(); }
function toggleEx(id){
  S.open[id] = !S.open[id];
  if (!S.open[id]) delete S.video[id];
  render();
}
function toggleVideo(id, i){
  if (S.video[id] === i) delete S.video[id]; else S.video[id] = i;
  render();
}
function goEx(id){
  const e = D.exercices[id];
  S.tab = S.libTab = e.bloc; S.filter = 'tous'; S.open[id] = true; lsSet(TAB_KEY, e.bloc);
  render(); focusEx(id);
}
function focusEx(id){
  requestAnimationFrame(() => {
    const el = document.getElementById('ex-' + id);
    if (!el) return;
    el.scrollIntoView({behavior:'smooth', block:'start'});
    el.classList.add('flash');
  });
}


/* ═══════════ PROGRAMME DU JOUR ═══════════ */
function loadState(){
  try { PLAN = JSON.parse(lsGet(PLAN_KEY)) || null; } catch(e){ PLAN = null; }
  try { LOG = JSON.parse(lsGet(LOG_KEY)) || {}; } catch(e){ LOG = {}; }
}
function saveState(){ lsSet(PLAN_KEY, JSON.stringify(PLAN)); lsSet(LOG_KEY, JSON.stringify(LOG)); }
function dk(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dow(d){ d = d || new Date(); return (d.getDay() + 6) % 7; }
function parseDk(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(k){ return parseDk(k).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}); }
function isActive(v){ return !!v && Object.values(v.ex || {}).some(x => (x.sets || 0) > 0 || (x.holds || []).length > 0); }
function activeDaysIn(bloc, exclude){ return Object.entries(LOG).filter(([k,v]) => k !== exclude && v.bloc === bloc && isActive(v)).length; }
function needDays(){ return D.programme_jour?.jours_actifs_par_bloc || 14; }

function currentBloc(){
  const k = dk();
  if (PLAN.forceBloc) return PLAN.forceBloc;
  if (isActive(LOG[k]) && LOG[k].bloc) return LOG[k].bloc;
  for (const b of D.blocs) if (activeDaysIn(b.id, k) < needDays()) return b.id;
  return 'fini';
}
function entryForLog(){
  const k = dk(), b = currentBloc();
  if (!LOG[k]) LOG[k] = { ex: {} };
  if (!isActive(LOG[k])) LOG[k].bloc = b;
  return LOG[k];
}
function exLog(entry, id){ if (!entry.ex[id]) entry.ex[id] = { sets: 0, holds: [] }; return entry.ex[id]; }
function hasNonDaily(v){ return !!v && Object.entries(v.ex || {}).some(([id,x]) => D.exercices[id] && D.exercices[id].categorie !== 'quotidien' && ((x.sets || 0) > 0 || (x.holds || []).length > 0)); }
function isFullDay(){ const v = LOG[dk()]; return !!v?.full || hasNonDaily(v); }

function bestPrev(id, side){
  const k = dk();
  const keys = Object.keys(LOG).filter(x => x < k).sort().reverse();
  for (const key of keys) {
    const hs = (LOG[key].ex?.[id]?.holds || []).filter(h => (h.c || '') === (side || ''));
    if (hs.length) return Math.max(...hs.map(h => h.t));
  }
  return null;
}
function targetFor(e, side){
  const su = e.suivi, b = bestPrev(e.id, side);
  if (b === null) return su.min_s;
  return Math.min(su.max_s, Math.max(su.min_s, b + su.pas_s));
}
function exDone(e, x){
  const su = e.suivi;
  if (!x) return false;
  if (su.mode === 'series') return (x.sets || 0) >= su.cible;
  const hs = x.holds || [];
  if (su.cote) return hs.filter(h => h.c === 'G').length >= su.cible && hs.filter(h => h.c === 'D').length >= su.cible;
  return hs.length >= su.cible;
}
function fmtS(s){ return s >= 60 ? Math.floor(s/60) + ':' + String(s%60).padStart(2,'0') : s + ' s'; }
function weekTarget(){ return D.programme_jour?.seances_completes_semaine || 3; }
function fullInfo(){
  const now = new Date(), k = dk(now);
  const monday = new Date(now); monday.setDate(now.getDate() - dow(now)); const mk = dk(monday);
  const y = new Date(now); y.setDate(now.getDate() - 1); const yk = dk(y);
  const days = Object.keys(LOG).filter(x => hasNonDaily(LOG[x])).sort();
  const prev = days.filter(x => x < k).pop() || null;
  return { week: days.filter(x => x >= mk && x <= k).length, prev, yesterday: prev === yk, daysLeft: 7 - dow(now) };
}
function fullAdvice(full){
  const I = fullInfo(), T = weekTarget();
  const doneBefore = I.week - (hasNonDaily(LOG[dk()]) ? 1 : 0);
  const left = Math.max(0, T - doneBefore);
  const last = I.prev ? ` Dernière séance complète : ${esc(fmtDate(I.prev))}.` : '';
  if (full) {
    if (I.yesterday) return `<p class="adv o">Tu as déjà fait une séance complète hier. ${fmt(D.programme_jour?.conseil_espacement || '')}</p>`;
    return '';
  }
  if (doneBefore >= T) return `<p class="adv g">Objectif de la semaine atteint (${T}/${T}) : aujourd'hui, les drills suffisent.${last}</p>`;
  if (I.yesterday) return `<p class="adv o">Séance complète faite hier : si tu peux, garde aujourd'hui pour les drills et fais la suivante demain.</p>`;
  let t = `Il te reste ${left} séance${left > 1 ? 's' : ''} complète${left > 1 ? 's' : ''} à placer d'ici dimanche (${I.daysLeft} jour${I.daysLeft > 1 ? 's' : ''} restant${I.daysLeft > 1 ? 's' : ''}, aujourd'hui compris).${last}`;
  if (left * 2 - 1 > I.daysLeft) t += " Pas assez de jours pour bien les espacer : ce n'est pas grave, le programme avance en jours actifs, pas en semaines.";
  return `<p class="adv">${t}</p>`;
}

function today(){
  if (!PLAN) return setupView();
  const b = currentBloc();
  if (b === 'fini') return finishedView();
  const B = D.blocs.find(x => x.id === b);
  const k = dk(), entry = LOG[k] || { ex: {} };
  const full = isFullDay();
  const order = D.programme_jour?.ordre_seance || ['quotidien','isometrique','pliometrique','force'];
  const cats = order.filter(c => c === 'quotidien' || full).map(c => B.categories.find(x => x.type === c)).filter(c => c && c.exercices.length);
  const ids = cats.flatMap(c => c.exercices);
  const done = ids.filter(id => exDone(D.exercices[id], entry.ex?.[id])).length;
  const actDone = activeDaysIn(b, k) + (isActive(entry) ? 1 : 0);
  const need = needDays();

  let h = '<div class="daycard">';
  h += `<div class="kick">${esc(fmtDate(k))}${PLAN.forceBloc ? ' · bloc fixé manuellement' : ''}</div>`;
  h += `<h2>Semaines ${esc(B.semaines)} — ${esc(B.titre)}</h2>`;
  const nb = v => String(v).replace(/≈\s*/g, '');
  const dur = full ? `≈ ${nb(B.duree_estimee.quotidien_min)} min de drills + ≈ ${nb(B.duree_estimee.tri_hebdo_min)} min` : `≈ ${nb(B.duree_estimee.quotidien_min)} min`;
  h += `<p>${full ? 'Séance complète : drills + isométrie + pliométrie + force' : 'Drills quotidiens seulement'} · ${esc(dur)}</p>`;
  if (PLAN.start > k) h += `<p style="margin-top:6px;color:var(--o)">Démarrage prévu ${esc(fmtDate(PLAN.start))} — tu peux déjà t'entraîner, les jours comptent dès la première série notée.</p>`;
  h += '<div class="squares">';
  for (let i = 0; i < need; i++) {
    const cls = i < actDone ? (i === actDone - 1 && isActive(entry) ? 'sq today' : 'sq on') : 'sq';
    h += `<div class="${cls}"></div>`;
  }
  h += '</div>';
  h += `<div class="sqlbl"><span>Jours actifs dans le bloc : ${Math.min(actDone, need)}/${need}</span><span>Séances complètes cette semaine : ${fullInfo().week}/${weekTarget()}</span></div>`;
  h += `<div class="prog"><div class="bar"><div class="fill" style="width:${ids.length ? Math.round(done/ids.length*100) : 0}%"></div></div><span>${done}/${ids.length}</span></div>`;
  h += '<div class="fullbox">';
  if (!full) h += `<button class="btn pri" style="width:100%" onclick="addFull()">＋ Séance complète aujourd'hui</button>`;
  else if (!hasNonDaily(LOG[k])) h += `<button class="btn ghost sm" style="width:100%" onclick="removeFull()">Retirer la séance complète d'aujourd'hui</button>`;
  else h += '<div class="fullon">✓ Séance complète en cours</div>';
  h += fullAdvice(full);
  h += '</div>';
  h += '</div>';

  cats.forEach(c => {
    h += `<div class="cat cat-${c.type}"><div class="cat-hdr"><h3>${CAT_LABELS[c.type]}</h3><span>${esc(c.frequence)}</span></div>`;
    if (c.type === 'quotidien' && D.programme_jour?.repartition_drills) h += `<p class="hint">${fmt(D.programme_jour.repartition_drills)}</p>`;
    c.exercices.forEach(id => { h += dayRow(D.exercices[id], entry); });
    h += '</div>';
  });

  if (full && D.programme_jour?.note_bfs) h += `<div class="callout" style="margin-bottom:14px">${fmt(D.programme_jour.note_bfs)}</div>`;

  h += `<div class="setup"><h3>Note du jour</h3><textarea class="note" placeholder="Sensations hanche D, tendons le lendemain, charges…" oninput="saveNote(this.value)">${esc(entry.note || '')}</textarea></div>`;
  h += settingsView(b);
  return h;
}

function dayRow(e, entry){
  const su = e.suivi, x = entry.ex?.[e.id], ok = exDone(e, x), open = !!S.open[e.id];
  let h = `<div class="row ${ok ? 'done' : ''}" id="ex-${e.id}">`;
  h += `<div class="row-top"><span class="chk">${ok ? '✓' : ''}</span>`;
  h += `<div class="ex-info" onclick="toggleEx('${e.id}')"><div class="ex-name"><span class="dot ${e.verdict}" style="display:inline-block;width:7px;height:7px;margin:0 6px 2px 0"></span>${esc(e.nom_fr)}</div>`;
  const par = su.mode === 'series' ? `${su.cible} séries · ${su.reps}` : `${su.cible} × ${fmtS(su.min_s)}→${fmtS(su.max_s)}${su.cote ? ' /côté' : ''}`;
  h += `<div class="ex-params">${esc(par)}</div></div>`;
  h += `<span class="chev" onclick="toggleEx('${e.id}')" style="cursor:pointer">${open ? '▾' : '▸'}</span></div>`;
  if (e.consigne_jour) h += `<div class="consigne ${e.verdict === 'orange' ? 'orange' : ''}">${e.verdict === 'orange' ? '⚠︎ ' : ''}${fmt(e.consigne_jour)}</div>`;
  h += '<div class="trk">';
  if (su.mode === 'series') {
    const n = x?.sets || 0;
    h += `<span class="cnt-n ${n >= su.cible ? 'ok' : ''}">${n}/${su.cible}</span>`;
    h += `<button class="btn pri sm" onclick="addSet('${e.id}',1)">+1 série</button>`;
    if (n > 0) h += `<button class="undo" onclick="addSet('${e.id}',-1)" aria-label="Retirer une série">−</button>`;
  } else {
    const sides = su.cote ? ['G','D'] : [''];
    sides.forEach(sd => {
      const hs = (x?.holds || []).filter(hh => (hh.c || '') === sd);
      const tg = targetFor(e, sd), prev = bestPrev(e.id, sd);
      h += '<div class="side">';
      if (sd) h += `<span class="lbl">${sd}</span>`;
      h += `<button class="btn pri sm" onclick="startHold('${e.id}','${sd}')">▶ ${fmtS(tg)}</button>`;
      h += `<span class="cnt-n ${hs.length >= su.cible ? 'ok' : ''}">${hs.length}/${su.cible}</span>`;
      h += '<div class="holds">' + hs.map(hh => `<span class="hold">${fmtS(hh.t)}</span>`).join('') + '</div>';
      if (hs.length) h += `<button class="undo" onclick="undoHold('${e.id}','${sd}')" aria-label="Retirer la dernière tenue">−</button>`;
      h += '</div>';
      h += `<div class="tgt">Objectif ${fmtS(tg)}${prev !== null ? ' · meilleur précédent ' + fmtS(prev) : ' · première séance'}</div>`;
    });
  }
  h += '</div>';
  if (open) h += exBody(e);
  h += '</div>';
  return h;
}

function setupView(){
  let h = '<div class="daycard"><div class="kick">Programme journalier</div><h2>Démarrer Lower Limb Foundations</h2>';
  h += '<p>Chaque jour, l\'appli t\'affiche les drills du bloc en cours. Le jour où tu as le temps, touche « Séance complète aujourd\'hui » pour ajouter isométrie, pliométrie et force. ';
  h += `Objectif : ${weekTarget()} par semaine, idéalement pas deux jours de suite — rien n'est fixé à l'avance.</p></div>`;
  h += `<div class="setup"><p>${fmt(D.programme_jour?.regle_progression || '')}</p>`;
  h += `<button class="btn pri" style="width:100%;margin-top:6px" onclick="startPlan()">Commencer aujourd'hui</button></div>`;
  return h;
}

function finishedView(){
  let h = '<div class="daycard"><div class="kick">Programme terminé</div><h2>Les 3 blocs sont validés 🎉</h2>';
  h += `<p>${needDays()} jours actifs dans chaque bloc. Tu peux continuer le dernier bloc en entretien ou relancer un bloc précis.</p></div>`;
  h += '<div class="setup"><div class="blocsel">';
  D.blocs.forEach(b => { h += `<button class="btn sm" onclick="setForce('${b.id}')">Continuer S${esc(b.semaines)}</button>`; });
  h += '</div></div>';
  h += settingsView('fini');
  return h;
}

function settingsView(b){
  let h = '<details class="set"><summary>⚙︎ Réglages du programme</summary><div class="setup">';
  h += `<p>Démarré le ${esc(fmtDate(PLAN.start))}.</p>`;
  h += '<h3>Bloc</h3><div class="blocsel">';
  h += `<button class="btn sm ${!PLAN.forceBloc ? 'pri' : ''}" onclick="setForce(null)">Auto (14 jours actifs)</button>`;
  D.blocs.forEach(x => { h += `<button class="btn sm ${PLAN.forceBloc === x.id ? 'pri' : ''}" onclick="setForce('${x.id}')">S${esc(x.semaines)}</button>`; });
  h += '</div><h3>Données</h3><div class="blocsel">';
  h += '<button class="btn sm" onclick="exportLog()">📤 Exporter le suivi (JSON)</button>';
  h += `<button class="btn sm warn" onclick="resetPlan()">${S.confirmReset ? 'Confirmer la remise à zéro' : 'Remettre à zéro'}</button>`;
  h += '</div><p style="margin-top:8px;font-size:12px;color:var(--t3)">Le suivi est enregistré dans ce navigateur (iPhone). Exporte-le pour tes bilans du 1er et du 15.</p>';
  h += '</div></details>';
  return h;
}

/* ── Actions programme ── */
function startPlan(){ PLAN = { start: dk(), forceBloc: null }; saveState(); render(); window.scrollTo(0,0); }
function setForce(b){ PLAN.forceBloc = b; saveState(); render(); }
function addFull(){ const k = dk(); if (!LOG[k]) LOG[k] = { ex: {} }; LOG[k].full = true; saveState(); render(); }
function removeFull(){ const k = dk(); if (LOG[k]) { LOG[k].full = false; saveState(); } render(); }
function addSet(id, d){
  const x = exLog(entryForLog(), id);
  x.sets = Math.max(0, (x.sets || 0) + d);
  saveState(); render();
}
function undoHold(id, sd){
  const x = LOG[dk()]?.ex?.[id]; if (!x) return;
  for (let i = x.holds.length - 1; i >= 0; i--) if ((x.holds[i].c || '') === sd) { x.holds.splice(i,1); break; }
  saveState(); render();
}
function saveNote(v){ const k = dk(); if (!LOG[k]) LOG[k] = { ex: {} }; LOG[k].note = v; saveState(); }
function resetPlan(){
  if (!S.confirmReset) { S.confirmReset = true; render(); setTimeout(() => { S.confirmReset = false; }, 5000); return; }
  S.confirmReset = false; PLAN = null; LOG = {}; saveState(); render(); window.scrollTo(0,0);
}
function exportLog(){
  const blob = new Blob([JSON.stringify({ exported_at: new Date().toISOString(), source: 'llf.html', version: D.meta.version, plan: PLAN, log: LOG }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `llf-suivi-${dk()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ── Chrono de tenue ── */
let AC = null;
function audio(){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e){} }
function beep(){
  try {
    if (!AC) return;
    [0, .22].forEach(dt => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(.25, AC.currentTime + dt); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dt + .18);
      o.start(AC.currentTime + dt); o.stop(AC.currentTime + dt + .2);
    });
  } catch(e){}
  if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
}
function startHold(id, sd){
  if (TIMER) stopHold(false);
  audio();
  const e = D.exercices[id];
  TIMER = { id, sd, t0: Date.now(), target: targetFor(e, sd), beeped: false };
  const bar = document.getElementById('timerbar');
  bar.classList.add('on'); bar.classList.remove('done');
  document.getElementById('tb-name').textContent = e.nom_fr + (sd ? ' · ' + (sd === 'G' ? 'gauche' : 'droite') : '');
  document.getElementById('tb-target').textContent = '/ ' + fmtS(TIMER.target);
  tick(); TIMER.iv = setInterval(tick, 250);
}
function tick(){
  if (!TIMER) return;
  const s = Math.floor((Date.now() - TIMER.t0) / 1000);
  document.getElementById('tb-time').textContent = s >= 60 ? Math.floor(s/60) + ':' + String(s%60).padStart(2,'0') : s + 's';
  if (!TIMER.beeped && s >= TIMER.target) { TIMER.beeped = true; document.getElementById('timerbar').classList.add('done'); beep(); }
}
function stopHold(save){
  if (!TIMER) return;
  clearInterval(TIMER.iv);
  const s = Math.floor((Date.now() - TIMER.t0) / 1000), t = TIMER;
  TIMER = null;
  document.getElementById('timerbar').classList.remove('on','done');
  if (save && s >= 1) { exLog(entryForLog(), t.id).holds.push({ c: t.sd || '', t: s }); saveState(); }
  render();
}

window.addEventListener('hashchange', () => {
  const h = location.hash.match(/ex=([\w-]+)/);
  if (D && h && D.exercices[h[1]]) goEx(h[1]);
});

load();
